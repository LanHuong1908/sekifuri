  function allRenbanOptions(){
    const tables = currentTables();
    const options = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          for(let start = 0; start &lt; run.length; start++){
            let capacity = 0;

            for(let end = start; end &lt; run.length; end++){
              const ids = run.slice(start, end + 1);
              const cap = tables[run[end]];

              if(cap === &quot;BOX&quot;){
                if(ids.length === 1) continue;

                if(ids.length === 2){
                  [9,10,11,12,13,14].forEach(pax =&gt; {
                    options.push({
                      ids,
                      pax,
                      capacity:14,
                      low:pax !== 14,
                      box:true
                    });
                  });
                }
              }else{
                capacity += Number(cap);

                if(end &gt; start){
                  options.push({
                    ids,
                    pax:capacity,
                    capacity,
                    low:false,
                    box:false
                  });
                }
              }
            }
          }
        }

        run = [];
      };

      group.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 単卓もおすすめ候補に含める。
       2名なら空いている2人卓、4名なら4人卓、6名なら6人卓を最優先にできる。 */
    Object.keys(tables)
      .filter(id =&gt; tables[id] !== &quot;BOX&quot; &amp;&amp; isVacant(id))
      .forEach(id =&gt; {
        const capacity = Number(tables[id]);
        if(capacity &gt; 0){
          options.push({
            ids:[id],
            pax:capacity,
            capacity,
            low:false,
            box:false
          });
        }
      });

    Object.keys(tables)
      .filter(id =&gt; tables[id] === &quot;BOX&quot; &amp;&amp; isVacant(id))
      .forEach(id =&gt; {
        options.push({ids:[id], pax:7, capacity:7, low:false, box:true});
        options.push({ids:[id], pax:8, capacity:7, low:true, box:true});
      });

    options.forEach(option =&gt; {
      option.cleaning = option.ids.some(id =&gt; isCleaning(id));
    });

    const seen = new Set();

    return options
      .filter(option =&gt; {
        const key = option.pax + &quot;|&quot; + option.ids.join(&quot;-&quot;);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a,b) =&gt;
        a.pax - b.pax ||
        Number(a.low) - Number(b.low) ||
        a.ids.length - b.ids.length
      );
  }

  function renderPeopleRow(){
    const row = document.getElementById(&quot;peopleRow&quot;);

    options.forEach(item =&gt; {
      const pax = Number(item.pax);

    });

    const maxGuideCapacity = options.reduce((max,item) =&gt; {
      const cap = Number(item.capacity ?? item.pax);
      return Number.isFinite(cap) ? Math.max(max,cap) : max;
    },0);

    if(maxGuideCapacity &gt;= 9){
      for(let n=9; n&lt;=maxGuideCapacity; n++){
        availablePax.add(n);
      }
    }

    const capacities = [...availablePax]
      .filter(value =&gt; Number.isFinite(Number(value)))
      .map(Number)
      .sort((a,b) =&gt; a-b);

    const choices = [

  function updateRenbanArrows(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);
    const max = Math.max(0, holder.scrollWidth - holder.clientWidth);
    prev.disabled = holder.scrollLeft &lt;= 2;
    next.disabled = holder.scrollLeft &gt;= max - 2;
  }

  function setupRenbanScroller(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);

    prev.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:-holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    next.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    holder.addEventListener(&quot;scroll&quot;, updateRenbanArrows, {passive:true});

    let dragging = false;
    let startX = 0;
    let startScroll = 0;

    holder.addEventListener(&quot;pointerdown&quot;, event =&gt; {
      if(event.pointerType === &quot;touch&quot;) return;

      /* おすすめ案ボタンをクリックした時は、
         親の横スクロールがpointerを奪わないようにする。
         これが原因でPCでは案を押してもclickが発火しなかった。 */
      if(event.target.closest(&quot;.renban-option&quot;)) return;

      dragging = true;
      startX = event.clientX;
      startScroll = holder.scrollLeft;
      holder.classList.add(&quot;dragging&quot;);
      holder.setPointerCapture(event.pointerId);
    });

    holder.addEventListener(&quot;pointermove&quot;, event =&gt; {
      if(!dragging) return;
      holder.scrollLeft = startScroll - (event.clientX - startX);
    });

    const stopDragging = event =&gt; {
      if(!dragging) return;
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
      try{ holder.releasePointerCapture(event.pointerId); }catch{}
    };

    holder.addEventListener(&quot;pointerup&quot;, stopDragging);
    holder.addEventListener(&quot;pointercancel&quot;, stopDragging);
    holder.addEventListener(&quot;lostpointercapture&quot;, () =&gt; {
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
    });

    window.addEventListener(&quot;resize&quot;, updateRenbanArrows);
  }


  function remainingRenbanScore(usedIds){
    const used = new Set(usedIds);
    const tables = currentTables();

    const capOf = id =&gt; Number(tables[id] || 0);

    let bestCapacity = 0;
    let totalCapacityInRuns = 0;

    recommendationRows().forEach(row =&gt; {
      let runCapacity = 0;
      let runLength = 0;

      const flush = () =&gt; {
        if(runLength &gt;= 2){
          totalCapacityInRuns += runCapacity;
          bestCapacity = Math.max(bestCapacity, runCapacity);
        }
        runCapacity = 0;
        runLength = 0;
      };

      row.forEach(id =&gt; {
        if(isVacant(id) &amp;&amp; !used.has(id)){
          runLength++;
          runCapacity += capOf(id);
        }else{
          flush();
        }
      });

      flush();
    });

    return bestCapacity * 1000 + totalCapacityInRuns;
  }

  function physicalCountForId(id){
    const group = appState.groups.find(g =&gt; g.id === id);
    if(group){
      return group.ids.reduce((sum,x)=&gt;sum+physicalCountForId(x),0);
    }

    const tables = currentTables();
    const cap = Number(tables[id] || 0);

    /* 3Fは表示上4人卓等でも、実際は2人卓を組み合わせたものとして
       清掃負担を数える。4名=2実卓、6名=3実卓… */
    return Math.max(1, Math.ceil(cap / 2));
  }

  function cleaningEffort(option){
    let physical = 0;
    let capacity = 0;

    option.ids.forEach(id =&gt; {
      if(isCleaning(id)){
        physical += physicalCountForId(id);
        const tables = currentTables();
        capacity += Number(tables[id] || 0);
      }
    });

    return {physical, capacity};
  }

  function cleaningPhysicalKeys(option){
    const keys = [];

    const expand = id =&gt; {
      const group = appState.groups.find(g =&gt; g.id === id);
      if(group){
        group.ids.forEach(expand);
        return;
      }

      const def = pairById[id];
      if(def &amp;&amp; appState.merged[id]){
        def.parts.forEach(part =&gt; keys.push(part));
        return;
      }

      keys.push(id);
    };

    option.ids.forEach(id =&gt; {
      if(isCleaning(id)) expand(id);
    });

    return [...new Set(keys)];
  }

  function cleaningSetDominated(option,candidates){
    const mine = new Set(cleaningPhysicalKeys(option));
    if(!mine.size) return false;

    return candidates.some(other =&gt; {
      if(other === option) return false;

      const theirs = new Set(cleaningPhysicalKeys(other));
      if(!theirs.size || theirs.size &gt;= mine.size) return false;

      for(const key of theirs){
        if(!mine.has(key)) return false;
      }

      return true;
    });
  }

  function applyRecommendationOption(option){
    /* Khi bấm một phương án trong おすすめ案:
       - xóa 清掃待ち của mọi bàn thuộc phương án
       - áp dụng thẳng trạng thái đang chọn (席取り / 使用中 / 空席)
       - KHÔNG bắt buộc tạo group ghép mới
       Như vậy ví dụ C7 đang 清掃待ち + C8 đang sạch:
       bấm phương án khi chọn 使用中 =&gt; cả C7 và C8 đều thành 使用中. */
    const expanded = new Set();

    option.ids.forEach(id =&gt; {
      const group = groupFor(id);
      if(group){
        group.ids.forEach(x =&gt; expanded.add(x));
      }else{
        expanded.add(id);
      }
    });

    [...expanded].forEach(id =&gt; {
      delete appState.cleaning[id];

      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    /* Nếu phương án chạm vào một group đã tồn tại thì cập nhật group đó.
       Không tự tạo group mới chỉ vì chọn một phương án đề nghị. */
    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
        group.ids.forEach(id =&gt; delete appState.cleaning[id]);
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

function renderRenbanOptions(){
    const all = allRenbanOptions();
    let filtered;

    if(peopleFilter === &quot;all&quot;){
      filtered = [...all].sort((a,b) =&gt;
        Number(a.cleaning) - Number(b.cleaning) ||
        compareRecommendationRoute(a,b)
      );
    }else{
      const requested = Number(peopleFilter);
      const capacityOf = item =&gt; item.capacity ?? item.pax;

      const bestByTables = new Map();

      all
        .filter(item =&gt; capacityOf(item) &gt;= requested)
        .forEach(item =&gt; {
          const key = item.ids.join(&quot;-&quot;);
          const current = bestByTables.get(key);

          if(!current ||
             capacityOf(item) &lt; capacityOf(current) ||
             (capacityOf(item) === capacityOf(current) &amp;&amp;
              Number(item.low) &lt; Number(current.low))){
            bestByTables.set(key,item);
          }
        });

      const normal = [...bestByTables.values()];

      const keepReasonableCombos = list =&gt; {
        if(!list.length) return [];

        const singles = list.filter(item =&gt; item.ids.length === 1);
        const combos = list.filter(item =&gt; item.ids.length &gt; 1);
        const minOverallCapacity = Math.min(
          ...list.map(item =&gt; capacityOf(item))
        );

        /* その時点の分割/連結状態を実配置として扱う。
           E3E4等が現在連結済みなら ids.length===1 の既存卓として
           MAXが大きくても予備候補に残す。
           現在E3/E4に分割されているなら、2名客のために
           E3+E4=4を新規連結する案は出さない。 */
        return [
          ...singles,
          ...combos.filter(item =&gt; capacityOf(item) === minOverallCapacity)
        ];
      };

      const sorter = (a,b) =&gt; {
        const capA = capacityOf(a);
        const capB = capacityOf(b);

        const capacityDiff =
          (capA - requested) - (capB - requested);
        if(capacityDiff) return capacityDiff;

        if(a.cleaning &amp;&amp; b.cleaning){
          const ea = cleaningEffort(a);
          const eb = cleaningEffort(b);

          const cleanDiff =
            ea.physical - eb.physical ||
            ea.capacity - eb.capacity;
          if(cleanDiff) return cleanDiff;
        }

        const renDiff =
          remainingRenbanScore(b.ids) - remainingRenbanScore(a.ids);
        if(renDiff) return renDiff;

        const displayCountDiff = a.ids.length - b.ids.length;
        if(displayCountDiff) return displayCountDiff;

        return compareRecommendationRoute(a,b);
      };

      /* 案内可能候補:
         現在すでに存在する単卓/連結済み卓は大きめMAXでも予備として残し、
         今から新しく作る連結案だけ必要最小MAXに制限する。 */
      const ready = keepReasonableCombos(
        normal.filter(item =&gt; !item.cleaning)
      ).sort(sorter);

      const waitingBase = keepReasonableCombos(
        normal.filter(item =&gt; item.cleaning)
      );

      let waiting = [];

      if(waitingBase.length){
        const minWaitingCapacity = Math.min(
          ...waitingBase.map(item =&gt; capacityOf(item))
        );

        const sameCapacity = waitingBase
          .filter(item =&gt; capacityOf(item) === minWaitingCapacity);

        waiting = sameCapacity
          .filter(item =&gt; !cleaningSetDominated(item,sameCapacity))
          .sort(sorter);
      }

      /* お客様最優先：案内可能な最小MAX候補を全部先に、
         その後に清掃待ちの最小MAX候補。 */
      filtered = [...ready, ...waiting];
    }

    document.getElementById(&quot;renbanCount&quot;).textContent = filtered.length + &quot;案&quot;;

    const holder = document.getElementById(&quot;renbanOptions&quot;);
    holder.innerHTML = &quot;&quot;;

    if(!filtered.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;案内できる空席候補はありません。&quot;;
      holder.appendChild(empty);
      requestAnimationFrame(updateRenbanArrows);
      return;
    }

    const tables = currentTables();
    const requested = peopleFilter === &quot;all&quot; ? null : Number(peopleFilter);

    filtered.forEach(option =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      const actualCapacity = option.capacity ?? option.pax;
      const excess =
        requested === null ? 0 : Math.max(0,actualCapacity-requested);

      let priorityClass = &quot;&quot;;
      let priorityLabel = &quot;&quot;;

      if(option.cleaning){
        priorityClass = &quot; low&quot;;
        priorityLabel = &quot;清掃待ち&quot;;
      }else if(requested !== null){
        if(excess === 0){
          priorityClass = &quot; priority-1&quot;;
          priorityLabel = &quot;優先&quot;;
        }else if(excess === 1){
          priorityClass = &quot; priority-2&quot;;
          priorityLabel = &quot;次点&quot;;
        }else{
          priorityClass = &quot; priority-3&quot;;
          priorityLabel = &quot;予備&quot;;
        }
      }else{
        priorityClass = option.low ? &quot; low&quot; : &quot;&quot;;
        priorityLabel = option.low ? &quot;優先度低&quot; : &quot;使用可能&quot;;
      }

      btn.className = &quot;renban-option&quot; + priorityClass;

      let note;

      if(option.cleaning){
        const effort = cleaningEffort(option);
        const renScore = remainingRenbanScore(option.ids);
        const remainingMaxRenban = Math.floor(renScore / 1000);

        note =
          &quot;清掃待ち・MAX &quot; + actualCapacity + &quot;名&quot; +
          &quot;・清掃&quot; + effort.physical + &quot;卓相当&quot; +
          &quot;・残す連番MAX &quot; + remainingMaxRenban + &quot;名&quot;;

        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else if(requested !== null){
        note =
          priorityLabel + &quot;・&quot; +
          option.ids.length + &quot;卓・MAX &quot; + actualCapacity + &quot;名&quot;;

        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else{
        note = priorityLabel;
      }

      btn.innerHTML =
        &quot;&lt;strong&gt;&quot; + (requested ?? option.pax) + &quot;名&lt;/strong&gt;&quot; +
        &#x27;&lt;div class=&quot;chips&quot;&gt;&#x27; +
        option.ids.map(id =&gt;
          &#x27;&lt;span class=&quot;chip &#x27; + capacityClass(tables[id]) + &#x27;&quot;&gt;&#x27; +
          id +
          &quot;&lt;/span&gt;&quot;
        ).join(&quot;&quot;) +
        &quot;&lt;/div&gt;&quot; +
        &quot;&lt;small&gt;&quot; + note + &quot;&lt;/small&gt;&quot;;

      btn.addEventListener(&quot;click&quot;, () =&gt; {
        applyRecommendationOption(option);
      });

      holder.appendChild(btn);
    });

    requestAnimationFrame(updateRenbanArrows);
  }

      summary.appendChild(card);

    cleaningCard.innerHTML = &quot;&lt;small&gt;清掃待ち&lt;/small&gt;&lt;b&gt;&quot; + cleaningCount + &quot;&lt;/b&gt;&quot;;
    summary.appendChild(cleaningCard);
  }

  }


  function createManualGroup(){
    if(!validManualSelection()){
      showToast(&quot;同じ連番内の隣り合う卓を選択してください&quot;);
      return;
    }

    const ids = sortedManualSelection();
    const state = selectedStatus;
    const tables = currentTables();
    const capacity = ids.reduce((sum,id) =&gt; {
      const value = tables[id];
      return sum + (value === &quot;BOX&quot; ? 7 : Number(value || 0));
    },0);

    const group = {
      id:&quot;manual-&quot; + Date.now(),
      ids,
      state,
      capacity
    };

    appState.groups.push(group);

    ids.forEach(id =&gt; {
      if(state === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = state;
      }
    });

    manualMode = false;
    manualSelected.clear();
    saveState();
    renderAll();
    showToast(ids.join(&quot;・&quot;) + &quot; を手動連結&quot;);
  }

  function releaseManualGroup(groupId){
    const index = appState.groups.findIndex(group =&gt; group.id === groupId);
    if(index &lt; 0) return;

    const [group] = appState.groups.splice(index,1);
    group.ids.forEach(id =&gt; delete appState.states[id]);

    manualSelected.clear();
    saveState();
    renderAll();
    showToast(group.ids.join(&quot;・&quot;) + &quot; → 空席&quot;);
  }

  function renderManualControls(){
    const ids = sortedManualSelection();
    const tables = currentTables();
    const total = ids.reduce((sum,id) =&gt; {
      const capacity = tables[id];
      return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
    },0);

    const toggle = document.getElementById(&quot;manualToggle&quot;);
    toggle.classList.toggle(&quot;active&quot;, manualMode);
    toggle.textContent = manualMode ? &quot;手動連結中&quot; : &quot;手動連結&quot;;

    document.getElementById(&quot;manualInfo&quot;).textContent =
      ids.length
        ? &quot;選択：&quot; + ids.join(&quot;・&quot;) + &quot;　合計&quot; + total + &quot;席&quot;
        : &quot;卓を選択&quot;;

    document.getElementById(&quot;manualConfirm&quot;).disabled = !validManualSelection();
  }


  function renderLargeManualGroups(){
    const section = document.getElementById(&quot;largeManualSection&quot;);
    const grid = document.getElementById(&quot;largeManualGrid&quot;);
    const count = document.getElementById(&quot;largeManualCount&quot;);

    const groups = appState.groups.filter(group =&gt; Number(group.capacity) &gt; 6);

    section.hidden = groups.length === 0;
    count.textContent = groups.length + &quot;組&quot;;
    grid.innerHTML = &quot;&quot;;

    groups.forEach(group =&gt; {
      grid.appendChild(createManualGroupCard(group));
    });
  }

  function renderAll(){
    renderSummary();
    renderPeopleRow();
    renderClusterStrip();
    renderRenbanOptions();
    renderManualControls();
    renderLargeManualGroups();
    renderTables();
  }


  document.getElementById(&quot;manualToggle&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualMode = !manualMode;

    renderAll();
  });

  document.getElementById(&quot;manualClear&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualSelected.clear();
    renderAll();
  });

  document.getElementById(&quot;manualConfirm&quot;).addEventListener(&quot;click&quot;, createManualGroup);

  document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {

        item.classList.toggle(&quot;active&quot;, item === btn);
      });
    });
  });

  document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      tableView = btn.dataset.view;
      document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(item =&gt; {
        item.classList.toggle(&quot;active&quot;, item === btn);
      });
      renderTables();
    });
  });

  document.getElementById(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
appState = {states:{}, merged:{...defaultMerged}, groups:[], cleaning:{}};
    selectedStatus = &quot;reserved&quot;;
    tableView = &quot;all&quot;;
    peopleFilter = &quot;all&quot;;
    saveState();

    document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.state === &quot;reserved&quot;);
    });

    document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.view === &quot;all&quot;);
    });

    renderAll();
  });

  setupRenbanScroller();
  renderAll();
})();

function roomOf(id){return ROOM_ORDER.find(r=&gt;id.startsWith(r))||null}
function baseOf(id){return id.endsWith(&quot;A&quot;)||id.endsWith(&quot;B&quot;)?id.slice(0,-1):id}
function posOf(id){const r=roomOf(id),b=baseOf(id);return r?ROOMS[r].positions[b]:null}
function capOf(id){
 const p=posOf(id);if(!p)return 0;
 if(id.endsWith(&quot;A&quot;))return 2;if(id.endsWith(&quot;B&quot;))return 4;
 return p.type===&quot;fixed6&quot;||p.type===&quot;split&quot;?6:4;
}
function activeIds(room){
 const out=[];
 for(const [id,p] of Object.entries(ROOMS[room].positions)){
  if(p.type===&quot;fixture&quot;)continue;
  if(p.type===&quot;split&quot;&amp;&amp;!data.merged[id])out.push(id+&quot;A&quot;,id+&quot;B&quot;);else out.push(id);
 }
 return out;
}
function groupFor(id){return data.groups.find(g=&gt;g.ids.includes(id))}
function isCleaning(id){
 const g=groupFor(id),ids=g?g.ids:[id];
 return ids.some(x=&gt;!!data.cleaning[x]);
}
function vacant(id){return state(id)===&quot;empty&quot;&amp;&amp;!groupFor(id)}
function available(id){return vacant(id)&amp;&amp;!isCleaning(id)}

function laneUnits(room,lane){
 const ids=[];
 lane.forEach(base=&gt;{
  const p=ROOMS[room].positions[base];
  if(p.type===&quot;split&quot;&amp;&amp;!data.merged[base])ids.push(base+&quot;B&quot;,base+&quot;A&quot;); else ids.push(base);
 });
 return ids;
}
function allRuns(room){
 const out=[];
 ROOMS[room].autoLanes.forEach((lane,laneIndex)=&gt;{
  const units=laneUnits(room,lane);
  for(let i=0;i&lt;units.length;i++){
   if(!vacant(units[i]))continue;
   let cap=0,cleaning=false;
   for(let j=i;j&lt;units.length;j++){
    if(!vacant(units[j]))break;
    cap+=capOf(units[j]);
    cleaning=cleaning||isCleaning(units[j]);
    out.push({ids:units.slice(i,j+1),cap,count:j-i+1,laneIndex,start:i,cleaning});
   }
  }
 });
 return out;
}
function tableNumber(id){
 const nums=String(id).match(/\d+/g);
 return nums ? Math.min(...nums.map(Number)) : Number.MAX_SAFE_INTEGER;
}
function compareByTableNumber(a,b){
 const aa=a.ids.map(tableNumber).sort((x,y)=&gt;x-y);
 const bb=b.ids.map(tableNumber).sort((x,y)=&gt;x-y);
 const n=Math.max(aa.length,bb.length);
 for(let i=0;i&lt;n;i++){
  const av=aa[i]??Number.MAX_SAFE_INTEGER;
  const bv=bb[i]??Number.MAX_SAFE_INTEGER;
  if(av!==bv)return av-bv;
 }
 return 0;
}
function remainingMaxAfter(room,usedIds){
 const used=new Set(usedIds);
 let best=0;

 ROOMS[room].autoLanes.forEach(lane=&gt;{
  const units=laneUnits(room,lane);
  let cap=0;
  units.forEach(id=&gt;{
   if(vacant(id)&amp;&amp;!used.has(id)){
    cap+=capOf(id);
    if(cap&gt;best)best=cap;
   }else{
    cap=0;
   }
  });
 });

 return best;
}

function physicalCountForId(id){
 const g=groupFor(id);
 if(g){
  return g.ids.reduce((sum,x)=&gt;sum+physicalCountForId(x),0);
 }

 const p=posOf(id);
 if(!p)return 1;

 /* 個室には固定卓と分割/連結卓が混在する。
    - 固定4/固定6: そのまま1卓
    - splitを現在連結中: 2つの実卓を連結したものなので2卓
    - splitを分割中のA/B: それぞれ1卓 */
 const base=baseOf(id);
 const bp=ROOMS[roomOf(id)]?.positions?.[base];

 if(bp?.type===&quot;split&quot;){
  if(id===base &amp;&amp; data.merged[base])return 2;
  return 1;
 }

 return 1;
}

function cleaningEffort(option){
 let physical=0,capacity=0;
 option.ids.forEach(id=&gt;{
  if(isCleaning(id)){
   physical+=physicalCountForId(id);
   capacity+=capOf(id);
  }
 });
 return {physical,capacity};
}

function cleaningPhysicalKeys(option){
 const keys=[];

 const expand=id=&gt;{
  const g=groupFor(id);
  if(g){
   g.ids.forEach(expand);
   return;
  }

  const base=baseOf(id);
  const room=roomOf(id);
  const p=room?ROOMS[room].positions[base]:null;

  if(p?.type===&quot;split&quot; &amp;&amp; id===base &amp;&amp; data.merged[base]){
   keys.push(base+&quot;A&quot;,base+&quot;B&quot;);
   return;
  }

  keys.push(id);
 };

 option.ids.forEach(id=&gt;{
  if(isCleaning(id))expand(id);
 });

 return [...new Set(keys)];
}

function cleaningSetDominated(option,candidates){
 const mine=new Set(cleaningPhysicalKeys(option));
 if(!mine.size)return false;

 return candidates.some(other=&gt;{
  if(other===option)return false;
  const theirs=new Set(cleaningPhysicalKeys(other));
  if(!theirs.size||theirs.size&gt;=mine.size)return false;

  for(const key of theirs){
   if(!mine.has(key))return false;
  }
  return true;
 });
}

function roomActivityProfile(room){
 let total=0;
 let used=0;
 const countedGroups=new Set();

 activeIds(room).forEach(id=&gt;{
  const g=groupFor(id);

  if(g){
   if(countedGroups.has(g.id))return;
   countedGroups.add(g.id);
   total+=1;

   const active=
     (g.state||&quot;empty&quot;)!==&quot;empty&quot; ||
     g.ids.some(x=&gt;state(x)!==&quot;empty&quot;) ||
     g.ids.some(x=&gt;isCleaning(x));

   if(active)used+=1;
   return;
  }

  total+=1;
  if(state(id)!==&quot;empty&quot; || isCleaning(id))used+=1;
 });

 return {used,total,remaining:Math.max(0,total-used)};
}

function roomActivityScore(room){
 const p=roomActivityProfile(room);
 return p.total ? p.used/p.total : 0;
}

function roomRemainingProfile(chosenRoom,usedIds){
 const profile={};
 ROOM_ORDER.forEach(room=&gt;{
  profile[room]=remainingMaxAfter(
    room,
    room===chosenRoom ? usedIds : []
  );
 });
 return profile;
}

function strongestOtherRoomMax(chosenRoom,usedIds){
 const p=roomRemainingProfile(chosenRoom,usedIds);
 return Math.max(...ROOM_ORDER.map(r=&gt;p[r]||0));
}

function splitUseCandidates(){
 const out=[];

 ROOM_ORDER.forEach(room=&gt;{
  for(const [base,p] of Object.entries(ROOMS[room].positions)){
   if(p.type!==&quot;split&quot; || !data.merged[base])continue;
   if(!vacant(base) || isCleaning(base))continue;

   /* Cụm split hiện tại = 2 + 4.
      Nếu khách cần 2 người, có thể tách và dùng A, giữ lại B=4.
      Nếu khách cần 3-4 người, có thể tách và dùng B=4, giữ lại A=2.
      Đây phải được ưu tiên hơn dùng một bàn cố định 6 người. */
   let part=null,cap=0,kept=0;

   if(people&lt;=2){
    part=base+&quot;A&quot;;
    cap=2;
    kept=4;
   }else if(people&lt;=4){
    part=base+&quot;B&quot;;
    cap=4;
    kept=2;
   }else{
    continue;
   }

   out.push({
    ids:[part],
    base,
    room,
    cap,
    count:1,
    laneIndex:0,
    start:tableNumber(base),
    cleaning:false,
    splitUse:true,
    keptSplitCapacity:kept,
    remainMax:remainingMaxAfter(room,[base]),
    roomActivity:roomActivityScore(room),
    roomActivityProfile:roomActivityProfile(room),
    globalRemainMax:strongestOtherRoomMax(room,[base]),
    remainProfile:roomRemainingProfile(room,[base])
   });
  }
 });

 return out;
}

function applySplitUse(option){
 const base=option.base;
 if(!base || !data.merged[base])return;

 if(state(base)!==&quot;empty&quot; || isCleaning(base)){
  toast(base+&quot; は現在分割できません&quot;);
  return;
 }

 delete data.states[base];
 delete data.cleaning[base];
 delete data.states[base+&quot;A&quot;];
 delete data.states[base+&quot;B&quot;];
 data.merged[base]=false;

 const target=option.ids[0];
 if(selectedState===&quot;empty&quot;){
  delete data.states[target];
 }else{
  data.states[target]=selectedState;
 }

 save();
 renderAll();
 toast(base+&quot; を分割 → &quot;+target+&quot; を&quot;+stateLabel(selectedState));
}

function flexibilityPenalty(option){
 /* Cùng phòng + cùng MAX:
    bàn cố định nên được dùng trước để giữ các bàn có thể tách 2+4 cho lượt sau.
    0 = bàn cố định / không làm mất tính linh hoạt
    1 = cụm split hiện đang ghép (2+4) sẽ mất cơ hội tách thành 2 nhóm 2 và 4
    2 = phương án phải ghép mới nhiều bàn
 */
 if(option.splitUse)return 0;

 if(option.count===1 &amp;&amp; option.ids.length===1){
  const id=option.ids[0];
  const p=posOf(id);
  if(p?.type===&quot;split&quot; &amp;&amp; data.merged[id])return 1;
  return 0;
 }

 return option.count&gt;1 ? 2 : 0;
}

function candidates(){
 const roomPriority=room=&gt;ROOM_ORDER.indexOf(room);

 const normal=ROOM_ORDER.flatMap(room=&gt;
   allRuns(room)
    .filter(x=&gt;x.cap&gt;=people)
    .map(x=&gt;({
      ...x,
      room,
      remainMax:remainingMaxAfter(room,x.ids),
      roomActivity:roomActivityScore(room),
      roomActivityProfile:roomActivityProfile(room),
      flexibilityPenalty:0,
      globalRemainMax:strongestOtherRoomMax(room,x.ids),
      remainProfile:roomRemainingProfile(room,x.ids)
    }))
 );

 /* Cụm 2+4 đang ghép sẵn có thể tách để dùng đúng phần cần thiết. */
 const splitReady=splitUseCandidates();

 const all=[...normal,...splitReady];

 const keepCurrentTablesAndMinimumNewCombos=list=&gt;{
  if(!list.length)return [];

  const existing=list.filter(x=&gt;x.count===1 || x.splitUse);
  const combos=list.filter(x=&gt;x.count&gt;1 &amp;&amp; !x.splitUse);
  const minOverallCap=Math.min(...list.map(x=&gt;x.cap));

  return [
    ...existing,
    ...combos.filter(x=&gt;x.cap===minOverallCap)
  ];
 };

 const readyAll=all.filter(x=&gt;!x.cleaning);

 /* 案内可能な空席案は、各部屋ごとに必要最小MAXの新規連結案を残す。
    個室全体で一括して絞ると、別の部屋の候補のせいで
    SGの4+4=8のような「今すぐ案内できる案」が消えることがある。 */
 const readyBase=ROOM_ORDER.flatMap(room=&gt;
   keepCurrentTablesAndMinimumNewCombos(
     readyAll.filter(x=&gt;x.room===room)
   )
 );

 const readySorter=(a,b)=&gt;{
  /* 1) Vừa số khách nhất.
        Ví dụ 4名: phần 4 của SG5/KH5 tự nhiên đứng trước bàn cố định6 KH8. */
  const capDiff=(a.cap-people)-(b.cap-people);
  if(capDiff)return capDiff;

  /* 2) Dồn khách vào phòng đã dùng nhiều hơn TRƯỚC.
        Nếu SG đang dùng nhiều hơn KH thì SG phải đứng trước KH. */
  const ap=a.roomActivityProfile||roomActivityProfile(a.room);
  const bp=b.roomActivityProfile||roomActivityProfile(b.room);

  /* 使用率 used/total が高い部屋を先に埋める。 */
  const ratioDiff=(bp.used*ap.total)-(ap.used*bp.total);
  if(ratioDiff)return ratioDiff;

  /* 使用率が同じなら、残り卓数が少ない部屋を先にする。 */
  const remainingDiff=ap.remaining-bp.remaining;
  if(remainingDiff)return remainingDiff;

  const usedDiff=bp.used-ap.used;
  if(usedDiff)return usedDiff;

  /* 3) Nếu cùng phòng / cùng mức vừa khách:
        ưu tiên bàn CỐ ĐỊNH trước bàn split đang ghép.
        Ví dụ 6名 trong KH: KH8 cố định phải trước KH5=2+4,
        vì KH5 còn có thể tách ra dùng cho 4名 + 2名 sau. */
  if(a.room===b.room){
   const flexibilityDiff=flexibilityPenalty(a)-flexibilityPenalty(b);
   if(flexibilityDiff)return flexibilityDiff;
  }

  /* 4) Với nhóm 2〜4名, nếu đang dùng chính cụm split thì
        phương án tách lấy đúng phần cần vẫn được ưu tiên. */
  const splitDiff=Number(!!b.splitUse)-Number(!!a.splitUse);
  if(splitDiff)return splitDiff;

  /* 4) Nếu đều là split-use, giữ phần bàn có ích hơn cho lượt sau. */
  const keptDiff=(b.keptSplitCapacity||0)-(a.keptSplitCapacity||0);
  if(keptDiff)return keptDiff;

  /* 5) Ít đơn vị bàn hơn */
  const countDiff=a.count-b.count;
  if(countDiff)return countDiff;

  /* 6) Giữ MAX toàn khu rồi MAX trong phòng */
  const globalDiff=b.globalRemainMax-a.globalRemainMax;
  if(globalDiff)return globalDiff;

  const roomMaxDiff=b.remainMax-a.remainMax;
  if(roomMaxDiff)return roomMaxDiff;

  return roomPriority(a.room)-roomPriority(b.room)||
    compareByTableNumber(a,b)||
    a.laneIndex-b.laneIndex||
    a.start-b.start;
 };

 const ready=readyBase.sort(readySorter);

 /* 清掃待ち không dùng split-use ảo vì trạng thái merged không cho biết
    chính xác phần A hay B đã bẩn; giữ logic dọn an toàn như v6. */
 const waitingAll=normal.filter(x=&gt;x.cleaning);

 /* 清掃待ちも部屋ごとに候補を作ってから全体比較する。 */
 const waitingBase=ROOM_ORDER.flatMap(room=&gt;
   keepCurrentTablesAndMinimumNewCombos(
     waitingAll.filter(x=&gt;x.room===room)
   )
 );

 let waiting=[];
 if(waitingBase.length){
  const minWaitingCap=Math.min(...waitingBase.map(x=&gt;x.cap));
  const sameCapacity=waitingBase.filter(x=&gt;x.cap===minWaitingCap);

  waiting=sameCapacity.filter(
    x=&gt;!cleaningSetDominated(x,sameCapacity)
  );

  waiting.sort((a,b)=&gt;{
   const ap=a.roomActivityProfile||roomActivityProfile(a.room);
   const bp=b.roomActivityProfile||roomActivityProfile(b.room);

   /* 使用率 used/total が高い部屋を先に埋める。 */
   const ratioDiff=(bp.used*ap.total)-(ap.used*bp.total);
   if(ratioDiff)return ratioDiff;

   /* 使用率が同じなら、残り卓数が少ない部屋を先にする。 */
   const remainingDiff=ap.remaining-bp.remaining;
   if(remainingDiff)return remainingDiff;

   const usedDiff=bp.used-ap.used;
   if(usedDiff)return usedDiff;

   const ea=cleaningEffort(a),eb=cleaningEffort(b);
   const cleanDiff=
     ea.physical-eb.physical||
     ea.capacity-eb.capacity;
   if(cleanDiff)return cleanDiff;

   const globalDiff=b.globalRemainMax-a.globalRemainMax;
   if(globalDiff)return globalDiff;

   const roomMaxDiff=b.remainMax-a.remainMax;
   if(roomMaxDiff)return roomMaxDiff;

   return roomPriority(a.room)-roomPriority(b.room)||
     a.count-b.count||
     compareByTableNumber(a,b)||
     a.laneIndex-b.laneIndex||
     a.start-b.start;
  });
 }

 return [...ready,...waiting].slice(0,35);
}
function setIds(ids,s=selectedState){
 ids.forEach(id=&gt;{
   delete data.cleaning[id];
   s===&quot;empty&quot;?delete data.states[id]:data.states[id]=s;
 });
 const g=data.groups.find(g=&gt;ids.some(id=&gt;g.ids.includes(id)));
 if(g){
   g.state=s;
   g.ids.forEach(id=&gt;delete data.cleaning[id]);
 }
 save();renderAll();
}
function createGroup(ids,room=roomOf(ids[0])||selectedRoom){
 selectedRoom=room;
 if(ids.length&lt;2){setIds(ids);return}
 if(ids.some(id=&gt;!available(id))){toast(&quot;空席の卓だけ連結できます&quot;);return}
 data.groups.push({id:&quot;g&quot;+Date.now()+Math.random(),room,ids:[...ids],state:selectedState});
 setIds(ids,selectedState);toast(ids.join(&quot;・&quot;)+&quot; を連結しました&quot;);
}
function releaseGroup(gid){
 const i=data.groups.findIndex(g=&gt;g.id===gid);if(i&lt;0)return;
 data.groups[i].ids.forEach(id=&gt;{delete data.states[id];delete data.cleaning[id]});data.groups.splice(i,1);save();renderAll();toast(&quot;連結解除 → 空席&quot;);
}
function toggleSplit(base){
 if(groupFor(base)||groupFor(base+&quot;A&quot;)||groupFor(base+&quot;B&quot;)){
  toast(&quot;先に手動連結を解除してください&quot;);return
 }

 if(data.merged[base]){
  if(state(base)!==&quot;empty&quot;){toast(&quot;空席にしてから分割してください&quot;);return}
  const wasCleaning=!!data.cleaning[base];

  delete data.states[base];
  delete data.cleaning[base];
  delete data.states[base+&quot;A&quot;];
  delete data.states[base+&quot;B&quot;];
  data.merged[base]=false;

  if(wasCleaning){
   data.cleaning[base+&quot;A&quot;]=true;
   data.cleaning[base+&quot;B&quot;]=true;
  }
 }else{
  if(state(base+&quot;A&quot;)!==&quot;empty&quot;||state(base+&quot;B&quot;)!==&quot;empty&quot;){
   toast(&quot;両方を空席にしてから連結してください&quot;);return
  }

  const wasCleaning=!!data.cleaning[base+&quot;A&quot;]||!!data.cleaning[base+&quot;B&quot;];

  delete data.states[base];
  delete data.states[base+&quot;A&quot;];
  delete data.states[base+&quot;B&quot;];
  delete data.cleaning[base+&quot;A&quot;];
  delete data.cleaning[base+&quot;B&quot;];
  data.merged[base]=true;

  if(wasCleaning)data.cleaning[base]=true;
 }

 selected.clear();save();renderAll();
}
function markCleaning(id){
 const g=groupFor(id),ids=g?g.ids:[id];
 ids.forEach(x=&gt;{delete data.states[x];data.cleaning[x]=true});
 if(g)g.state=&quot;empty&quot;;
 save();renderAll();toast(ids.join(&quot;・&quot;)+&quot; → 清掃待ち&quot;);
}
function bindLongPress(btn,id){
 let timer=null,held=false,suppressClick=false,startX=0,startY=0;
 const begin=(x,y)=&gt;{
  held=false;startX=x;startY=y;clearTimeout(timer);
  timer=setTimeout(()=&gt;{
   held=true;suppressClick=true;markCleaning(id);
   try{navigator.vibrate&amp;&amp;navigator.vibrate(25)}catch{}
  },500);
 };
 const move=(x,y)=&gt;{
  if(Math.abs(x-startX)&gt;12||Math.abs(y-startY)&gt;12){clearTimeout(timer);timer=null}
 };
 const end=()=&gt;{clearTimeout(timer);timer=null};
 btn.addEventListener(&quot;touchstart&quot;,e=&gt;{const t=e.touches[0];begin(t.clientX,t.clientY)},{passive:true});
 btn.addEventListener(&quot;touchmove&quot;,e=&gt;{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
 btn.addEventListener(&quot;touchend&quot;,e=&gt;{end();if(held)e.preventDefault()},{passive:false});
 btn.addEventListener(&quot;touchcancel&quot;,end);
 btn.addEventListener(&quot;mousedown&quot;,e=&gt;{if(e.button===0)begin(e.clientX,e.clientY)});
 btn.addEventListener(&quot;mousemove&quot;,e=&gt;move(e.clientX,e.clientY));
 btn.addEventListener(&quot;mouseup&quot;,end);btn.addEventListener(&quot;mouseleave&quot;,end);
 btn.addEventListener(&quot;click&quot;,e=&gt;{
  if(suppressClick){suppressClick=false;e.preventDefault();e.stopImmediatePropagation()}
 },true);
 btn.addEventListener(&quot;contextmenu&quot;,e=&gt;e.preventDefault());
}

function handle(id){
 if(manual){
  if(!available(id)){toast(&quot;空席の卓だけ選択できます&quot;);return}
  selected.has(id)?selected.delete(id):selected.add(id);renderAll();return;
 }
 const g=groupFor(id);g?setIds(g.ids):setIds([id]);
}

function renderRoomButtons(){
 const h=document.getElementById(&quot;roomRow&quot;);h.innerHTML=&quot;&quot;;
 ROOM_ORDER.forEach(r=&gt;{const b=document.createElement(&quot;button&quot;);b.textContent=r;b.classList.toggle(&quot;active&quot;,r===selectedRoom);
  b.onclick=()=&gt;{selectedRoom=r;manual=false;selected.clear();renderAll()};h.appendChild(b)});
}
function renderPeople(){
 const h=document.getElementById(&quot;peopleRow&quot;);
 h.innerHTML=&quot;&quot;;

 /* Chỉ hiển thị số người mà trạng thái bàn HIỆN TẠI thực sự còn có thể nhận.
    Dùng allRuns() của toàn bộ SG/KH/CD, bao gồm cả bàn sạch và 清掃待ち,
    vì cả hai đều là phương án có thể phục vụ sau khi dọn.
    Không dùng danh sách cố định tới 20 nữa. */
 const maxCapacity=ROOM_ORDER.reduce((max,room)=&gt;{
   const roomMax=allRuns(room).reduce((m,x)=&gt;Math.max(m,x.cap),0);
   return Math.max(max,roomMax);
 },0);

 const choices=[];
 for(let n=2;n&lt;=maxCapacity;n++){
   const possible=ROOM_ORDER.some(room=&gt;
     allRuns(room).some(x=&gt;x.cap&gt;=n)
   );
   if(possible)choices.push(n);
 }

 /* Nếu trạng thái thay đổi làm số người đang chọn không còn hợp lệ,
    chuyển về mức lớn nhất còn có thể nhận. */
 if(choices.length &amp;&amp; !choices.includes(people)){
   people=choices[choices.length-1];
 }

 choices.forEach(n=&gt;{
   const b=document.createElement(&quot;button&quot;);
   b.textContent=n+&quot;名&quot;;
   b.classList.toggle(&quot;active&quot;,n===people);
   b.onclick=()=&gt;{
     people=n;
     renderPeople();
     renderOptions();
   };
   h.appendChild(b)
 });
}
function summary(room){
 const ids=activeIds(room),grouped=new Set(data.groups.filter(g=&gt;g.room===room).flatMap(g=&gt;g.ids));
 const c=n=&gt;ids.filter(id=&gt;capOf(id)===n&amp;&amp;!grouped.has(id)&amp;&amp;state(id)===&quot;empty&quot;).length;
 const cleaning=ids.filter(id=&gt;!grouped.has(id)&amp;&amp;state(id)===&quot;empty&quot;&amp;&amp;isCleaning(id)).length;
 return {c2:c(2),c4:c(4),c6:c(6),max:allRuns(room).reduce((m,x)=&gt;Math.max(m,x.cap),0),cleaning};
}
function renderSummary(){
 const h=document.getElementById(&quot;summaryAll&quot;);h.innerHTML=&quot;&quot;;
 ROOM_ORDER.forEach(r=&gt;{const s=summary(r),d=document.createElement(&quot;div&quot;);d.className=&quot;room-summary&quot;;
 d.innerHTML=`&lt;div class=&quot;room-name&quot;&gt;${r}&lt;/div&gt;&lt;div class=&quot;sum&quot;&gt;&lt;small&gt;2人卓 空き&lt;/small&gt;&lt;b&gt;${s.c2}&lt;/b&gt;&lt;/div&gt;
 &lt;div class=&quot;sum&quot;&gt;&lt;small&gt;4人卓 空き&lt;/small&gt;&lt;b&gt;${s.c4}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;sum&quot;&gt;&lt;small&gt;6人卓 空き&lt;/small&gt;&lt;b&gt;${s.c6}&lt;/b&gt;&lt;/div&gt;
 &lt;div class=&quot;sum&quot;&gt;&lt;small&gt;MAX&lt;/small&gt;&lt;b&gt;${s.max}名&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;sum&quot;&gt;&lt;small&gt;清掃待ち&lt;/small&gt;&lt;b&gt;${s.cleaning}&lt;/b&gt;&lt;/div&gt;`;h.appendChild(d)});
}
function renderManual(){
 document.getElementById(&quot;manualToggle&quot;).classList.toggle(&quot;active&quot;,manual);
 document.getElementById(&quot;manualToggle&quot;).textContent=manual?&quot;手動連結中&quot;:&quot;手動連結&quot;;
 const ids=[...selected],cap=ids.reduce((s,id)=&gt;s+capOf(id),0);
 document.getElementById(&quot;selectionInfo&quot;).textContent=ids.length?`選択：${ids.join(&quot;・&quot;)}　合計${cap}席`:&quot;卓を選択してください&quot;;
 document.getElementById(&quot;manualConfirm&quot;).disabled=ids.length&lt;2;
}
function applyCleaningOption(option){
 const ids=[...option.ids];

 /* 同じsplit卓のA+Bなら、清掃待ちを解除してその場で再連結し、
    選択中の 席取り / 使用中 にする。
    例: SG5A + SG5B → SG5（6人） */
 if(ids.length===2){
  const bases=[...new Set(ids.map(baseOf))];
  if(bases.length===1){
   const base=bases[0];
   const room=roomOf(base);
   const p=room ? ROOMS[room].positions[base] : null;
   const expected=new Set([base+&quot;A&quot;,base+&quot;B&quot;]);

   if(
    p?.type===&quot;split&quot; &amp;&amp;
    !data.merged[base] &amp;&amp;
    ids.every(id=&gt;expected.has(id)) &amp;&amp;
    ids.every(id=&gt;state(id)===&quot;empty&quot;)
   ){
    delete data.states[base+&quot;A&quot;];
    delete data.states[base+&quot;B&quot;];
    delete data.cleaning[base+&quot;A&quot;];
    delete data.cleaning[base+&quot;B&quot;];
    delete data.states[base];
    delete data.cleaning[base];

    data.merged[base]=true;
    if(selectedState!==&quot;empty&quot;)data.states[base]=selectedState;

    selectedRoom=room;
    save();
    renderAll();
    toast(base+&quot; を連結 → &quot;+stateLabel(selectedState));
    return;
   }
  }
 }

 /* 通常の清掃待ち案:
    清掃待ちを解除し、必要ならそのまま連結して選択状態にする。 */
 ids.forEach(id=&gt;delete data.cleaning[id]);

 if(ids.length&lt;2){
  setIds(ids,selectedState);
  return;
 }

 if(ids.every(id=&gt;available(id))){
  createGroup(ids,option.room);
  return;
 }

 toast(&quot;この案は現在そのまま連結できません&quot;);
}

function renderOptions(){
 document.getElementById(&quot;recommendTitle&quot;).innerHTML=&quot;&lt;strong&gt;おすすめ案&lt;/strong&gt;&quot;;
 const h=document.getElementById(&quot;options&quot;);h.innerHTML=&quot;&quot;;const arr=candidates();
 document.getElementById(&quot;optionCount&quot;).textContent=arr.length+&quot;案&quot;;
 if(!arr.length){
  h.innerHTML=&#x27;&lt;div class=&quot;empty-note&quot;&gt;利用できる組み合わせがありません。&lt;/div&gt;&#x27;;
  updateArrows();return
 }

 arr.forEach((o,i)=&gt;{
  const excess=o.cap-people;
  const cls=o.cleaning?&quot;low&quot;:excess===0?&quot;p1&quot;:excess===1?&quot;p2&quot;:&quot;p3&quot;;
  const b=document.createElement(&quot;button&quot;);
  b.className=&quot;option &quot;+cls;

  let note;
  if(o.cleaning){
   const effort=cleaningEffort(o);
   note=
    &quot;清掃待ち&quot;+
    &quot;・MAX &quot;+o.cap+&quot;名&quot;+
    &quot;・清掃&quot;+effort.physical+&quot;卓&quot;+
    &quot;・残すMAX &quot;+o.remainMax+&quot;名&quot;;
   if(excess&gt;0)note+=&quot;・空き&quot;+excess+&quot;席&quot;;
  }else if(o.splitUse){
   note=
    &quot;優先・&quot;+o.base+&quot;を分割&quot;+
    &quot;・MAX &quot;+o.cap+&quot;名&quot;+
    &quot;・&quot;+o.keptSplitCapacity+&quot;人卓を残す&quot;;
  }else{
   note=(i===0&amp;&amp;excess===0)?&quot;優先&quot;:excess===0?&quot;同数候補&quot;:&quot;予備&quot;;
   if(excess&gt;0)note+=&quot;・空き&quot;+excess+&quot;席&quot;;
   note+=&quot;・残すMAX &quot;+o.remainMax+&quot;名&quot;;
  }

  const title=o.splitUse ? (o.ids[0]+&quot;（分割）&quot;) : o.ids.join(&quot;・&quot;);

  b.innerHTML=
   `&lt;strong&gt;${title}&lt;/strong&gt;`+
   `&lt;div class=&quot;cap&quot;&gt;${o.room}・${o.count}卓・MAX ${o.cap}名&lt;/div&gt;`+
   `&lt;small&gt;${note}&lt;/small&gt;`;

  b.onclick=()=&gt;{
   if(o.cleaning){
    applyCleaningOption(o);
    return
   }
   if(o.splitUse){
    applySplitUse(o);
    return
   }
   createGroup(o.ids,o.room)
  };
  h.appendChild(b)
 });

 requestAnimationFrame(()=&gt;{h.scrollLeft=0;updateArrows()});
}
function styleBox(el,p){
 el.style.left=p.x+&quot;%&quot;;el.style.top=p.y+&quot;%&quot;;el.style.width=p.w+&quot;%&quot;;el.style.height=p.h+&quot;%&quot;;
}
function tableButton(id,cap){
 const b=document.createElement(&quot;button&quot;),g=groupFor(id),cleaning=isCleaning(id);
 b.className=`table cap${cap} ${cleaning?&quot;cleaning&quot;:state(id)} ${selected.has(id)?&quot;selected&quot;:&quot;&quot;} ${g?&quot;grouped&quot;:&quot;&quot;}`;
 b.innerHTML=`&lt;span class=&quot;st&quot;&gt;${cleaning?&quot;清&quot;:stateLabel(state(id)).slice(0,1)}&lt;/span&gt;&lt;span&gt;${id}&lt;/span&gt;&lt;span class=&quot;cap&quot;&gt;${cap}人&lt;/span&gt;`;
 if(g){const badge=document.createElement(&quot;span&quot;);badge.className=&quot;group-badge&quot;;badge.textContent=&quot;連&quot;;b.appendChild(badge)}
 b.onclick=()=&gt;handle(id);bindLongPress(b,id);return b;
}
function splitElement(base,p){
 const wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;split-wrap&quot;;styleBox(wrap,p);
 if(data.merged[base]){
  const g=groupFor(base),d=document.createElement(&quot;button&quot;);
  const cleaning=isCleaning(base);
  d.className=`split-merged ${cleaning?&quot;cleaning&quot;:state(base)} ${selected.has(base)?&quot;selected&quot;:&quot;&quot;} ${g?&quot;grouped&quot;:&quot;&quot;}`;
  d.innerHTML=`&lt;div class=&quot;segment seg2&quot;&gt;2&lt;/div&gt;&lt;div class=&quot;segment seg4&quot;&gt;4&lt;/div&gt;&lt;span class=&quot;state-badge&quot;&gt;${cleaning?&quot;清&quot;:stateLabel(state(base)).slice(0,1)}&lt;/span&gt;&lt;span class=&quot;merged-label&quot;&gt;${base}　6人&lt;/span&gt;`;
  if(g){const badge=document.createElement(&quot;span&quot;);badge.className=&quot;group-badge&quot;;badge.textContent=&quot;連&quot;;d.appendChild(badge)}
  d.onclick=()=&gt;handle(base);bindLongPress(d,base);wrap.appendChild(d);
 }else{
  const d=document.createElement(&quot;div&quot;);d.className=&quot;split-parts&quot;;d.append(tableButton(base+&quot;A&quot;,2),tableButton(base+&quot;B&quot;,4));wrap.appendChild(d);
 }
 const t=document.createElement(&quot;button&quot;);t.className=&quot;split-action&quot;;t.textContent=data.merged[base]?&quot;分割&quot;:&quot;連結&quot;;t.onclick=e=&gt;{e.stopPropagation();toggleSplit(base)};
 wrap.appendChild(t);return wrap;
}
function rectOfId(id){
 const p=posOf(id);if(!p)return null;
 let y=p.y,h=p.h;
 if(id.endsWith(&quot;A&quot;)){h=p.h/3}
 else if(id.endsWith(&quot;B&quot;)){y=p.y+p.h/3;h=p.h*2/3}
 return {x:p.x,y,w:p.w,h};
}
function placeAbsolute(el,r){
 el.style.left=r.x+&quot;%&quot;;el.style.top=r.y+&quot;%&quot;;el.style.width=r.w+&quot;%&quot;;el.style.height=r.h+&quot;%&quot;;
}
function renderSplitBase(map,base,p,grouped){
 const a=base+&quot;A&quot;,b=base+&quot;B&quot;;
 if(data.merged[base]){
   if(grouped.has(base))return;
   map.appendChild(splitElement(base,p));return;
 }
 const wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;split-wrap&quot;;styleBox(wrap,p);
 const parts=document.createElement(&quot;div&quot;);parts.className=&quot;split-parts&quot;;
 if(grouped.has(a)){
   const gap=document.createElement(&quot;div&quot;);gap.style.visibility=&quot;hidden&quot;;parts.appendChild(gap);
 }else parts.appendChild(tableButton(a,2));
 if(grouped.has(b)){
   const gap=document.createElement(&quot;div&quot;);gap.style.visibility=&quot;hidden&quot;;parts.appendChild(gap);
 }else parts.appendChild(tableButton(b,4));
 wrap.appendChild(parts);
 const t=document.createElement(&quot;button&quot;);t.className=&quot;split-action&quot;;t.textContent=&quot;連結&quot;;
 t.onclick=e=&gt;{e.stopPropagation();toggleSplit(base)};wrap.appendChild(t);map.appendChild(wrap);
}
function renderManualGroups(map){
 data.groups.filter(g=&gt;g.room===selectedRoom).forEach(g=&gt;{
   const rects=g.ids.map(rectOfId).filter(Boolean);if(!rects.length)return;
   const minX=Math.min(...rects.map(r=&gt;r.x)),minY=Math.min(...rects.map(r=&gt;r.y));
   const maxX=Math.max(...rects.map(r=&gt;r.x+r.w)),maxY=Math.max(...rects.map(r=&gt;r.y+r.h));
   const pad=0.7;
   const wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;manual-group-wrap&quot;;
   placeAbsolute(wrap,{x:Math.max(0,minX-pad),y:Math.max(0,minY-pad),w:Math.min(100,maxX-minX+pad*2),h:Math.min(100,maxY-minY+pad*2)});
   const b=document.createElement(&quot;button&quot;);b.className=`manual-group ${g.state||state(g.ids[0])}`;
   const cap=g.ids.reduce((s,id)=&gt;s+capOf(id),0);
   b.innerHTML=`&lt;span class=&quot;group-ids&quot;&gt;${g.ids.join(&quot;・&quot;)}&lt;/span&gt;&lt;span class=&quot;group-cap&quot;&gt;MAX ${cap}名&lt;/span&gt;`;
   b.onclick=()=&gt;manual?toast(&quot;手動連結中です&quot;):setIds(g.ids);
   const x=document.createElement(&quot;button&quot;);x.className=&quot;group-release&quot;;x.textContent=&quot;×&quot;;
   x.title=&quot;連結解除&quot;;x.onclick=e=&gt;{e.stopPropagation();releaseGroup(g.id)};
   wrap.append(b,x);map.appendChild(wrap);
 });
}
function renderMap(){
 document.getElementById(&quot;mapTitle&quot;).textContent=`${selectedRoom} 実配置`;
 const map=document.getElementById(&quot;roomMap&quot;);map.innerHTML=&quot;&quot;;
 const head=document.createElement(&quot;div&quot;);head.className=&quot;room-header&quot;;head.textContent=selectedRoom;map.appendChild(head);
 const ent=document.createElement(&quot;div&quot;);ent.className=&quot;entrance&quot;;ent.textContent=&quot;入口&quot;;map.appendChild(ent);

 const grouped=new Set(data.groups.filter(g=&gt;g.room===selectedRoom).flatMap(g=&gt;g.ids));
 const positions=ROOMS[selectedRoom].positions;
 for(const [id,p] of Object.entries(positions)){
   if(p.type===&quot;fixture&quot;){
     const f=document.createElement(&quot;div&quot;);f.className=&quot;fixture&quot;;f.innerHTML=p.label;styleBox(f,p);map.appendChild(f);continue;
   }
   if(p.type===&quot;split&quot;){renderSplitBase(map,id,p,grouped);continue}
   if(grouped.has(id))continue;
   const wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;table-wrap&quot;;styleBox(wrap,p);
   wrap.appendChild(tableButton(id,p.type===&quot;fixed6&quot;?6:4));map.appendChild(wrap);
 }
 renderManualGroups(map);
}
function updateArrows(){
 const h=document.getElementById(&quot;options&quot;),m=Math.max(0,h.scrollWidth-h.clientWidth);
 document.getElementById(&quot;prev&quot;).disabled=h.scrollLeft&lt;=2;document.getElementById(&quot;next&quot;).disabled=h.scrollLeft&gt;=m-2;
}
function renderAll(){
 renderPeople();
 renderSummary();
 renderRoomButtons();
 renderManual();
 renderOptions();
 renderMap();
}

document.querySelectorAll(&quot;#stateRow button&quot;).forEach(b=&gt;b.onclick=()=&gt;{
 selectedState=b.dataset.state;document.querySelectorAll(&quot;#stateRow button&quot;).forEach(x=&gt;x.classList.toggle(&quot;active&quot;,x===b))
});
document.getElementById(&quot;manualToggle&quot;).onclick=()=&gt;{manual=!manual;selected.clear();renderAll()};
document.getElementById(&quot;manualClear&quot;).onclick=()=&gt;{selected.clear();renderAll()};
document.getElementById(&quot;manualConfirm&quot;).onclick=()=&gt;{const ids=[...selected];if(ids.length&lt;2){toast(&quot;2卓以上を選択してください&quot;);return}createGroup(ids);manual=false;selected.clear();renderAll()};
document.getElementById(&quot;reset&quot;).onclick=()=&gt;{
 data={states:{},groups:[],merged:{},cleaning:{}};
 for(const r of ROOM_ORDER)for(const [id,p] of Object.entries(ROOMS[r].positions))if(p.type===&quot;split&quot;)data.merged[id]=true;
 manual=false;selected.clear();save();renderAll();toast(&quot;初期状態に戻しました&quot;)
};
const oh=document.getElementById(&quot;options&quot;);
document.getElementById(&quot;prev&quot;).onclick=()=&gt;oh.scrollBy({left:-oh.clientWidth*.85,behavior:&quot;smooth&quot;});
document.getElementById(&quot;next&quot;).onclick=()=&gt;oh.scrollBy({left:oh.clientWidth*.85,behavior:&quot;smooth&quot;});
oh.addEventListener(&quot;scroll&quot;,updateArrows,{passive:true});

renderPeople();renderAll();
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe></main></div><script>
(()=>{const bs=[...document.querySelectorAll(".tab-btn")],fs=[...document.querySelectorAll(".app-frame")];
function a(n){bs.forEach((b,i)=>b.classList.toggle("active",i===n));fs.forEach((f,i)=>f.classList.toggle("active",i===n));try{localStorage.setItem("sekifuri-all-active-tab",String(n))}catch{}}
bs.forEach((b,i)=>b.addEventListener("click",()=>a(i)));let n=0;try{const s=Number(localStorage.getItem("sekifuri-all-active-tab"));if(Number.isInteger(s)&&s>=0&&s<fs.length)n=s}catch{}a(n)})();
</script></body></html>
