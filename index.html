const KEY=CONFIG.key;

for(const c of CONFIG.composites) if(data.merged[c.id]===undefined)data.merged[c.id]=true;

const state=id=&gt;data.states[id]||&quot;empty&quot;;

function toast(m){const t=document.getElementById(&quot;toast&quot;);t.textContent=m;t.classList.add(&quot;show&quot;);clearTimeout(window.__toast);window.__toast=setTimeout(()=&gt;t.classList.remove(&quot;show&quot;),1250)}
function compositeById(id){return CONFIG.composites.find(c=&gt;c.id===id)}
function groupForUnit(id){return data.groups.find(g=&gt;g.ids.includes(id))}
function activeUnits(){
 const units=[];
 CONFIG.items.forEach(item=&gt;{
   if(item.kind===&quot;single&quot;) units.push({id:item.id,cap:item.cap,base:item.base||item.id,rowKey:item.rowKey,order:item.order,pos:item.pos});
   else {
     const c=compositeById(item.id);
     if(data.merged[c.id]) units.push({id:c.id,cap:c.cap,base:c.id,rowKey:c.rowKey,order:c.order,pos:c.pos,composite:true});
     else c.parts.forEach((p,i)=&gt;units.push({id:p.id,cap:p.cap,base:c.id,rowKey:c.rowKey,order:c.order+i/10,pos:c.pos,part:true}));
   }
 });
 return units;
}
function unitMap(){return Object.fromEntries(activeUnits().map(u=&gt;[u.id,u]))}
function isCleaning(id){return !!data.cleaning[id]}
function vacant(u){return state(u.id)===&quot;empty&quot;&amp;&amp;!groupForUnit(u.id)}
function available(u){return vacant(u)&amp;&amp;!isCleaning(u.id)}
function currentRows(){
 const um=unitMap(), rows=[];
 CONFIG.rowKeys.forEach(key=&gt;{
   const arr=activeUnits().filter(u=&gt;u.rowKey===key).sort((a,b)=&gt;a.order-b.order);
   rows.push(arr);
 });
 return rows;
}
function allRuns(){
 const out=[];
 currentRows().forEach((row,rowIndex)=&gt;{
   for(let i=0;i&lt;row.length;i++){
     if(!vacant(row[i]))continue;
     let cap=0,cleaning=false;
     for(let j=i;j&lt;row.length;j++){
       if(!vacant(row[j]))break;
       cap+=row[j].cap;
       cleaning=cleaning||isCleaning(row[j].id);
       out.push({ids:row.slice(i,j+1).map(x=&gt;x.id),cap,rowIndex,start:i,count:j-i+1,cleaning});
     }
   }
 });
 return out;
}
function remainingMaxAfter(ids){
 const used=new Set(ids);
 let best=0;
 currentRows().forEach(row=&gt;{
   let cap=0;
   row.forEach(u=&gt;{
     if(vacant(u)&amp;&amp;!used.has(u.id)){
       cap+=u.cap;
       if(cap&gt;best)best=cap;
     }else{
       cap=0;
     }
   });
 });
 return best;
}
function physicalTableCountForId(id){
 const c=compositeById(id);
 if(c&amp;&amp;data.merged[c.id])return c.parts.length;
 return 1;
}
function physicalTableCount(ids){
 return ids.reduce((sum,id)=&gt;sum+physicalTableCountForId(id),0);
}
function cleaningPhysicalCount(ids){
 return ids.reduce((sum,id)=&gt;{
   if(!isCleaning(id))return sum;
   return sum+physicalTableCountForId(id);
 },0);
}
function candidates(){
 const fitting=allRuns().filter(o=&gt;o.cap&gt;=people);
 if(!fitting.length)return [];

 const enrich=o=&gt;({
   ...o,
   physicalCount:physicalTableCount(o.ids),
   cleaningPhysical:cleaningPhysicalCount(o.ids),
   remainMax:remainingMaxAfter(o.ids)
 });

 const readyAll=fitting.filter(o=&gt;!o.cleaning);
 const waitingAll=fitting.filter(o=&gt;o.cleaning);

 let ready=[];
 if(readyAll.length){
   const minReadyCap=Math.min(...readyAll.map(o=&gt;o.cap));

   /* 新しく連結する案は必要最小MAXだけ。
      ただし、現在すでに1つの卓として存在する結合卓は
      MAXが大きくても予備候補として残す。 */
   ready=readyAll
     .filter(o=&gt;{
       if(o.cap===minReadyCap)return true;
       if(o.ids.length!==1)return false;
       const u=unitMap()[o.ids[0]];
       return !!u?.composite;
     })
     .map(enrich);
 }

 let waiting=[];
 if(waitingAll.length){
   /* 清掃待ちは従来どおり、必要最小MAXだけ。 */
   const minWaitingCap=Math.min(...waitingAll.map(o=&gt;o.cap));
   waiting=waitingAll
     .filter(o=&gt;o.cap===minWaitingCap)
     .map(enrich);
 }

 const sorter=(a,b)=&gt;
   a.cleaningPhysical-b.cleaningPhysical ||
   a.physicalCount-b.physicalCount ||
   b.remainMax-a.remainMax ||
   Number(a.rowIndex===0)-Number(b.rowIndex===0) ||
   a.rowIndex-b.rowIndex ||
   a.start-b.start;

 /* お客様優先：すぐ案内できる候補を全部先に、清掃待ちは後。 */
 return [
   ...ready.sort((a,b)=&gt;
     (a.cap-people)-(b.cap-people) ||
     sorter(a,b)
   ),
   ...waiting.sort((a,b)=&gt;
     (a.cap-people)-(b.cap-people) ||
     sorter(a,b)
   )
 ].slice(0,35);
}
function setUnits(ids,s=selectedState){
 ids.forEach(id=&gt;{
   delete data.cleaning[id];
   s===&quot;empty&quot;?delete data.states[id]:data.states[id]=s;
 });
 const g=data.groups.find(x=&gt;ids.some(id=&gt;x.ids.includes(id)));

   g.state=s;
   g.ids.forEach(id=&gt;delete data.cleaning[id]);
 }

}
function createGroup(ids){

 if(ids.some(id=&gt;!available(unitMap()[id]))){toast(&quot;空席ではない卓は連結できません&quot;);return}
 data.groups.push({id:&quot;g&quot;+Date.now()+Math.random(),ids:[...ids],state:selectedState});

}
function releaseGroup(gid){
 const i=data.groups.findIndex(g=&gt;g.id===gid); if(i&lt;0)return;
 data.groups[i].ids.forEach(id=&gt;{delete data.states[id];delete data.cleaning[id]});
 data.groups.splice(i,1); save();renderAll();toast(&quot;連結解除 → 空席&quot;);
}
function toggleComposite(cid){

 if(groupForUnit(cid)||c.parts.some(p=&gt;groupForUnit(p.id))){toast(&quot;先に手動連結を解除してください&quot;);return}
 if(data.merged[cid]){
   if(state(cid)!==&quot;empty&quot;){toast(&quot;空席にしてから分割してください&quot;);return}
   delete data.states[cid]; c.parts.forEach(p=&gt;delete data.states[p.id]); data.merged[cid]=false;
 }else{
   if(c.parts.some(p=&gt;state(p.id)!==&quot;empty&quot;)){toast(&quot;両方を空席にしてから連結してください&quot;);return}
   c.parts.forEach(p=&gt;delete data.states[p.id]); delete data.states[cid]; data.merged[cid]=true;
 }

}
function validManual(){
 if(selected.size&lt;2)return false;
 const ids=[...selected], rows=currentRows();
 return rows.some(row=&gt;{
   const ri=ids.map(id=&gt;row.findIndex(u=&gt;u.id===id));
   if(ri.some(i=&gt;i&lt;0))return false;
   ri.sort((a,b)=&gt;a-b);
   return ri.every((v,i)=&gt;i===0||v===ri[i-1]+1);
 });
}
function toggleSelect(id){

function renderPeople(){
 const h=document.getElementById(&quot;peopleRow&quot;);
 h.innerHTML=&quot;&quot;;

 /* Chỉ hiện số khách mà trạng thái bàn HIỆN TẠI thực sự còn có thể nhận.
    allRuns() bao gồm cả bàn sạch và 清掃待ち miễn bàn vẫn là 空席,
    nên MAX ở đây phản ánh cả trường hợp dọn xong rồi annai. */
 const runs=allRuns();
 const maxCap=runs.reduce((m,o)=&gt;Math.max(m,o.cap),0);

 const choices=[];
 for(let n=2;n&lt;=maxCap;n++){
  if(runs.some(o=&gt;o.cap&gt;=n)) choices.push(n);
 }

 /* Nếu trạng thái bàn thay đổi khiến số người đang chọn không còn khả thi,
    tự chuyển về mức lớn nhất còn nhận được. */
 if(choices.length &amp;&amp; !choices.includes(people)){
  people=choices[choices.length-1];
 }

 choices.forEach(n=&gt;{
  const b=document.createElement(&quot;button&quot;);
  b.textContent=n+&quot;名&quot;;
  b.classList.toggle(&quot;active&quot;,n===people);
  b.onclick=()=&gt;{
   people=n;
   renderPeople();
   renderOptions();
  };
  h.appendChild(b);
 });
}

function applyRecommendedCleaning(ids){

function renderOptions(){

 document.getElementById(&quot;optionCount&quot;).textContent=arr.length+&quot;案&quot;;
 if(!arr.length){h.innerHTML=&#x27;&lt;div class=&quot;empty-note&quot;&gt;利用できる連番がありません。&lt;/div&gt;&#x27;;return}
 arr.forEach((o,i)=&gt;{
   const excess=o.cap-people;
   let cls=o.cleaning?&quot;low&quot;:excess===0?&quot;p1&quot;:excess===1?&quot;p2&quot;:&quot;p3&quot;;
   const b=document.createElement(&quot;button&quot;);b.className=&quot;option &quot;+cls;
   const note=o.cleaning?&quot;清掃待ち&quot;:(i===0&amp;&amp;excess===0?&quot;優先&quot;:excess===0?&quot;同数候補&quot;:&quot;予備&quot;);

      &lt;button id=&quot;manualToggle&quot; type=&quot;button&quot;&gt;手動連結&lt;/button&gt;
      &lt;span id=&quot;manualInfo&quot; class=&quot;manual-info&quot;&gt;卓を選択&lt;/span&gt;
      &lt;button id=&quot;manualClear&quot; type=&quot;button&quot;&gt;選択解除&lt;/button&gt;
      &lt;button id=&quot;manualConfirm&quot; class=&quot;confirm&quot; type=&quot;button&quot; disabled&gt;連結する&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;main&gt;
  &lt;section class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;
      &lt;span&gt;おすすめ案&lt;/span&gt;
      &lt;span id=&quot;renbanCount&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;renban-scroll-wrap&quot;&gt;
      &lt;button id=&quot;renbanPrev&quot; class=&quot;scroll-arrow&quot; type=&quot;button&quot; aria-label=&quot;前の候補&quot;&gt;‹&lt;/button&gt;
      &lt;div id=&quot;renbanOptions&quot; class=&quot;renban-options&quot;&gt;&lt;/div&gt;
      &lt;button id=&quot;renbanNext&quot; class=&quot;scroll-arrow&quot; type=&quot;button&quot; aria-label=&quot;次の候補&quot;&gt;›&lt;/button&gt;
    &lt;/div&gt;
  &lt;/section&gt;




  &lt;section id=&quot;largeManualSection&quot; class=&quot;card&quot; hidden&gt;
    &lt;div class=&quot;card-title&quot;&gt;
      &lt;span&gt;連結卓（7名以上）&lt;/span&gt;
      &lt;span id=&quot;largeManualCount&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;largeManualGrid&quot; class=&quot;table-grid&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div id=&quot;tableArea&quot;&gt;&lt;/div&gt;
&lt;/main&gt;

&lt;div id=&quot;toast&quot; class=&quot;toast&quot;&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;

  const STORAGE_KEY = &quot;sekifuri-2f-cleaning-final-v13-cleaning-renban&quot;;
  const PREVIOUS_STORAGE_KEY = &quot;sekifuri-2f-v27-priority-route&quot;;
  if(!localStorage.getItem(STORAGE_KEY) &amp;&amp; localStorage.getItem(PREVIOUS_STORAGE_KEY)){
    localStorage.setItem(STORAGE_KEY, localStorage.getItem(PREVIOUS_STORAGE_KEY));
  }

  const fixedTables = {
    &quot;S1&quot;:2,&quot;S2&quot;:2,&quot;S3&quot;:2,&quot;S4&quot;:2,&quot;S5&quot;:2,
    &quot;80&quot;:6,&quot;81&quot;:6,
    &quot;90&quot;:6,&quot;91&quot;:4,&quot;92&quot;:6,&quot;93&quot;:4,&quot;94&quot;:6,&quot;95&quot;:4,&quot;96&quot;:4,
    &quot;97&quot;:2,&quot;98&quot;:2,&quot;99&quot;:2,&quot;100&quot;:2,&quot;101&quot;:2,
    &quot;C1&quot;:6,&quot;C2&quot;:6,&quot;C3&quot;:6,&quot;C4&quot;:6,&quot;C5&quot;:6,&quot;C6&quot;:6,
    &quot;C7&quot;:&quot;BOX&quot;,&quot;C8&quot;:&quot;BOX&quot;,
    &quot;D1&quot;:&quot;BOX&quot;,&quot;D2&quot;:&quot;BOX&quot;,&quot;D3&quot;:&quot;BOX&quot;,&quot;D4&quot;:&quot;BOX&quot;,
    &quot;D5&quot;:&quot;BOX&quot;,&quot;D6&quot;:&quot;BOX&quot;,&quot;D7&quot;:&quot;BOX&quot;,&quot;D8&quot;:&quot;BOX&quot;,
    &quot;D9&quot;:6,&quot;D10&quot;:4,&quot;D11&quot;:4
  };

  const pairPrefixes = [&quot;82&quot;,&quot;83&quot;,&quot;84&quot;,&quot;85&quot;,&quot;86&quot;,&quot;87&quot;,&quot;88&quot;];

  /* 卓種別の表示順は、番号順ではなく実際の案内動線に合わせる。 */
  const twoFixedOrder = [&quot;S1&quot;,&quot;S2&quot;,&quot;S3&quot;,&quot;S4&quot;,&quot;S5&quot;,&quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;];
  const fourFixedOrder = [&quot;91&quot;,&quot;93&quot;,&quot;95&quot;,&quot;96&quot;,&quot;D10&quot;,&quot;D11&quot;];
  const sixOrder = [&quot;80&quot;,&quot;81&quot;,&quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;,&quot;90&quot;,&quot;92&quot;,&quot;94&quot;,&quot;D9&quot;];
  const boxOrder = [&quot;C7&quot;,&quot;C8&quot;,&quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;];

  /*
    おすすめ案の案内優先順。
    S卓 → 80番台 → 90番台 → C卓 → D卓。
    同じ列の中では番号の小さい卓から先に表示する。
  */
  const recommendationRoute = [
    &quot;S1&quot;,&quot;S2&quot;,&quot;S3&quot;,&quot;S4&quot;,&quot;S5&quot;,
    &quot;80&quot;,&quot;81&quot;,
    &quot;82A&quot;,&quot;82B&quot;,&quot;82AB&quot;,&quot;83A&quot;,&quot;83B&quot;,&quot;83AB&quot;,&quot;84A&quot;,&quot;84B&quot;,&quot;84AB&quot;,
    &quot;85A&quot;,&quot;85B&quot;,&quot;85AB&quot;,&quot;86A&quot;,&quot;86B&quot;,&quot;86AB&quot;,&quot;87A&quot;,&quot;87B&quot;,&quot;87AB&quot;,&quot;88A&quot;,&quot;88B&quot;,&quot;88AB&quot;,
    &quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;,&quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
    &quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;,&quot;C7&quot;,&quot;C8&quot;,
    &quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;,&quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;
  ];

  function recommendationIdRank(id){
    const direct = recommendationRoute.indexOf(id);
    if(direct &gt;= 0) return direct;

    const group = appState?.groups?.find(group =&gt; group.id === id);
    if(group){
      const ranks = group.ids.map(recommendationIdRank).filter(Number.isFinite);
      return ranks.length ? Math.min(...ranks) : Number.MAX_SAFE_INTEGER;
    }
    return Number.MAX_SAFE_INTEGER;
  }

  function recommendationKey(option){
    return option.ids
      .flatMap(id =&gt; {
        const group = appState?.groups?.find(group =&gt; group.id === id);
        return group ? group.ids : [id];
      })
      .map(recommendationIdRank)
      .sort((a,b) =&gt; a-b);
  }

  function compareRecommendationRoute(a,b){
    const ka = recommendationKey(a);
    const kb = recommendationKey(b);
    const n = Math.max(ka.length,kb.length);
    for(let i=0;i&lt;n;i++){
      const av = ka[i] ?? Number.MAX_SAFE_INTEGER;
      const bv = kb[i] ?? Number.MAX_SAFE_INTEGER;
      if(av !== bv) return av-bv;
    }
    return 0;
  }

  const renbanGroups = [
    [&quot;80&quot;,&quot;81&quot;],
    [&quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;],
    [&quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;],
    [&quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;],
    [&quot;C7&quot;,&quot;C8&quot;],
    [&quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;],
    [&quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;]
  ];

  /*
    手動連結卓の表示順。
    作成した順番ではなく、もとの卓位置に従って必ず並べる。
  */
  const pairRouteIds = pairPrefixes.flatMap(prefix =&gt; [
    prefix + &quot;A&quot;, prefix + &quot;B&quot;, prefix + &quot;AB&quot;
  ]);

  const manualOrderByCapacity = {
    2: [
      ...pairRouteIds,
      &quot;S1&quot;,&quot;S2&quot;,&quot;S3&quot;,&quot;S4&quot;,&quot;S5&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;
    ],
    4: [
      ...pairRouteIds,
      &quot;91&quot;,&quot;93&quot;,&quot;95&quot;,&quot;96&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
      &quot;D10&quot;,&quot;D11&quot;
    ],
    6: [
      &quot;80&quot;,&quot;81&quot;,
      ...pairRouteIds,
      &quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;,
      &quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
      &quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;
    ],
    large: [
      &quot;80&quot;,&quot;81&quot;,
      ...pairRouteIds,
      &quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;,&quot;C7&quot;,&quot;C8&quot;,
      &quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
      &quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;,&quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;
    ]
  };

  function manualGroupRank(group, capacityKey){
    const route = manualOrderByCapacity[capacityKey] || manualOrderByCapacity.large;
    const indexes = group.ids
      .map(id =&gt; route.indexOf(id))
      .filter(index =&gt; index &gt;= 0);

    return indexes.length ? Math.min(...indexes) : Number.MAX_SAFE_INTEGER;
  }

  function sortedManualGroups(groups, capacityKey){
    return [...groups].sort((a,b) =&gt; {
      const rankDiff = manualGroupRank(a, capacityKey) - manualGroupRank(b, capacityKey);
      if(rankDiff !== 0) return rankDiff;

      const aLabel = a.ids.join(&quot;・&quot;);
      const bLabel = b.ids.join(&quot;・&quot;);
      return aLabel.localeCompare(bLabel, &quot;ja&quot;);
    });
  }

  let appState = loadState();
  let selectedStatus = &quot;reserved&quot;;
  let tableView = &quot;all&quot;;
  let peopleFilter = &quot;all&quot;;
  let manualMode = false;
  let manualSelected = new Set();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        states: parsed.states || {},
        merged: parsed.merged || {},
        groups: parsed.groups || [],
        cleaning: parsed.cleaning || {}
      };
    }catch{
      return {states:{}, merged:{}, groups:[], cleaning:{}};
    }
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  }


  function groupFor(id){
    return appState.groups.find(group =&gt; group.id === id || group.ids.includes(id));
  }

  function isGrouped(id){
    return Boolean(groupFor(id));
  }

  function isCleaning(id){
    const group = groupFor(id);
    const ids = group ? group.ids : [id];
    return ids.some(x =&gt; !!appState.cleaning?.[x]);
  }

  function isVacant(id){
    const virtualGroup = appState.groups.some(group =&gt; group.id === id);
    return getStatus(id) === &quot;empty&quot; &amp;&amp; (virtualGroup || !isGrouped(id));
  }

  function isAvailable(id){
    return isVacant(id) &amp;&amp; !isCleaning(id);
  }

  function activePairRow(){
    return pairPrefixes.flatMap(prefix =&gt;
      appState.merged[prefix]
        ? [prefix + &quot;AB&quot;]
        : [prefix + &quot;A&quot;, prefix + &quot;B&quot;]
    );
  }

  function recommendationRows(){
    return [activePairRow(), ...renbanGroups];
  }

  function manualRows(){
    return recommendationRows();
  }

  function sortedManualSelection(){
    const ids = [...manualSelected];
    for(const row of manualRows()){
      if(ids.every(id =&gt; row.includes(id))){
        return ids.sort((a,b) =&gt; row.indexOf(a) - row.indexOf(b));
      }
    }
    return ids;
  }

  function validManualSelection(){
    if(manualSelected.size &lt; 2) return false;

    const ids = [...manualSelected];
    return manualRows().some(row =&gt; {
      const indexes = ids.map(id =&gt; row.indexOf(id));
      if(indexes.some(index =&gt; index &lt; 0)) return false;
      indexes.sort((a,b) =&gt; a-b);
      return indexes.every((value,index) =&gt;
        index === 0 || value === indexes[index - 1] + 1
      );
    });
  }

  function currentTables(){
    const tables = {...fixedTables};
    pairPrefixes.forEach(prefix =&gt; {
      if(appState.merged[prefix]){
        tables[prefix + &quot;AB&quot;] = 4;
      }else{
        tables[prefix + &quot;A&quot;] = 2;
        tables[prefix + &quot;B&quot;] = 2;
      }
    });

    appState.groups.forEach(group =&gt; {
      const total = group.capacity || group.ids.reduce((sum,id) =&gt; {
        const capacity = tables[id];
        return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
      },0);
      group.capacity = total;
      tables[group.id] = total;
    });

    return tables;
  }

  function getStatus(id){
    const group = appState.groups.find(item =&gt; item.id === id);
    if(group) return group.state || &quot;empty&quot;;
    return appState.states[id] || &quot;empty&quot;;
  }

  function setStatus(ids){
    const expanded = new Set();

    ids.forEach(id =&gt; {
      const group = groupFor(id);
      (group ? group.ids : [id]).forEach(groupId =&gt; expanded.add(groupId));
    });

    [...expanded].forEach(id =&gt; {
      delete appState.cleaning[id];
      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

  function statusLabel(value){
    if(value === &quot;reserved&quot;) return &quot;席取り&quot;;
    if(value === &quot;used&quot;) return &quot;使用中&quot;;
    return &quot;空席&quot;;
  }

  function capacityClass(capacity){
    if(capacity === &quot;BOX&quot;) return &quot;cbox&quot;;
    return &quot;c&quot; + capacity;
  }

  function markCleaning(id){
    const group = groupFor(id);
    const ids = group ? group.ids : [id];
    ids.forEach(x =&gt; {
      delete appState.states[x];
      appState.cleaning[x] = true;
    });
    if(group) group.state = &quot;empty&quot;;
    saveState();
    renderAll();
    showToast(ids.join(&quot;・&quot;) + &quot; → 清掃待ち&quot;);
  }

  function bindLongPress(btn,id){
    let timer=null, held=false, suppressClick=false, startX=0, startY=0;
    const begin=(x,y)=&gt;{
      held=false; startX=x; startY=y;
      clearTimeout(timer);
      timer=setTimeout(()=&gt;{
        held=true; suppressClick=true;
        markCleaning(id);
        try{navigator.vibrate&amp;&amp;navigator.vibrate(25)}catch{}
      },500);
    };
    const move=(x,y)=&gt;{
      if(Math.abs(x-startX)&gt;12 || Math.abs(y-startY)&gt;12){
        clearTimeout(timer); timer=null;
      }
    };
    const end=()=&gt;{ clearTimeout(timer); timer=null; };

    btn.addEventListener(&quot;touchstart&quot;,e=&gt;{const t=e.touches[0];begin(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchmove&quot;,e=&gt;{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchend&quot;,e=&gt;{end();if(held)e.preventDefault()},{passive:false});
    btn.addEventListener(&quot;touchcancel&quot;,end);

    btn.addEventListener(&quot;mousedown&quot;,e=&gt;{if(e.button===0)begin(e.clientX,e.clientY)});
    btn.addEventListener(&quot;mousemove&quot;,e=&gt;move(e.clientX,e.clientY));
    btn.addEventListener(&quot;mouseup&quot;,end);
    btn.addEventListener(&quot;mouseleave&quot;,end);

    btn.addEventListener(&quot;click&quot;,e=&gt;{
      if(suppressClick){
        suppressClick=false;
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    },true);
    btn.addEventListener(&quot;contextmenu&quot;,e=&gt;e.preventDefault());
  }

  function createTableButton(id, capacity){
    const btn = document.createElement(&quot;button&quot;);
    btn.className = &quot;table-btn &quot; + capacityClass(capacity) + &quot; &quot; + (isCleaning(id) ? &quot;cleaning&quot; : getStatus(id));
    if(manualSelected.has(id)) btn.classList.add(&quot;manual-selected&quot;);

    btn.innerHTML = (isCleaning(id) ? &quot;清 &quot; : &quot;&quot;) + id + &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + (capacity === &quot;BOX&quot; ? &quot;B&quot; : capacity) + &quot;&lt;/span&gt;&quot;;

    btn.addEventListener(&quot;click&quot;, () =&gt; {
      if(!manualMode){
        setStatus([id]);
        return;
      }

      if(getStatus(id) !== &quot;empty&quot;){
        showToast(&quot;空席の卓だけ選択できます&quot;);
        return;
      }

      if(isGrouped(id)){
        showToast(&quot;すでに手動連結されています&quot;);
        return;
      }

      if(manualSelected.has(id)){
        manualSelected.delete(id);
      }else{
        manualSelected.add(id);
      }

      renderAll();
    });

    bindLongPress(btn,id);

    return btn;
  }


  function createManualGroupCard(group){
    const wrap = document.createElement(&quot;div&quot;);
    wrap.className = &quot;pair-card merged&quot;;

    const table = createTableButton(group.id, group.capacity);
    table.innerHTML =
      group.ids.join(&quot;・&quot;) +
      &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + group.capacity + &#x27;&lt;/span&gt;&#x27;;
    wrap.appendChild(table);

    const release = document.createElement(&quot;button&quot;);
    release.className = &quot;pair-action&quot;;
    release.textContent = &quot;解除&quot;;
    release.addEventListener(&quot;click&quot;, event =&gt; {
      event.stopPropagation();
      releaseManualGroup(group.id);
    });
    wrap.appendChild(release);

    return wrap;
  }

  function togglePair(prefix){
    const relatedIds = [prefix + &quot;AB&quot;, prefix + &quot;A&quot;, prefix + &quot;B&quot;];
    if(relatedIds.some(isGrouped)){
      showToast(&quot;先に手動連結を解除してください&quot;);
      return;
    }

    if(appState.merged[prefix]){
      const mergedId = prefix + &quot;AB&quot;;
      const oldStatus = getStatus(mergedId);
      const wasCleaning = !!appState.cleaning[mergedId];

      delete appState.states[mergedId];
      delete appState.cleaning[mergedId];
      appState.merged[prefix] = false;

      if(oldStatus !== &quot;empty&quot;){
        appState.states[prefix + &quot;A&quot;] = oldStatus;
        appState.states[prefix + &quot;B&quot;] = oldStatus;
      }
      if(wasCleaning){
        appState.cleaning[prefix + &quot;A&quot;] = true;
        appState.cleaning[prefix + &quot;B&quot;] = true;
      }
    }else{
      const aId = prefix + &quot;A&quot;;
      const bId = prefix + &quot;B&quot;;
      const aStatus = getStatus(aId);
      const bStatus = getStatus(bId);
      const wasCleaning = !!appState.cleaning[aId] || !!appState.cleaning[bId];

      delete appState.states[aId];
      delete appState.states[bId];
      delete appState.cleaning[aId];
      delete appState.cleaning[bId];
      appState.merged[prefix] = true;

      const mergedId = prefix + &quot;AB&quot;;
      if(aStatus === &quot;used&quot; || bStatus === &quot;used&quot;){
        appState.states[mergedId] = &quot;used&quot;;
      }else if(aStatus === &quot;reserved&quot; || bStatus === &quot;reserved&quot;){
        appState.states[mergedId] = &quot;reserved&quot;;
      }else if(wasCleaning){
        appState.cleaning[mergedId] = true;
      }
    }

    saveState();
    renderAll();
  }
  function createPairCard(prefix){
    const wrap = document.createElement(&quot;div&quot;);

    if(appState.merged[prefix]){
      wrap.className = &quot;pair-card merged&quot;;
      wrap.appendChild(createTableButton(prefix + &quot;AB&quot;, 4));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;分割&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }else{
      wrap.className = &quot;pair-card&quot;;
      wrap.appendChild(createTableButton(prefix + &quot;A&quot;, 2));
      wrap.appendChild(createTableButton(prefix + &quot;B&quot;, 2));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;連結&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }

    return wrap;
  }

  function countFree(ids){
    return ids.filter(id =&gt; getStatus(id) === &quot;empty&quot;).length;
  }

  function createSection(title, ids, pairMode){
    const section = document.createElement(&quot;section&quot;);
    section.className = &quot;card&quot;;

    let freeCount = ids.filter(id =&gt; !isGrouped(id) &amp;&amp; getStatus(id) === &quot;empty&quot;).length;
    const sectionCapacity = Number(title.replace(&quot;人卓&quot;,&quot;&quot;));
    const manualGroups = appState.groups.filter(group =&gt;
      group.capacity &lt;= 6 &amp;&amp; group.capacity === sectionCapacity
    );
    freeCount += manualGroups.filter(group =&gt; getStatus(group.id) === &quot;empty&quot;).length;

    if(pairMode === &quot;split-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(!appState.merged[prefix]){
          if(!isGrouped(prefix + &quot;A&quot;) &amp;&amp; getStatus(prefix + &quot;A&quot;) === &quot;empty&quot;) freeCount++;
          if(!isGrouped(prefix + &quot;B&quot;) &amp;&amp; getStatus(prefix + &quot;B&quot;) === &quot;empty&quot;) freeCount++;
        }
      });
    }

    if(pairMode === &quot;merged-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(appState.merged[prefix] &amp;&amp; !isGrouped(prefix + &quot;AB&quot;) &amp;&amp; getStatus(prefix + &quot;AB&quot;) === &quot;empty&quot;){
          freeCount++;
        }
      });
    }

    section.innerHTML =
      &#x27;&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;&#x27; + title + &#x27;&lt;/span&gt;&lt;span&gt;空き &#x27; + freeCount + &quot;&lt;/span&gt;&lt;/div&gt;&quot;;

    const grid = document.createElement(&quot;div&quot;);
    grid.className = &quot;table-grid&quot;;
    const tables = currentTables();
    const renderedGroups = new Set();

    const route = manualOrderByCapacity[sectionCapacity] || ids;
    const orderedGroups = sortedManualGroups(manualGroups, sectionCapacity);

    function groupAt(id){
      return orderedGroups.find(group =&gt;
        !renderedGroups.has(group.id) &amp;&amp; group.ids.includes(id)
      );
    }

    route.forEach(routeId =&gt; {
      const group = groupAt(routeId);
      if(group){
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
        return;
      }

      const pairPrefix = pairPrefixes.find(prefix =&gt;
        routeId === prefix + &quot;A&quot; ||
        routeId === prefix + &quot;B&quot; ||
        routeId === prefix + &quot;AB&quot;
      );

      if(pairPrefix){
        if(
          pairMode === &quot;split-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;A&quot; &amp;&amp;
          !appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;A&quot;) &amp;&amp;
          !isGrouped(pairPrefix + &quot;B&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }

        if(
          pairMode === &quot;merged-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;AB&quot; &amp;&amp;
          appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;AB&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }
        return;
      }

      if(ids.includes(routeId) &amp;&amp; !isGrouped(routeId)){
        grid.appendChild(createTableButton(routeId, tables[routeId]));
      }
    });

    /*
      念のため、順序表にない卓が追加された場合だけ最後に表示する。
      現在の卓構成では通常ここには入らない。
    */
    orderedGroups
      .filter(group =&gt; !renderedGroups.has(group.id))
      .forEach(group =&gt; {
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
      });

    ids
      .filter(id =&gt; !route.includes(id) &amp;&amp; !isGrouped(id))
      .forEach(id =&gt; grid.appendChild(createTableButton(id, tables[id])));

    if(!grid.children.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;この種類の卓はありません。&quot;;
      grid.appendChild(empty);
    }

    section.appendChild(grid);
    return section;
  }

  function maximalEmptyRuns(){
    const tables = currentTables();
    const runs = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          let total = 0;
          let allBox = true;

          run.forEach(id =&gt; {
            if(tables[id] === &quot;BOX&quot;){
              total += 7;
            }else{
              allBox = false;
              total += Number(tables[id]);
            }
          });

          runs.push({
            ids:[...run],
            label: run.length === 2 ? run.join(&quot;・&quot;) : run[0] + &quot;〜&quot; + run[run.length - 1],
            max:total,
            allBox
          });
        }
        run = [];
      };

      group.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    return runs;
  }

  function allRenbanOptions(){
    const tables = currentTables();
    const options = [];

    const seatCapacity = id =&gt; {
      const value = tables[id];
      return value === &quot;BOX&quot; ? 7 : Number(value || 0);
    };

    recommendationRows().forEach(row =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(!run.length) return;

        /* 連続して空いている卓から、隣り合う全組み合わせを作る。
           2Fは卓種が多いので、4+4=8、6+4=10、BOX+BOX=14等も
           実際に隣接していれば候補として残す。 */
        for(let start = 0; start &lt; run.length; start++){
          let capacity = 0;

          for(let finish = start; finish &lt; run.length; finish++){
            const id = run[finish];
            capacity += seatCapacity(id);

            const ids = run.slice(start, finish + 1);
            if(ids.length &lt; 2) continue;

            const allBox = ids.every(x =&gt; tables[x] === &quot;BOX&quot;);

            if(allBox &amp;&amp; ids.length === 2){
              /* 2 BOX = MAX14.
                 実際の案内人数として9〜14名を選べるように、
                 人数フィルター用の候補を保持する。 */
              [9,10,11,12,13,14].forEach(pax =&gt; {
                options.push({
                  ids:[...ids],
                  pax,
                  capacity:14,
                  low:pax !== 14,
                  box:true
                });
              });
            }else{
              options.push({
                ids,
                pax:capacity,
                capacity,
                low:false,
                box:allBox
              });
            }
          }
        }

        run = [];
      };

      row.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 単卓候補 */
    Object.keys(tables)
      .filter(id =&gt; isVacant(id))
      .forEach(id =&gt; {
        if(tables[id] === &quot;BOX&quot;){
          options.push({
            ids:[id],
            pax:7,
            capacity:7,
            low:false,
            box:true,
            singleBox:true
          });

          /* 8名をBOX1卓に入れるのは最終手段だけ。
             候補自体は保持し、表示側で他案が無い時だけ使う。 */
          options.push({
            ids:[id],
            pax:8,
            capacity:7,
            low:true,
            box:true,
            singleBox:true,
            tightEight:true
          });
        }else{
          const capacity = Number(tables[id] || 0);
          if(capacity &gt; 0){
            options.push({
              ids:[id],
              pax:capacity,
              capacity,
              low:false,
              box:false
            });
          }
        }
      });

    options.forEach(option =&gt; {
      option.cleaning = option.ids.some(id =&gt; isCleaning(id));
    });

    const seen = new Set();

    return options
      .filter(option =&gt; {
        const key =
          option.pax + &quot;|&quot; +
          option.capacity + &quot;|&quot; +
          option.ids.join(&quot;-&quot;) + &quot;|&quot; +
          Number(!!option.tightEight);

        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a,b) =&gt;
        a.pax - b.pax ||
        Number(a.low) - Number(b.low) ||
        a.ids.length - b.ids.length
      );
  }

  function renderPeopleRow(){
    const row = document.getElementById(&quot;peopleRow&quot;);

    const options = allRenbanOptions();
    const availablePax = new Set();

    /* Các mức nhỏ giữ theo những lựa chọn vốn có của 2F. */
    options.forEach(item =&gt; {
      const pax = Number(item.pax);
      if(Number.isFinite(pax)) availablePax.add(pax);
    });

    /* Từ 9 người trở lên phải hiển thị LIÊN TỤC tới MAX hiện tại,
       không phụ thuộc MAX đó đến từ 2 BOX hay từ các bàn đặc thù khác.
       Ví dụ còn phương án MAX14 thì luôn có 9,10,11,12,13,14.
       Nếu MAX12 thì có 9,10,11,12. */
    const maxGuideCapacity = options.reduce((max,item) =&gt; {
      const cap = Number(item.capacity ?? item.pax);
      return Number.isFinite(cap) ? Math.max(max,cap) : max;
    },0);

    if(maxGuideCapacity &gt;= 9){
      for(let n=9; n&lt;=maxGuideCapacity; n++){
        availablePax.add(n);
      }
    }

    const capacities = [...availablePax]
      .filter(value =&gt; Number.isFinite(Number(value)))
      .map(Number)
      .sort((a,b) =&gt; a-b);

    const choices = [
      [&quot;all&quot;,&quot;全部&quot;],
      ...capacities.map(value =&gt; [String(value), value + &quot;名&quot;])

    choices.forEach(([value,label]) =&gt; {

    const next = document.getElementById(&quot;renbanNext&quot;);

  function setupRenbanScroller(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);

    prev.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:-holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    next.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    holder.addEventListener(&quot;scroll&quot;, updateRenbanArrows, {passive:true});

    let dragging = false;
    let startX = 0;
    let startScroll = 0;

    holder.addEventListener(&quot;pointerdown&quot;, event =&gt; {
      if(event.pointerType === &quot;touch&quot;) return;

      /* おすすめ案ボタンをクリックした時は、
         親の横スクロールがpointerを奪わないようにする。
         これが原因でPCでは案を押してもclickが発火しなかった。 */
      if(event.target.closest(&quot;.renban-option&quot;)) return;

      dragging = true;
      startX = event.clientX;
      startScroll = holder.scrollLeft;
      holder.classList.add(&quot;dragging&quot;);
      holder.setPointerCapture(event.pointerId);
    });

    holder.addEventListener(&quot;pointermove&quot;, event =&gt; {
      if(!dragging) return;
      holder.scrollLeft = startScroll - (event.clientX - startX);
    });

    const stopDragging = event =&gt; {
      if(!dragging) return;
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
      try{ holder.releasePointerCapture(event.pointerId); }catch{}
    };

    holder.addEventListener(&quot;pointerup&quot;, stopDragging);
    holder.addEventListener(&quot;pointercancel&quot;, stopDragging);
    holder.addEventListener(&quot;lostpointercapture&quot;, () =&gt; {
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
    });

    window.addEventListener(&quot;resize&quot;, updateRenbanArrows);
  }


  function remainingRenbanScore(usedIds){
    const used = new Set(usedIds);
    const tables = currentTables();

    const capOf = id =&gt; {
      const value = tables[id];
      return value === &quot;BOX&quot; ? 7 : Number(value || 0);
    };

    let bestCapacity = 0;
    let totalCapacityInRuns = 0;

    recommendationRows().forEach(row =&gt; {
      let runCapacity = 0;
      let runLength = 0;

      const flush = () =&gt; {
        if(runLength &gt;= 2){
          totalCapacityInRuns += runCapacity;
          bestCapacity = Math.max(bestCapacity, runCapacity);
        }
        runCapacity = 0;
        runLength = 0;
      };

      row.forEach(id =&gt; {
        if(isVacant(id) &amp;&amp; !used.has(id)){
          runLength++;
          runCapacity += capOf(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 最大連番容量を最優先、同じなら残っている連番容量の合計。 */
    return bestCapacity * 1000 + totalCapacityInRuns;
  }

  function physicalCountForId(id){
    const group = appState.groups.find(g =&gt; g.id === id);
    if(group) return group.ids.reduce((sum,x)=&gt;sum+physicalCountForId(x),0);

    const tables = currentTables();
    const cap = tables[id] === &quot;BOX&quot; ? 7 : Number(tables[id] || 0);

    if(/AB$/.test(id)) return 2;
    return 1;
  }

  function cleaningEffort(option){
    let physical = 0;
    let capacity = 0;
    option.ids.forEach(id =&gt; {
      if(isCleaning(id)){
        physical += physicalCountForId(id);
        const tables = currentTables();
        capacity += tables[id] === &quot;BOX&quot; ? 7 : Number(tables[id] || 0);
      }
    });
    return {physical, capacity};
  }

  function cleaningPhysicalKeys(option){
    const keys = [];

    const expand = id =&gt; {
      const group = appState.groups.find(g =&gt; g.id === id);
      if(group){
        group.ids.forEach(expand);
        return;
      }

      if(/AB$/.test(id)){
        const prefix = id.slice(0,-2);
        keys.push(prefix + &quot;A&quot;, prefix + &quot;B&quot;);
        return;
      }

      keys.push(id);
    };

    option.ids.forEach(id =&gt; {
      if(isCleaning(id)) expand(id);
    });

    return [...new Set(keys)];
  }

  function cleaningSetDominated(option, candidates){
    const mine = new Set(cleaningPhysicalKeys(option));
    if(!mine.size) return false;

    return candidates.some(other =&gt; {
      if(other === option) return false;

      const theirs = new Set(cleaningPhysicalKeys(other));
      if(!theirs.size || theirs.size &gt;= mine.size) return false;

      /* Remove an option only when another same-MAX option needs cleaning
         a strict SUBSET of the exact same physical tables.
         Example:
         clean 82AB+83AB  vs  clean 83AB + use clean 84AB
         -&gt; {83A,83B} is a strict subset of {82A,82B,83A,83B},
            so the heavier option is unnecessary.

         But 82AB vs 99+100 are different physical-table choices,
         so neither is a subset of the other and BOTH remain. */
      for(const key of theirs){
        if(!mine.has(key)) return false;
      }
      return true;
    });
  }

  function applyRecommendationOption(option){
    /* Khi bấm một phương án trong おすすめ案:
       - xóa 清掃待ち của mọi bàn thuộc phương án
       - áp dụng thẳng trạng thái đang chọn (席取り / 使用中 / 空席)
       - KHÔNG bắt buộc tạo group ghép mới
       Như vậy ví dụ C7 đang 清掃待ち + C8 đang sạch:
       bấm phương án khi chọn 使用中 =&gt; cả C7 và C8 đều thành 使用中. */
    const expanded = new Set();

    option.ids.forEach(id =&gt; {
      const group = groupFor(id);
      if(group){
        group.ids.forEach(x =&gt; expanded.add(x));
      }else{
        expanded.add(id);
      }
    });

    [...expanded].forEach(id =&gt; {
      delete appState.cleaning[id];

      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    /* Nếu phương án chạm vào một group đã tồn tại thì cập nhật group đó.
       Không tự tạo group mới chỉ vì chọn một phương án đề nghị. */
    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
        group.ids.forEach(id =&gt; delete appState.cleaning[id]);
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

function renderRenbanOptions(){
    const all = allRenbanOptions();
    let filtered;

    if(peopleFilter === &quot;all&quot;){
      filtered = [...all].sort((a,b) =&gt;
        Number(a.cleaning) - Number(b.cleaning) ||
        Number(!!a.tightEight) - Number(!!b.tightEight) ||
        compareRecommendationRoute(a,b)
      );
    }else{
      const requested = Number(peopleFilter);
      const capacityOf = item =&gt; item.capacity ?? item.pax;

      /* 8名用のBOX1卓だけは通常候補とは別枠。
         ただし完全に消さず、比較候補として最後に残す。 */
      const normalAll = all.filter(item =&gt;
        !item.tightEight &amp;&amp;
        capacityOf(item) &gt;= requested
      );

      const deduped = new Map();
      normalAll.forEach(item =&gt; {
        const key = item.ids.join(&quot;-&quot;);
        const current = deduped.get(key);

        if(!current ||
           capacityOf(item) &lt; capacityOf(current) ||
           (capacityOf(item) === capacityOf(current) &amp;&amp;
            Number(item.low) &lt; Number(current.low))){
          deduped.set(key,item);
        }
      });
      const normal = [...deduped.values()];

      const keepReasonableCombos = list =&gt; {
        if(!list.length) return [];

        const singles = list.filter(item =&gt; item.ids.length === 1);
        const combos = list.filter(item =&gt; item.ids.length &gt; 1);
        const minOverallCapacity = Math.min(
          ...list.map(item =&gt; capacityOf(item))
        );

        /* 現在の分割/連結状態をその時点の実配置として扱う。
           - ids.length===1: すでに存在する単卓 / 当日すでに連結済みの卓
             → MAXが大きくても予備候補として残す
           - ids.length&gt;1: 今から新しく連結する案
             → 必要最小MAXの案だけ残す
           例：2名で82A/82Bが分割中なら82A+82B=4は出さない。
               82ABとして連結済みならMAX4の予備候補として出す。 */
        return [
          ...singles,
          ...combos.filter(item =&gt; capacityOf(item) === minOverallCapacity)
        ];
      };

      const sorter = (a,b) =&gt; {
        const capA = capacityOf(a);
        const capB = capacityOf(b);

        /* まず人数に近いMAXを優先。 */
        const capacityDiff =
          (capA - requested) - (capB - requested);
        if(capacityDiff) return capacityDiff;

        /* 清掃待ち同士では、表示上の「1卓/2卓」より先に
           実際の清掃負担を見る。
           82AB等は実卓2卓として数える。 */
        if(a.cleaning &amp;&amp; b.cleaning){
          const ea = cleaningEffort(a);
          const eb = cleaningEffort(b);

          const cleanDiff =
            ea.physical - eb.physical ||
            ea.capacity - eb.capacity;
          if(cleanDiff) return cleanDiff;
        }

        /* 次に、残る連番のMAX容量を大きく保つ。 */
        const renDiff =
          remainingRenbanScore(b.ids) - remainingRenbanScore(a.ids);
        if(renDiff) return renDiff;

        /* ここまで同じなら、実際に使う表示単位数が少ない方。 */
        const tableCountDiff = a.ids.length - b.ids.length;
        if(tableCountDiff) return tableCountDiff;

        return compareRecommendationRoute(a,b);
      };

      const ready = keepReasonableCombos(
        normal.filter(item =&gt; !item.cleaning)
      ).sort(sorter);

      const waitingBase = keepReasonableCombos(
        normal.filter(item =&gt; item.cleaning)
      );

      let waiting = [];
      if(waitingBase.length){
        /* 清掃待ちはまず「必要十分なMAX」に絞る。 */
        const minWaitingCapacity = Math.min(
          ...waitingBase.map(item =&gt; capacityOf(item))
        );

        const sameCapacity = waitingBase
          .filter(item =&gt; capacityOf(item) === minWaitingCapacity);

        /* 同じMAXでも、他の候補が「同じ清掃卓の一部だけ」を掃除すれば
           成立するなら、余分に掃除する案は不要なので除外する。
           ただし清掃する卓の場所が違う案は残す。
           これで:
           - 8名: 83AB清掃+84AB空席 があるなら
                  82AB+83AB両方清掃 は消える
           - 4名: 82AB清掃 と 99+100清掃 は
                  後客用の2人卓温存という意味が違うので両方残る */
        waiting = sameCapacity
          .filter(item =&gt; !cleaningSetDominated(item, sameCapacity))
          .sort(sorter);
      }

      /* 8名時のBOX1卓:
         - 空いているBOXなら、待たずに案内できる比較候補として残す
         - 清掃待ちBOXも、2卓掃除などと比較できるよう残す
         ただし通常の8名向け候補より後ろに置く。 */
      let box8Ready = [];
      let box8Waiting = [];

      if(requested === 8){
        box8Ready = all
          .filter(item =&gt; item.tightEight &amp;&amp; !item.cleaning)
          .sort(compareRecommendationRoute);

        const allBoxWaiting = all
          .filter(item =&gt; item.tightEight &amp;&amp; item.cleaning)
          .sort((a,b) =&gt; {
            const ea = cleaningEffort(a);
            const eb = cleaningEffort(b);
            return ea.physical - eb.physical ||
                   ea.capacity - eb.capacity ||
                   compareRecommendationRoute(a,b);
          });

        /* BOXは8名だと窮屈なので通常は後順位。
           ただし、通常案より明らかに掃除が早い
           （例：BOX1卓掃除 vs 4人卓2卓分掃除）なら比較候補として残す。 */
        if(allBoxWaiting.length){
          const bestNormalCleaningPhysical =
            waiting.length
              ? Math.min(...waiting.map(item =&gt; cleaningEffort(item).physical))
              : Infinity;

          box8Waiting = allBoxWaiting.filter(item =&gt;
            cleaningEffort(item).physical &lt; bestNormalCleaningPhysical
          );
        }
      }

      /* お客様優先:
         1) 通常の案内可能
         2) BOX1卓8名（空席・窮屈だが待たない）
         3) 通常の清掃待ち
         4) BOX1卓8名の清掃待ち
         こうすることで、空いているBOXと「2卓掃除」も比較でき、
         清掃BOX候補も消えない。 */
      filtered = [
        ...ready,
        ...box8Ready,
        ...waiting,
        ...box8Waiting
      ];
    }

    document.getElementById(&quot;renbanCount&quot;).textContent = filtered.length + &quot;案&quot;;

    const holder = document.getElementById(&quot;renbanOptions&quot;);
    holder.innerHTML = &quot;&quot;;

    if(!filtered.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;案内できる空席候補はありません。&quot;;
      holder.appendChild(empty);
      requestAnimationFrame(updateRenbanArrows);
      return;
    }

    const tables = currentTables();
    const requested = peopleFilter === &quot;all&quot; ? null : Number(peopleFilter);

    filtered.forEach(option =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      const cap = option.capacity ?? option.pax;
      const excess = requested === null ? 0 : Math.max(0, cap - requested);

      let priorityClass = &quot;&quot;;
      let priorityLabel = &quot;&quot;;

      if(option.tightEight &amp;&amp; !option.cleaning){
        priorityClass = &quot; box8-fallback&quot;;
        priorityLabel = &quot;予備&quot;;
      }else if(option.tightEight &amp;&amp; option.cleaning){
        priorityClass = &quot; low&quot;;
        priorityLabel = &quot;清掃待ち&quot;;
      }else if(option.cleaning){
        priorityClass = &quot; low&quot;;
        priorityLabel = &quot;清掃待ち&quot;;
      }else if(requested !== null){
        if(excess === 0){
          priorityClass = &quot; priority-1&quot;;
          priorityLabel = &quot;優先&quot;;
        }else if(excess === 1){
          priorityClass = &quot; priority-2&quot;;
          priorityLabel = &quot;次点&quot;;
        }else{
          priorityClass = &quot; priority-3&quot;;
          priorityLabel = &quot;予備&quot;;
        }
      }else{
        priorityClass = option.low ? &quot; low&quot; : &quot;&quot;;
        priorityLabel = option.low ? &quot;優先度低&quot; : &quot;使用可能&quot;;
      }

      btn.className = &quot;renban-option&quot; + priorityClass;

      let note;

      if(option.tightEight &amp;&amp; !option.cleaning){
        note = &quot;予備・BOXは7名推奨・8名は窮屈・待ち時間なし&quot;;
      }else if(option.tightEight &amp;&amp; option.cleaning){
        const effort = cleaningEffort(option);
        const renScore = remainingRenbanScore(option.ids);
        const remainingMaxRenban = Math.floor(renScore / 1000);
        note =
          &quot;清掃待ち・BOXは7名推奨・8名は窮屈&quot; +
          &quot;・清掃&quot; + effort.physical + &quot;卓&quot; +
          &quot;・残す連番MAX &quot; + remainingMaxRenban + &quot;名&quot;;
      }else if(option.cleaning){
        const effort = cleaningEffort(option);
        const renScore = remainingRenbanScore(option.ids);
        const remainingMaxRenban = Math.floor(renScore / 1000);
        note =
          &quot;清掃待ち・MAX &quot; + cap + &quot;名&quot; +
          &quot;・清掃&quot; + effort.physical + &quot;卓&quot; +
          &quot;・残す連番MAX &quot; + remainingMaxRenban + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else if(requested !== null){
        note =
          priorityLabel + &quot;・&quot; +
          option.ids.length + &quot;卓・MAX &quot; + cap + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else{
        note = priorityLabel;
      }

      btn.innerHTML =
        &quot;&lt;strong&gt;&quot; + (requested ?? option.pax) + &quot;名&lt;/strong&gt;&quot; +
        &#x27;&lt;div class=&quot;chips&quot;&gt;&#x27; +
        option.ids.map(id =&gt;
          &#x27;&lt;span class=&quot;chip &#x27; + capacityClass(tables[id]) + &#x27;&quot;&gt;&#x27; +
          id +
          &quot;&lt;/span&gt;&quot;
        ).join(&quot;&quot;) +
        &quot;&lt;/div&gt;&quot; +
        &quot;&lt;small&gt;&quot; + note + &quot;&lt;/small&gt;&quot;;

      btn.addEventListener(&quot;click&quot;, () =&gt; {
        if(option.tightEight){
          showToast(&quot;BOX1卓は8名だと窮屈です&quot;);
          return;
        }

        applyRecommendationOption(option);
      });

      holder.appendChild(btn);
    });

    requestAnimationFrame(updateRenbanArrows);
  }

  function renderSummary(){
    const summary = document.getElementById(&quot;summary&quot;);
    summary.innerHTML = &quot;&quot;;

    const tables = currentTables();
    const groups = [
      [2,&quot;2人&quot;],
      [4,&quot;4人&quot;],
      [6,&quot;6人&quot;],
      [&quot;BOX&quot;,&quot;BOX&quot;]
    ];

    groups.forEach(([capacity,label]) =&gt; {
      const count = Object.keys(tables).filter(id =&gt; {
        if(tables[id] !== capacity) return false;
        const isVirtual = appState.groups.some(group =&gt; group.id === id);
        if(!isVirtual &amp;&amp; isGrouped(id)) return false;
        return isVacant(id);
      }).length;

      const card = document.createElement(&quot;div&quot;);
      card.className = &quot;summary-card&quot;;
      card.innerHTML = &quot;&lt;small&gt;&quot; + label + &quot; 空き&lt;/small&gt;&lt;b&gt;&quot; + count + &quot;&lt;/b&gt;&quot;;
      summary.appendChild(card);
    });
    const cleaningCount = Object.keys(tables).filter(id =&gt; {
      const isVirtual = appState.groups.some(group =&gt; group.id === id);
      if(!isVirtual &amp;&amp; isGrouped(id)) return false;
      return isVacant(id) &amp;&amp; isCleaning(id);
    }).length;
    const cleaningCard = document.createElement(&quot;div&quot;);
    cleaningCard.className = &quot;summary-card&quot;;
    cleaningCard.innerHTML = &quot;&lt;small&gt;清掃待ち&lt;/small&gt;&lt;b&gt;&quot; + cleaningCount + &quot;&lt;/b&gt;&quot;;
    summary.appendChild(cleaningCard);
  }

  function showToast(message){
    const toast = document.getElementById(&quot;toast&quot;);
    toast.textContent = message;
    toast.classList.add(&quot;show&quot;);

    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() =&gt; toast.classList.remove(&quot;show&quot;), 1100);
  }


  function createManualGroup(){
    if(!validManualSelection()){
      showToast(&quot;同じ連番内の隣り合う卓を選択してください&quot;);
      return;
    }

    const ids = sortedManualSelection();
    const state = selectedStatus;
    const tables = currentTables();
    const capacity = ids.reduce((sum,id) =&gt; {
      const value = tables[id];
      return sum + (value === &quot;BOX&quot; ? 7 : Number(value || 0));
    },0);

    const group = {
      id:&quot;manual-&quot; + Date.now(),
      ids,
      state,
      capacity
    };

    appState.groups.push(group);

    ids.forEach(id =&gt; {
      if(state === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = state;
      }
    });

    manualMode = false;
    manualSelected.clear();
    saveState();
    renderAll();
    showToast(ids.join(&quot;・&quot;) + &quot; を手動連結&quot;);
  }

  function releaseManualGroup(groupId){
    const index = appState.groups.findIndex(group =&gt; group.id === groupId);
    if(index &lt; 0) return;

    const [group] = appState.groups.splice(index,1);
    group.ids.forEach(id =&gt; delete appState.states[id]);

    manualSelected.clear();
    saveState();
    renderAll();
    showToast(group.ids.join(&quot;・&quot;) + &quot; → 空席&quot;);
  }

  function renderManualControls(){
    const ids = sortedManualSelection();
    const tables = currentTables();
    const total = ids.reduce((sum,id) =&gt; {
      const capacity = tables[id];
      return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
    },0);

    const toggle = document.getElementById(&quot;manualToggle&quot;);
    toggle.classList.toggle(&quot;active&quot;, manualMode);
    toggle.textContent = manualMode ? &quot;手動連結中&quot; : &quot;手動連結&quot;;

    document.getElementById(&quot;manualInfo&quot;).textContent =
      ids.length
        ? &quot;選択：&quot; + ids.join(&quot;・&quot;) + &quot;　合計&quot; + total + &quot;席&quot;
        : &quot;卓を選択&quot;;

    document.getElementById(&quot;manualConfirm&quot;).disabled = !validManualSelection();
  }


  function renderLargeManualGroups(){
    const section = document.getElementById(&quot;largeManualSection&quot;);
    const grid = document.getElementById(&quot;largeManualGrid&quot;);
    const count = document.getElementById(&quot;largeManualCount&quot;);

    const groups = sortedManualGroups(
      appState.groups.filter(group =&gt; Number(group.capacity) &gt; 6),
      &quot;large&quot;
    );

    section.hidden = groups.length === 0;
    count.textContent = groups.length + &quot;組&quot;;
    grid.innerHTML = &quot;&quot;;

    groups.forEach(group =&gt; {
      grid.appendChild(createManualGroupCard(group));
    });
  }

  function renderAll(){
    renderSummary();
    renderPeopleRow();
    renderClusterStrip();
    renderRenbanOptions();
    renderManualControls();
    renderLargeManualGroups();
    renderTables();
  }


  document.getElementById(&quot;manualToggle&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualMode = !manualMode;
    manualSelected.clear();
    renderAll();
  });

  document.getElementById(&quot;manualClear&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualSelected.clear();
    renderAll();
  });

  document.getElementById(&quot;manualConfirm&quot;).addEventListener(&quot;click&quot;, createManualGroup);

  document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      selectedStatus = btn.dataset.state;
      document.querySelectorAll(&quot;#stateRow button&quot;).forEach(item =&gt; {
        item.classList.toggle(&quot;active&quot;, item === btn);
      });
    });
  });

  document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      tableView = btn.dataset.view;
      document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(item =&gt; {
        item.classList.toggle(&quot;active&quot;, item === btn);
      });
      renderTables();
    });
  });

  document.getElementById(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
appState = {states:{}, merged:{}, groups:[], cleaning:{}};
    selectedStatus = &quot;reserved&quot;;
    tableView = &quot;all&quot;;
    peopleFilter = &quot;all&quot;;
    saveState();

    document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.state === &quot;reserved&quot;);
    });

    document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.view === &quot;all&quot;);
    });

    renderAll();
  });

  setupRenbanScroller();
  renderAll();
})();

&lt;body&gt;

      &lt;button id=&quot;manualClear&quot; type=&quot;button&quot;&gt;選択解除&lt;/button&gt;

&lt;main&gt;
  &lt;section class=&quot;card&quot;&gt;

      &lt;span&gt;&lt;strong&gt;おすすめ案&lt;/strong&gt;&lt;/span&gt;
      &lt;span id=&quot;renbanCount&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;renban-scroll-wrap&quot;&gt;
      &lt;button id=&quot;renbanPrev&quot; class=&quot;scroll-arrow&quot; type=&quot;button&quot; aria-label=&quot;前の候補&quot;&gt;‹&lt;/button&gt;
      &lt;div id=&quot;renbanOptions&quot; class=&quot;renban-options&quot;&gt;&lt;/div&gt;
      &lt;button id=&quot;renbanNext&quot; class=&quot;scroll-arrow&quot; type=&quot;button&quot; aria-label=&quot;次の候補&quot;&gt;›&lt;/button&gt;
    &lt;/div&gt;
  &lt;/section&gt;




  &lt;section id=&quot;largeManualSection&quot; class=&quot;card&quot; hidden&gt;
    &lt;div class=&quot;card-title&quot;&gt;
      &lt;span&gt;連結卓（7名以上）&lt;/span&gt;
      &lt;span id=&quot;largeManualCount&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;largeManualGrid&quot; class=&quot;table-grid&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div id=&quot;tableArea&quot;&gt;&lt;/div&gt;
&lt;/main&gt;

&lt;div id=&quot;toast&quot; class=&quot;toast&quot;&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;

  const STORAGE_KEY = &quot;sekifuri-3f-cleaning-v4-baseline&quot;;
  const PREVIOUS_STORAGE_KEY = &quot;sekifuri-3f-v7-priority-route&quot;;
  if(!localStorage.getItem(STORAGE_KEY) &amp;&amp; localStorage.getItem(PREVIOUS_STORAGE_KEY)){
    localStorage.setItem(STORAGE_KEY, localStorage.getItem(PREVIOUS_STORAGE_KEY));
  }

  const fixedTables = {
    &quot;F1&quot;:2,&quot;F2&quot;:2,&quot;F3&quot;:2,&quot;F4&quot;:2,&quot;F5&quot;:2,

    &quot;G6&quot;:2,&quot;G7&quot;:2,&quot;G8&quot;:2,&quot;G9&quot;:2,&quot;G10&quot;:2,&quot;G11&quot;:2
  };

  const pairDefinitions = [
    {id:&quot;E1&quot;, parts:[&quot;E1A&quot;,&quot;E1B&quot;]},
    {id:&quot;E2&quot;, parts:[&quot;E2A&quot;,&quot;E2B&quot;]},
    {id:&quot;E3E4&quot;, parts:[&quot;E3&quot;,&quot;E4&quot;]},
    {id:&quot;E5E6&quot;, parts:[&quot;E5&quot;,&quot;E6&quot;]},
    {id:&quot;E7&quot;, parts:[&quot;E7A&quot;,&quot;E7B&quot;]},
    {id:&quot;E8E9&quot;, parts:[&quot;E8&quot;,&quot;E9&quot;]},
    {id:&quot;E10&quot;, parts:[&quot;E10A&quot;,&quot;E10B&quot;]},
    {id:&quot;E11&quot;, parts:[&quot;E11A&quot;,&quot;E11B&quot;]},

    {id:&quot;G1&quot;, parts:[&quot;G1A&quot;,&quot;G1B&quot;]},
    {id:&quot;G2G3&quot;, parts:[&quot;G2&quot;,&quot;G3&quot;]},
    {id:&quot;G4&quot;, parts:[&quot;G4A&quot;,&quot;G4B&quot;]},
    {id:&quot;G5&quot;, parts:[&quot;G5A&quot;,&quot;G5B&quot;]}
  ];

  const pairPrefixes = pairDefinitions.map(def =&gt; def.id);
  const pairById = Object.fromEntries(pairDefinitions.map(def =&gt; [def.id, def]));

  const defaultMerged = Object.fromEntries(
    pairDefinitions
      .filter(def =&gt; def.parts.every(part =&gt; /[AB]$/.test(part)))
      .map(def =&gt; [def.id, true])
  );

  const twoFixedOrder = [
    &quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;,
    &quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;
  ];

  const fourFixedOrder = [];
  const sixOrder = [];
  const boxOrder = [];

  /*
    おすすめ案の案内優先順。
    F卓を先にし、その後はE卓を番号の大きい順、
    G卓を番号の小さい順に表示する。
  */
  const recommendationRoute = [
    &quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;,

    &quot;E11&quot;,&quot;E11A&quot;,&quot;E11B&quot;,
    &quot;E10&quot;,&quot;E10A&quot;,&quot;E10B&quot;,
    &quot;E8E9&quot;,&quot;E9&quot;,&quot;E8&quot;,
    &quot;E7&quot;,&quot;E7A&quot;,&quot;E7B&quot;,
    &quot;E5E6&quot;,&quot;E6&quot;,&quot;E5&quot;,
    &quot;E3E4&quot;,&quot;E4&quot;,&quot;E3&quot;,
    &quot;E2&quot;,&quot;E2A&quot;,&quot;E2B&quot;,
    &quot;E1&quot;,&quot;E1A&quot;,&quot;E1B&quot;,

    &quot;G1&quot;,&quot;G1A&quot;,&quot;G1B&quot;,
    &quot;G2G3&quot;,&quot;G2&quot;,&quot;G3&quot;,
    &quot;G4&quot;,&quot;G4A&quot;,&quot;G4B&quot;,
    &quot;G5&quot;,&quot;G5A&quot;,&quot;G5B&quot;,
    &quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;
  ];

  function recommendationIdRank(id){
    const direct = recommendationRoute.indexOf(id);
    if(direct &gt;= 0) return direct;

    const group = appState?.groups?.find(group =&gt; group.id === id);
    if(group){
      const ranks = group.ids.map(recommendationIdRank).filter(Number.isFinite);
      return ranks.length ? Math.min(...ranks) : Number.MAX_SAFE_INTEGER;
    }
    return Number.MAX_SAFE_INTEGER;
  }

  function recommendationKey(option){
    return option.ids
      .flatMap(id =&gt; {
        const group = appState?.groups?.find(group =&gt; group.id === id);
        return group ? group.ids : [id];
      })
      .map(recommendationIdRank)
      .sort((a,b) =&gt; a-b);
  }

  function compareRecommendationRoute(a,b){
    const ka = recommendationKey(a);
    const kb = recommendationKey(b);
    const n = Math.max(ka.length,kb.length);
    for(let i=0;i&lt;n;i++){
      const av = ka[i] ?? Number.MAX_SAFE_INTEGER;
      const bv = kb[i] ?? Number.MAX_SAFE_INTEGER;
      if(av !== bv) return av-bv;
    }
    return 0;
  }

  const renbanBaseGroups = [
    [&quot;E1&quot;,&quot;E2&quot;,&quot;E3E4&quot;,&quot;E5E6&quot;,&quot;E7&quot;,&quot;E8E9&quot;,&quot;E10&quot;,&quot;E11&quot;],
    [&quot;G1&quot;,&quot;G2G3&quot;,&quot;G4&quot;,&quot;G5&quot;,&quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;]
  ];

  let appState = loadState();
  let selectedStatus = &quot;reserved&quot;;
  let tableView = &quot;all&quot;;
  let peopleFilter = &quot;all&quot;;
  let manualMode = false;
  let manualSelected = new Set();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        states: parsed.states || {},
        merged: {...defaultMerged, ...(parsed.merged || {})},
        groups: parsed.groups || [],
        cleaning: parsed.cleaning || {}
      };
    }catch{
      return {states:{}, merged:{...defaultMerged}, groups:[], cleaning:{}};
    }
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  }


  function groupFor(id){
    return appState.groups.find(group =&gt; group.id === id || group.ids.includes(id));
  }

  function isGrouped(id){
    return Boolean(groupFor(id));
  }

  function isCleaning(id){
    const group = groupFor(id);
    const ids = group ? group.ids : [id];
    return ids.some(x =&gt; !!appState.cleaning?.[x]);
  }

  function isVacant(id){
    const virtualGroup = appState.groups.some(group =&gt; group.id === id);
    return getStatus(id) === &quot;empty&quot; &amp;&amp; (virtualGroup || !isGrouped(id));
  }

  function isAvailable(id){
    return isVacant(id) &amp;&amp; !isCleaning(id);
  }

  function currentRenbanGroups(){
    return renbanBaseGroups.map(group =&gt; group.flatMap(id =&gt; {
      const def = pairById[id];
      if(!def) return [id];
      return appState.merged[id] ? [def.id] : [...def.parts];
    }));
  }

  function recommendationRows(){
    return currentRenbanGroups();
  }

  function manualRows(){
    return recommendationRows();
  }

  function sortedManualSelection(){
    const ids = [...manualSelected];
    for(const row of manualRows()){
      if(ids.every(id =&gt; row.includes(id))){
        return ids.sort((a,b) =&gt; row.indexOf(a) - row.indexOf(b));
      }
    }
    return ids;
  }

  function validManualSelection(){
    if(manualSelected.size &lt; 2) return false;

    const ids = [...manualSelected];
    return manualRows().some(row =&gt; {
      const indexes = ids.map(id =&gt; row.indexOf(id));
      if(indexes.some(index =&gt; index &lt; 0)) return false;
      indexes.sort((a,b) =&gt; a-b);
      return indexes.every((value,index) =&gt;
        index === 0 || value === indexes[index - 1] + 1
      );
    });
  }

  function currentTables(){
    const tables = {...fixedTables};

    pairDefinitions.forEach(def =&gt; {
      if(appState.merged[def.id]){
        tables[def.id] = 4;
      }else{
        tables[def.parts[0]] = 2;
        tables[def.parts[1]] = 2;
      }
    });

    appState.groups.forEach(group =&gt; {
      const total = group.capacity || group.ids.reduce((sum,id) =&gt; {
        const capacity = tables[id];
        return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
      },0);
      group.capacity = total;
      tables[group.id] = total;
    });

    return tables;
  }

  function getStatus(id){
    const group = appState.groups.find(item =&gt; item.id === id);
    if(group) return group.state || &quot;empty&quot;;
    return appState.states[id] || &quot;empty&quot;;
  }

  function setStatus(ids){
    const expanded = new Set();

    ids.forEach(id =&gt; {
      const group = groupFor(id);
      (group ? group.ids : [id]).forEach(groupId =&gt; expanded.add(groupId));
    });

    [...expanded].forEach(id =&gt; {
      delete appState.cleaning[id];
      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

  function statusLabel(value){
    if(value === &quot;reserved&quot;) return &quot;席取り&quot;;
    if(value === &quot;used&quot;) return &quot;使用中&quot;;
    return &quot;空席&quot;;
  }

  function capacityClass(capacity){
    if(capacity === &quot;BOX&quot;) return &quot;cbox&quot;;
    return &quot;c&quot; + capacity;
  }

  function markCleaning(id){
    const group = groupFor(id);
    const ids = group ? group.ids : [id];
    ids.forEach(x =&gt; {
      delete appState.states[x];
      appState.cleaning[x] = true;
    });
    if(group) group.state = &quot;empty&quot;;
    saveState();
    renderAll();
    showToast(ids.join(&quot;・&quot;) + &quot; → 清掃待ち&quot;);
  }

  function bindLongPress(btn,id){
    let timer=null, held=false, suppressClick=false, startX=0, startY=0;
    const begin=(x,y)=&gt;{
      held=false; startX=x; startY=y;
      clearTimeout(timer);
      timer=setTimeout(()=&gt;{
        held=true; suppressClick=true;
        markCleaning(id);
        try{navigator.vibrate&amp;&amp;navigator.vibrate(25)}catch{}
      },500);
    };
    const move=(x,y)=&gt;{
      if(Math.abs(x-startX)&gt;12 || Math.abs(y-startY)&gt;12){
        clearTimeout(timer); timer=null;
      }
    };
    const end=()=&gt;{ clearTimeout(timer); timer=null; };

    btn.addEventListener(&quot;touchstart&quot;,e=&gt;{const t=e.touches[0];begin(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchmove&quot;,e=&gt;{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchend&quot;,e=&gt;{end();if(held)e.preventDefault()},{passive:false});
    btn.addEventListener(&quot;touchcancel&quot;,end);

    btn.addEventListener(&quot;mousedown&quot;,e=&gt;{if(e.button===0)begin(e.clientX,e.clientY)});
    btn.addEventListener(&quot;mousemove&quot;,e=&gt;move(e.clientX,e.clientY));
    btn.addEventListener(&quot;mouseup&quot;,end);
    btn.addEventListener(&quot;mouseleave&quot;,end);

    btn.addEventListener(&quot;click&quot;,e=&gt;{
      if(suppressClick){
        suppressClick=false;
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    },true);
    btn.addEventListener(&quot;contextmenu&quot;,e=&gt;e.preventDefault());
  }

  function createTableButton(id, capacity){
    const btn = document.createElement(&quot;button&quot;);
    btn.className = &quot;table-btn &quot; + capacityClass(capacity) + &quot; &quot; + (isCleaning(id) ? &quot;cleaning&quot; : getStatus(id));
    if(manualSelected.has(id)) btn.classList.add(&quot;manual-selected&quot;);

    btn.innerHTML = (isCleaning(id) ? &quot;清 &quot; : &quot;&quot;) + id + &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + (capacity === &quot;BOX&quot; ? &quot;B&quot; : capacity) + &quot;&lt;/span&gt;&quot;;

    btn.addEventListener(&quot;click&quot;, () =&gt; {
      if(!manualMode){
        setStatus([id]);
        return;
      }

      if(getStatus(id) !== &quot;empty&quot;){
        showToast(&quot;空席の卓だけ選択できます&quot;);
        return;
      }

      if(isGrouped(id)){
        showToast(&quot;すでに手動連結されています&quot;);
        return;
      }

      if(manualSelected.has(id)){
        manualSelected.delete(id);
      }else{
        manualSelected.add(id);
      }

      renderAll();
    });

    bindLongPress(btn,id);

    return btn;
  }


  function createManualGroupCard(group){
    const wrap = document.createElement(&quot;div&quot;);
    wrap.className = &quot;pair-card merged&quot;;

    const table = createTableButton(group.id, group.capacity);
    table.innerHTML =
      group.ids.join(&quot;・&quot;) +
      &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + group.capacity + &#x27;&lt;/span&gt;&#x27;;
    wrap.appendChild(table);

    const release = document.createElement(&quot;button&quot;);
    release.className = &quot;pair-action&quot;;
    release.textContent = &quot;解除&quot;;
    release.addEventListener(&quot;click&quot;, event =&gt; {
      event.stopPropagation();
      releaseManualGroup(group.id);
    });
    wrap.appendChild(release);

    return wrap;
  }

  function togglePair(prefix){
    const def = pairById[prefix];
    const relatedIds = [def.id, ...def.parts];

    if(relatedIds.some(isGrouped)){
      showToast(&quot;先に手動連結を解除してください&quot;);
      return;
    }

    if(appState.merged[prefix]){
      const oldStatus = getStatus(def.id);
      const wasCleaning = !!appState.cleaning[def.id];

      delete appState.states[def.id];
      delete appState.cleaning[def.id];
      appState.merged[prefix] = false;

      if(oldStatus !== &quot;empty&quot;){
        appState.states[def.parts[0]] = oldStatus;
        appState.states[def.parts[1]] = oldStatus;
      }
      if(wasCleaning){
        appState.cleaning[def.parts[0]] = true;
        appState.cleaning[def.parts[1]] = true;
      }
    }else{
      const firstStatus = getStatus(def.parts[0]);
      const secondStatus = getStatus(def.parts[1]);
      const wasCleaning =
        !!appState.cleaning[def.parts[0]] || !!appState.cleaning[def.parts[1]];

      delete appState.states[def.parts[0]];
      delete appState.states[def.parts[1]];
      delete appState.cleaning[def.parts[0]];
      delete appState.cleaning[def.parts[1]];
      appState.merged[prefix] = true;

      if(firstStatus === &quot;used&quot; || secondStatus === &quot;used&quot;){
        appState.states[def.id] = &quot;used&quot;;
      }else if(firstStatus === &quot;reserved&quot; || secondStatus === &quot;reserved&quot;){
        appState.states[def.id] = &quot;reserved&quot;;
      }else if(wasCleaning){
        appState.cleaning[def.id] = true;
      }
    }

    saveState();
    renderAll();
  }
  function createPairCard(prefix){
    const def = pairById[prefix];
    const wrap = document.createElement(&quot;div&quot;);

    if(appState.merged[prefix]){
      wrap.className = &quot;pair-card merged&quot;;
      wrap.appendChild(createTableButton(def.id, 4));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;分割&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }else{
      wrap.className = &quot;pair-card&quot;;
      wrap.appendChild(createTableButton(def.parts[0], 2));
      wrap.appendChild(createTableButton(def.parts[1], 2));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;連結&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }

    return wrap;
  }

  function countFree(ids){
    return ids.filter(id =&gt; getStatus(id) === &quot;empty&quot;).length;
  }

  function createSection(title, ids, pairMode){
    const section = document.createElement(&quot;section&quot;);
    section.className = &quot;card&quot;;

    let freeCount = ids.filter(id =&gt; !isGrouped(id) &amp;&amp; getStatus(id) === &quot;empty&quot;).length;
    const manualGroups = appState.groups.filter(group =&gt; group.capacity === Number(title.replace(&quot;人卓&quot;,&quot;&quot;)));
    freeCount += manualGroups.filter(group =&gt; getStatus(group.id) === &quot;empty&quot;).length;

    if(pairMode === &quot;split-first&quot;){
      pairDefinitions.forEach(def =&gt; {
        if(!appState.merged[def.id]){
          if(!isGrouped(def.parts[0]) &amp;&amp; getStatus(def.parts[0]) === &quot;empty&quot;) freeCount++;
          if(!isGrouped(def.parts[1]) &amp;&amp; getStatus(def.parts[1]) === &quot;empty&quot;) freeCount++;
        }
      });
    }

    if(pairMode === &quot;merged-first&quot;){
      pairDefinitions.forEach(def =&gt; {
        if(appState.merged[def.id] &amp;&amp; !isGrouped(def.id) &amp;&amp; getStatus(def.id) === &quot;empty&quot;){
          freeCount++;
        }
      });
    }

    section.innerHTML =
      &#x27;&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;&#x27; + title + &#x27;&lt;/span&gt;&lt;span&gt;空き &#x27; + freeCount + &quot;&lt;/span&gt;&lt;/div&gt;&quot;;

    const grid = document.createElement(&quot;div&quot;);
    grid.className = &quot;table-grid&quot;;

    const tables = currentTables();

  function maximalEmptyRuns(){
    const tables = currentTables();
    const runs = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          let total = 0;
          let allBox = true;

          run.forEach(id =&gt; {
            if(tables[id] === &quot;BOX&quot;){
              total += 7;
            }else{
              allBox = false;
              total += Number(tables[id]);
            }
          });

          runs.push({
            ids:[...run],
            label: run.length === 2 ? run.join(&quot;・&quot;) : run[0] + &quot;〜&quot; + run[run.length - 1],
            max:total,
            allBox
          });
        }
        run = [];
      };

      group.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    return runs;
  }
