/* ===== physical table composition display ===== */
.physical-merged,.physical-group{
 width:100%;height:100%;position:relative;border:3px solid #047857;border-radius:7px;overflow:hidden;
 display:flex;background:#fff;padding:0;font:inherit;color:inherit
}

.physical-seg{

 font-size:9px;font-weight:950;position:relative
}
.physical-seg:last-child{border-right:0}
.physical-merged.reserved .physical-seg,.physical-group.reserved .physical-seg{background:var(--reserved)}
.physical-merged.used .physical-seg,.physical-group.used .physical-seg{background:var(--used)}

 position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.9);font-weight:950
}

/* ===== FIX state visibility ===== */
/* Capacity colors are ONLY the empty-state base colors. */
.table.empty.cap2{background:var(--empty2)!important}
.table.empty.cap4{background:var(--empty4)!important}
.table.empty.cap6{background:var(--empty6)!important}
.table.empty.capbox{background:var(--empty4)!important}

/* Operational states always override capacity colors. */
.table.reserved,
.physical-merged.reserved,
.physical-group.reserved{
  background:var(--reserved)!important;
  color:#111827!important;
}
.table.used,
.physical-merged.used,
.physical-group.used{
  background:var(--used)!important;
  color:#fff!important;
}
.table.cleaning,
.physical-merged.cleaning,
.physical-group.cleaning{
  background:var(--clean)!important;
  color:#111827!important;
}

/* Physical segments inherit the state overlay visually instead of masking it. */
.physical-merged.reserved .physical-seg,
.physical-group.reserved .physical-seg{
  background:var(--reserved)!important;
}
.physical-merged.used .physical-seg,
.physical-group.used .physical-seg{
  background:var(--used)!important;
  color:#fff!important;
}
.physical-merged.cleaning .physical-seg,
.physical-group.cleaning .physical-seg{
  background:var(--clean)!important;
}

/* Delete selection must be obvious on every visual type. */
.table.bulk-delete-selected,
.physical-merged.bulk-delete-selected,
.physical-group.bulk-delete-selected,
.composite-wrap.bulk-delete-selected,
.group-wrap.bulk-delete-selected{
  outline:4px solid #dc2626!important;
  outline-offset:2px!important;
  box-shadow:0 0 0 2px #fff inset!important;
}


/* ===== 清掃待ち：斜線表示を復元 ===== */

  color:#111827!important;
}
.physical-merged.cleaning .physical-seg,
.physical-group.cleaning .physical-seg{
  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,.92) 0 8px,
      rgba(148,163,184,.35) 8px 16px
    ) !important;
  color:#111827!important;
}

function cfgNaturalTableCompare(a,b){
 const aa=String(a).toUpperCase();
 const bb=String(b).toUpperCase();
 const pa=aa.match(/^(\D*?)(\d+)(.*)$/);
 const pb=bb.match(/^(\D*?)(\d+)(.*)$/);

 if(pa &amp;&amp; pb){
   const prefixCmp=pa[1].localeCompare(pb[1],&quot;ja&quot;,{numeric:true,sensitivity:&quot;base&quot;});
   if(prefixCmp!==0)return prefixCmp;

   const numCmp=Number(pa[2])-Number(pb[2]);
   if(numCmp!==0)return numCmp;

   return pa[3].localeCompare(pb[3],&quot;ja&quot;,{numeric:true,sensitivity:&quot;base&quot;});
 }
 return aa.localeCompare(bb,&quot;ja&quot;,{numeric:true,sensitivity:&quot;base&quot;});
}

 }).sort((a,b)=&gt;cfgNaturalTableCompare(a.id,b.id));

 let col=1;
 arr.forEach((item,i)=&gt;{

   if(item.kind===&quot;single&quot;){
     item.order=i;

   }else{

   }
   col+=width;
 });
}

function cfgMoveKey(obj,oldKey,newKey){
 if(!obj || oldKey===newKey || obj[oldKey]===undefined)return;
 obj[newKey]=obj[oldKey];delete obj[oldKey];
}
function cfgRenameTable(oldId,newId){
 newId=(newId||&quot;&quot;).trim();
 if(!newId || oldId===newId)return oldId;
 if(cfgNamedItem(newId))throw new Error(`卓 ${newId} はすでに存在します。`);
 const item=cfgNamedItem(oldId);if(!item)throw new Error(&quot;元の卓が見つかりません。&quot;);
 if(item.kind===&quot;single&quot;){
   item.id=newId;
   cfgMoveKey(data.states,oldId,newId);
   cfgMoveKey(data.cleaning,oldId,newId);
   data.groups.forEach(g=&gt;g.ids=g.ids.map(x=&gt;x===oldId?newId:x));
 }else{
   const c=compositeById(oldId);
   const oldParts=c.parts.map(p=&gt;p.id);
   item.id=newId;c.id=newId;
   c.parts.forEach((p,i)=&gt;p.id=newId+String.fromCharCode(65+i));
   cfgMoveKey(data.states,oldId,newId);
   cfgMoveKey(data.cleaning,oldId,newId);
   cfgMoveKey(data.merged,oldId,newId);
   oldParts.forEach((op,i)=&gt;{
     const np=c.parts[i].id;
     cfgMoveKey(data.states,op,np);
     cfgMoveKey(data.cleaning,op,np);
   });
   data.groups.forEach(g=&gt;g.ids=g.ids.map(x=&gt;{
     if(x===oldId)return newId;
     const i=oldParts.indexOf(x);return i&gt;=0?c.parts[i].id:x;
   }));
 }
 cfgEditingId=newId;
 return newId;
}

  function cfgSetupHScroll(holderId,prevId,nextId){
    const holder=document.getElementById(holderId),prev=document.getElementById(prevId),next=document.getElementById(nextId);
    if(!holder||!prev||!next)return;
    const update=()=&gt;{
      const max=Math.max(0,holder.scrollWidth-holder.clientWidth);
      prev.disabled=max&lt;=2||holder.scrollLeft&lt;=2;
      next.disabled=max&lt;=2||holder.scrollLeft&gt;=max-2;
    };
    const step=()=&gt;Math.max(150,holder.clientWidth*.85);
    prev.onclick=()=&gt;{holder.scrollBy({left:-step(),behavior:&quot;smooth&quot;});setTimeout(update,250)};
    next.onclick=()=&gt;{holder.scrollBy({left: step(),behavior:&quot;smooth&quot;});setTimeout(update,250)};
    holder.addEventListener(&quot;scroll&quot;,update,{passive:true});
    holder.addEventListener(&quot;wheel&quot;,e=&gt;{
      if(Math.abs(e.deltaY)&gt;Math.abs(e.deltaX)){holder.scrollLeft+=e.deltaY;e.preventDefault()}
    },{passive:false});
    requestAnimationFrame(update);setTimeout(update,80);
  }
  renderAll();return true;
}

};

function cfgExpectedRowForTableId(id){

 if(!m)return null;

 let chosen=null;
 for(const row of rows){
   if(row.num&lt;=n)chosen=row;
   else break;
 }
 return chosen ? chosen.rowKey : null;
}

function cfgRepairNumericRowAssignments(){
 /* Repair only named numeric 1F identities.
    This fixes layouts saved by the previous buggy build where a table such as 41
    could inherit row 1 after composite normalization. */
 const rows=cfgNumericRowDefinitions();
 if(!rows.length)return;

 CONFIG.items.forEach(item=&gt;{
   const expected=cfgExpectedRowForTableId(item.id);
   if(!expected)return;

   if(item.kind===&quot;single&quot;){
     item.rowKey=expected;
   }else{
     const c=compositeById(item.id);
     if(c)c.rowKey=expected;
   }
 });
}


function cfgPartBelongsToComposite(parentId,partId){
  const p=String(parentId).toUpperCase();
  const x=String(partId).toUpperCase();

  /* Valid physical parts of parent 40 are names that still begin with 40
     and then have a suffix such as A/B/C/D. */
  if(!x.startsWith(p))return false;
  const suffix=x.slice(p.length);
  return /^[A-Z]+$/.test(suffix);
}

function cfgRepairDetachedPartsFromSavedLayout(){
  const toDetach=[];

  CONFIG.composites.forEach(parent=&gt;{
    parent.parts.forEach(part=&gt;{
      if(!cfgPartBelongsToComposite(parent.id,part.id)){
        toDetach.push({
          parentId:parent.id,
          partId:part.id,
          cap:Number(part.cap||2),
          box:!!part.box,
          rowKey:parent.rowKey
        });
      }
    });
  });

  toDetach.forEach(info=&gt;{
    const parent=compositeById(info.parentId);
    if(!parent)return;

    const part=parent.parts.find(p=&gt;p.id===info.partId);
    if(!part)return;

    /* Remove stale detached part from composite. */
    parent.parts=parent.parts.filter(p=&gt;p.id!==info.partId);

    /* Remove it from any manual group too; a detached table must be independent. */
    const repairedGroups=[];
    data.groups.forEach(g=&gt;{
      if(!Array.isArray(g.ids)){repairedGroups.push(g);return}
      if(!g.ids.includes(info.partId)){repairedGroups.push(g);return}

      const remain=g.ids.filter(x=&gt;x!==info.partId);
      if(remain.length&gt;=2){
        g.ids=remain;
        repairedGroups.push(g);
      }
    });
    data.groups=repairedGroups;

    /* Create independent table if it does not already exist as a named item. */
    if(!cfgNamedItem(info.partId)){
      CONFIG.items.push({
        kind:&quot;single&quot;,
        id:info.partId,
        cap:info.cap,
        rowKey:info.rowKey,
        order:9999,
        pos:[1,1,cfgSeatWidth(info.cap,info.box)],
        box:info.box
      });
    }

    cfgNormalizeComposite(info.parentId);
  });

  /* Also repair old suffix gaps even if no new detach was needed. */
  CONFIG.composites.forEach(c=&gt;cfgNormalizeCompositePartSuffixes(c.id));

  if(toDetach.length){
    cfgSortRowsAndReflow();
    cfgSaveLayout();
  }
}


function cfgNormalizeAllCompositeSuffixes(){
  [...CONFIG.composites].forEach(c=&gt;cfgNormalizeCompositePartSuffixes(c.id));
}


function cfgRemoveEmptyRows(){
  const usedRows=new Set();

  CONFIG.items.forEach(item=&gt;{
    if(item.kind===&quot;single&quot;){
      if(item.rowKey)usedRows.add(item.rowKey);
    }else{
      const c=compositeById(item.id);
      if(c &amp;&amp; c.rowKey)usedRows.add(c.rowKey);
    }
  });

  const removed=CONFIG.rowKeys.filter(rowKey=&gt;!usedRows.has(rowKey));
  if(!removed.length)return false;

  CONFIG.rowKeys=CONFIG.rowKeys.filter(rowKey=&gt;usedRows.has(rowKey));

  if(CONFIG.rowLabels){
    removed.forEach(rowKey=&gt;delete CONFIG.rowLabels[rowKey]);
  }

  return true;
}

function cfgAddNew(){
 let rowKey=document.getElementById(&quot;cfgAddRow&quot;).value;
 let newRowName=&quot;&quot;;

 if(rowKey===&quot;NEW&quot;){
   newRowName=document.getElementById(&quot;cfgNewRowName&quot;).value.trim();
   if(!newRowName){
     document.getElementById(&quot;cfgAddError&quot;).textContent=&quot;新しい列名を入力してください。&quot;;
     return;
   }

   rowKey=&quot;r&quot;+Date.now();
   if(!CONFIG.rowLabels)CONFIG.rowLabels={};
   CONFIG.rowLabels[rowKey]=newRowName;
   CONFIG.rowKeys.push(rowKey);
 }

 let id=document.getElementById(&quot;cfgAddName&quot;).value.trim();

 /* New row: if user leaves the automatically proposed name unchanged/empty,
    the first table uses the row number itself, e.g. row 40 -&gt; table 40. */
 if(!id &amp;&amp; newRowName){
   id=newRowName;
   document.getElementById(&quot;cfgAddName&quot;).value=id;
 }

 const m=cfgMetrics(cfgAddCounts);

 if(!rowKey){
   document.getElementById(&quot;cfgAddError&quot;).textContent=&quot;追加する列を選択してください。&quot;;
   return;
 }
 if(!id){
   document.getElementById(&quot;cfgAddError&quot;).textContent=&quot;卓名を決められません。&quot;;
   return;
 }
 if(cfgNamedItem(id)){
   document.getElementById(&quot;cfgAddError&quot;).textContent=`卓 ${id} はすでに存在します。`;
   return;
 }
 if(!m.physical){
   document.getElementById(&quot;cfgAddError&quot;).textContent=&quot;卓構成を設定してください。&quot;;
   return;
 }

 const rowItems=CONFIG.items.filter(x=&gt;(x.kind===&quot;single&quot;?x.rowKey:compositeById(x.id)?.rowKey)===rowKey);
 const maxOrder=rowItems.reduce((mx,x)=&gt;Math.max(mx,x.kind===&quot;single&quot;?x.order:compositeById(x.id).order),-1);

 if(m.physical===1){
   let cap=0,box=false;
   CFG_TYPES.forEach(t=&gt;{
     if(cfgAddCounts[t.key]){cap=t.cap;box=t.key===&quot;BOX&quot;}
   });
   CONFIG.items.push({kind:&quot;single&quot;,id,cap,rowKey,order:maxOrder+1,pos:[1,1,1],box});
 }else{
   CONFIG.items.push({kind:&quot;composite&quot;,id});
   CONFIG.composites.push({
     id,cap:m.max,parts:cfgPartList(id,cfgAddCounts),
     rowKey,order:maxOrder+1,pos:[1,1,m.physical]
   });
   data.merged[id]=true;
 }

 /* Sort BOTH tables inside each row and the rows themselves.
    Example: adding new row 40 places it after 30 and before 50. */
 cfgNormalizeAllCompositeSuffixes();
 cfgCleanupRowsAndReflow();
 cfgRefreshAddRowOptions();
 cfgSaveLayout();
 cfgRefreshAddRowOptions();

 save();
 renderAll();
 cfgClose();
 toast(`${id} を追加しました`);
}

function cfgNormalizeName(v){return String(v||&quot;&quot;).trim().toUpperCase()}


function cfgDetachPartAsSingle(parent,partId,newId){
  const part=parent.parts.find(p=&gt;p.id===partId);
  if(!part)return false;

  newId=cfgNormalizeName(newId);
  if(!newId)return false;

  const duplicateNamed=cfgNamedItem(newId);
  const duplicatePart=CONFIG.composites.some(c=&gt;c.parts.some(p=&gt;p.id===newId));
  if(duplicateNamed||duplicatePart){
    toast(`卓 ${newId} はすでに存在します`);
    return false;
  }

  const originalRowKey=parent.rowKey;
  const originalCap=Number(part.cap||2);
  const originalBox=!!part.box;

  /* 1) Detach this physical table from the parent composite. */
  parent.parts=parent.parts.filter(p=&gt;p.id!==partId);

  /* 2) Detach it completely from manual groups.
        Do NOT replace partId with newId inside the old group. */
  const nextGroups=[];
  data.groups.forEach(g=&gt;{
    if(!Array.isArray(g.ids)){ nextGroups.push(g); return; }

    if(!g.ids.includes(partId)){
      nextGroups.push(g);
      return;
    }

    const remain=g.ids.filter(x=&gt;x!==partId);

    /* A manual group needs at least 2 units. If only one remains, dissolve it. */
    if(remain.length&gt;=2){
      g.ids=remain;
      nextGroups.push(g);
    }
  });
  data.groups=nextGroups;

  /* 3) Carry state/cleaning to the new independent table. */
  if(data.states[partId]!==undefined){
    data.states[newId]=data.states[partId];
    delete data.states[partId];
  }
  if(data.cleaning[partId]!==undefined){
    data.cleaning[newId]=data.cleaning[partId];
    delete data.cleaning[partId];
  }

  /* 4) Create a TRUE single table in the SAME row.
        order is temporary; natural reflow decides final position. */
  CONFIG.items.push({
    kind:&quot;single&quot;,
    id:newId,
    cap:originalCap,
    rowKey:originalRowKey,
    order:9999,
    pos:[1,1,cfgSeatWidth(originalCap,originalBox)],
    box:originalBox
  });

  /* 5) Re-normalize the old composite:
        2+ parts =&gt; stays composite
        1 part  =&gt; collapses to base identity
        0 parts =&gt; disappears */
  parent.rowKey=originalRowKey;
  cfgNormalizeComposite(parent.id);

  /* 6) Re-sort the SAME row immediately by natural numeric order.
        Example: 40,41,42,43,44... */
  cfgReflowRow(originalRowKey);

  return true;
}


function cfgNormalizeCompositePartSuffixes(parentId){
  const parent=compositeById(parentId);
  if(!parent || parent.parts.length===0)return;

  /* Keep the current physical order, then rename consecutively:
     parentA, parentB, parentC... */
  const renames=[];
  parent.parts.forEach((part,i)=&gt;{
    const wanted=parentId + String.fromCharCode(65+i);
    if(part.id!==wanted){
      renames.push({part,oldId:part.id,newId:wanted});
    }
  });

  if(!renames.length)return;

  /* Two-phase rename avoids collisions such as 40D -&gt; 40C while 40C
     may still temporarily exist elsewhere during normalization. */
  renames.forEach((r,i)=&gt;{
    const temp=`__TMP_${parentId}_${i}_${Date.now()}`;
    r.tempId=temp;

    if(data.states[r.oldId]!==undefined){
      data.states[temp]=data.states[r.oldId];
      delete data.states[r.oldId];
    }
    if(data.cleaning[r.oldId]!==undefined){
      data.cleaning[temp]=data.cleaning[r.oldId];
      delete data.cleaning[r.oldId];
    }

    data.groups.forEach(g=&gt;{
      if(Array.isArray(g.ids)){
        g.ids=g.ids.map(x=&gt;x===r.oldId?temp:x);
      }
    });

    r.part.id=temp;
  });

  renames.forEach(r=&gt;{
    if(data.states[r.tempId]!==undefined){
      data.states[r.newId]=data.states[r.tempId];
      delete data.states[r.tempId];
    }
    if(data.cleaning[r.tempId]!==undefined){
      data.cleaning[r.newId]=data.cleaning[r.tempId];
      delete data.cleaning[r.tempId];
    }

    data.groups.forEach(g=&gt;{
      if(Array.isArray(g.ids)){
        g.ids=g.ids.map(x=&gt;x===r.tempId?r.newId:x);
      }
    });

    r.part.id=r.newId;
  });
}

function cfgNormalizeComposite(parentId){
  const parent=compositeById(parentId);
  const item=cfgNamedItem(parentId);
  if(!parent||!item)return;

  const stableRowKey=parent.rowKey;
  const stableOrder=parent.order;

  /* After any detach/delete, close suffix gaps automatically.
     Example: 40A,40B,40D -&gt; 40A,40B,40C. */
  cfgNormalizeCompositePartSuffixes(parentId);

  if(parent.parts.length===0){
    CONFIG.items=CONFIG.items.filter(x=&gt;x.id!==parentId);
    CONFIG.composites=CONFIG.composites.filter(c=&gt;c.id!==parentId);
    delete data.merged[parentId];
    delete data.states[parentId];
    delete data.cleaning[parentId];
    return;
  }

  if(parent.parts.length===1){
    const only=parent.parts[0];
    const oldPartId=only.id;

    let newState;
    if(data.states[oldPartId]!==undefined)newState=data.states[oldPartId];
    else if(data.states[parentId]!==undefined)newState=data.states[parentId];
    const newCleaning=!!data.cleaning[oldPartId]||!!data.cleaning[parentId];

    CONFIG.items=CONFIG.items.filter(x=&gt;x.id!==parentId);
    CONFIG.composites=CONFIG.composites.filter(c=&gt;c.id!==parentId);

    CONFIG.items.push({
      kind:&quot;single&quot;,
      id:parentId,
      cap:Number(only.cap||2),
      rowKey:stableRowKey,
      order:stableOrder,
      pos:[1,1,cfgSeatWidth(only.cap,!!only.box)],
      box:!!only.box
    });

    delete data.states[oldPartId];
    delete data.cleaning[oldPartId];
    delete data.states[parentId];
    delete data.cleaning[parentId];
    delete data.merged[parentId];

    if(newState!==undefined)data.states[parentId]=newState;
    if(newCleaning)data.cleaning[parentId]=true;

    data.groups.forEach(g=&gt;{
      if(Array.isArray(g.ids))g.ids=g.ids.map(x=&gt;x===oldPartId?parentId:x);
    });

    cfgReflowRow(stableRowKey);
    return;
  }

  parent.rowKey=stableRowKey;
  parent.cap=parent.parts.reduce((sum,p)=&gt;sum+Number(p.cap||0),0);
  parent.pos[2]=parent.parts.reduce((sum,p)=&gt;sum+cfgSeatWidth(p.cap,!!p.box),0);
}

function cfgRenameEverywhere(oldId,newId){
 oldId=cfgNormalizeName(oldId);newId=cfgNormalizeName(newId);
 if(!oldId||!newId)return false;
 if(oldId===newId)return true;

 /* Prevent duplicate against named tables and physical parts. */
 const duplicateNamed=cfgNamedItem(newId);
 const duplicatePart=CONFIG.composites.some(c=&gt;c.parts.some(p=&gt;p.id===newId));
 if(duplicateNamed||duplicatePart){toast(`卓 ${newId} はすでに存在します`);return false}

 const item=cfgNamedItem(oldId);

 if(item){
   if(item.kind===&quot;single&quot;){
     item.id=newId;
   }else{
     const c=compositeById(oldId);
     item.id=newId;
     if(c){
       c.id=newId;
       c.parts.forEach((p,i)=&gt;{
         const oldPart=p.id;
         const suffix=oldPart.startsWith(oldId)?oldPart.slice(oldId.length):String.fromCharCode(65+i);
         p.id=newId+suffix;
         if(data.states[oldPart]!==undefined){data.states[p.id]=data.states[oldPart];delete data.states[oldPart]}
         if(data.cleaning[oldPart]!==undefined){data.cleaning[p.id]=data.cleaning[oldPart];delete data.cleaning[oldPart]}
       });
     }
     if(data.merged[oldId]!==undefined){data.merged[newId]=data.merged[oldId];delete data.merged[oldId]}
   }

   if(data.states[oldId]!==undefined){data.states[newId]=data.states[oldId];delete data.states[oldId]}
   if(data.cleaning[oldId]!==undefined){data.cleaning[newId]=data.cleaning[oldId];delete data.cleaning[oldId]}

   data.groups.forEach(g=&gt;{
     if(Array.isArray(g.ids))g.ids=g.ids.map(x=&gt;x===oldId?newId:x);
   });
   return true;
 }

 /* Split physical part renamed to a new table identity:
    DETACH from parent composite + create independent single table. */
 const parent=CONFIG.composites.find(c=&gt;c.parts.some(p=&gt;p.id===oldId));
 if(parent){
   return cfgDetachPartAsSingle(parent,oldId,newId);
 }

 return false;
}

function quickRenameTable(id,tableEl){
 if(bulkDeleteMode)return;
 const item=cfgNamedItem(id);
 const parent=!item?CONFIG.composites.find(c=&gt;c.parts.some(p=&gt;p.id===id)):null;
 if(!item&amp;&amp;!parent)return;
 const oldId=id;
 const rowKey=item ? (item.kind===&quot;single&quot;?item.rowKey:compositeById(id)?.rowKey) : parent.rowKey;
 const oldHTML=tableEl.innerHTML;

 const input=document.createElement(&quot;input&quot;);
 input.className=&quot;quick-rename-input&quot;;
 input.value=oldId;
 input.autocomplete=&quot;off&quot;;
 input.autocapitalize=&quot;characters&quot;;
 input.spellcheck=false;

 tableEl.innerHTML=&quot;&quot;;
 tableEl.appendChild(input);

 requestAnimationFrame(()=&gt;{input.focus();try{input.setSelectionRange(input.value.length,input.value.length)}catch{}});

 let finished=false;
 const finish=saveIt=&gt;{
   if(finished)return;
   finished=true;
   const newId=cfgNormalizeName(input.value);

   if(!saveIt||!newId||newId===oldId){
     tableEl.innerHTML=oldHTML;
     return;
   }

   if(!cfgRenameEverywhere(oldId,newId)){
     finished=false;input.focus();try{input.setSelectionRange(input.value.length,input.value.length)}catch{};return;
   }

   if(rowKey)cfgReflowRow(rowKey);
   cfgRepairDetachedPartsFromSavedLayout();
   cfgNormalizeAllCompositeSuffixes();
   cfgSortRowsAndReflow();
   cfgRefreshAddRowOptions();
   cfgSaveLayout();
   save();
   renderAll();
   toast(`${oldId} → ${newId}`);
 };

 input.addEventListener(&quot;input&quot;,()=&gt;{
   const p=input.selectionStart;
   input.value=input.value.toUpperCase();
   try{input.setSelectionRange(p,p)}catch{}
 });
 input.addEventListener(&quot;keydown&quot;,e=&gt;{
   e.stopPropagation();
   if(e.key===&quot;Enter&quot;){e.preventDefault();finish(true)}
   else if(e.key===&quot;Escape&quot;){e.preventDefault();finish(false)}
 });
 input.addEventListener(&quot;click&quot;,e=&gt;e.stopPropagation());
 input.addEventListener(&quot;dblclick&quot;,e=&gt;e.stopPropagation());
 input.addEventListener(&quot;mousedown&quot;,e=&gt;e.stopPropagation());
 input.addEventListener(&quot;pointerdown&quot;,e=&gt;e.stopPropagation());
 input.addEventListener(&quot;blur&quot;,()=&gt;finish(true),{once:true});
}

function cfgDeleteFast(id){
 const item=cfgNamedItem(id);

 /* Normal named table / merged composite identity. */
 if(item){
   const c=item.kind===&quot;composite&quot;?compositeById(id):null;
   const ids=c?[id,...c.parts.map(p=&gt;p.id)]:[id];

   if(ids.some(x=&gt;state(x)!==&quot;empty&quot;||isCleaning(x)||groupForUnit(x)))return false;

   CONFIG.items=CONFIG.items.filter(x=&gt;x.id!==id);
   CONFIG.composites=CONFIG.composites.filter(x=&gt;x.id!==id);
   ids.forEach(x=&gt;{delete data.states[x];delete data.cleaning[x]});
   delete data.merged[id];
   return true;
 }

 /* Split physical part: delete ONLY that physical table. */
 const parent=CONFIG.composites.find(c=&gt;c.parts.some(p=&gt;p.id===id));
 if(parent){
   if(state(id)!==&quot;empty&quot;||isCleaning(id)||groupForUnit(id))return false;

   parent.parts=parent.parts.filter(p=&gt;p.id!==id);

   /* Remove the deleted physical part from manual groups too. */
   const cleanedGroups=[];
   data.groups.forEach(g=&gt;{
     if(!Array.isArray(g.ids)){cleanedGroups.push(g);return}
     if(!g.ids.includes(id)){cleanedGroups.push(g);return}
     const remain=g.ids.filter(x=&gt;x!==id);
     if(remain.length&gt;=2){
       g.ids=remain;
       cleanedGroups.push(g);
     }
   });
   data.groups=cleanedGroups;

   delete data.states[id];
   delete data.cleaning[id];

   /* If no physical parts remain, remove the named composite entirely. */
   if(parent.parts.length===0){
     CONFIG.items=CONFIG.items.filter(x=&gt;x.id!==parent.id);
     CONFIG.composites=CONFIG.composites.filter(c=&gt;c.id!==parent.id);
     delete data.merged[parent.id];
     delete data.states[parent.id];
     delete data.cleaning[parent.id];
     return true;
   }

   /* Normalize remaining composite:
      2+ parts stay composite; 1 part collapses to base single identity. */
   data.merged[parent.id]=false;
   delete data.states[parent.id];
   delete data.cleaning[parent.id];
   cfgNormalizeComposite(parent.id);
   return true;
 }

 return false;
}

function compositeById(id){return CONFIG.composites.find(c=&gt;c.id===id)}
function groupForUnit(id){return data.groups.find(g=&gt;g.ids.includes(id))}
function groupById(id){return data.groups.find(g=&gt;g.id===id)}
function operationalState(u){
 if(u&amp;&amp;u.manualGroup){
  const g=groupById(u.id);
  return g?.state||&quot;empty&quot;;
 }
 return state(u.id);
}
function operationalCleaning(u){
 if(u&amp;&amp;u.manualGroup){
  const g=groupById(u.id);
  return !!g &amp;&amp; g.ids.some(id=&gt;isCleaning(id));
 }
 return isCleaning(u.id);
}
function operationalVacant(u){
 if(!u)return false;
 if(u.manualGroup)return operationalState(u)===&quot;empty&quot;;
 return state(u.id)===&quot;empty&quot;&amp;&amp;!groupForUnit(u.id);
}
function operationalRows(){
 const rawRows=[];
 CONFIG.rowKeys.forEach(key=&gt;{
  rawRows.push(activeUnits().filter(u=&gt;u.rowKey===key).sort((a,b)=&gt;a.order-b.order));
 });

 return rawRows.map(row=&gt;{
  const out=[];
  const consumed=new Set();

  for(let i=0;i&lt;row.length;i++){
   const u=row[i];
   if(consumed.has(u.id))continue;

   const g=groupForUnit(u.id);
   if(!g){
    out.push(u);
    continue;
   }

   const memberUnits=g.ids.map(id=&gt;row.find(x=&gt;x.id===id)).filter(Boolean);
   if(memberUnits.length!==g.ids.length){
    /* Defensive fallback: do not hide a group if layout is stale. */
    out.push(u);
    continue;
   }

   memberUnits.forEach(x=&gt;consumed.add(x.id));
   const cap=memberUnits.reduce((s,x)=&gt;s+x.cap,0);
   const first=[...memberUnits].sort((a,b)=&gt;a.order-b.order)[0];
   const minCol=Math.min(...memberUnits.map(x=&gt;x.pos?.[0]||0));
   const maxCol=Math.max(...memberUnits.map(x=&gt;(x.pos?.[0]||0)+(x.pos?.[2]||1)));

   out.push({
    id:g.id,
    cap,
    base:g.id,
    rowKey:first.rowKey,
    order:Math.min(...memberUnits.map(x=&gt;x.order)),
    pos:[minCol,first.pos?.[1]||0,Math.max(1,maxCol-minCol)],
    manualGroup:true,
    members:[...g.ids]
   });
  }
  return out.sort((a,b)=&gt;a.order-b.order);
 });
}

function activeUnits(){
 const units=[];
 CONFIG.items.forEach(item=&gt;{
   if(item.kind===&quot;single&quot;) units.push({id:item.id,cap:item.cap,base:item.base||item.id,rowKey:item.rowKey,order:item.order,pos:item.pos});
   else {
     const c=compositeById(item.id);
     if(data.merged[c.id]) units.push({id:c.id,cap:c.cap,base:c.id,rowKey:c.rowKey,order:c.order,pos:c.pos,composite:true});
     else c.parts.forEach((p,i)=&gt;units.push({id:p.id,cap:p.cap,base:c.id,rowKey:c.rowKey,order:c.order+i/10,pos:c.pos,part:true}));
   }
 });
 return units;
}

function isCleaning(id){return !!data.cleaning[id]}
function vacant(u){return state(u.id)===&quot;empty&quot;&amp;&amp;!groupForUnit(u.id)}
function available(u){return vacant(u)&amp;&amp;!isCleaning(u.id)}

function allRuns(){
 const out=[];
 currentRows().forEach((row,rowIndex)=&gt;{
  for(let i=0;i&lt;row.length;i++){
   if(!operationalVacant(row[i]))continue;
   let cap=0,cleaning=false;
   for(let j=i;j&lt;row.length;j++){
    if(!operationalVacant(row[j]))break;
    cap+=row[j].cap;
    cleaning=cleaning||operationalCleaning(row[j]);
    out.push({
     ids:row.slice(i,j+1).map(x=&gt;x.id),
     cap,rowIndex,start:i,count:j-i+1,cleaning
    });
   }
  }
 });
 return out;
}
function remainingMaxAfter(ids){
 const used=new Set(ids);
 let best=0;
 currentRows().forEach(row=&gt;{
  let cap=0;
  row.forEach(u=&gt;{
   if(operationalVacant(u)&amp;&amp;!used.has(u.id)){
    cap+=u.cap;
    if(cap&gt;best)best=cap;
   }else cap=0;
  });
 });
 return best;
}
function physicalTableCountForId(id){
 const g=groupById(id);
 if(g)return g.ids.reduce((s,x)=&gt;s+physicalTableCountForId(x),0);
 const c=compositeById(id);
 if(c&amp;&amp;data.merged[c.id])return c.parts.length;
 return 1;
}
function physicalTableCount(ids){
 return ids.reduce((sum,id)=&gt;sum+physicalTableCountForId(id),0);
}
function cleaningPhysicalCount(ids){
 return ids.reduce((sum,id)=&gt;{
  const g=groupById(id);
  if(g){
   return sum+g.ids.reduce((s,x)=&gt;s+(isCleaning(x)?physicalTableCountForId(x):0),0);
  }
  if(!isCleaning(id))return sum;
  return sum+physicalTableCountForId(id);
 },0);
}
function candidates(){
 const fitting=allRuns().filter(o=&gt;o.cap&gt;=people);
 if(!fitting.length)return [];

 const enrich=o=&gt;{
   const singleId=o.ids.length===1?o.ids[0]:null;
   const existingGroup=singleId &amp;&amp; !!groupById(singleId);
   const existingComposite=singleId &amp;&amp; !!unitMap()[singleId]?.composite;
   return {
    ...o,
    physicalCount:physicalTableCount(o.ids),
    cleaningPhysical:cleaningPhysicalCount(o.ids),
    remainMax:remainingMaxAfter(o.ids),
    existingReadyUnit:!!(existingGroup||existingComposite)
   };
 };

 const readyAll=fitting.filter(o=&gt;!o.cleaning);
 const waitingAll=fitting.filter(o=&gt;o.cleaning);

 let ready=[];
 if(readyAll.length){
   const minReadyCap=Math.min(...readyAll.map(o=&gt;o.cap));

   ready=readyAll
     .filter(o=&gt;{
       if(o.cap===minReadyCap)return true;
       if(o.ids.length!==1)return false;
       const id=o.ids[0];
       const u=unitMap()[id];
       return !!u?.composite || !!groupById(id);
     })
     .map(enrich);
 }

 let waiting=[];
 if(waitingAll.length){
   const minWaitingCap=Math.min(...waitingAll.map(o=&gt;o.cap));
   waiting=waitingAll
     .filter(o=&gt;o.cap===minWaitingCap)
     .map(enrich);
 }

 const sorter=(a,b)=&gt;
   a.cleaningPhysical-b.cleaningPhysical ||
   (a.cap-people)-(b.cap-people) ||
   b.remainMax-a.remainMax ||
   Number(b.existingReadyUnit)-Number(a.existingReadyUnit) ||
   a.physicalCount-b.physicalCount ||
   Number(a.rowIndex===0)-Number(b.rowIndex===0) ||
   a.rowIndex-b.rowIndex ||
   a.start-b.start;

 return [
   ...ready.sort(sorter),
   ...waiting.sort(sorter)
 ].slice(0,35);
}
function setUnits(ids,s=selectedState){
 ids.forEach(id=&gt;{
   delete data.cleaning[id];
   s===&quot;empty&quot;?delete data.states[id]:data.states[id]=s;
 });
 const g=data.groups.find(x=&gt;ids.some(id=&gt;x.ids.includes(id)));
 if(g){
   g.state=s;
   g.ids.forEach(id=&gt;delete data.cleaning[id]);
 }
 save();renderAll();
}
function createGroup(ids){
 let expanded=expandOperationalIds(ids);

 /* Existing manual groups contained in the recommendation are temporarily
    dissolved, then rebuilt together with any newly adjacent tables. */
 const involved=data.groups.filter(g=&gt;ids.includes(g.id));
 if(involved.length){
  const involvedSet=new Set(involved.map(g=&gt;g.id));
  data.groups=data.groups.filter(g=&gt;!involvedSet.has(g.id));
 }

 expanded=[...new Set(expanded)];

 if(expanded.length&lt;2){
  setUnits(expanded);
  return;
 }

 if(expanded.some(id=&gt;!available(unitMap()[id]))){
  /* Restore old groups if the recommendation cannot be applied. */
  involved.forEach(g=&gt;data.groups.push(g));
  toast(&quot;空席ではない卓は連結できません&quot;);
  return;
 }

 data.groups.push({id:&quot;g&quot;+Date.now()+Math.random(),ids:[...expanded],state:selectedState});
 setUnits(expanded,selectedState);
 toast(expanded.join(&quot;・&quot;)+&quot; を連結しました&quot;);
}
function releaseGroup(gid){
 const i=data.groups.findIndex(g=&gt;g.id===gid); if(i&lt;0)return;
 data.groups[i].ids.forEach(id=&gt;{delete data.states[id];delete data.cleaning[id]});
 data.groups.splice(i,1); save();renderAll();toast(&quot;連結解除 → 空席&quot;);
}
function toggleComposite(cid){
 const c=compositeById(cid); if(!c)return;
 if(groupForUnit(cid)||c.parts.some(p=&gt;groupForUnit(p.id))){toast(&quot;先に手動連結を解除してください&quot;);return}
 if(data.merged[cid]){
   if(state(cid)!==&quot;empty&quot;){toast(&quot;空席にしてから分割してください&quot;);return}
   delete data.states[cid]; c.parts.forEach(p=&gt;delete data.states[p.id]); data.merged[cid]=false;
 }else{
   if(c.parts.some(p=&gt;state(p.id)!==&quot;empty&quot;)){toast(&quot;両方を空席にしてから連結してください&quot;);return}
   c.parts.forEach(p=&gt;delete data.states[p.id]); delete data.states[cid]; data.merged[cid]=true;
 }
 selected.clear();save();renderAll();
}
function validManual(){

   if(ri.some(i=&gt;i&lt;0))return false;

function renderPeople(){

 h.innerHTML=&quot;&quot;;

    allRuns() bao gồm cả bàn sạch và 清掃待ち miễn bàn vẫn là 空席,
    nên MAX ở đây phản ánh cả trường hợp dọn xong rồi annai. */

 const maxCap=runs.reduce((m,o)=&gt;Math.max(m,o.cap),0);

    tự chuyển về mức lớn nhất còn nhận được. */

  people=choices[choices.length-1];

   b.onclick=()=&gt;{

function bindLongPress(btn,ids){
 let timer=null,held=false,suppressClick=false,startX=0,startY=0;

 function begin(x,y){
   held=false;
   startX=x;startY=y;
   clearTimeout(timer);
   timer=setTimeout(()=&gt;{
     if(bulkDeleteMode)return;
     held=true;
     suppressClick=true;
     markCleaning(ids);
     try{navigator.vibrate&amp;&amp;navigator.vibrate(25)}catch{}
   },500);
 }
 function move(x,y){
   if(Math.abs(x-startX)&gt;12||Math.abs(y-startY)&gt;12){
     clearTimeout(timer);timer=null;
   }
 }
 function end(){
   clearTimeout(timer);timer=null;
 }

 // Điện thoại / màn hình cảm ứng
 btn.addEventListener(&quot;touchstart&quot;,e=&gt;{
   const t=e.touches[0];
   begin(t.clientX,t.clientY);
 },{passive:true});
 btn.addEventListener(&quot;touchmove&quot;,e=&gt;{
   const t=e.touches[0];
   move(t.clientX,t.clientY);
 },{passive:true});
 btn.addEventListener(&quot;touchend&quot;,e=&gt;{
   end();
   if(held)e.preventDefault();
 },{passive:false});
 btn.addEventListener(&quot;touchcancel&quot;,end);

 // Máy tính / chuột
 btn.addEventListener(&quot;mousedown&quot;,e=&gt;{
   if(e.button!==0)return;
   begin(e.clientX,e.clientY);
 });
 btn.addEventListener(&quot;mousemove&quot;,e=&gt;move(e.clientX,e.clientY));
 btn.addEventListener(&quot;mouseup&quot;,end);
 btn.addEventListener(&quot;mouseleave&quot;,end);

 // Chặn đúng 1 click phát sinh sau khi nhấn giữ; click bình thường vẫn chạy.
 btn.addEventListener(&quot;click&quot;,e=&gt;{
   if(suppressClick){
     suppressClick=false;
     e.preventDefault();
     e.stopImmediatePropagation();
   }
 },true);

 btn.addEventListener(&quot;contextmenu&quot;,e=&gt;e.preventDefault());
}
function baseButton(id,cap,extra=&quot;&quot;){

   const wrap=document.createElement(&quot;div&quot;);wrap.className=&quot;group-wrap&quot;;
   if(bulkDeleteMode &amp;&amp; g.ids.some(id=&gt;bulkDeleteSelected.has(id)))wrap.classList.add(&quot;bulk-delete-selected&quot;);wrap.style.gridColumn=`${min} / span ${Math.max(1,max-min)}`;wrap.style.gridRow=String(row);
   const parts=g.ids.flatMap(id=&gt;physicalPartsForUnit(id));
   const cap=parts.reduce((sum,p)=&gt;sum+p.cap,0);
   const mainState=g.state||state(g.ids[0]);
   const b=physicalButton(g.ids[0],parts,&quot;physical-group&quot;,mainState,()=&gt;manual?toast(&quot;手動連結中です&quot;):setUnits(g.ids),g.ids.join(&quot;・&quot;),cap);
   const x=document.createElement(&quot;button&quot;);x.className=&quot;group-release&quot;;x.textContent=&quot;×&quot;;x.onclick=e=&gt;{e.stopPropagation();releaseGroup(g.id)};

&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;&gt;
&lt;title&gt;2F 席振り v28 表示調整版&lt;/title&gt;
&lt;style&gt;
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --line:#d1d5db;
  --text:#111827;
  --muted:#6b7280;
  --blue:#dbeafe;
  --green:#dcfce7;
  --orange:#ffedd5;
  --purple:#ede9fe;
  --reserved:#fef3c7;
  --used:#fee2e2;
  --accent:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans JP&quot;,sans-serif}
button{font:inherit;color:inherit}

#fixedPanel{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(243,244,246,.99);
  border-bottom:1px solid #cbd5e1;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.fixed-inner{max-width:760px;margin:auto;padding:6px 8px 7px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.header strong{font-size:16px}
.reset{
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  padding:4px 8px;
  font-size:11px;
}
.summary{display:flex;flex-wrap:nowrap;gap:4px;margin-bottom:5px;overflow-x:auto;scrollbar-width:none}.summary::-webkit-scrollbar{display:none}
.summary-card{
  flex:1 0 68px;
  min-width:0;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  text-align:center;
  padding:3px;
}
.summary-card small{display:block;font-size:9px;color:var(--muted)}
.summary-card b{font-size:16px}

.label{font-size:10px;font-weight:800;color:var(--muted);margin:2px 0 3px}

.row-scroll{
  display:flex;
  gap:4px;
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:none;
  margin-bottom:5px;
}
.row-scroll::-webkit-scrollbar{display:none}
.row-scroll button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
}
.row-scroll button.active{
  border-color:var(--accent);
  outline:2px solid var(--accent);
  outline-offset:0;
}
.state-row button[data-state=&quot;reserved&quot;]{background:var(--reserved)}
.state-row button[data-state=&quot;used&quot;]{background:var(--used)}

.cluster-strip{
  display:flex;
  gap:5px;
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:none;
}
.cluster-strip::-webkit-scrollbar{display:none}
.cluster-chip{
  flex:0 0 auto;
  border:1px solid #374151;
  background:#111827;
  color:#fff;
  border-radius:999px;
  padding:5px 8px;
  font-size:10px;
  font-weight:900;
}
.cluster-chip small{font-size:9px;opacity:.8;margin-left:4px}
.cluster-chip.disabled{background:#4b5563;color:#d1d5db}

main{max-width:760px;margin:auto;padding:7px 8px 30px}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px;
  margin:7px 0;
}
.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
  margin-bottom:7px;
}
.card-title span{font-size:11px;color:var(--muted)}

.renban-scroll-wrap{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 34px;
  gap:5px;
  align-items:stretch;
}
.scroll-arrow{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  font-size:20px;
  font-weight:900;
  touch-action:manipulation;
}
.scroll-arrow:disabled{opacity:.3}
.renban-options{
  min-width:0;
  width:100%;
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
  overflow-x:scroll;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  overscroll-behavior-x:contain;
  touch-action:pan-x;
  cursor:grab;
  scrollbar-width:auto;
  padding-bottom:5px;
}
.renban-options.dragging{
  cursor:grabbing;
  scroll-behavior:auto;
  user-select:none;
}
.renban-options::-webkit-scrollbar{height:7px}
.renban-options::-webkit-scrollbar-thumb{
  background:#9ca3af;
  border-radius:999px;
}
.renban-option{
  flex:0 0 180px;
  width:180px;
  min-width:180px;
  border:2px solid #9ca3af;
  border-radius:9px;
  background:#fff;
  padding:6px;
  text-align:left;
}
.renban-option.priority-1{
  border-color:#16a34a;
  background:#dcfce7;
}
.renban-option.priority-2{
  border-color:#eab308;
  background:#fef9c3;
}
.renban-option.priority-3{
  border-color:#fb923c;
  background:#ffedd5;
}
.renban-option.low{
  border-color:#9ca3af;
  background:#f3f4f6;
}
.renban-option.box8-fallback{
  border-color:#7c3aed;
  background:#f3e8ff;
}

.renban-option strong{font-size:17px}
.renban-option small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.chips{display:flex;gap:3px;margin-top:4px}
.chip{padding:0;border-radius:0;font-weight:900;font-size:12px;background:transparent!important}
.c2{background:transparent}
.c4{background:transparent}
.c6{background:transparent}
.cbox{background:transparent}

.table-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}
.table-btn{
  min-height:47px;
  border:2px solid #9ca3af;
  border-radius:8px;
  background:#fff;
  position:relative;
  font-weight:900;
}
.table-btn .cap{
  position:absolute;
  top:2px;
  right:3px;
  font-size:9px;
  padding:1px 4px;
  border-radius:999px;
}
.table-btn.c2 .cap{background:var(--blue)}
.table-btn.c4 .cap{background:var(--green)}
.table-btn.c6 .cap{background:var(--orange)}
.table-btn.cbox .cap{background:var(--purple)}
.table-btn.reserved{background:var(--reserved);border-color:#f59e0b}
.table-btn.cleaning,.physical-table.cleaning{
 background:repeating-linear-gradient(135deg,#f8fafc,#f8fafc 8px,#dbe2ea 8px,#dbe2ea 12px)!important;
 color:#111827!important
}
.physical-table.cleaning .phys-seg{
 background:repeating-linear-gradient(135deg,#f8fafc,#f8fafc 8px,#dbe2ea 8px,#dbe2ea 12px)!important;
 color:#111827!important
}
.table-btn.used{background:var(--used);border-color:#ef4444}

.pair-card{
  grid-column:span 2;
  border:1px dashed #9ca3af;
  border-radius:9px;
  padding:4px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  position:relative;
}
.pair-card.merged{
  grid-template-columns:1fr auto;
  background:#eff6ff;
  border-style:solid;
  border-color:#60a5fa;
}
.pair-action{
  position:absolute;
  right:3px;
  bottom:3px;
  font-size:9px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:6px;
  padding:2px 4px;
}
.pair-card.merged .pair-action{position:static}

.empty-note{
  grid-column:1/-1;
  text-align:center;
  padding:12px;
  color:var(--muted);
  font-size:12px;
}

.manual-row{
  display:flex;
  gap:4px;
  align-items:center;
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:none;
}
.manual-row::-webkit-scrollbar{display:none}
.manual-row button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
}
.manual-row button.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}
.manual-row .confirm{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.manual-row .confirm:disabled{opacity:.35}
.manual-info{
  flex:0 0 auto;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
}
.table-btn.manual-selected{
  outline:4px solid var(--accent);
  outline-offset:-4px;
}
.manual-groups{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.manual-group{
  position:relative;
  width:100%;
  min-height:54px;
  border:3px solid var(--accent);
  border-radius:9px;
  background:#eff6ff;
  padding:7px 34px 7px 8px;
  text-align:left;
  font-weight:900;
}
.manual-group.reserved{background:var(--reserved);border-color:#f59e0b}
.manual-group.used{background:var(--used);border-color:#ef4444}
.manual-group small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}
.manual-release{
  position:absolute;
  right:5px;
  top:5px;
  width:25px;
  height:25px;
  border:1px solid #dc2626;
  background:#fff;
  color:#b91c1c;
  border-radius:6px;
  font-weight:900;
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  opacity:0;
  transition:.2s;
  z-index:200;
}
.toast.show{opacity:1}

@media(max-width:390px){
  main{padding-top:356px}
  .table-grid{gap:4px}
  .table-btn{min-height:44px;font-size:13px}
}

/* ===== 配置編集追加 ===== */
.cfg-top-actions{display:flex;gap:4px;align-items:center}
.cfg-top-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:900}
.cfg-top-btn.add{background:var(--accent);color:#fff;border-color:var(--accent)}
.cfg-bg{position:fixed;inset:0;background:rgba(15,23,42,.38);display:none;z-index:1000;align-items:center;justify-content:center;padding:12px}
.cfg-bg.show{display:flex}
.cfg-modal{width:min(94vw,420px);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 18px 55px rgba(0,0,0,.25)}
.cfg-modal h3{margin:0 0 9px;font-size:16px}
.cfg-field{border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:8px}
.cfg-field label{display:block;font-size:10px;color:var(--muted);font-weight:900;margin-bottom:4px}
.cfg-field input,.cfg-field select{width:100%;border:0;outline:0;background:transparent;font:inherit;font-weight:900}
.cfg-row{display:grid;grid-template-columns:1fr 34px 36px 34px;gap:5px;align-items:center;margin:5px 0}
.cfg-row button{height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:950}
.cfg-num{text-align:center;font-weight:950}
.cfg-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cfg-sum{border:1px solid var(--line);border-radius:8px;background:#f8fafc;text-align:center;padding:6px}
.cfg-sum small{display:block;font-size:9px;color:var(--muted)}.cfg-sum b{font-size:15px}
.cfg-preview{display:flex;gap:0;height:44px;margin-top:7px;border:2px solid #64748b;border-radius:7px;overflow:hidden}
.cfg-pseg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:950;border-right:2px solid #475569;min-width:34px;background:#fff}
.cfg-pseg:last-child{border-right:0}
.cfg-actions{display:flex;gap:7px;margin-top:9px}
.cfg-actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font-weight:900}
.cfg-actions .save{background:var(--accent);color:#fff;border-color:var(--accent)}
.cfg-delete{width:100%;margin-top:10px;border:1px solid #ef4444;background:#fff;color:#b91c1c;border-radius:9px;padding:8px;font-weight:900}
.cfg-error{min-height:16px;color:#b91c1c;font-size:11px;font-weight:800}
.cfg-members{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;min-height:28px}
.cfg-chip{border:1px solid #93c5fd;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
.cfg-chip button{border:0;background:transparent;color:#b91c1c;font-weight:950;padding:0 0 0 4px}
.cfg-add-member{display:grid;grid-template-columns:1fr auto;gap:6px}
.cfg-add-member input{border:1px solid var(--line);border-radius:8px;padding:7px;font-weight:900}
.cfg-add-member button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-weight:900}

/* Vật lý: vạch chia chạy trọn chiều cao như 1F */
.table-btn.physical{padding:0!important;overflow:hidden!important;display:flex!important;position:relative}
.table-btn.physical .phys-seg{
  height:100%;min-height:46px;display:flex;align-items:center;justify-content:center;
  border-right:3px solid #475569;font-size:9px;font-weight:950;min-width:0
}
.table-btn.physical .phys-seg:last-of-type{border-right:0}
.table-btn.physical .phys-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;font-weight:950;text-shadow:0 1px 0 rgba(255,255,255,.95)
}
.table-btn.physical .phys-overlay small{font-size:9px;color:#475569;margin-top:1px}


.cfg-group-quick{margin-top:7px}
.cfg-group-quick-title{font-size:10px;color:var(--muted);font-weight:900;margin-bottom:4px}
.cfg-group-buttons{display:flex;gap:5px;flex-wrap:wrap}
.cfg-group-btn{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}


/* ===== common horizontal scroll controls ===== */
.cfg-scroll-wrap{
  display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:5px;align-items:stretch
}
.cfg-scroll-arrow{
  border:1px solid var(--line);background:#fff;border-radius:8px;font-size:20px;font-weight:900;touch-action:manipulation
}
.cfg-scroll-arrow:disabled{opacity:.3}
.row-scroll,.cluster-strip,.renban-options{
  min-width:0!important;width:100%!important;display:flex!important;flex-wrap:nowrap!important;
  overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch!important;
  overscroll-behavior-x:contain!important;touch-action:pan-x!important;scroll-behavior:smooth!important
}
.row-scroll &gt; *,.cluster-strip &gt; *,.renban-options &gt; *{flex-shrink:0!important}


/* ===== 2F horizontal UI standard ===== */
#peopleRow,
#clusterStrip,
#renbanOptions{
  min-width:0!important;
  width:100%!important;
  display:flex!important;
  flex-wrap:nowrap!important;
  overflow-x:auto!important;
  overflow-y:hidden!important;
  -webkit-overflow-scrolling:touch!important;
  overscroll-behavior-x:contain!important;
  touch-action:pan-x!important;
  scrollbar-width:auto!important;
  padding-bottom:6px!important;
}
#peopleRow &gt; *,
#clusterStrip &gt; *,
#renbanOptions &gt; *{
  flex-shrink:0!important;
}
#peopleRow::-webkit-scrollbar,
#clusterStrip::-webkit-scrollbar,
#renbanOptions::-webkit-scrollbar{
  height:7px!important;
  display:block!important;
}
#peopleRow::-webkit-scrollbar-thumb,
#clusterStrip::-webkit-scrollbar-thumb,
#renbanOptions::-webkit-scrollbar-thumb{
  background:#9ca3af!important;
  border-radius:999px!important;
}
#peopleRow::-webkit-scrollbar-track,
#clusterStrip::-webkit-scrollbar-track,
#renbanOptions::-webkit-scrollbar-track{
  background:#eef2f7!important;
  border-radius:999px!important;
}


/* ===== 2F final horizontal UI: scrollbar only, no arrow buttons ===== */
#peopleRow,
#clusterStrip,
#renbanOptions{
  min-width:0!important;
  width:100%!important;
  display:flex!important;
  flex-wrap:nowrap!important;
  overflow-x:auto!important;
  overflow-y:hidden!important;
  -webkit-overflow-scrolling:touch!important;
  overscroll-behavior-x:contain!important;
  touch-action:pan-x!important;
  scrollbar-width:auto!important;
  padding-bottom:6px!important;
}
#peopleRow &gt; *,
#clusterStrip &gt; *,
#renbanOptions &gt; *{
  flex-shrink:0!important;
}
#peopleRow::-webkit-scrollbar,
#clusterStrip::-webkit-scrollbar,
#renbanOptions::-webkit-scrollbar{
  height:8px!important;
  display:block!important;
}
#peopleRow::-webkit-scrollbar-thumb,
#clusterStrip::-webkit-scrollbar-thumb,
#renbanOptions::-webkit-scrollbar-thumb{
  background:#9ca3af!important;
  border-radius:999px!important;
}
#peopleRow::-webkit-scrollbar-track,
#clusterStrip::-webkit-scrollbar-track,
#renbanOptions::-webkit-scrollbar-track{
  background:#eef2f7!important;
  border-radius:999px!important;
}



/* ===== REBUILT 2F: 1F visual/editing standard, 2F route logic ===== */
:root{
  --empty2:#eadcff;
  --empty4:#dcecff;
  --empty6:#d9f3e4;
  --emptybox:#ffe8cc;
  --reserved:#ffe49a;
  --used:#ef6b73;
}
/* Native scrollbar only. NO separate white arrow buttons. */
#peopleRow,#clusterStrip,#renbanOptions,.row-scroll{
  overflow-x:auto!important; overflow-y:hidden!important; flex-wrap:nowrap!important;
  -webkit-overflow-scrolling:touch!important; scrollbar-width:auto!important;
  padding-bottom:6px!important;
}
#peopleRow::-webkit-scrollbar,#clusterStrip::-webkit-scrollbar,#renbanOptions::-webkit-scrollbar,.row-scroll::-webkit-scrollbar{height:8px!important;display:block!important}
#peopleRow::-webkit-scrollbar-thumb,#clusterStrip::-webkit-scrollbar-thumb,#renbanOptions::-webkit-scrollbar-thumb,.row-scroll::-webkit-scrollbar-thumb{background:#9ca3af!important;border-radius:999px!important}
#peopleRow::-webkit-scrollbar-track,#clusterStrip::-webkit-scrollbar-track,#renbanOptions::-webkit-scrollbar-track,.row-scroll::-webkit-scrollbar-track{background:#eef2f7!important;border-radius:999px!important}
.scroll-arrow,.cfg-scroll-arrow,.renban-scroll-wrap&gt;.scroll-arrow{display:none!important}
.renban-scroll-wrap{display:block!important}

/* Physical table sizing = 1F seat-width units (52px each). */
.table-grid{display:flex!important;flex-wrap:wrap!important;align-items:flex-start!important;gap:10px 7px!important}
.table-btn{flex:0 0 auto!important;width:52px;min-width:52px;height:52px;min-height:52px;border:2px solid #64748b;border-radius:4px;padding:2px;background:#fff}
.table-btn.single-cap4{width:111px;min-width:111px;background:var(--empty4)!important}
.table-btn.single-cap6{width:170px;min-width:170px;background:var(--empty6)!important;border-width:3px}
.table-btn.single-box{width:52px;min-width:52px;background:var(--emptybox)!important;border-width:3px}
.table-btn.single-cap2{background:var(--empty2)!important}
.table-btn.reserved,.physical-table.reserved{background:var(--reserved)!important;color:#111827!important}
.table-btn.used,.physical-table.used{background:var(--used)!important;color:#fff!important}
.table-btn.cleaning,.physical-table.cleaning{background:repeating-linear-gradient(135deg,rgba(255,255,255,.92) 0 8px,rgba(148,163,184,.35) 8px 16px)!important;color:#111827!important}

.composite-card{position:relative;display:flex;align-items:stretch;height:52px;flex:0 0 auto;margin-bottom:10px}
.physical-table{height:52px;padding:0;border:3px solid #047857;border-radius:4px;overflow:hidden;display:flex;position:relative;background:#fff;font:inherit;font-weight:900}
.physical-table .phys-seg{height:100%;min-width:0;display:flex;align-items:center;justify-content:center;border-right:2px solid #64748b;font-size:9px;font-weight:950}
.physical-table .phys-seg:last-of-type{border-right:0}
.physical-table .phys-seg.cap2{background:var(--empty2)}
.physical-table .phys-seg.cap4{background:var(--empty4)}
.physical-table .phys-seg.cap6{background:var(--empty6)}
.physical-table .phys-seg.capbox{background:var(--emptybox)}
.physical-table.reserved .phys-seg{background:var(--reserved)!important}
.physical-table.used .phys-seg{background:var(--used)!important;color:#fff!important}
.physical-table.cleaning .phys-seg{background:repeating-linear-gradient(135deg,rgba(255,255,255,.92) 0 8px,rgba(148,163,184,.35) 8px 16px)!important}
.physical-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.9)}
.physical-overlay small{font-size:9px;color:#475569}
.composite-toggle{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:5;border:1px solid #64748b;background:#fff;border-radius:999px;padding:1px 7px;font-size:9px;font-weight:900;white-space:nowrap}

.quick-rename-input{width:calc(100% - 6px);height:28px;margin:2px 3px;padding:2px 4px;border:2px solid #2563eb;border-radius:4px;background:#fff;font:inherit;font-weight:900;text-align:center;text-transform:uppercase;box-sizing:border-box}

&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;

  const STORAGE_KEY = &quot;sekifuri-2f-cleaning-final-v13-cleaning-renban&quot;;
  const PREVIOUS_STORAGE_KEY = &quot;sekifuri-2f-v27-priority-route&quot;;
  if(!localStorage.getItem(STORAGE_KEY) &amp;&amp; localStorage.getItem(PREVIOUS_STORAGE_KEY)){
    localStorage.setItem(STORAGE_KEY, localStorage.getItem(PREVIOUS_STORAGE_KEY));
  }

  const fixedTables = {
    &quot;S1&quot;:2,&quot;S2&quot;:2,&quot;S3&quot;:2,&quot;S4&quot;:2,&quot;S5&quot;:2,
    &quot;80&quot;:6,&quot;81&quot;:6,
    &quot;90&quot;:6,&quot;91&quot;:4,&quot;92&quot;:6,&quot;93&quot;:4,&quot;94&quot;:6,&quot;95&quot;:4,&quot;96&quot;:4,
    &quot;97&quot;:2,&quot;98&quot;:2,&quot;99&quot;:2,&quot;100&quot;:2,&quot;101&quot;:2,
    &quot;C1&quot;:6,&quot;C2&quot;:6,&quot;C3&quot;:6,&quot;C4&quot;:6,&quot;C5&quot;:6,&quot;C6&quot;:6,
    &quot;C7&quot;:&quot;BOX&quot;,&quot;C8&quot;:&quot;BOX&quot;,
    &quot;D1&quot;:&quot;BOX&quot;,&quot;D2&quot;:&quot;BOX&quot;,&quot;D3&quot;:&quot;BOX&quot;,&quot;D4&quot;:&quot;BOX&quot;,
    &quot;D5&quot;:&quot;BOX&quot;,&quot;D6&quot;:&quot;BOX&quot;,&quot;D7&quot;:&quot;BOX&quot;,&quot;D8&quot;:&quot;BOX&quot;,
    &quot;D9&quot;:6,&quot;D10&quot;:4,&quot;D11&quot;:4
  };

  const pairPrefixes = [&quot;82&quot;,&quot;83&quot;,&quot;84&quot;,&quot;85&quot;,&quot;86&quot;,&quot;87&quot;,&quot;88&quot;];


  /* ===== cấu hình động demo ===== */
  const cfgTypes=[
    {key:&quot;2&quot;,label:&quot;2人卓&quot;,cap:2},
    {key:&quot;4&quot;,label:&quot;4人卓&quot;,cap:4},
    {key:&quot;6&quot;,label:&quot;6人卓&quot;,cap:6},
    {key:&quot;BOX&quot;,label:&quot;BOX&quot;,cap:7}
  ];
  const cfgAreaRoute=[&quot;8&quot;,&quot;C&quot;,&quot;S&quot;,&quot;9&quot;,&quot;D&quot;];

  /* Giữ thứ tự tuyến gốc tuyệt đối, không thay đổi khi đổi loại bàn. */
  const cfgBaseRoute = [
    &quot;80&quot;,&quot;81&quot;,&quot;82&quot;,&quot;83&quot;,&quot;84&quot;,&quot;85&quot;,&quot;86&quot;,&quot;87&quot;,&quot;88&quot;,
    &quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;,&quot;C7&quot;,&quot;C8&quot;,
    &quot;S1&quot;,&quot;S2&quot;,&quot;S3&quot;,&quot;S4&quot;,&quot;S5&quot;,
    &quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;,&quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
    &quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;,&quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;
  ];
  const cfgRouteRank = Object.fromEntries(cfgBaseRoute.map((id,i)=&gt;[id,i]));
  let cfgNextRouteRank = cfgBaseRoute.length;

  function cfgRank(id){
    return cfgRouteRank[id] ?? (1000 + (cfgAreaRoute.indexOf(cfgAreaOf(id))&lt;0?99:cfgAreaRoute.indexOf(cfgAreaOf(id))*100) + cfgNum(id));
  }

  /* identity-level structure */
  const cfgStructures={};
  Object.entries(fixedTables).forEach(([id,cap])=&gt;{
    cfgStructures[id]=cap===&quot;BOX&quot;
      ? {&quot;2&quot;:0,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:1}
      : {&quot;2&quot;:0,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:0,[String(cap)]:1};
  });
  pairPrefixes.forEach(id=&gt;cfgStructures[id]={&quot;2&quot;:2,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:0});

  function cfgAreaOf(id){
    id=String(id);
    if(/^S/.test(id))return &quot;S&quot;;
    if(/^C/.test(id))return &quot;C&quot;;
    if(/^D/.test(id))return &quot;D&quot;;
    if(/^\d+$/.test(id))return Number(id)&gt;=90?&quot;9&quot;:&quot;8&quot;;
    return &quot;&quot;;
  }
  function cfgNum(id){const m=String(id).match(/\d+/);return m?Number(m[0]):99999}
  function cfgCompare(a,b){
    const ra=cfgRank(a),rb=cfgRank(b);
    if(ra!==rb)return ra-rb;
    return String(a).localeCompare(String(b),&quot;ja&quot;,{numeric:true});
  }
  function cfgRouteBase(id){
    id=String(id);
    if(/AB$/.test(id))return id.slice(0,-2);
    if(/[AB]$/.test(id)){
      const p=id.slice(0,-1);
      if(pairPrefixes.includes(p))return p;
    }
    return id;
  }
  function cfgRouteSuffixRank(id){
    id=String(id);
    if(/A$/.test(id)&amp;&amp;!(/AB$/.test(id)))return 0;
    if(/B$/.test(id)&amp;&amp;!(/AB$/.test(id)))return 1;
    if(/AB$/.test(id))return 2;
    return 0;
  }
  function cfgRouteIdCompare(a,b){
    const ba=cfgRouteBase(a),bb=cfgRouteBase(b);
    const r=cfgCompare(ba,bb);
    if(r)return r;
    return cfgRouteSuffixRank(a)-cfgRouteSuffixRank(b);
  }
  function cfgMetric(c){
    let max=0,physical=0;
    cfgTypes.forEach(t=&gt;{const n=c[t.key]||0;max+=n*t.cap;physical+=n});
    return {max,physical};
  }

  /* Renban groups at identity level.
     80-81 riêng, 82-88 riêng vì cầu thang ở giữa. */
  let cfgRenbanGroups=[
    [&quot;80&quot;,&quot;81&quot;],
    [&quot;82&quot;,&quot;83&quot;,&quot;84&quot;,&quot;85&quot;,&quot;86&quot;,&quot;87&quot;,&quot;88&quot;],
    [&quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;],
    [&quot;C7&quot;,&quot;C8&quot;],
    [&quot;S1&quot;,&quot;S2&quot;,&quot;S3&quot;,&quot;S4&quot;,&quot;S5&quot;],
    [&quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;],
    [&quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;],
    [&quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;],
    [&quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;]
  ];

  function cfgGroupOf(id){
    id=String(id).replace(/AB$/,&quot;&quot;).replace(/[AB]$/,&quot;&quot;);
    return cfgRenbanGroups.find(g=&gt;g.includes(id))||null;
  }
  function cfgExpandIdentity(id){
    if(pairPrefixes.includes(id)){
      return appState.merged[id]?[id+&quot;AB&quot;]:[id+&quot;A&quot;,id+&quot;B&quot;];
    }
    return [id];
  }
  function cfgExpandedRows(){

  function bindLongPress(btn,id){
    let timer=null, held=false, suppressClick=false, startX=0, startY=0;
    const begin=(x,y)=&gt;{

      clearTimeout(timer);

    };
    const move=(x,y)=&gt;{
      if(Math.abs(x-startX)&gt;12 || Math.abs(y-startY)&gt;12){
        clearTimeout(timer); timer=null;
      }
    };
    const end=()=&gt;{ clearTimeout(timer); timer=null; };

    btn.addEventListener(&quot;touchstart&quot;,e=&gt;{const t=e.touches[0];begin(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchmove&quot;,e=&gt;{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchend&quot;,e=&gt;{end();if(held)e.preventDefault()},{passive:false});
    btn.addEventListener(&quot;touchcancel&quot;,end);

    btn.addEventListener(&quot;mousedown&quot;,e=&gt;{if(e.button===0)begin(e.clientX,e.clientY)});
    btn.addEventListener(&quot;mousemove&quot;,e=&gt;move(e.clientX,e.clientY));
    btn.addEventListener(&quot;mouseup&quot;,end);
    btn.addEventListener(&quot;mouseleave&quot;,end);

    btn.addEventListener(&quot;click&quot;,e=&gt;{
      if(suppressClick){
        suppressClick=false;
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    },true);
    btn.addEventListener(&quot;contextmenu&quot;,e=&gt;e.preventDefault());
  }
