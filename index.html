 .title{font-size:14px;padding-top:5px}

      const ranks = group.ids.map(recommendationIdRank).filter(Number.isFinite);

      .flatMap(id =&gt; {

  const renbanGroups = [
    [&quot;80&quot;,&quot;81&quot;],
    [&quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;],
    [&quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;],
    [&quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;],
    [&quot;C7&quot;,&quot;C8&quot;],
    [&quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;],
    [&quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;]
  ];

  /*
    手動連結卓の表示順。
    作成した順番ではなく、もとの卓位置に従って必ず並べる。
  */
  const pairRouteIds = pairPrefixes.flatMap(prefix =&gt; [
    prefix + &quot;A&quot;, prefix + &quot;B&quot;, prefix + &quot;AB&quot;
  ]);

  const manualOrderByCapacity = {
    2: [
      ...pairRouteIds,
      &quot;S1&quot;,&quot;S2&quot;,&quot;S3&quot;,&quot;S4&quot;,&quot;S5&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;
    ],
    4: [
      ...pairRouteIds,
      &quot;91&quot;,&quot;93&quot;,&quot;95&quot;,&quot;96&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
      &quot;D10&quot;,&quot;D11&quot;
    ],
    6: [
      &quot;80&quot;,&quot;81&quot;,
      ...pairRouteIds,
      &quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;,
      &quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
      &quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;
    ],
    large: [
      &quot;80&quot;,&quot;81&quot;,
      ...pairRouteIds,
      &quot;C1&quot;,&quot;C2&quot;,&quot;C3&quot;,&quot;C4&quot;,&quot;C5&quot;,&quot;C6&quot;,&quot;C7&quot;,&quot;C8&quot;,
      &quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;,
      &quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;,
      &quot;D1&quot;,&quot;D2&quot;,&quot;D3&quot;,&quot;D4&quot;,&quot;D5&quot;,&quot;D6&quot;,&quot;D7&quot;,&quot;D8&quot;,&quot;D9&quot;,&quot;D10&quot;,&quot;D11&quot;
    ]
  };

  function manualGroupRank(group, capacityKey){
    const route = manualOrderByCapacity[capacityKey] || manualOrderByCapacity.large;
    const indexes = group.ids
      .map(id =&gt; route.indexOf(id))
      .filter(index =&gt; index &gt;= 0);

    return indexes.length ? Math.min(...indexes) : Number.MAX_SAFE_INTEGER;
  }

  function sortedManualGroups(groups, capacityKey){
    return [...groups].sort((a,b) =&gt; {
      const rankDiff = manualGroupRank(a, capacityKey) - manualGroupRank(b, capacityKey);
      if(rankDiff !== 0) return rankDiff;

      const aLabel = a.ids.join(&quot;・&quot;);
      const bLabel = b.ids.join(&quot;・&quot;);
      return aLabel.localeCompare(bLabel, &quot;ja&quot;);
    });
  }

  let appState = loadState();
  let selectedStatus = &quot;reserved&quot;;
  let tableView = &quot;all&quot;;
  let peopleFilter = &quot;all&quot;;
  let manualMode = false;
  let manualSelected = new Set();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        states: parsed.states || {},
        merged: parsed.merged || {},
        groups: parsed.groups || []
      };
    }catch{
      return {states:{}, merged:{}, groups:[]};
    }
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  }


  function groupFor(id){
    return appState.groups.find(group =&gt; group.id === id || group.ids.includes(id));
  }

  function isGrouped(id){
    return Boolean(groupFor(id));
  }

  function isAvailable(id){
    const virtualGroup = appState.groups.some(group =&gt; group.id === id);
    return getStatus(id) === &quot;empty&quot; &amp;&amp; (virtualGroup || !isGrouped(id));
  }

  function activePairRow(){
    return pairPrefixes.flatMap(prefix =&gt;
      appState.merged[prefix]
        ? [prefix + &quot;AB&quot;]
        : [prefix + &quot;A&quot;, prefix + &quot;B&quot;]
    );
  }

  function recommendationRows(){
    return [activePairRow(), ...renbanGroups];
  }

  function manualRows(){
    return recommendationRows();
  }

  function sortedManualSelection(){
    const ids = [...manualSelected];
    for(const row of manualRows()){
      if(ids.every(id =&gt; row.includes(id))){
        return ids.sort((a,b) =&gt; row.indexOf(a) - row.indexOf(b));
      }
    }
    return ids;
  }

  function validManualSelection(){
    if(manualSelected.size &lt; 2) return false;

    const ids = [...manualSelected];
    return manualRows().some(row =&gt; {
      const indexes = ids.map(id =&gt; row.indexOf(id));
      if(indexes.some(index =&gt; index &lt; 0)) return false;
      indexes.sort((a,b) =&gt; a-b);
      return indexes.every((value,index) =&gt;
        index === 0 || value === indexes[index - 1] + 1
      );
    });
  }

  function currentTables(){
    const tables = {...fixedTables};
    pairPrefixes.forEach(prefix =&gt; {
      if(appState.merged[prefix]){
        tables[prefix + &quot;AB&quot;] = 4;
      }else{
        tables[prefix + &quot;A&quot;] = 2;
        tables[prefix + &quot;B&quot;] = 2;
      }
    });

    appState.groups.forEach(group =&gt; {
      const total = group.capacity || group.ids.reduce((sum,id) =&gt; {
        const capacity = tables[id];
        return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
      },0);
      group.capacity = total;
      tables[group.id] = total;
    });

    return tables;
  }

  function getStatus(id){
    const group = appState.groups.find(item =&gt; item.id === id);
    if(group) return group.state || &quot;empty&quot;;
    return appState.states[id] || &quot;empty&quot;;
  }

  function setStatus(ids){
    const expanded = new Set();

    ids.forEach(id =&gt; {
      const group = groupFor(id);
      (group ? group.ids : [id]).forEach(groupId =&gt; expanded.add(groupId));
    });

    [...expanded].forEach(id =&gt; {
      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

  function statusLabel(value){
    if(value === &quot;reserved&quot;) return &quot;席取り&quot;;
    if(value === &quot;used&quot;) return &quot;使用中&quot;;
    return &quot;空席&quot;;
  }

  function capacityClass(capacity){
    if(capacity === &quot;BOX&quot;) return &quot;cbox&quot;;
    return &quot;c&quot; + capacity;
  }

  function createTableButton(id, capacity){
    const btn = document.createElement(&quot;button&quot;);
    btn.className = &quot;table-btn &quot; + capacityClass(capacity) + &quot; &quot; + getStatus(id);
    if(manualSelected.has(id)) btn.classList.add(&quot;manual-selected&quot;);

    btn.innerHTML = id + &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + (capacity === &quot;BOX&quot; ? &quot;B&quot; : capacity) + &quot;&lt;/span&gt;&quot;;

    btn.addEventListener(&quot;click&quot;, () =&gt; {
      if(!manualMode){
        setStatus([id]);
        return;
      }

      if(getStatus(id) !== &quot;empty&quot;){
        showToast(&quot;空席の卓だけ選択できます&quot;);
        return;
      }

      if(isGrouped(id)){
        showToast(&quot;すでに手動連結されています&quot;);
        return;
      }

      if(manualSelected.has(id)){
        manualSelected.delete(id);
      }else{
        manualSelected.add(id);
      }

      renderAll();
    });

    return btn;
  }


  function createManualGroupCard(group){
    const wrap = document.createElement(&quot;div&quot;);
    wrap.className = &quot;pair-card merged&quot;;

    const table = createTableButton(group.id, group.capacity);
    table.innerHTML =
      group.ids.join(&quot;・&quot;) +
      &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + group.capacity + &#x27;&lt;/span&gt;&#x27;;
    wrap.appendChild(table);

    const release = document.createElement(&quot;button&quot;);
    release.className = &quot;pair-action&quot;;
    release.textContent = &quot;解除&quot;;
    release.addEventListener(&quot;click&quot;, event =&gt; {
      event.stopPropagation();
      releaseManualGroup(group.id);
    });
    wrap.appendChild(release);

    return wrap;
  }

  function togglePair(prefix){
    const relatedIds = [prefix + &quot;AB&quot;, prefix + &quot;A&quot;, prefix + &quot;B&quot;];
    if(relatedIds.some(isGrouped)){
      showToast(&quot;先に手動連結を解除してください&quot;);
      return;
    }

    if(appState.merged[prefix]){
      const mergedId = prefix + &quot;AB&quot;;
      const oldStatus = getStatus(mergedId);

      delete appState.states[mergedId];
      appState.merged[prefix] = false;

      if(oldStatus !== &quot;empty&quot;){
        appState.states[prefix + &quot;A&quot;] = oldStatus;
        appState.states[prefix + &quot;B&quot;] = oldStatus;
      }
    }else{
      const aId = prefix + &quot;A&quot;;
      const bId = prefix + &quot;B&quot;;
      const aStatus = getStatus(aId);
      const bStatus = getStatus(bId);

      delete appState.states[aId];
      delete appState.states[bId];
      appState.merged[prefix] = true;

      const mergedId = prefix + &quot;AB&quot;;
      if(aStatus === &quot;used&quot; || bStatus === &quot;used&quot;){
        appState.states[mergedId] = &quot;used&quot;;
      }else if(aStatus === &quot;reserved&quot; || bStatus === &quot;reserved&quot;){
        appState.states[mergedId] = &quot;reserved&quot;;
      }
    }

    saveState();
    renderAll();
  }

  function createPairCard(prefix){
    const wrap = document.createElement(&quot;div&quot;);

    if(appState.merged[prefix]){
      wrap.className = &quot;pair-card merged&quot;;
      wrap.appendChild(createTableButton(prefix + &quot;AB&quot;, 4));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;分割&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }else{
      wrap.className = &quot;pair-card&quot;;
      wrap.appendChild(createTableButton(prefix + &quot;A&quot;, 2));
      wrap.appendChild(createTableButton(prefix + &quot;B&quot;, 2));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;連結&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }

    return wrap;
  }

  function countFree(ids){
    return ids.filter(id =&gt; getStatus(id) === &quot;empty&quot;).length;
  }

  function createSection(title, ids, pairMode){
    const section = document.createElement(&quot;section&quot;);
    section.className = &quot;card&quot;;

    let freeCount = ids.filter(id =&gt; !isGrouped(id) &amp;&amp; getStatus(id) === &quot;empty&quot;).length;
    const sectionCapacity = Number(title.replace(&quot;人卓&quot;,&quot;&quot;));
    const manualGroups = appState.groups.filter(group =&gt;
      group.capacity &lt;= 6 &amp;&amp; group.capacity === sectionCapacity
    );
    freeCount += manualGroups.filter(group =&gt; getStatus(group.id) === &quot;empty&quot;).length;

    if(pairMode === &quot;split-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(!appState.merged[prefix]){
          if(!isGrouped(prefix + &quot;A&quot;) &amp;&amp; getStatus(prefix + &quot;A&quot;) === &quot;empty&quot;) freeCount++;
          if(!isGrouped(prefix + &quot;B&quot;) &amp;&amp; getStatus(prefix + &quot;B&quot;) === &quot;empty&quot;) freeCount++;
        }
      });
    }

    if(pairMode === &quot;merged-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(appState.merged[prefix] &amp;&amp; !isGrouped(prefix + &quot;AB&quot;) &amp;&amp; getStatus(prefix + &quot;AB&quot;) === &quot;empty&quot;){
          freeCount++;
        }
      });
    }

    section.innerHTML =
      &#x27;&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;&#x27; + title + &#x27;&lt;/span&gt;&lt;span&gt;空き &#x27; + freeCount + &quot;&lt;/span&gt;&lt;/div&gt;&quot;;

    const grid = document.createElement(&quot;div&quot;);
    grid.className = &quot;table-grid&quot;;
    const tables = currentTables();
    const renderedGroups = new Set();

    const route = manualOrderByCapacity[sectionCapacity] || ids;
    const orderedGroups = sortedManualGroups(manualGroups, sectionCapacity);

    function groupAt(id){
      return orderedGroups.find(group =&gt;
        !renderedGroups.has(group.id) &amp;&amp; group.ids.includes(id)
      );
    }

    route.forEach(routeId =&gt; {
      const group = groupAt(routeId);
      if(group){
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
        return;
      }

      const pairPrefix = pairPrefixes.find(prefix =&gt;
        routeId === prefix + &quot;A&quot; ||
        routeId === prefix + &quot;B&quot; ||
        routeId === prefix + &quot;AB&quot;
      );

      if(pairPrefix){
        if(
          pairMode === &quot;split-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;A&quot; &amp;&amp;
          !appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;A&quot;) &amp;&amp;
          !isGrouped(pairPrefix + &quot;B&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }

        if(
          pairMode === &quot;merged-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;AB&quot; &amp;&amp;
          appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;AB&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }
        return;
      }

      if(ids.includes(routeId) &amp;&amp; !isGrouped(routeId)){
        grid.appendChild(createTableButton(routeId, tables[routeId]));
      }
    });

    /*
      念のため、順序表にない卓が追加された場合だけ最後に表示する。
      現在の卓構成では通常ここには入らない。
    */
    orderedGroups
      .filter(group =&gt; !renderedGroups.has(group.id))
      .forEach(group =&gt; {
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
      });

    ids
      .filter(id =&gt; !route.includes(id) &amp;&amp; !isGrouped(id))
      .forEach(id =&gt; grid.appendChild(createTableButton(id, tables[id])));

    if(!grid.children.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;この種類の卓はありません。&quot;;
      grid.appendChild(empty);
    }

    section.appendChild(grid);
    return section;
  }

  function renderTables(){
    const area = document.getElementById(&quot;tableArea&quot;);
    area.innerHTML = &quot;&quot;;

    if(tableView === &quot;all&quot; || tableView === &quot;2&quot;){
      area.appendChild(createSection(&quot;2人卓&quot;, twoFixedOrder, &quot;split-first&quot;));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;4&quot;){
      area.appendChild(createSection(&quot;4人卓&quot;, fourFixedOrder, &quot;merged-first&quot;));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;6&quot;){
      area.appendChild(createSection(&quot;6人卓&quot;, sixOrder, null));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;BOX&quot;){
      area.appendChild(createSection(&quot;BOX&quot;, boxOrder, null));
    }
  }

  function maximalEmptyRuns(){
    const tables = currentTables();
    const runs = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          let total = 0;
          let allBox = true;

          run.forEach(id =&gt; {
            if(tables[id] === &quot;BOX&quot;){
              total += 7;
            }else{
              allBox = false;
              total += Number(tables[id]);
            }
          });

          runs.push({
            ids:[...run],
            label: run.length === 2 ? run.join(&quot;・&quot;) : run[0] + &quot;〜&quot; + run[run.length - 1],
            max:total,
            allBox
          });
        }
        run = [];
      };

      group.forEach(id =&gt; {
        if(isAvailable(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    return runs;
  }

  function renderClusterStrip(){
    const strip = document.getElementById(&quot;clusterStrip&quot;);
    strip.innerHTML = &quot;&quot;;

    const runs = maximalEmptyRuns();

    if(!runs.length){
      const chip = document.createElement(&quot;span&quot;);
      chip.className = &quot;cluster-chip disabled&quot;;
      chip.textContent = &quot;空いている連続卓はありません&quot;;
      strip.appendChild(chip);
      return;
    }

    runs.forEach(run =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;cluster-chip&quot;;
      btn.innerHTML =
        run.label +
        &quot;&lt;small&gt;&quot; +
        (run.allBox ? &quot;BOX×&quot; + run.ids.length : run.max + &quot;名 max&quot;) +
        &quot;&lt;/small&gt;&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; {
        peopleFilter = &quot;all&quot;;
        renderPeopleRow();
        renderRenbanOptions();
        document.getElementById(&quot;renbanOptions&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;start&quot;});
        showToast(&quot;空き連番: &quot; + run.label);
      });
      strip.appendChild(btn);
    });
  }

  function allRenbanOptions(){
    const tables = currentTables();
    const options = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          for(let start = 0; start &lt; run.length; start++){
            let capacity = 0;

            for(let end = start; end &lt; run.length; end++){
              const ids = run.slice(start, end + 1);
              const cap = tables[run[end]];

              if(cap === &quot;BOX&quot;){
                if(ids.length === 1) continue;

                if(ids.length === 2){
                  [9,10,11,12,13,14].forEach(pax =&gt; {
                    options.push({
                      ids,
                      pax,
                      capacity:14,
                      low:pax !== 14,
                      box:true
                    });
                  });
                }
              }else{
                capacity += Number(cap);

                if(end &gt; start){
                  options.push({
                    ids,
                    pax:capacity,
                    capacity,
                    low:false,
                    box:false
                  });
                }
              }
            }
          }
        }

        run = [];
      };

      group.forEach(id =&gt; {
        if(isAvailable(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 単卓もおすすめ候補に含める。
       2名なら空いている2人卓、4名なら4人卓、6名なら6人卓を最優先にできる。 */
    Object.keys(tables)
      .filter(id =&gt; tables[id] !== &quot;BOX&quot; &amp;&amp; isAvailable(id))
      .forEach(id =&gt; {
        const capacity = Number(tables[id]);
        if(capacity &gt; 0){
          options.push({
            ids:[id],
            pax:capacity,
            capacity,
            low:false,
            box:false
          });
        }
      });

    Object.keys(tables)
      .filter(id =&gt; tables[id] === &quot;BOX&quot; &amp;&amp; isAvailable(id))
      .forEach(id =&gt; {
        options.push({ids:[id], pax:7, capacity:7, low:false, box:true});
        options.push({ids:[id], pax:8, capacity:7, low:true, box:true});
      });

    const seen = new Set();

    return options
      .filter(option =&gt; {
        const key = option.pax + &quot;|&quot; + option.ids.join(&quot;-&quot;);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a,b) =&gt;
        a.pax - b.pax ||
        Number(a.low) - Number(b.low) ||
        a.ids.length - b.ids.length
      );
  }

  function renderPeopleRow(){
    const row = document.getElementById(&quot;peopleRow&quot;);
    row.innerHTML = &quot;&quot;;

    const capacities = [...new Set(allRenbanOptions().map(item =&gt; item.pax))]
      .sort((a,b) =&gt; a-b);

    const choices = [[&quot;all&quot;,&quot;全部&quot;], ...capacities.map(value =&gt; [String(value), value + &quot;名&quot;])];

    choices.forEach(([value,label]) =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      btn.textContent = label;
      btn.classList.toggle(&quot;active&quot;, peopleFilter === value);
      btn.addEventListener(&quot;click&quot;, () =&gt; {
        peopleFilter = value;
        renderPeopleRow();
        renderRenbanOptions();
      });
      row.appendChild(btn);
    });
  }


  function updateRenbanArrows(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);
    const max = Math.max(0, holder.scrollWidth - holder.clientWidth);
    prev.disabled = holder.scrollLeft &lt;= 2;
    next.disabled = holder.scrollLeft &gt;= max - 2;
  }

  function setupRenbanScroller(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);

    prev.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:-holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    next.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    holder.addEventListener(&quot;scroll&quot;, updateRenbanArrows, {passive:true});

    let dragging = false;
    let startX = 0;
    let startScroll = 0;

    holder.addEventListener(&quot;pointerdown&quot;, event =&gt; {
      if(event.pointerType === &quot;touch&quot;) return;
      dragging = true;
      startX = event.clientX;
      startScroll = holder.scrollLeft;
      holder.classList.add(&quot;dragging&quot;);
      holder.setPointerCapture(event.pointerId);
    });

    holder.addEventListener(&quot;pointermove&quot;, event =&gt; {
      if(!dragging) return;
      holder.scrollLeft = startScroll - (event.clientX - startX);
    });

    const stopDragging = event =&gt; {
      if(!dragging) return;
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
      try{ holder.releasePointerCapture(event.pointerId); }catch{}
    };

    holder.addEventListener(&quot;pointerup&quot;, stopDragging);
    holder.addEventListener(&quot;pointercancel&quot;, stopDragging);
    holder.addEventListener(&quot;lostpointercapture&quot;, () =&gt; {
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
    });

    window.addEventListener(&quot;resize&quot;, updateRenbanArrows);
  }

  function renderRenbanOptions(){
    const all = allRenbanOptions();
    let filtered;

    if(peopleFilter === &quot;all&quot;){
      filtered = [...all].sort(compareRecommendationRoute);
    }else{
      const requested = Number(peopleFilter);
      const bestByTables = new Map();

      all
        .filter(item =&gt; {
          const actualCapacity = item.capacity ?? item.pax;
          /* BOX単体の8名利用は従来どおり低優先で残す。 */
          return actualCapacity &gt;= requested || (item.box &amp;&amp; item.ids.length === 1 &amp;&amp; item.pax === requested);
        })
        .forEach(item =&gt; {
          const key = item.ids.join(&quot;-&quot;);
          const current = bestByTables.get(key);
          const itemCapacity = item.capacity ?? item.pax;
          const currentCapacity = current ? (current.capacity ?? current.pax) : Infinity;

          if(!current ||
             itemCapacity &lt; currentCapacity ||
             (itemCapacity === currentCapacity &amp;&amp; Number(item.low) &lt; Number(current.low))){
            bestByTables.set(key, item);
          }
        });

      filtered = [...bestByTables.values()]
        .sort((a,b) =&gt; {
          const capA = a.capacity ?? a.pax;
          const capB = b.capacity ?? b.pax;

          /* 優先順位:
             1. 使用する卓数が少ない
             2. 同じ卓数なら空き席が少ない
             3. 同条件なら通常卓をBOXより先にする */
          return a.ids.length - b.ids.length ||
                 (capA - requested) - (capB - requested) ||
                 Number(a.low) - Number(b.low) ||
                 Number(a.box) - Number(b.box) ||
                 compareRecommendationRoute(a,b);
        });
    }

    document.getElementById(&quot;renbanCount&quot;).textContent = filtered.length + &quot;案&quot;;

    const holder = document.getElementById(&quot;renbanOptions&quot;);
    holder.innerHTML = &quot;&quot;;

    if(!filtered.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;案内できる空席候補はありません。&quot;;
      holder.appendChild(empty);
      requestAnimationFrame(updateRenbanArrows);
      return;
    }

    const tables = currentTables();
    const requested = peopleFilter === &quot;all&quot; ? null : Number(peopleFilter);

    filtered.forEach((option,index) =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      const actualCapacity = option.capacity ?? option.pax;
      const excess = requested === null ? 0 : Math.max(0, actualCapacity - requested);

      let priorityClass = &quot;&quot;;
      let priorityLabel = &quot;&quot;;

      if(requested !== null){
        if(excess === 0){
          priorityClass = &quot; priority-1&quot;;
          priorityLabel = &quot;優先&quot;;
        }else if(excess === 1){
          priorityClass = &quot; priority-2&quot;;
          priorityLabel = &quot;次点&quot;;
        }else if(excess &lt;= 3){
          priorityClass = &quot; priority-3&quot;;
          priorityLabel = &quot;予備&quot;;
        }else{
          priorityClass = &quot; low&quot;;
          priorityLabel = &quot;優先度低&quot;;
        }
      }else{
        priorityClass = option.low ? &quot; low&quot; : &quot;&quot;;
        priorityLabel = option.low ? &quot;優先度低&quot; : &quot;使用可能&quot;;
      }

      btn.className = &quot;renban-option&quot; + priorityClass;

      let note;
      if(requested !== null){
        note = priorityLabel + &quot;・&quot; + option.ids.length + &quot;卓・MAX &quot; + actualCapacity + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else if(option.box &amp;&amp; actualCapacity === 14){
        note = priorityLabel + &quot;・2 BOX&quot;;
      }else{
        note = priorityLabel;
      }

      btn.innerHTML =
        &quot;&lt;strong&gt;&quot; + (requested ?? option.pax) + &quot;名&lt;/strong&gt;&quot; +
        &#x27;&lt;div class=&quot;chips&quot;&gt;&#x27; +
        option.ids.map(id =&gt;
          &#x27;&lt;span class=&quot;chip &#x27; + capacityClass(tables[id]) + &#x27;&quot;&gt;&#x27; + id + &quot;&lt;/span&gt;&quot;
        ).join(&quot;&quot;) +
        &quot;&lt;/div&gt;&quot; +
        &quot;&lt;small&gt;&quot; + note + &quot;&lt;/small&gt;&quot;;

      btn.addEventListener(&quot;click&quot;, () =&gt; setStatus(option.ids));
      holder.appendChild(btn);
    });

    requestAnimationFrame(updateRenbanArrows);
  }

  function renderSummary(){
    const summary = document.getElementById(&quot;summary&quot;);
    summary.innerHTML = &quot;&quot;;

    const tables = currentTables();
    const groups = [
      [2,&quot;2人&quot;],
      [4,&quot;4人&quot;],
      [6,&quot;6人&quot;],
      [&quot;BOX&quot;,&quot;BOX&quot;]
    ];

    groups.forEach(([capacity,label]) =&gt; {
      const count = Object.keys(tables).filter(id =&gt; {
        if(tables[id] !== capacity) return false;
        const isVirtual = appState.groups.some(group =&gt; group.id === id);
        if(!isVirtual &amp;&amp; isGrouped(id)) return false;
        return isAvailable(id);
      }).length;

      const card = document.createElement(&quot;div&quot;);
      card.className = &quot;summary-card&quot;;
      card.innerHTML = &quot;&lt;small&gt;&quot; + label + &quot; 空き&lt;/small&gt;&lt;b&gt;&quot; + count + &quot;&lt;/b&gt;&quot;;
      summary.appendChild(card);
    });
  }

  function showToast(message){
    const toast = document.getElementById(&quot;toast&quot;);
    toast.textContent = message;
    toast.classList.add(&quot;show&quot;);

    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() =&gt; toast.classList.remove(&quot;show&quot;), 1100);
  }


  function createManualGroup(){
    if(!validManualSelection()){
      showToast(&quot;同じ連番内の隣り合う卓を選択してください&quot;);
      return;
    }

    const ids = sortedManualSelection();
    const state = selectedStatus;
    const tables = currentTables();
    const capacity = ids.reduce((sum,id) =&gt; {
      const value = tables[id];
      return sum + (value === &quot;BOX&quot; ? 7 : Number(value || 0));
    },0);

    const group = {
      id:&quot;manual-&quot; + Date.now(),
      ids,
      state,
      capacity
    };

    appState.groups.push(group);

    ids.forEach(id =&gt; {
      if(state === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = state;
      }
    });

    manualMode = false;
    manualSelected.clear();
    saveState();
    renderAll();
    showToast(ids.join(&quot;・&quot;) + &quot; を手動連結&quot;);
  }

  function releaseManualGroup(groupId){
    const index = appState.groups.findIndex(group =&gt; group.id === groupId);
    if(index &lt; 0) return;

    const [group] = appState.groups.splice(index,1);
    group.ids.forEach(id =&gt; delete appState.states[id]);

    manualSelected.clear();
    saveState();
    renderAll();
    showToast(group.ids.join(&quot;・&quot;) + &quot; → 空席&quot;);
  }

  function renderManualControls(){
    const ids = sortedManualSelection();
    const tables = currentTables();
    const total = ids.reduce((sum,id) =&gt; {
      const capacity = tables[id];
      return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
    },0);

    const toggle = document.getElementById(&quot;manualToggle&quot;);
    toggle.classList.toggle(&quot;active&quot;, manualMode);
    toggle.textContent = manualMode ? &quot;手動連結中&quot; : &quot;手動連結&quot;;

    document.getElementById(&quot;manualInfo&quot;).textContent =
      ids.length
        ? &quot;選択：&quot; + ids.join(&quot;・&quot;) + &quot;　合計&quot; + total + &quot;席&quot;
        : &quot;卓を選択&quot;;

    document.getElementById(&quot;manualConfirm&quot;).disabled = !validManualSelection();
  }


  function renderLargeManualGroups(){
    const section = document.getElementById(&quot;largeManualSection&quot;);
    const grid = document.getElementById(&quot;largeManualGrid&quot;);
    const count = document.getElementById(&quot;largeManualCount&quot;);

    const groups = sortedManualGroups(
      appState.groups.filter(group =&gt; Number(group.capacity) &gt; 6),
      &quot;large&quot;
    );

    section.hidden = groups.length === 0;
    count.textContent = groups.length + &quot;組&quot;;
    grid.innerHTML = &quot;&quot;;

    groups.forEach(group =&gt; {
      grid.appendChild(createManualGroupCard(group));
    });
  }

  function renderAll(){
    renderSummary();
    renderPeopleRow();
    renderClusterStrip();
    renderRenbanOptions();
    renderManualControls();
    renderLargeManualGroups();
    renderTables();
  }


  document.getElementById(&quot;manualToggle&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualMode = !manualMode;
    manualSelected.clear();
    renderAll();
  });

  document.getElementById(&quot;manualClear&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualSelected.clear();
    renderAll();
  });

  document.getElementById(&quot;manualConfirm&quot;).addEventListener(&quot;click&quot;, createManualGroup);

  document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      selectedStatus = btn.dataset.state;
      document.querySelectorAll(&quot;#stateRow button&quot;).forEach(item =&gt; {
        item.classList.toggle(&quot;active&quot;, item === btn);
      });
    });
  });

  document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      tableView = btn.dataset.view;
      document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(item =&gt; {
        item.classList.toggle(&quot;active&quot;, item === btn);
      });
      renderTables();
    });
  });

  document.getElementById(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    appState = {states:{}, merged:{}, groups:[]};
    selectedStatus = &quot;reserved&quot;;
    tableView = &quot;all&quot;;
    peopleFilter = &quot;all&quot;;
    saveState();

    document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.state === &quot;reserved&quot;);
    });

    document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.view === &quot;all&quot;);
    });

    renderAll();
  });

  setupRenbanScroller();
  renderAll();
})();
&lt;/script&gt;

      &lt;button data-view=&quot;all&quot; class=&quot;active&quot;&gt;全部&lt;/button&gt;

    &lt;/div&gt;

    &lt;div class=&quot;label&quot;&gt;人数&lt;/div&gt;
    &lt;div id=&quot;peopleRow&quot; class=&quot;row-scroll&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;label&quot;&gt;空いている連続卓&lt;/div&gt;
    &lt;div id=&quot;clusterStrip&quot; class=&quot;cluster-strip&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;label&quot;&gt;手動連結&lt;/div&gt;
    &lt;div class=&quot;manual-row&quot;&gt;
      &lt;button id=&quot;manualToggle&quot; type=&quot;button&quot;&gt;手動連結&lt;/button&gt;
      &lt;span id=&quot;manualInfo&quot; class=&quot;manual-info&quot;&gt;卓を選択&lt;/span&gt;
      &lt;button id=&quot;manualClear&quot; type=&quot;button&quot;&gt;選択解除&lt;/button&gt;
      &lt;button id=&quot;manualConfirm&quot; class=&quot;confirm&quot; type=&quot;button&quot; disabled&gt;連結する&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;main&gt;
  &lt;section class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;
      &lt;span&gt;おすすめ案&lt;/span&gt;
      &lt;span id=&quot;renbanCount&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;renban-scroll-wrap&quot;&gt;
      &lt;button id=&quot;renbanPrev&quot; class=&quot;scroll-arrow&quot; type=&quot;button&quot; aria-label=&quot;前の候補&quot;&gt;‹&lt;/button&gt;
      &lt;div id=&quot;renbanOptions&quot; class=&quot;renban-options&quot;&gt;&lt;/div&gt;
      &lt;button id=&quot;renbanNext&quot; class=&quot;scroll-arrow&quot; type=&quot;button&quot; aria-label=&quot;次の候補&quot;&gt;›&lt;/button&gt;
    &lt;/div&gt;
  &lt;/section&gt;




  &lt;section id=&quot;largeManualSection&quot; class=&quot;card&quot; hidden&gt;
    &lt;div class=&quot;card-title&quot;&gt;
      &lt;span&gt;連結卓（7名以上）&lt;/span&gt;
      &lt;span id=&quot;largeManualCount&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;largeManualGrid&quot; class=&quot;table-grid&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div id=&quot;tableArea&quot;&gt;&lt;/div&gt;
&lt;/main&gt;

&lt;div id=&quot;toast&quot; class=&quot;toast&quot;&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;

  const STORAGE_KEY = &quot;sekifuri-3f-v8-display-clean&quot;;
  const PREVIOUS_STORAGE_KEY = &quot;sekifuri-3f-v7-priority-route&quot;;
  if(!localStorage.getItem(STORAGE_KEY) &amp;&amp; localStorage.getItem(PREVIOUS_STORAGE_KEY)){
    localStorage.setItem(STORAGE_KEY, localStorage.getItem(PREVIOUS_STORAGE_KEY));
  }

  const fixedTables = {
    &quot;F1&quot;:2,&quot;F2&quot;:2,&quot;F3&quot;:2,&quot;F4&quot;:2,&quot;F5&quot;:2,

    &quot;G6&quot;:2,&quot;G7&quot;:2,&quot;G8&quot;:2,&quot;G9&quot;:2,&quot;G10&quot;:2,&quot;G11&quot;:2
  };

  const pairDefinitions = [
    {id:&quot;E1&quot;, parts:[&quot;E1A&quot;,&quot;E1B&quot;]},
    {id:&quot;E2&quot;, parts:[&quot;E2A&quot;,&quot;E2B&quot;]},
    {id:&quot;E3E4&quot;, parts:[&quot;E3&quot;,&quot;E4&quot;]},
    {id:&quot;E5E6&quot;, parts:[&quot;E5&quot;,&quot;E6&quot;]},
    {id:&quot;E7&quot;, parts:[&quot;E7A&quot;,&quot;E7B&quot;]},
    {id:&quot;E8E9&quot;, parts:[&quot;E8&quot;,&quot;E9&quot;]},
    {id:&quot;E10&quot;, parts:[&quot;E10A&quot;,&quot;E10B&quot;]},
    {id:&quot;E11&quot;, parts:[&quot;E11A&quot;,&quot;E11B&quot;]},

    {id:&quot;G1&quot;, parts:[&quot;G1A&quot;,&quot;G1B&quot;]},
    {id:&quot;G2G3&quot;, parts:[&quot;G2&quot;,&quot;G3&quot;]},
    {id:&quot;G4&quot;, parts:[&quot;G4A&quot;,&quot;G4B&quot;]},
    {id:&quot;G5&quot;, parts:[&quot;G5A&quot;,&quot;G5B&quot;]}
  ];

  const pairPrefixes = pairDefinitions.map(def =&gt; def.id);
  const pairById = Object.fromEntries(pairDefinitions.map(def =&gt; [def.id, def]));

  const defaultMerged = Object.fromEntries(
    pairDefinitions
      .filter(def =&gt; def.parts.every(part =&gt; /[AB]$/.test(part)))
      .map(def =&gt; [def.id, true])
  );

  const twoFixedOrder = [
    &quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;,
    &quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;
  ];

  const fourFixedOrder = [];
  const sixOrder = [];
  const boxOrder = [];

  /*
    おすすめ案の案内優先順。
    F卓を先にし、その後はE卓を番号の大きい順、
    G卓を番号の小さい順に表示する。
  */
  const recommendationRoute = [
    &quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;,

    &quot;E11&quot;,&quot;E11A&quot;,&quot;E11B&quot;,
    &quot;E10&quot;,&quot;E10A&quot;,&quot;E10B&quot;,
    &quot;E8E9&quot;,&quot;E9&quot;,&quot;E8&quot;,
    &quot;E7&quot;,&quot;E7A&quot;,&quot;E7B&quot;,
    &quot;E5E6&quot;,&quot;E6&quot;,&quot;E5&quot;,
    &quot;E3E4&quot;,&quot;E4&quot;,&quot;E3&quot;,
    &quot;E2&quot;,&quot;E2A&quot;,&quot;E2B&quot;,
    &quot;E1&quot;,&quot;E1A&quot;,&quot;E1B&quot;,

    &quot;G1&quot;,&quot;G1A&quot;,&quot;G1B&quot;,
    &quot;G2G3&quot;,&quot;G2&quot;,&quot;G3&quot;,
    &quot;G4&quot;,&quot;G4A&quot;,&quot;G4B&quot;,
    &quot;G5&quot;,&quot;G5A&quot;,&quot;G5B&quot;,
    &quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;
  ];

  function recommendationIdRank(id){
    const direct = recommendationRoute.indexOf(id);
    if(direct &gt;= 0) return direct;

    const group = appState?.groups?.find(group =&gt; group.id === id);
    if(group){
      const ranks = group.ids.map(recommendationIdRank).filter(Number.isFinite);
      return ranks.length ? Math.min(...ranks) : Number.MAX_SAFE_INTEGER;
    }
    return Number.MAX_SAFE_INTEGER;
  }

  function recommendationKey(option){
    return option.ids
      .flatMap(id =&gt; {
        const group = appState?.groups?.find(group =&gt; group.id === id);
        return group ? group.ids : [id];
      })
      .map(recommendationIdRank)
      .sort((a,b) =&gt; a-b);
  }

  function compareRecommendationRoute(a,b){
    const ka = recommendationKey(a);
    const kb = recommendationKey(b);
    const n = Math.max(ka.length,kb.length);
    for(let i=0;i&lt;n;i++){
      const av = ka[i] ?? Number.MAX_SAFE_INTEGER;
      const bv = kb[i] ?? Number.MAX_SAFE_INTEGER;
      if(av !== bv) return av-bv;
    }
    return 0;
  }

  const renbanBaseGroups = [
    [&quot;E1&quot;,&quot;E2&quot;,&quot;E3E4&quot;,&quot;E5E6&quot;,&quot;E7&quot;,&quot;E8E9&quot;,&quot;E10&quot;,&quot;E11&quot;],
    [&quot;G1&quot;,&quot;G2G3&quot;,&quot;G4&quot;,&quot;G5&quot;,&quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;]
  ];

  let appState = loadState();
  let selectedStatus = &quot;reserved&quot;;
  let tableView = &quot;all&quot;;
  let peopleFilter = &quot;all&quot;;
  let manualMode = false;
  let manualSelected = new Set();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        states: parsed.states || {},
        merged: {...defaultMerged, ...(parsed.merged || {})},
        groups: parsed.groups || []
      };
    }catch{
      return {states:{}, merged:{...defaultMerged}, groups:[]};
    }
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  }


  function groupFor(id){
    return appState.groups.find(group =&gt; group.id === id || group.ids.includes(id));
  }

  function isGrouped(id){
    return Boolean(groupFor(id));
  }

  function isAvailable(id){
    const virtualGroup = appState.groups.some(group =&gt; group.id === id);
    return getStatus(id) === &quot;empty&quot; &amp;&amp; (virtualGroup || !isGrouped(id));
  }

  function currentRenbanGroups(){
    return renbanBaseGroups.map(group =&gt; group.flatMap(id =&gt; {
      const def = pairById[id];
      if(!def) return [id];
      return appState.merged[id] ? [def.id] : [...def.parts];
    }));
  }

  function recommendationRows(){
    return currentRenbanGroups();
  }

  function manualRows(){
    return recommendationRows();
  }

  function sortedManualSelection(){
    const ids = [...manualSelected];
    for(const row of manualRows()){
      if(ids.every(id =&gt; row.includes(id))){
        return ids.sort((a,b) =&gt; row.indexOf(a) - row.indexOf(b));
      }
    }
    return ids;
  }

  function validManualSelection(){
    if(manualSelected.size &lt; 2) return false;

    const ids = [...manualSelected];
    return manualRows().some(row =&gt; {
      const indexes = ids.map(id =&gt; row.indexOf(id));
      if(indexes.some(index =&gt; index &lt; 0)) return false;
      indexes.sort((a,b) =&gt; a-b);
      return indexes.every((value,index) =&gt;
        index === 0 || value === indexes[index - 1] + 1
      );
    });
  }

  function currentTables(){
    const tables = {...fixedTables};

    pairDefinitions.forEach(def =&gt; {
      if(appState.merged[def.id]){
        tables[def.id] = 4;
      }else{
        tables[def.parts[0]] = 2;
        tables[def.parts[1]] = 2;
      }
    });

    appState.groups.forEach(group =&gt; {
      const total = group.capacity || group.ids.reduce((sum,id) =&gt; {
        const capacity = tables[id];
        return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
      },0);
      group.capacity = total;
      tables[group.id] = total;
    });

    return tables;
  }

  function getStatus(id){
    const group = appState.groups.find(item =&gt; item.id === id);
    if(group) return group.state || &quot;empty&quot;;
    return appState.states[id] || &quot;empty&quot;;
  }

  function setStatus(ids){
    const expanded = new Set();

    ids.forEach(id =&gt; {
      const group = groupFor(id);
      (group ? group.ids : [id]).forEach(groupId =&gt; expanded.add(groupId));
    });

    [...expanded].forEach(id =&gt; {
      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

  function statusLabel(value){
    if(value === &quot;reserved&quot;) return &quot;席取り&quot;;
    if(value === &quot;used&quot;) return &quot;使用中&quot;;
    return &quot;空席&quot;;
  }

  function capacityClass(capacity){
    if(capacity === &quot;BOX&quot;) return &quot;cbox&quot;;
    return &quot;c&quot; + capacity;
  }

  function createTableButton(id, capacity){
    const btn = document.createElement(&quot;button&quot;);
    btn.className = &quot;table-btn &quot; + capacityClass(capacity) + &quot; &quot; + getStatus(id);
    if(manualSelected.has(id)) btn.classList.add(&quot;manual-selected&quot;);

    btn.innerHTML = id + &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + (capacity === &quot;BOX&quot; ? &quot;B&quot; : capacity) + &quot;&lt;/span&gt;&quot;;

    btn.addEventListener(&quot;click&quot;, () =&gt; {
      if(!manualMode){
        setStatus([id]);
        return;
      }

      if(getStatus(id) !== &quot;empty&quot;){
        showToast(&quot;空席の卓だけ選択できます&quot;);
        return;
      }

      if(isGrouped(id)){
        showToast(&quot;すでに手動連結されています&quot;);
        return;
      }

      if(manualSelected.has(id)){
        manualSelected.delete(id);
      }else{
        manualSelected.add(id);
      }

      renderAll();
    });

    return btn;
  }


  function createManualGroupCard(group){
    const wrap = document.createElement(&quot;div&quot;);
    wrap.className = &quot;pair-card merged&quot;;

    const table = createTableButton(group.id, group.capacity);
    table.innerHTML =
      group.ids.join(&quot;・&quot;) +
      &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + group.capacity + &#x27;&lt;/span&gt;&#x27;;
    wrap.appendChild(table);

    const release = document.createElement(&quot;button&quot;);
    release.className = &quot;pair-action&quot;;
    release.textContent = &quot;解除&quot;;
    release.addEventListener(&quot;click&quot;, event =&gt; {
      event.stopPropagation();
      releaseManualGroup(group.id);
    });
    wrap.appendChild(release);

    return wrap;
  }

  function togglePair(prefix){
    const def = pairById[prefix];
    const relatedIds = [def.id, ...def.parts];

    if(relatedIds.some(isGrouped)){
      showToast(&quot;先に手動連結を解除してください&quot;);
      return;
    }

    if(appState.merged[prefix]){
      const oldStatus = getStatus(def.id);

      delete appState.states[def.id];
      appState.merged[prefix] = false;

      if(oldStatus !== &quot;empty&quot;){
        appState.states[def.parts[0]] = oldStatus;
        appState.states[def.parts[1]] = oldStatus;
      }
    }else{
      const firstStatus = getStatus(def.parts[0]);
      const secondStatus = getStatus(def.parts[1]);

      delete appState.states[def.parts[0]];
      delete appState.states[def.parts[1]];
      appState.merged[prefix] = true;

      if(firstStatus === &quot;used&quot; || secondStatus === &quot;used&quot;){
        appState.states[def.id] = &quot;used&quot;;
      }else if(firstStatus === &quot;reserved&quot; || secondStatus === &quot;reserved&quot;){
        appState.states[def.id] = &quot;reserved&quot;;
      }
    }

    saveState();
    renderAll();
  }

  function createPairCard(prefix){
    const def = pairById[prefix];
    const wrap = document.createElement(&quot;div&quot;);

    if(appState.merged[prefix]){
      wrap.className = &quot;pair-card merged&quot;;
      wrap.appendChild(createTableButton(def.id, 4));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;分割&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }else{
      wrap.className = &quot;pair-card&quot;;
      wrap.appendChild(createTableButton(def.parts[0], 2));
      wrap.appendChild(createTableButton(def.parts[1], 2));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;連結&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }

    return wrap;
  }

  function countFree(ids){
    return ids.filter(id =&gt; getStatus(id) === &quot;empty&quot;).length;
  }

  function createSection(title, ids, pairMode){
    const section = document.createElement(&quot;section&quot;);
    section.className = &quot;card&quot;;

    let freeCount = ids.filter(id =&gt; !isGrouped(id) &amp;&amp; getStatus(id) === &quot;empty&quot;).length;
    const manualGroups = appState.groups.filter(group =&gt; group.capacity === Number(title.replace(&quot;人卓&quot;,&quot;&quot;)));
    freeCount += manualGroups.filter(group =&gt; getStatus(group.id) === &quot;empty&quot;).length;

    if(pairMode === &quot;split-first&quot;){
      pairDefinitions.forEach(def =&gt; {
        if(!appState.merged[def.id]){
          if(!isGrouped(def.parts[0]) &amp;&amp; getStatus(def.parts[0]) === &quot;empty&quot;) freeCount++;
          if(!isGrouped(def.parts[1]) &amp;&amp; getStatus(def.parts[1]) === &quot;empty&quot;) freeCount++;
        }
      });
    }

    if(pairMode === &quot;merged-first&quot;){
      pairDefinitions.forEach(def =&gt; {
        if(appState.merged[def.id] &amp;&amp; !isGrouped(def.id) &amp;&amp; getStatus(def.id) === &quot;empty&quot;){
          freeCount++;
        }
      });
    }

    section.innerHTML =
      &#x27;&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;&#x27; + title + &#x27;&lt;/span&gt;&lt;span&gt;空き &#x27; + freeCount + &quot;&lt;/span&gt;&lt;/div&gt;&quot;;

    const grid = document.createElement(&quot;div&quot;);
    grid.className = &quot;table-grid&quot;;

    const tables = currentTables();

    /* 2人卓・4人卓は82〜88を先頭に置き、その後に各エリアを動線順で並べる。 */
    if(pairMode === &quot;split-first&quot;){
      pairDefinitions
        .filter(def =&gt;
          !appState.merged[def.id] &amp;&amp;
          !isGrouped(def.parts[0]) &amp;&amp;
          !isGrouped(def.parts[1])
        )
        .forEach(def =&gt; grid.appendChild(createPairCard(def.id)));
    }

    if(pairMode === &quot;merged-first&quot;){
      pairDefinitions
        .filter(def =&gt;
          appState.merged[def.id] &amp;&amp;
          !isGrouped(def.id)
        )
        .forEach(def =&gt; grid.appendChild(createPairCard(def.id)));
    }

    const sectionCapacity = Number(title.replace(&quot;人卓&quot;,&quot;&quot;));
    appState.groups
      .filter(group =&gt; group.capacity &lt;= 6 &amp;&amp; group.capacity === sectionCapacity)
      .forEach(group =&gt; grid.appendChild(createManualGroupCard(group)));

    ids
      .filter(id =&gt; !isGrouped(id))
      .forEach(id =&gt; grid.appendChild(createTableButton(id, tables[id])));

    if(!grid.children.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;この種類の卓はありません。&quot;;
      grid.appendChild(empty);
    }

    section.appendChild(grid);
    return section;
  }

  function renderTables(){
    const area = document.getElementById(&quot;tableArea&quot;);
    area.innerHTML = &quot;&quot;;

    if(tableView === &quot;all&quot; || tableView === &quot;2&quot;){
      area.appendChild(createSection(&quot;2人卓&quot;, twoFixedOrder, &quot;split-first&quot;));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;4&quot;){
      area.appendChild(createSection(&quot;4人卓&quot;, fourFixedOrder, &quot;merged-first&quot;));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;6&quot;){
      area.appendChild(createSection(&quot;6人卓&quot;, sixOrder, null));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;BOX&quot;){
      area.appendChild(createSection(&quot;BOX&quot;, boxOrder, null));
    }
  }

  function maximalEmptyRuns(){
    const tables = currentTables();
    const runs = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          let total = 0;
          let allBox = true;

          run.forEach(id =&gt; {
            if(tables[id] === &quot;BOX&quot;){
              total += 7;
            }else{
              allBox = false;
              total += Number(tables[id]);
            }
          });

          runs.push({
            ids:[...run],
            label: run.length === 2 ? run.join(&quot;・&quot;) : run[0] + &quot;〜&quot; + run[run.length - 1],
            max:total,
            allBox
          });
        }
        run = [];
      };

      group.forEach(id =&gt; {
        if(isAvailable(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    return runs;
  }

  function renderClusterStrip(){
    const strip = document.getElementById(&quot;clusterStrip&quot;);
    strip.innerHTML = &quot;&quot;;

    const runs = maximalEmptyRuns();

    if(!runs.length){
      const chip = document.createElement(&quot;span&quot;);
      chip.className = &quot;cluster-chip disabled&quot;;
      chip.textContent = &quot;空いている連続卓はありません&quot;;
      strip.appendChild(chip);
      return;
    }

    runs.forEach(run =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;cluster-chip&quot;;
      btn.innerHTML =
        run.label +
        &quot;&lt;small&gt;&quot; +
        (run.allBox ? &quot;BOX×&quot; + run.ids.length : run.max + &quot;名 max&quot;) +
        &quot;&lt;/small&gt;&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; {
        peopleFilter = &quot;all&quot;;
        renderPeopleRow();
        renderRenbanOptions();
        document.getElementById(&quot;renbanOptions&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;start&quot;});
        showToast(&quot;空き連番: &quot; + run.label);
      });
      strip.appendChild(btn);
    });
  }

  function allRenbanOptions(){
    const tables = currentTables();
    const options = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          for(let start = 0; start &lt; run.length; start++){
            let capacity = 0;

            for(let end = start; end &lt; run.length; end++){
              const ids = run.slice(start, end + 1);
              const cap = tables[run[end]];

              if(cap === &quot;BOX&quot;){
                if(ids.length === 1) continue;

                if(ids.length === 2){
                  [9,10,11,12,13,14].forEach(pax =&gt; {
                    options.push({
                      ids,
                      pax,
                      capacity:14,
                      low:pax !== 14,
                      box:true
                    });
                  });
                }
              }else{
                capacity += Number(cap);

                if(end &gt; start){
                  options.push({
                    ids,
                    pax:capacity,
                    capacity,
                    low:false,
                    box:false
                  });
                }
              }
            }
          }
        }

        run = [];
      };

      group.forEach(id =&gt; {
        if(isAvailable(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 単卓もおすすめ候補に含める。
       2名なら空いている2人卓、4名なら4人卓、6名なら6人卓を最優先にできる。 */
    Object.keys(tables)
      .filter(id =&gt; tables[id] !== &quot;BOX&quot; &amp;&amp; isAvailable(id))
      .forEach(id =&gt; {
        const capacity = Number(tables[id]);
        if(capacity &gt; 0){
          options.push({
            ids:[id],
            pax:capacity,
            capacity,
            low:false,
            box:false
          });
        }
      });

    Object.keys(tables)
      .filter(id =&gt; tables[id] === &quot;BOX&quot; &amp;&amp; isAvailable(id))
      .forEach(id =&gt; {
        options.push({ids:[id], pax:7, capacity:7, low:false, box:true});
        options.push({ids:[id], pax:8, capacity:7, low:true, box:true});
      });

    const seen = new Set();

    return options
      .filter(option =&gt; {
        const key = option.pax + &quot;|&quot; + option.ids.join(&quot;-&quot;);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a,b) =&gt;
        a.pax - b.pax ||
        Number(a.low) - Number(b.low) ||
        a.ids.length - b.ids.length
      );
  }

  function renderPeopleRow(){
    const row = document.getElementById(&quot;peopleRow&quot;);
    row.innerHTML = &quot;&quot;;

    const capacities = [...new Set(allRenbanOptions().map(item =&gt; item.pax))]
      .sort((a,b) =&gt; a-b);

    const choices = [[&quot;all&quot;,&quot;全部&quot;], ...capacities.map(value =&gt; [String(value), value + &quot;名&quot;])];

    choices.forEach(([value,label]) =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      btn.textContent = label;
      btn.classList.toggle(&quot;active&quot;, peopleFilter === value);
      btn.addEventListener(&quot;click&quot;, () =&gt; {
        peopleFilter = value;
        renderPeopleRow();
        renderRenbanOptions();
      });
      row.appendChild(btn);
    });
  }


  function updateRenbanArrows(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);
    const max = Math.max(0, holder.scrollWidth - holder.clientWidth);
    prev.disabled = holder.scrollLeft &lt;= 2;
    next.disabled = holder.scrollLeft &gt;= max - 2;
  }

  function setupRenbanScroller(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);

    prev.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:-holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    next.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    holder.addEventListener(&quot;scroll&quot;, updateRenbanArrows, {passive:true});

    let dragging = false;
    let startX = 0;
    let startScroll = 0;

    holder.addEventListener(&quot;pointerdown&quot;, event =&gt; {
      if(event.pointerType === &quot;touch&quot;) return;
      dragging = true;
      startX = event.clientX;
      startScroll = holder.scrollLeft;
      holder.classList.add(&quot;dragging&quot;);
      holder.setPointerCapture(event.pointerId);
    });

    holder.addEventListener(&quot;pointermove&quot;, event =&gt; {
      if(!dragging) return;
      holder.scrollLeft = startScroll - (event.clientX - startX);
    });

    const stopDragging = event =&gt; {
      if(!dragging) return;
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
      try{ holder.releasePointerCapture(event.pointerId); }catch{}
    };

    holder.addEventListener(&quot;pointerup&quot;, stopDragging);
    holder.addEventListener(&quot;pointercancel&quot;, stopDragging);
    holder.addEventListener(&quot;lostpointercapture&quot;, () =&gt; {
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
    });

    window.addEventListener(&quot;resize&quot;, updateRenbanArrows);
  }

  function renderRenbanOptions(){
    const all = allRenbanOptions();
    let filtered;

    if(peopleFilter === &quot;all&quot;){
      filtered = [...all].sort(compareRecommendationRoute);
    }else{
      const requested = Number(peopleFilter);
      const bestByTables = new Map();

      all
        .filter(item =&gt; {
          const actualCapacity = item.capacity ?? item.pax;
          /* BOX単体の8名利用は従来どおり低優先で残す。 */
          return actualCapacity &gt;= requested || (item.box &amp;&amp; item.ids.length === 1 &amp;&amp; item.pax === requested);
        })
        .forEach(item =&gt; {
          const key = item.ids.join(&quot;-&quot;);
          const current = bestByTables.get(key);
          const itemCapacity = item.capacity ?? item.pax;
          const currentCapacity = current ? (current.capacity ?? current.pax) : Infinity;

          if(!current ||
             itemCapacity &lt; currentCapacity ||
             (itemCapacity === currentCapacity &amp;&amp; Number(item.low) &lt; Number(current.low))){
            bestByTables.set(key, item);
          }
        });

      filtered = [...bestByTables.values()]
        .sort((a,b) =&gt; {
          const capA = a.capacity ?? a.pax;
          const capB = b.capacity ?? b.pax;

          /* 優先順位:
             1. 使用する卓数が少ない
             2. 同じ卓数なら空き席が少ない
             3. 同条件なら通常卓をBOXより先にする */
          return a.ids.length - b.ids.length ||
                 (capA - requested) - (capB - requested) ||
                 Number(a.low) - Number(b.low) ||
                 Number(a.box) - Number(b.box) ||
                 compareRecommendationRoute(a,b);
        });
    }

    document.getElementById(&quot;renbanCount&quot;).textContent = filtered.length + &quot;案&quot;;

    const holder = document.getElementById(&quot;renbanOptions&quot;);
    holder.innerHTML = &quot;&quot;;

    if(!filtered.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;案内できる空席候補はありません。&quot;;
      holder.appendChild(empty);
      requestAnimationFrame(updateRenbanArrows);
      return;
    }

    const tables = currentTables();
    const requested = peopleFilter === &quot;all&quot; ? null : Number(peopleFilter);

    filtered.forEach((option,index) =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      const actualCapacity = option.capacity ?? option.pax;
      const excess = requested === null ? 0 : Math.max(0, actualCapacity - requested);

      let priorityClass = &quot;&quot;;
      let priorityLabel = &quot;&quot;;

      if(requested !== null){
        if(excess === 0){
          priorityClass = &quot; priority-1&quot;;
          priorityLabel = &quot;優先&quot;;
        }else if(excess === 1){
          priorityClass = &quot; priority-2&quot;;
          priorityLabel = &quot;次点&quot;;
        }else if(excess &lt;= 3){
          priorityClass = &quot; priority-3&quot;;
          priorityLabel = &quot;予備&quot;;
        }else{
          priorityClass = &quot; low&quot;;
          priorityLabel = &quot;優先度低&quot;;
        }
      }else{
        priorityClass = option.low ? &quot; low&quot; : &quot;&quot;;
        priorityLabel = option.low ? &quot;優先度低&quot; : &quot;使用可能&quot;;
      }

      btn.className = &quot;renban-option&quot; + priorityClass;

      let note;
      if(requested !== null){
        note = priorityLabel + &quot;・&quot; + option.ids.length + &quot;卓・MAX &quot; + actualCapacity + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else if(option.box &amp;&amp; actualCapacity === 14){
        note = priorityLabel + &quot;・2 BOX&quot;;
      }else{
        note = priorityLabel;
      }

      btn.innerHTML =
        &quot;&lt;strong&gt;&quot; + (requested ?? option.pax) + &quot;名&lt;/strong&gt;&quot; +
        &#x27;&lt;div class=&quot;chips&quot;&gt;&#x27; +
        option.ids.map(id =&gt;
          &#x27;&lt;span class=&quot;chip &#x27; + capacityClass(tables[id]) + &#x27;&quot;&gt;&#x27; + id + &quot;&lt;/span&gt;&quot;
        ).join(&quot;&quot;) +
        &quot;&lt;/div&gt;&quot; +
        &quot;&lt;small&gt;&quot; + note + &quot;&lt;/small&gt;&quot;;

      btn.addEventListener(&quot;click&quot;, () =&gt; setStatus(option.ids));
      holder.appendChild(btn);
    });

    requestAnimationFrame(updateRenbanArrows);
  }

  function renderSummary(){
    const summary = document.getElementById(&quot;summary&quot;);
    summary.innerHTML = &quot;&quot;;

    const tables = currentTables();
    const groups = [
      [2,&quot;2人&quot;],
      [4,&quot;4人&quot;],
      [6,&quot;6人&quot;],
      [&quot;BOX&quot;,&quot;BOX&quot;]
    ];

    groups.forEach(([capacity,label]) =&gt; {
      const count = Object.keys(tables).filter(id =&gt; {
        if(tables[id] !== capacity) return false;
        const isVirtual = appState.groups.some(group =&gt; group.id === id);
        if(!isVirtual &amp;&amp; isGrouped(id)) return false;
        return isAvailable(id);
      }).length;

      const card = document.createElement(&quot;div&quot;);
      card.className = &quot;summary-card&quot;;
      card.innerHTML = &quot;&lt;small&gt;&quot; + label + &quot; 空き&lt;/small&gt;&lt;b&gt;&quot; + count + &quot;&lt;/b&gt;&quot;;
      summary.appendChild(card);
    });
  }

  function showToast(message){
    const toast = document.getElementById(&quot;toast&quot;);
    toast.textContent = message;
    toast.classList.add(&quot;show&quot;);

    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() =&gt; toast.classList.remove(&quot;show&quot;), 1100);
  }


  function createManualGroup(){
    if(!validManualSelection()){
      showToast(&quot;同じ連番内の隣り合う卓を選択してください&quot;);
      return;
    }

    const ids = sortedManualSelection();
    const state = selectedStatus;
    const tables = currentTables();
    const capacity = ids.reduce((sum,id) =&gt; {
      const value = tables[id];
      return sum + (value === &quot;BOX&quot; ? 7 : Number(value || 0));
    },0);

    const group = {
      id:&quot;manual-&quot; + Date.now(),
      ids,
      state,
      capacity
    };

    appState.groups.push(group);

    ids.forEach(id =&gt; {
      if(state === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = state;
      }
    });

    manualMode = false;
    manualSelected.clear();
    saveState();
    renderAll();
    showToast(ids.join(&quot;・&quot;) + &quot; を手動連結&quot;);
  }

  function releaseManualGroup(groupId){
    const index = appState.groups.findIndex(group =&gt; group.id === groupId);
    if(index &lt; 0) return;

    const [group] = appState.groups.splice(index,1);
    group.ids.forEach(id =&gt; delete appState.states[id]);

    manualSelected.clear();
    saveState();
    renderAll();
    showToast(group.ids.join(&quot;・&quot;) + &quot; → 空席&quot;);
  }

  function renderManualControls(){
    const ids = sortedManualSelection();
    const tables = currentTables();
    const total = ids.reduce((sum,id) =&gt; {
      const capacity = tables[id];
      return sum + (capacity === &quot;BOX&quot; ? 7 : Number(capacity || 0));
    },0);

    const toggle = document.getElementById(&quot;manualToggle&quot;);
    toggle.classList.toggle(&quot;active&quot;, manualMode);
    toggle.textContent = manualMode ? &quot;手動連結中&quot; : &quot;手動連結&quot;;

    document.getElementById(&quot;manualInfo&quot;).textContent =
      ids.length
        ? &quot;選択：&quot; + ids.join(&quot;・&quot;) + &quot;　合計&quot; + total + &quot;席&quot;
        : &quot;卓を選択&quot;;

    document.getElementById(&quot;manualConfirm&quot;).disabled = !validManualSelection();
  }


  function renderLargeManualGroups(){
    const section = document.getElementById(&quot;largeManualSection&quot;);
    const grid = document.getElementById(&quot;largeManualGrid&quot;);
    const count = document.getElementById(&quot;largeManualCount&quot;);

    const groups = appState.groups.filter(group =&gt; Number(group.capacity) &gt; 6);

    section.hidden = groups.length === 0;
    count.textContent = groups.length + &quot;組&quot;;
    grid.innerHTML = &quot;&quot;;

    groups.forEach(group =&gt; {
      grid.appendChild(createManualGroupCard(group));
    });
  }

  function renderAll(){
    renderSummary();
    renderPeopleRow();
    renderClusterStrip();
    renderRenbanOptions();
    renderManualControls();
    renderLargeManualGroups();
    renderTables();
  }


  document.getElementById(&quot;manualToggle&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualMode = !manualMode;
    manualSelected.clear();
    renderAll();
  });

  document.getElementById(&quot;manualClear&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    manualSelected.clear();
    renderAll();
  });

  document.getElementById(&quot;manualConfirm&quot;).addEventListener(&quot;click&quot;, createManualGroup);

  document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      selectedStatus = btn.dataset.state;
      document.querySelectorAll(&quot;#stateRow button&quot;).forEach(item =&gt; {
        item.classList.toggle(&quot;active&quot;, item === btn);
      });
    });
  });

  document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      tableView = btn.dataset.view;
      document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(item =&gt; {
        item.classList.toggle(&quot;active&quot;, item === btn);
      });
      renderTables();
    });
  });

  document.getElementById(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    appState = {states:{}, merged:{...defaultMerged}, groups:[]};
    selectedStatus = &quot;reserved&quot;;
    tableView = &quot;all&quot;;
    peopleFilter = &quot;all&quot;;
    saveState();

    document.querySelectorAll(&quot;#stateRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.state === &quot;reserved&quot;);
    });

    document.querySelectorAll(&quot;#tableFilterRow button&quot;).forEach(btn =&gt; {
      btn.classList.toggle(&quot;active&quot;, btn.dataset.view === &quot;all&quot;);
    });

    renderAll();
  });

  setupRenbanScroller();
  renderAll();
})();
