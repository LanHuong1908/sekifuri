  /* Split one current renban group according to edited membership.
     Example C1..C6 -&gt; edit C1 keeping only C2:
       new group C1,C2; remaining C3,C4,C5,C6 stays together. */
  function cfgApplyRenbanMembership(id,members){
    const oldGroup=cfgGroupOf(id);
    const chosen=[id,...members.filter(x=&gt;x!==id)];
    if(oldGroup){
      cfgRenbanGroups=cfgRenbanGroups.filter(g=&gt;g!==oldGroup);
      const chosenSet=new Set(chosen);
      const remaining=oldGroup.filter(x=&gt;!chosenSet.has(x));
      if(chosen.length&gt;=2)cfgRenbanGroups.push(chosen.sort(cfgCompare));
      if(remaining.length&gt;=2)cfgRenbanGroups.push(remaining.sort(cfgCompare));
    }else if(chosen.length&gt;=2){
      /* remove chosen members from any previous groups first */
      chosen.slice(1).forEach(member=&gt;{
        const g=cfgGroupOf(member);
        if(!g)return;
        cfgRenbanGroups=cfgRenbanGroups.filter(x=&gt;x!==g);
        const rest=g.filter(x=&gt;x!==member);
        if(rest.length&gt;=2)cfgRenbanGroups.push(rest);
      });
      cfgRenbanGroups.push(chosen.sort(cfgCompare));
    }
    cfgRenbanGroups.sort((a,b)=&gt;cfgCompare(a[0],b[0]));
  }

  function cfgRemoveFromOrders(id){
    [twoFixedOrder,fourFixedOrder,sixOrder,boxOrder].forEach(arr=&gt;{
      for(let i=arr.length-1;i&gt;=0;i--)if(arr[i]===id)arr.splice(i,1);
    });
  }
  function cfgSortOrders(){
    [twoFixedOrder,fourFixedOrder,sixOrder,boxOrder].forEach(arr=&gt;arr.sort(cfgCompare));
  }
  function cfgPlaceInCapacity(id,max,counts){
    cfgRemoveFromOrders(id);
    const target=counts.BOX===1 &amp;&amp; cfgMetric(counts).physical===1 ? boxOrder :
      max&lt;=2?twoFixedOrder:max&lt;=4?fourFixedOrder:max&lt;=6?sixOrder:sixOrder;
    target.push(id);cfgSortOrders();
  }

  function cfgRenameIdentity(oldId,newId){
    if(oldId===newId)return oldId;
    if(cfgStructures[newId])throw new Error(`卓 ${newId} はすでに存在します。`);
    cfgStructures[newId]=cfgStructures[oldId];delete cfgStructures[oldId];
    if(cfgRouteRank[oldId]!==undefined){cfgRouteRank[newId]=cfgRouteRank[oldId];delete cfgRouteRank[oldId]}
    if(fixedTables[oldId]!==undefined){fixedTables[newId]=fixedTables[oldId];delete fixedTables[oldId]}
    [twoFixedOrder,fourFixedOrder,sixOrder,boxOrder].forEach(arr=&gt;arr.forEach((x,i)=&gt;{if(x===oldId)arr[i]=newId}));
    cfgRenbanGroups.forEach(g=&gt;g.forEach((x,i)=&gt;{if(x===oldId)g[i]=newId}));
    if(pairPrefixes.includes(oldId)){
      const i=pairPrefixes.indexOf(oldId);pairPrefixes[i]=newId;
      appState.merged[newId]=appState.merged[oldId];delete appState.merged[oldId];
      [&quot;A&quot;,&quot;B&quot;,&quot;AB&quot;].forEach(suf=&gt;{
        if(appState.states[oldId+suf]!==undefined){appState.states[newId+suf]=appState.states[oldId+suf];delete appState.states[oldId+suf]}
        if(appState.cleaning[oldId+suf]!==undefined){appState.cleaning[newId+suf]=appState.cleaning[oldId+suf];delete appState.cleaning[oldId+suf]}
      });
    }else{
      if(appState.states[oldId]!==undefined){appState.states[newId]=appState.states[oldId];delete appState.states[oldId]}
      if(appState.cleaning[oldId]!==undefined){appState.cleaning[newId]=appState.cleaning[oldId];delete appState.cleaning[oldId]}
    }
    return newId;
  }

  function cfgConvertPairToFixed(id,counts){
    const idx=pairPrefixes.indexOf(id);
    if(idx&lt;0)return;
    pairPrefixes.splice(idx,1);
    [&quot;A&quot;,&quot;B&quot;,&quot;AB&quot;].forEach(suf=&gt;{delete appState.states[id+suf];delete appState.cleaning[id+suf]});
    delete appState.merged[id];
    const m=cfgMetric(counts);
    fixedTables[id]=(counts.BOX===1&amp;&amp;m.physical===1)?&quot;BOX&quot;:m.max;
  }

  function cfgSaveEdit(){
    if(!cfgEditingId)return;
    const wanted=document.getElementById(&quot;cfgEditName&quot;).value.trim(),m=cfgMetric(cfgEditCounts);
    if(!wanted||!m.physical){document.getElementById(&quot;cfgEditError&quot;).textContent=&quot;卓名と卓構成を確認してください。&quot;;return}
    try{
      const old=cfgEditingId;
      cfgEditingId=cfgRenameIdentity(old,wanted);
      /* arbitrary physical composition becomes one named configurable table;
         2+2 existing pair remains split-able only if unchanged */
      const unchangedPair=pairPrefixes.includes(cfgEditingId) &amp;&amp;
        (cfgEditCounts[&quot;2&quot;]||0)===2 &amp;&amp; m.physical===2 &amp;&amp; m.max===4 &amp;&amp;
        !(cfgEditCounts[&quot;4&quot;]||0) &amp;&amp; !(cfgEditCounts[&quot;6&quot;]||0) &amp;&amp; !(cfgEditCounts[&quot;BOX&quot;]||0);
      if(!unchangedPair &amp;&amp; pairPrefixes.includes(cfgEditingId))cfgConvertPairToFixed(cfgEditingId,cfgEditCounts);

      cfgStructures[cfgEditingId]=JSON.parse(JSON.stringify(cfgEditCounts));
      if(!pairPrefixes.includes(cfgEditingId)){
        fixedTables[cfgEditingId]=(cfgEditCounts.BOX===1&amp;&amp;m.physical===1)?&quot;BOX&quot;:m.max;
        cfgPlaceInCapacity(cfgEditingId,m.max,cfgEditCounts);
      }
      cfgApplyRenbanMembership(cfgEditingId,cfgEditMembers.map(x=&gt;x===old?cfgEditingId:x));
      saveState();renderAll();cfgClose();showToast(`${cfgEditingId} を保存しました`);
    }catch(e){document.getElementById(&quot;cfgEditError&quot;).textContent=e.message||String(e)}
  }

  function cfgNextName(area){
    const ids=cfgIdentityIds();
    if([&quot;S&quot;,&quot;C&quot;,&quot;D&quot;].includes(area)){
      let max=0;ids.filter(x=&gt;x.startsWith(area)).forEach(x=&gt;{const m=x.slice(1).match(/^\d+/);if(m)max=Math.max(max,Number(m[0]))});
      return area+(max+1);
    }
    const nums=ids.filter(x=&gt;/^\d+$/.test(x)).map(Number);
    if(area===&quot;8&quot;){const a=nums.filter(n=&gt;n&gt;=80&amp;&amp;n&lt;90);return String((a.length?Math.max(...a):79)+1)}
    if(area===&quot;9&quot;){const a=nums.filter(n=&gt;n&gt;=90);return String((a.length?Math.max(...a):89)+1)}
    return &quot;&quot;;
  }


  function cfgAssignNewRouteRank(id,area){
    const same=Object.keys(cfgStructures).filter(x=&gt;x!==id &amp;&amp; cfgAreaOf(x)===area);
    if(same.length){
      const max=Math.max(...same.map(cfgRank));
      cfgRouteRank[id]=max+0.5;
    }else{
      cfgRouteRank[id]=cfgNextRouteRank++;
    }
  }

  function cfgSaveAdd(){
    const area=document.getElementById(&quot;cfgArea&quot;).value,id=document.getElementById(&quot;cfgAddName&quot;).value.trim(),m=cfgMetric(cfgAddCounts);
    if(!area||!id||!m.physical){document.getElementById(&quot;cfgAddError&quot;).textContent=&quot;エリア・卓名・卓構成を確認してください。&quot;;return}
    if(cfgStructures[id]){document.getElementById(&quot;cfgAddError&quot;).textContent=`卓 ${id} はすでに存在します。`;return}
    cfgStructures[id]=JSON.parse(JSON.stringify(cfgAddCounts));
    cfgAssignNewRouteRank(id,area);
    fixedTables[id]=(cfgAddCounts.BOX===1&amp;&amp;m.physical===1)?&quot;BOX&quot;:m.max;
    cfgPlaceInCapacity(id,m.max,cfgAddCounts);
    if(cfgAddMembers.length)cfgApplyRenbanMembership(id,cfgAddMembers);
    saveState();renderAll();cfgClose();showToast(`${id} を追加しました`);
  }

  function cfgDelete(){
    if(!cfgEditingBase)return;
    const id=cfgEditingBase;

    const related=pairPrefixes.includes(id)?[id+&quot;A&quot;,id+&quot;B&quot;,id+&quot;AB&quot;]:[id];
    if(related.some(x=&gt;getStatus(x)!==&quot;empty&quot;||isCleaning(x)||isGrouped(x))){
      showToast(&quot;空席で手動連結されていない卓だけ削除できます&quot;);return;
    }

    const g=cfgGroupOf(id);
    if(g){
      cfgRenbanGroups=cfgRenbanGroups.filter(x=&gt;x!==g);
      const remain=g.filter(x=&gt;x!==id);
      if(remain.length&gt;=2)cfgRenbanGroups.push(remain);
    }

    if(pairPrefixes.includes(id)){
      const pi=pairPrefixes.indexOf(id);if(pi&gt;=0)pairPrefixes.splice(pi,1);
      [id+&quot;A&quot;,id+&quot;B&quot;,id+&quot;AB&quot;].forEach(x=&gt;{delete appState.states[x];delete appState.cleaning[x]});
      delete appState.merged[id];
    }

    delete fixedTables[id];
    delete cfgStructures[id];
    if(typeof cfgRouteRank!==&quot;undefined&quot;)delete cfgRouteRank[id];
    cfgRemoveFromOrders(id);
    delete appState.states[id];
    delete appState.cleaning[id];

    saveState();renderAll();cfgClose();showToast(`${id} を削除しました`);
  }

  function cfgPartsForId(id,capacity){
    const group=appState.groups.find(g=&gt;g.id===id);
    if(group)return group.ids.flatMap(x=&gt;cfgPartsForId(x,currentTables()[x]));
    if(/AB$/.test(id)){
      const p=id.slice(0,-2);return cfgStructures[p]?cfgExpandParts(cfgStructures[p]):[{cap:2},{cap:2}];
    }
    if(/[AB]$/.test(id)&amp;&amp;pairPrefixes.includes(id.slice(0,-1)))return [{cap:2}];
    if(cfgStructures[id])return cfgExpandParts(cfgStructures[id]);
    return [{cap:capacity===&quot;BOX&quot;?7:Number(capacity||0)}];
  }
  function cfgExpandParts(c){
    const out=[];cfgTypes.forEach(t=&gt;{for(let i=0;i&lt;(c[t.key]||0);i++)out.push({cap:t.cap,label:t.key})});return out;
  }
  function cfgPhysicalize(btn,id,capacity,label){
    const parts=cfgPartsForId(id,capacity);
    if(parts.length&lt;=1)return false;
    btn.classList.add(&quot;physical&quot;);btn.innerHTML=&quot;&quot;;
    parts.forEach(p=&gt;{
      const seg=document.createElement(&quot;span&quot;);seg.className=&quot;phys-seg&quot;;
      seg.style.flex=String(Math.max(1,p.cap));seg.textContent=p.label===&quot;BOX&quot;?&quot;BOX&quot;:p.cap;btn.appendChild(seg);
    });
    const ov=document.createElement(&quot;span&quot;);ov.className=&quot;phys-overlay&quot;;
    const total=parts.reduce((sum,p)=&gt;sum+p.cap,0);
    ov.innerHTML=`&lt;span&gt;${label}&lt;/span&gt;&lt;small&gt;MAX ${total}名&lt;/small&gt;`;btn.appendChild(ov);
    return true;
  }

function createTableButton(id, capacity){
    const btn = document.createElement(&quot;button&quot;);
    btn.className = &quot;table-btn &quot; + capacityClass(capacity) + &quot; &quot; + (isCleaning(id) ? &quot;cleaning&quot; : getStatus(id));
    if(manualSelected.has(id)) btn.classList.add(&quot;manual-selected&quot;);

    if(!cfgPhysicalize(btn,id,capacity,id)){
      btn.innerHTML = (isCleaning(id) ? &quot;清 &quot; : &quot;&quot;) + id + &#x27;&lt;span class=&quot;cap&quot;&gt;&#x27; + (capacity === &quot;BOX&quot; ? &quot;B&quot; : capacity) + &quot;&lt;/span&gt;&quot;;
    }

    btn.addEventListener(&quot;click&quot;, () =&gt; {
      if(!manualMode){
        setStatus([id]);
        return;
      }

      if(getStatus(id) !== &quot;empty&quot;){
        showToast(&quot;空席の卓だけ選択できます&quot;);
        return;
      }

      if(isGrouped(id)){
        showToast(&quot;すでに手動連結されています&quot;);
        return;
      }

      if(manualSelected.has(id)){
        manualSelected.delete(id);
      }else{
        manualSelected.add(id);
      }

      renderAll();
    });

    bindLongPress(btn,id);

    return btn;
  }


  function createManualGroupCard(group){
    const wrap = document.createElement(&quot;div&quot;);
    wrap.className = &quot;pair-card merged&quot;;

    /* Build the physical appearance from EACH member table, not from the
       group&#x27;s total capacity. Example: 80 + 81 must render as 6 + 6. */
    const parts = [];
    group.ids.forEach(memberId =&gt; {
      const info = partInfo(memberId);
      if(info){
        parts.push({...info.part});
        return;
      }
      if(isCompositeIdentity(memberId) &amp;&amp; appState.merged[memberId] !== false){
        structureParts(memberId).forEach(p =&gt; parts.push({...p}));
        return;
      }
      const one = structureParts(memberId)[0];
      if(one){
        parts.push({...one});
        return;
      }
      const cap = currentTables()[memberId];
      parts.push({cap:cap === &quot;BOX&quot; ? 7 : Number(cap || 0),box:cap === &quot;BOX&quot;});
    });

    const total = parts.reduce((sum,p) =&gt; sum + Number(p.cap||0),0);
    const table = document.createElement(&quot;button&quot;);
    table.className = `physical-table ${group.ids.some(id=&gt;isCleaning(id)) ? &quot;cleaning&quot; : (group.state || &quot;empty&quot;)}`;
    table.dataset.id = group.id;
    table.style.width = (parts.reduce((s,p)=&gt;s+seatWidth(p.cap,!!p.box),0)*52 + Math.max(0,parts.length-1)*7) + &quot;px&quot;;

    parts.forEach(p =&gt; {
      const seg = document.createElement(&quot;span&quot;);
      seg.className = `phys-seg ${baseClassForPart(p)}`;
      seg.style.flex = String(seatWidth(p.cap,!!p.box));
      seg.textContent = p.box ? &quot;BOX&quot; : p.cap;
      table.appendChild(seg);
    });

    const overlay = document.createElement(&quot;span&quot;);
    overlay.className = &quot;physical-overlay&quot;;
    overlay.innerHTML = `&lt;span&gt;${group.ids.join(&quot;・&quot;)}&lt;/span&gt;&lt;small&gt;MAX ${total}名&lt;/small&gt;`;
    table.appendChild(overlay);
    table.onclick = () =&gt; manualMode ? showToast(&quot;手動連結中です&quot;) : setStatus(group.ids);
    bindLongPress(table,group.ids);
    wrap.appendChild(table);

    const release = document.createElement(&quot;button&quot;);
    release.className = &quot;pair-action&quot;;
    release.textContent = &quot;解除&quot;;
    release.addEventListener(&quot;click&quot;, event =&gt; {
      event.stopPropagation();
      releaseManualGroup(group.id);
    });
    wrap.appendChild(release);

    return wrap;
  }

  function togglePair(prefix){
    const relatedIds = [prefix + &quot;AB&quot;, prefix + &quot;A&quot;, prefix + &quot;B&quot;];
    if(relatedIds.some(isGrouped)){
      showToast(&quot;先に手動連結を解除してください&quot;);
      return;
    }

    if(appState.merged[prefix]){
      const mergedId = prefix + &quot;AB&quot;;
      const oldStatus = getStatus(mergedId);
      const wasCleaning = !!appState.cleaning[mergedId];

      delete appState.states[mergedId];
      delete appState.cleaning[mergedId];
      appState.merged[prefix] = false;

      if(oldStatus !== &quot;empty&quot;){
        appState.states[prefix + &quot;A&quot;] = oldStatus;
        appState.states[prefix + &quot;B&quot;] = oldStatus;
      }
      if(wasCleaning){
        appState.cleaning[prefix + &quot;A&quot;] = true;
        appState.cleaning[prefix + &quot;B&quot;] = true;
      }
    }else{
      const aId = prefix + &quot;A&quot;;
      const bId = prefix + &quot;B&quot;;
      const aStatus = getStatus(aId);
      const bStatus = getStatus(bId);
      const wasCleaning = !!appState.cleaning[aId] || !!appState.cleaning[bId];

      delete appState.states[aId];
      delete appState.states[bId];
      delete appState.cleaning[aId];
      delete appState.cleaning[bId];
      appState.merged[prefix] = true;

      const mergedId = prefix + &quot;AB&quot;;
      if(aStatus === &quot;used&quot; || bStatus === &quot;used&quot;){
        appState.states[mergedId] = &quot;used&quot;;
      }else if(aStatus === &quot;reserved&quot; || bStatus === &quot;reserved&quot;){
        appState.states[mergedId] = &quot;reserved&quot;;
      }else if(wasCleaning){
        appState.cleaning[mergedId] = true;
      }
    }

    saveState();
    renderAll();
  }
  function createPairCard(prefix){
    const wrap = document.createElement(&quot;div&quot;);

    if(appState.merged[prefix]){
      wrap.className = &quot;pair-card merged&quot;;
      const mergedBtn=createTableButton(prefix + &quot;AB&quot;,4);
      const ov=mergedBtn.querySelector(&quot;.phys-overlay span&quot;);if(ov)ov.textContent=prefix;
      wrap.appendChild(mergedBtn);

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;分割&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }else{
      wrap.className = &quot;pair-card&quot;;
      wrap.appendChild(createTableButton(prefix + &quot;A&quot;, 2));
      wrap.appendChild(createTableButton(prefix + &quot;B&quot;, 2));

      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;pair-action&quot;;
      btn.textContent = &quot;連結&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; togglePair(prefix));
      wrap.appendChild(btn);
    }

    return wrap;
  }

  function countFree(ids){
    return ids.filter(id =&gt; getStatus(id) === &quot;empty&quot;).length;
  }

  function createSection(title, ids, pairMode){
    const section = document.createElement(&quot;section&quot;);
    section.className = &quot;card&quot;;

    let freeCount = ids.filter(id =&gt; !isGrouped(id) &amp;&amp; getStatus(id) === &quot;empty&quot;).length;
    const sectionCapacity = Number(title.replace(&quot;人卓&quot;,&quot;&quot;));
    const manualGroups = appState.groups.filter(group =&gt;
      group.capacity &lt;= 6 &amp;&amp; group.capacity === sectionCapacity
    );
    freeCount += manualGroups.filter(group =&gt; getStatus(group.id) === &quot;empty&quot;).length;

    if(pairMode === &quot;split-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(!appState.merged[prefix]){
          if(!isGrouped(prefix + &quot;A&quot;) &amp;&amp; getStatus(prefix + &quot;A&quot;) === &quot;empty&quot;) freeCount++;
          if(!isGrouped(prefix + &quot;B&quot;) &amp;&amp; getStatus(prefix + &quot;B&quot;) === &quot;empty&quot;) freeCount++;
        }
      });
    }

    if(pairMode === &quot;merged-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(appState.merged[prefix] &amp;&amp; !isGrouped(prefix + &quot;AB&quot;) &amp;&amp; getStatus(prefix + &quot;AB&quot;) === &quot;empty&quot;){
          freeCount++;
        }
      });
    }

    section.innerHTML =
      &#x27;&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;&#x27; + title + &#x27;&lt;/span&gt;&lt;span&gt;空き &#x27; + freeCount + &quot;&lt;/span&gt;&lt;/div&gt;&quot;;

    const grid = document.createElement(&quot;div&quot;);
    grid.className = &quot;table-grid&quot;;
    const tables = currentTables();
    const renderedGroups = new Set();

    /*
      Dynamic display route:
      do NOT use the old manualOrderByCapacity table here.
      A table keeps its original route position even when its capacity changes.
    */
    const pairRouteForSection = pairPrefixes.flatMap(prefix =&gt; [
      prefix+&quot;A&quot;, prefix+&quot;B&quot;, prefix+&quot;AB&quot;
    ]);
    const manualMemberIds = manualGroups.flatMap(group =&gt; group.ids);
    const route = [...new Set([
      ...ids,
      ...pairRouteForSection,
      ...manualMemberIds
    ])].sort(cfgRouteIdCompare);
    const orderedGroups = sortedManualGroups(manualGroups, sectionCapacity)
      .sort((a,b)=&gt;{
        const aa=Math.min(...a.ids.map(id=&gt;cfgRank(cfgRouteBase(id))));
        const bb=Math.min(...b.ids.map(id=&gt;cfgRank(cfgRouteBase(id))));
        return aa-bb;
      });

    function groupAt(id){
      return orderedGroups.find(group =&gt;
        !renderedGroups.has(group.id) &amp;&amp; group.ids.includes(id)
      );
    }

    route.forEach(routeId =&gt; {
      const group = groupAt(routeId);
      if(group){
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
        return;
      }

      const pairPrefix = pairPrefixes.find(prefix =&gt;
        routeId === prefix + &quot;A&quot; ||
        routeId === prefix + &quot;B&quot; ||
        routeId === prefix + &quot;AB&quot;
      );

      if(pairPrefix){
        if(
          pairMode === &quot;split-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;A&quot; &amp;&amp;
          !appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;A&quot;) &amp;&amp;
          !isGrouped(pairPrefix + &quot;B&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }

        if(
          pairMode === &quot;merged-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;AB&quot; &amp;&amp;
          appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;AB&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }
        return;
      }

      if(ids.includes(routeId) &amp;&amp; !isGrouped(routeId)){
        grid.appendChild(createTableButton(routeId, tables[routeId]));
      }
    });

    /*
      念のため、順序表にない卓が追加された場合だけ最後に表示する。
      現在の卓構成では通常ここには入らない。
    */
    orderedGroups
      .filter(group =&gt; !renderedGroups.has(group.id))
      .forEach(group =&gt; {
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
      });

    ids
      .filter(id =&gt; !route.includes(id) &amp;&amp; !isGrouped(id))
      .sort(cfgRouteIdCompare)
      .forEach(id =&gt; grid.appendChild(createTableButton(id, tables[id])));

    if(!grid.children.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;この種類の卓はありません。&quot;;
      grid.appendChild(empty);
    }

    section.appendChild(grid);
    return section;
  }

  function renderTables(){
    cfgSortOrders();
    const area = document.getElementById(&quot;tableArea&quot;);
    area.innerHTML = &quot;&quot;;

    if(tableView === &quot;all&quot; || tableView === &quot;2&quot;){
      area.appendChild(createSection(&quot;2人卓&quot;, twoFixedOrder, &quot;split-first&quot;));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;4&quot;){
      area.appendChild(createSection(&quot;4人卓&quot;, fourFixedOrder, &quot;merged-first&quot;));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;6&quot;){
      area.appendChild(createSection(&quot;6人卓&quot;, sixOrder, null));
    }

    if(tableView === &quot;all&quot; || tableView === &quot;BOX&quot;){
      area.appendChild(createSection(&quot;BOX&quot;, boxOrder, null));
    }
  }

  function maximalEmptyRuns(){
    const tables = currentTables();
    const runs = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          let total = 0;
          let allBox = true;

          run.forEach(id =&gt; {
            if(tables[id] === &quot;BOX&quot;){
              total += 7;
            }else{
              allBox = false;
              total += Number(tables[id]);
            }
          });

          runs.push({
            ids:[...run],
            label: run.length === 2 ? run.join(&quot;・&quot;) : run[0] + &quot;〜&quot; + run[run.length - 1],
            max:total,
            allBox
          });
        }
        run = [];
      };

      group.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    return runs;
  }

  function renderClusterStrip(){
    const strip = document.getElementById(&quot;clusterStrip&quot;);
    if(!strip) return;
    strip.innerHTML = &quot;&quot;;

    const runs = maximalEmptyRuns();

    if(!runs.length){
      const chip = document.createElement(&quot;span&quot;);
      chip.className = &quot;cluster-chip disabled&quot;;
      chip.textContent = &quot;空いている連続卓はありません&quot;;
      strip.appendChild(chip);
      return;
    }

    runs.forEach(run =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      btn.className = &quot;cluster-chip&quot;;
      btn.innerHTML =
        run.label +
        &quot;&lt;small&gt;&quot; +
        (run.allBox ? &quot;BOX×&quot; + run.ids.length : run.max + &quot;名 max&quot;) +
        &quot;&lt;/small&gt;&quot;;
      btn.addEventListener(&quot;click&quot;, () =&gt; {
        peopleFilter = &quot;all&quot;;
        renderPeopleRow();
        renderRenbanOptions();
        document.getElementById(&quot;renbanOptions&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;start&quot;});
        showToast(&quot;空き連番: &quot; + run.label);
      });
      strip.appendChild(btn);
    });
  }

  function allRenbanOptions(){
    const tables = currentTables();
    const options = [];

    const seatCapacity = id =&gt; {
      const value = tables[id];
      return value === &quot;BOX&quot; ? 7 : Number(value || 0);
    };

    recommendationRows().forEach(row =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(!run.length) return;

        /* 連続して空いている卓から、隣り合う全組み合わせを作る。
           2Fは卓種が多いので、4+4=8、6+4=10、BOX+BOX=14等も
           実際に隣接していれば候補として残す。 */
        for(let start = 0; start &lt; run.length; start++){
          let capacity = 0;

          for(let finish = start; finish &lt; run.length; finish++){
            const id = run[finish];
            capacity += seatCapacity(id);

            const ids = run.slice(start, finish + 1);
            if(ids.length &lt; 2) continue;

            const allBox = ids.every(x =&gt; tables[x] === &quot;BOX&quot;);

            if(allBox &amp;&amp; ids.length === 2){
              /* 2 BOX = MAX14.
                 実際の案内人数として9〜14名を選べるように、
                 人数フィルター用の候補を保持する。 */
              [9,10,11,12,13,14].forEach(pax =&gt; {
                options.push({
                  ids:[...ids],
                  pax,
                  capacity:14,
                  low:pax !== 14,
                  box:true
                });
              });
            }else{
              options.push({
                ids,
                pax:capacity,
                capacity,
                low:false,
                box:allBox
              });
            }
          }
        }

        run = [];
      };

      row.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 単卓候補 */
    Object.keys(tables)
      .filter(id =&gt; isVacant(id))
      .forEach(id =&gt; {
        if(tables[id] === &quot;BOX&quot;){
          options.push({
            ids:[id],
            pax:7,
            capacity:7,
            low:false,
            box:true,
            singleBox:true
          });

          /* 8名をBOX1卓に入れるのは最終手段だけ。
             候補自体は保持し、表示側で他案が無い時だけ使う。 */
          options.push({
            ids:[id],
            pax:8,
            capacity:7,
            low:true,
            box:true,
            singleBox:true,
            tightEight:true
          });
        }else{
          const capacity = Number(tables[id] || 0);
          if(capacity &gt; 0){
            options.push({
              ids:[id],
              pax:capacity,
              capacity,
              low:false,
              box:false
            });
          }
        }
      });

    options.forEach(option =&gt; {
      option.cleaning = option.ids.some(id =&gt; isCleaning(id));
    });

    const seen = new Set();

    return options
      .filter(option =&gt; {
        const key =
          option.pax + &quot;|&quot; +
          option.capacity + &quot;|&quot; +
          option.ids.join(&quot;-&quot;) + &quot;|&quot; +
          Number(!!option.tightEight);

        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a,b) =&gt;
        a.pax - b.pax ||
        Number(a.low) - Number(b.low) ||
        a.ids.length - b.ids.length
      );
  }

  function renderPeopleRow(){
    const row = document.getElementById(&quot;peopleRow&quot;);
    row.innerHTML = &quot;&quot;;

    const options = allRenbanOptions();
    const availablePax = new Set();

    /* Các mức nhỏ giữ theo những lựa chọn vốn có của 2F. */
    options.forEach(item =&gt; {
      const pax = Number(item.pax);
      if(Number.isFinite(pax)) availablePax.add(pax);
    });

    /* Từ 9 người trở lên phải hiển thị LIÊN TỤC tới MAX hiện tại,
       không phụ thuộc MAX đó đến từ 2 BOX hay từ các bàn đặc thù khác.
       Ví dụ còn phương án MAX14 thì luôn có 9,10,11,12,13,14.
       Nếu MAX12 thì có 9,10,11,12. */
    const maxGuideCapacity = options.reduce((max,item) =&gt; {
      const cap = Number(item.capacity ?? item.pax);
      return Number.isFinite(cap) ? Math.max(max,cap) : max;
    },0);

    if(maxGuideCapacity &gt;= 9){
      for(let n=9; n&lt;=maxGuideCapacity; n++){
        availablePax.add(n);
      }
    }

    const capacities = [...availablePax]
      .filter(value =&gt; Number.isFinite(Number(value)))
      .map(Number)
      .sort((a,b) =&gt; a-b);

    const choices = [
      [&quot;all&quot;,&quot;全部&quot;],
      ...capacities.map(value =&gt; [String(value), value + &quot;名&quot;])
    ];

    choices.forEach(([value,label]) =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      btn.textContent = label;
      btn.classList.toggle(&quot;active&quot;, peopleFilter === value);
      btn.addEventListener(&quot;click&quot;, () =&gt; {

        renderPeopleRow();
        renderRenbanOptions();
      });
      row.appendChild(btn);
    });
  }

  function updateRenbanArrows(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);
    const max = Math.max(0, holder.scrollWidth - holder.clientWidth);
    prev.disabled = holder.scrollLeft &lt;= 2;
    next.disabled = holder.scrollLeft &gt;= max - 2;
  }

  function setupRenbanScroller(){
    const holder = document.getElementById(&quot;renbanOptions&quot;);
    const prev = document.getElementById(&quot;renbanPrev&quot;);
    const next = document.getElementById(&quot;renbanNext&quot;);

    prev.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:-holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    next.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    holder.addEventListener(&quot;scroll&quot;, updateRenbanArrows, {passive:true});

    let dragging = false;
    let startX = 0;
    let startScroll = 0;

    holder.addEventListener(&quot;pointerdown&quot;, event =&gt; {
      if(event.pointerType === &quot;touch&quot;) return;

      /* おすすめ案ボタンをクリックした時は、
         親の横スクロールがpointerを奪わないようにする。
         これが原因でPCでは案を押してもclickが発火しなかった。 */
      if(event.target.closest(&quot;.renban-option&quot;)) return;

      dragging = true;
      startX = event.clientX;
      startScroll = holder.scrollLeft;
      holder.classList.add(&quot;dragging&quot;);
      holder.setPointerCapture(event.pointerId);
    });

    holder.addEventListener(&quot;pointermove&quot;, event =&gt; {
      if(!dragging) return;
      holder.scrollLeft = startScroll - (event.clientX - startX);
    });

    const stopDragging = event =&gt; {
      if(!dragging) return;
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
      try{ holder.releasePointerCapture(event.pointerId); }catch{}
    };

    holder.addEventListener(&quot;pointerup&quot;, stopDragging);
    holder.addEventListener(&quot;pointercancel&quot;, stopDragging);
    holder.addEventListener(&quot;lostpointercapture&quot;, () =&gt; {
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
    });

    window.addEventListener(&quot;resize&quot;, updateRenbanArrows);
  }


  function remainingRenbanScore(usedIds){
    const used = new Set(usedIds);
    const tables = currentTables();

    const capOf = id =&gt; {
      const value = tables[id];
      return value === &quot;BOX&quot; ? 7 : Number(value || 0);
    };

    let bestCapacity = 0;
    let totalCapacityInRuns = 0;

    recommendationRows().forEach(row =&gt; {
      let runCapacity = 0;
      let runLength = 0;

      const flush = () =&gt; {
        if(runLength &gt;= 2){
          totalCapacityInRuns += runCapacity;
          bestCapacity = Math.max(bestCapacity, runCapacity);
        }
        runCapacity = 0;
        runLength = 0;
      };

      row.forEach(id =&gt; {
        if(isVacant(id) &amp;&amp; !used.has(id)){
          runLength++;
          runCapacity += capOf(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 最大連番容量を最優先、同じなら残っている連番容量の合計。 */
    return bestCapacity * 1000 + totalCapacityInRuns;
  }

  function physicalCountForId(id){
    const group = appState.groups.find(g =&gt; g.id === id);
    if(group) return group.ids.reduce((sum,x)=&gt;sum+physicalCountForId(x),0);

    const tables = currentTables();
    const cap = tables[id] === &quot;BOX&quot; ? 7 : Number(tables[id] || 0);

    if(/AB$/.test(id)) return 2;
    return 1;
  }

  function cleaningEffort(option){
    let physical = 0;
    let capacity = 0;
    option.ids.forEach(id =&gt; {
      if(isCleaning(id)){
        physical += physicalCountForId(id);
        const tables = currentTables();
        capacity += tables[id] === &quot;BOX&quot; ? 7 : Number(tables[id] || 0);
      }
    });
    return {physical, capacity};
  }

  function cleaningPhysicalKeys(option){
    const keys = [];

    const expand = id =&gt; {
      const group = appState.groups.find(g =&gt; g.id === id);
      if(group){
        group.ids.forEach(expand);
        return;
      }

      if(/AB$/.test(id)){
        const prefix = id.slice(0,-2);
        keys.push(prefix + &quot;A&quot;, prefix + &quot;B&quot;);
        return;
      }

      keys.push(id);
    };

    option.ids.forEach(id =&gt; {
      if(isCleaning(id)) expand(id);
    });

    return [...new Set(keys)];
  }

  function cleaningSetDominated(option, candidates){
    const mine = new Set(cleaningPhysicalKeys(option));
    if(!mine.size) return false;

    return candidates.some(other =&gt; {
      if(other === option) return false;

      const theirs = new Set(cleaningPhysicalKeys(other));
      if(!theirs.size || theirs.size &gt;= mine.size) return false;

      /* Remove an option only when another same-MAX option needs cleaning
         a strict SUBSET of the exact same physical tables.
         Example:
         clean 82AB+83AB  vs  clean 83AB + use clean 84AB
         -&gt; {83A,83B} is a strict subset of {82A,82B,83A,83B},
            so the heavier option is unnecessary.

         But 82AB vs 99+100 are different physical-table choices,
         so neither is a subset of the other and BOTH remain. */
      for(const key of theirs){
        if(!mine.has(key)) return false;
      }
      return true;
    });
  }

  function applyRecommendationOption(option){
    /* Khi bấm một phương án trong おすすめ案:
       - xóa 清掃待ち của mọi bàn thuộc phương án
       - áp dụng thẳng trạng thái đang chọn (席取り / 使用中 / 空席)
       - KHÔNG bắt buộc tạo group ghép mới
       Như vậy ví dụ C7 đang 清掃待ち + C8 đang sạch:
       bấm phương án khi chọn 使用中 =&gt; cả C7 và C8 đều thành 使用中. */
    const expanded = new Set();

    option.ids.forEach(id =&gt; {
      const group = groupFor(id);
      if(group){
        group.ids.forEach(x =&gt; expanded.add(x));
      }else{
        expanded.add(id);
      }
    });

    [...expanded].forEach(id =&gt; {
      delete appState.cleaning[id];

      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    /* Nếu phương án chạm vào một group đã tồn tại thì cập nhật group đó.
       Không tự tạo group mới chỉ vì chọn một phương án đề nghị. */
    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
        group.ids.forEach(id =&gt; delete appState.cleaning[id]);
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

function renderRenbanOptions(){
    const all = allRenbanOptions();
    let filtered;

    if(peopleFilter === &quot;all&quot;){
      filtered = [...all].sort((a,b) =&gt;
        Number(a.cleaning) - Number(b.cleaning) ||
        Number(!!a.tightEight) - Number(!!b.tightEight) ||
        compareRecommendationRoute(a,b)
      );
    }else{
      const requested = Number(peopleFilter);
      const capacityOf = item =&gt; item.capacity ?? item.pax;

      /* 8名用のBOX1卓だけは通常候補とは別枠。
         ただし完全に消さず、比較候補として最後に残す。 */
      const normalAll = all.filter(item =&gt;
        !item.tightEight &amp;&amp;
        capacityOf(item) &gt;= requested
      );

      const deduped = new Map();
      normalAll.forEach(item =&gt; {
        const key = item.ids.join(&quot;-&quot;);
        const current = deduped.get(key);

        if(!current ||
           capacityOf(item) &lt; capacityOf(current) ||
           (capacityOf(item) === capacityOf(current) &amp;&amp;
            Number(item.low) &lt; Number(current.low))){
          deduped.set(key,item);
        }
      });
      const normal = [...deduped.values()];

      const keepReasonableCombos = list =&gt; {
        if(!list.length) return [];

        const singles = list.filter(item =&gt; item.ids.length === 1);
        const combos = list.filter(item =&gt; item.ids.length &gt; 1);
        const minOverallCapacity = Math.min(
          ...list.map(item =&gt; capacityOf(item))
        );

        /* 現在の分割/連結状態をその時点の実配置として扱う。
           - ids.length===1: すでに存在する単卓 / 当日すでに連結済みの卓
             → MAXが大きくても予備候補として残す
           - ids.length&gt;1: 今から新しく連結する案
             → 必要最小MAXの案だけ残す
           例：2名で82A/82Bが分割中なら82A+82B=4は出さない。
               82ABとして連結済みならMAX4の予備候補として出す。 */
        return [
          ...singles,
          ...combos.filter(item =&gt; capacityOf(item) === minOverallCapacity)
        ];
      };

      const sorter = (a,b) =&gt; {
        const capA = capacityOf(a);
        const capB = capacityOf(b);

        /* まず人数に近いMAXを優先。 */
        const capacityDiff =
          (capA - requested) - (capB - requested);
        if(capacityDiff) return capacityDiff;

        /* 清掃待ち同士では、表示上の「1卓/2卓」より先に
           実際の清掃負担を見る。
           82AB等は実卓2卓として数える。 */
        if(a.cleaning &amp;&amp; b.cleaning){
          const ea = cleaningEffort(a);
          const eb = cleaningEffort(b);

          const cleanDiff =
            ea.physical - eb.physical ||
            ea.capacity - eb.capacity;
          if(cleanDiff) return cleanDiff;
        }

        /* 次に、残る連番のMAX容量を大きく保つ。 */
        const renDiff =
          remainingRenbanScore(b.ids) - remainingRenbanScore(a.ids);
        if(renDiff) return renDiff;

        /* ここまで同じなら、実際に使う表示単位数が少ない方。 */
        const tableCountDiff = a.ids.length - b.ids.length;
        if(tableCountDiff) return tableCountDiff;

        return compareRecommendationRoute(a,b);
      };

      const ready = keepReasonableCombos(
        normal.filter(item =&gt; !item.cleaning)
      ).sort(sorter);

      const waitingBase = keepReasonableCombos(
        normal.filter(item =&gt; item.cleaning)
      );

      let waiting = [];
      if(waitingBase.length){
        /* 清掃待ちはまず「必要十分なMAX」に絞る。 */
        const minWaitingCapacity = Math.min(
          ...waitingBase.map(item =&gt; capacityOf(item))
        );

        const sameCapacity = waitingBase
          .filter(item =&gt; capacityOf(item) === minWaitingCapacity);

        /* 同じMAXでも、他の候補が「同じ清掃卓の一部だけ」を掃除すれば
           成立するなら、余分に掃除する案は不要なので除外する。
           ただし清掃する卓の場所が違う案は残す。
           これで:
           - 8名: 83AB清掃+84AB空席 があるなら
                  82AB+83AB両方清掃 は消える
           - 4名: 82AB清掃 と 99+100清掃 は
                  後客用の2人卓温存という意味が違うので両方残る */
        waiting = sameCapacity
          .filter(item =&gt; !cleaningSetDominated(item, sameCapacity))
          .sort(sorter);
      }

      /* 8名時のBOX1卓:
         - 空いているBOXなら、待たずに案内できる比較候補として残す
         - 清掃待ちBOXも、2卓掃除などと比較できるよう残す
         ただし通常の8名向け候補より後ろに置く。 */
      let box8Ready = [];
      let box8Waiting = [];

      if(requested === 8){
        box8Ready = all
          .filter(item =&gt; item.tightEight &amp;&amp; !item.cleaning)
          .sort(compareRecommendationRoute);

        const allBoxWaiting = all
          .filter(item =&gt; item.tightEight &amp;&amp; item.cleaning)
          .sort((a,b) =&gt; {
            const ea = cleaningEffort(a);
            const eb = cleaningEffort(b);
            return ea.physical - eb.physical ||
                   ea.capacity - eb.capacity ||
                   compareRecommendationRoute(a,b);
          });

        /* BOXは8名だと窮屈なので通常は後順位。
           ただし、通常案より明らかに掃除が早い
           （例：BOX1卓掃除 vs 4人卓2卓分掃除）なら比較候補として残す。 */
        if(allBoxWaiting.length){
          const bestNormalCleaningPhysical =
            waiting.length
              ? Math.min(...waiting.map(item =&gt; cleaningEffort(item).physical))
              : Infinity;

          box8Waiting = allBoxWaiting.filter(item =&gt;
            cleaningEffort(item).physical &lt; bestNormalCleaningPhysical
          );
        }
      }

      /* お客様優先:
         1) 通常の案内可能
         2) BOX1卓8名（空席・窮屈だが待たない）
         3) 通常の清掃待ち
         4) BOX1卓8名の清掃待ち
         こうすることで、空いているBOXと「2卓掃除」も比較でき、
         清掃BOX候補も消えない。 */
      filtered = [
        ...ready,
        ...box8Ready,
        ...waiting,
        ...box8Waiting
      ];
    }

    document.getElementById(&quot;renbanCount&quot;).textContent = filtered.length + &quot;案&quot;;

    const holder = document.getElementById(&quot;renbanOptions&quot;);
    holder.innerHTML = &quot;&quot;;

    if(!filtered.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;案内できる空席候補はありません。&quot;;
      holder.appendChild(empty);
      requestAnimationFrame(updateRenbanArrows);
      return;
    }

    const tables = currentTables();
    const requested = peopleFilter === &quot;all&quot; ? null : Number(peopleFilter);

    filtered.forEach(option =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      const cap = option.capacity ?? option.pax;
      const excess = requested === null ? 0 : Math.max(0, cap - requested);

      let priorityClass = &quot;&quot;;
      let priorityLabel = &quot;&quot;;

      if(option.tightEight &amp;&amp; !option.cleaning){
        priorityClass = &quot; box8-fallback&quot;;
        priorityLabel = &quot;予備&quot;;
      }else if(option.tightEight &amp;&amp; option.cleaning){
        priorityClass = &quot; low&quot;;
        priorityLabel = &quot;清掃待ち&quot;;
      }else if(option.cleaning){
        priorityClass = &quot; low&quot;;
        priorityLabel = &quot;清掃待ち&quot;;
      }else if(requested !== null){
        if(excess === 0){
          priorityClass = &quot; priority-1&quot;;
          priorityLabel = &quot;優先&quot;;
        }else if(excess === 1){
          priorityClass = &quot; priority-2&quot;;
          priorityLabel = &quot;次点&quot;;
        }else{
          priorityClass = &quot; priority-3&quot;;
          priorityLabel = &quot;予備&quot;;
        }
      }else{
        priorityClass = option.low ? &quot; low&quot; : &quot;&quot;;
        priorityLabel = option.low ? &quot;優先度低&quot; : &quot;使用可能&quot;;
      }

      btn.className = &quot;renban-option&quot; + priorityClass;

      let note;

      if(option.tightEight &amp;&amp; !option.cleaning){
        note = &quot;予備・BOXは7名推奨・8名は窮屈・待ち時間なし&quot;;
      }else if(option.tightEight &amp;&amp; option.cleaning){
        const effort = cleaningEffort(option);
        const renScore = remainingRenbanScore(option.ids);
        const remainingMaxRenban = Math.floor(renScore / 1000);
        note =
          &quot;清掃待ち・BOXは7名推奨・8名は窮屈&quot; +
          &quot;・清掃&quot; + effort.physical + &quot;卓&quot; +
          &quot;・残す連番MAX &quot; + remainingMaxRenban + &quot;名&quot;;
      }else if(option.cleaning){
        const effort = cleaningEffort(option);
        const renScore = remainingRenbanScore(option.ids);
        const remainingMaxRenban = Math.floor(renScore / 1000);
        note =
          &quot;清掃待ち・MAX &quot; + cap + &quot;名&quot; +
          &quot;・清掃&quot; + effort.physical + &quot;卓&quot; +
          &quot;・残す連番MAX &quot; + remainingMaxRenban + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else if(requested !== null){
        note =
          priorityLabel + &quot;・&quot; +
          option.ids.length + &quot;卓・MAX &quot; + cap + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else{
        note = priorityLabel;
      }

      btn.innerHTML =
        &quot;&lt;strong&gt;&quot; + (requested ?? option.pax) + &quot;名&lt;/strong&gt;&quot; +
        &#x27;&lt;div class=&quot;chips&quot;&gt;&#x27; +
        option.ids.map(id =&gt;
          &#x27;&lt;span class=&quot;chip &#x27; + capacityClass(tables[id]) + &#x27;&quot;&gt;&#x27; +
          id +
          &quot;&lt;/span&gt;&quot;
        ).join(&quot;&quot;) +
        &quot;&lt;/div&gt;&quot; +
        &quot;&lt;small&gt;&quot; + note + &quot;&lt;/small&gt;&quot;;

  function renderLargeManualGroups(){

    const configuredLarge = Object.keys(cfgStructures)
      .filter(base =&gt; isCompositeIdentity(base) &amp;&amp; totalCap(base) &gt; 6);

    /* Large-table section uses natural identity order, not creation order
       and not area-route rank. Example: 80・81 -&gt; 80, 89 -&gt; 89, 90・91 -&gt; 90. */
    const largeSortKeyForId = id =&gt; {
      const base = cfgRouteBase(String(id)).toUpperCase();
      const m = base.match(/^(\D*?)(\d+)(.*)$/);
      if(m){
        const prefix = m[1] || &quot;&quot;;
        const prefixRank = prefix===&quot;&quot; ? 0 : prefix===&quot;S&quot; ? 1 : prefix===&quot;C&quot; ? 2 : prefix===&quot;D&quot; ? 3 : 9;
        return {prefixRank,num:Number(m[2]),suffix:m[3]||&quot;&quot;,raw:base};

      return {prefixRank:99,num:Number.MAX_SAFE_INTEGER,suffix:&quot;&quot;,raw:base};
    };
    const compareLargeKey = (a,b) =&gt;
      a.prefixRank-b.prefixRank ||
      a.num-b.num ||
      a.suffix.localeCompare(b.suffix,&quot;ja&quot;,{numeric:true}) ||
      a.raw.localeCompare(b.raw,&quot;ja&quot;,{numeric:true});
    const minLargeKey = ids =&gt; ids.map(largeSortKeyForId).sort(compareLargeKey)[0];

    const displayItems = [];

    configuredLarge.forEach(base =&gt; {

      /* If consumed by a manual group, that manual group owns the display. */
      if(active.some(id =&gt; isGrouped(id)) || isGrouped(base)) return;
      displayItems.push({
        kind:&quot;composite&quot;,
        base,
        sortKey:largeSortKeyForId(base),
        label:String(base)

    });

    manualGroups.forEach(group =&gt; {
      displayItems.push({
        kind:&quot;manual&quot;,
        group,
        sortKey:minLargeKey(group.ids),
        label:group.ids.join(&quot;・&quot;)

    });

    displayItems.sort((a,b) =&gt;
      compareLargeKey(a.sortKey,b.sortKey) ||
      a.label.localeCompare(b.label,&quot;ja&quot;,{numeric:true})
    );

    section.hidden = displayItems.length === 0;
    count.textContent = displayItems.length + &quot;組&quot;;
    grid.innerHTML = &quot;&quot;;

      grid.appendChild(
        item.kind === &quot;manual&quot;

          : compositeCard(item.base)
      );
    });
  }

  function rebuildOrders(){

    else{const ids=compositePartIds(base);if(ids.some(x=&gt;getStatus(x)!==&quot;empty&quot;||isCleaning(x))){showToast(&quot;すべて空席にしてから連結してください&quot;);return}ids.forEach(x=&gt;{delete appState.states[x];delete appState.cleaning[x]});appState.merged[base]=true}
    saveState();rebuildOrders();renderAll();
  }
  function compositeCard(base){const w=document.createElement(&quot;div&quot;);w.className=&quot;composite-card&quot;;if(appState.merged[base]!==false)w.appendChild(createPhysicalMerged(base));else compositePartIds(base).forEach(id=&gt;w.appendChild(createTableButton(id,currentTables()[id])));const t=document.createElement(&quot;button&quot;);t.className=&quot;composite-toggle&quot;;t.textContent=appState.merged[base]!==false?&quot;分割&quot;:&quot;連結&quot;;t.onclick=e=&gt;{e.stopPropagation();toggleComposite2F(base)};w.appendChild(t);return w}

  createSection=function(title,ids,pairMode){
    const section=document.createElement(&quot;section&quot;);section.className=&quot;card&quot;;
    const capacityKey=title.startsWith(&quot;2&quot;)?2:title.startsWith(&quot;4&quot;)?4:title.startsWith(&quot;6&quot;)?6:&quot;BOX&quot;;
    rebuildOrders();
    const all=[];
    const sectionForTotal=max=&gt;max&lt;=2?2:max&lt;=4?4:max&lt;=6?6:&quot;LARGE&quot;;
    Object.keys(cfgStructures).sort(naturalIdentityCompare).forEach(base=&gt;{
      const parts=structureParts(base); if(!parts.length)return;
      if(parts.length&gt;1){
        const merged=appState.merged[base]!==false;
        let home;
        if(merged){ home=sectionForTotal(totalCap(base)); }
        else{
          const keys=[...new Set(parts.map(p=&gt;p.box?&quot;BOX&quot;:p.cap))];
          home=keys.length===1?keys[0]:sectionForTotal(totalCap(base));
        }
        if(home===capacityKey)all.push({base,composite:true});
      }else{
        const p=parts[0],home=p.box?&quot;BOX&quot;:p.cap;if(home===capacityKey)all.push({id:base,base});
      }
    });
    all.sort((a,b)=&gt;naturalIdentityCompare(a.base,b.base));
    let free=0;
    all.forEach(x=&gt;{
      if(x.composite){
        const active=activeIdsForIdentity(x.base);free+=active.filter(id=&gt;getStatus(id)===&quot;empty&quot;&amp;&amp;!isCleaning(id)&amp;&amp;!isGrouped(id)).length;
      }else if(getStatus(x.id)===&quot;empty&quot;&amp;&amp;!isCleaning(x.id)&amp;&amp;!isGrouped(x.id))free++;
    });
    section.innerHTML=`&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;${title}&lt;/span&gt;&lt;span&gt;空き ${free}&lt;/span&gt;&lt;/div&gt;`;
    const grid=document.createElement(&quot;div&quot;);grid.className=&quot;table-grid&quot;;

    if(!grid.children.length){const e=document.createElement(&quot;div&quot;);e.className=&quot;empty-note&quot;;e.textContent=&quot;この種類の卓はありません。&quot;;grid.appendChild(e)}
    section.appendChild(grid);return section;
  };

  function bulkDeleteUpdate(){const bar=document.getElementById(&quot;bulkDeleteBar&quot;);bar.classList.toggle(&quot;show&quot;,bulkDeleteMode);document.getElementById(&quot;bulkDeleteCount&quot;).textContent=`${bulkDeleteSelected.size}卓 選択`;document.getElementById(&quot;bulkDeleteCommit&quot;).disabled=!bulkDeleteSelected.size}
  function bulkDeleteToggle(id){bulkDeleteSelected.has(id)?bulkDeleteSelected.delete(id):bulkDeleteSelected.add(id);bulkDeleteUpdate();renderAll()}
  function deleteOne(id){
    const pi=partInfo(id);
    if(pi){
      if(getStatus(id)!==&quot;empty&quot;||isCleaning(id)||isGrouped(id))return false;
      const base=pi.base,parts=structureParts(base),oldIds=compositePartIds(base);
      const snaps=Object.fromEntries(oldIds.map(x=&gt;[x,{s:appState.states[x],c:appState.cleaning[x]}]));
      parts.splice(pi.index,1);
      const counts={&quot;2&quot;:0,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:0};parts.forEach(p=&gt;counts[p.key]++);cfgStructures[base]=counts;
      oldIds.forEach(x=&gt;{delete appState.states[x];delete appState.cleaning[x]});
      const nextIds=compositePartIds(base);parts.forEach((_,i)=&gt;{const oldIndex=i&gt;=pi.index?i+1:i,snap=snaps[oldIds[oldIndex]];if(snap?.s!==undefined)appState.states[nextIds[i]]=snap.s;if(snap?.c!==undefined)appState.cleaning[nextIds[i]]=snap.c});
      appState.groups.forEach(g=&gt;{g.ids=g.ids.filter(x=&gt;x!==id)});appState.groups=appState.groups.filter(g=&gt;g.ids.length&gt;=2);
      if(parts.length===0){delete cfgStructures[base];delete appState.merged[base];cfgRenbanGroups=cfgRenbanGroups.map(g=&gt;g.filter(x=&gt;x!==base)).filter(g=&gt;g.length&gt;=2)}
      else if(parts.length===1){delete appState.merged[base]}
      else appState.merged[base]=false;
      return true;
    }
    if(!cfgStructures[id])return false;
    const active=activeIdsForIdentity(id);if(active.some(x=&gt;getStatus(x)!==&quot;empty&quot;||isCleaning(x)||isGrouped(x)))return false;
    delete cfgStructures[id];delete appState.states[id];delete appState.cleaning[id];delete appState.merged[id];cfgRenbanGroups=cfgRenbanGroups.map(g=&gt;g.filter(x=&gt;x!==id)).filter(g=&gt;g.length&gt;=2);return true;
  }
  function bulkDeleteCommit2(){let n=0;const bad=[];[...bulkDeleteSelected].forEach(id=&gt;deleteOne(id)?n++:bad.push(id));bulkDeleteMode=false;bulkDeleteSelected.clear();saveLayout2F();saveState();rebuildOrders();bulkDeleteUpdate();renderAll();showToast(bad.length?`${n}卓削除 / 削除不可: ${bad.join(&quot;・&quot;)}`:`${n}卓 を削除しました`)}

  /* ===== 2F display by real renban area: 8 -&gt; C -&gt; S -&gt; 9 -&gt; D ===== */
  function areaIdentityClusters(areaKey){
    const all=Object.keys(cfgStructures).filter(id=&gt;cfgAreaOf(id)===areaKey).sort(naturalIdentityCompare);
    const inGroup=new Set();
    const clusters=[];

    cfgRenbanGroups.forEach(g=&gt;{
      const members=g.filter(id=&gt;cfgStructures[id]&amp;&amp;cfgAreaOf(id)===areaKey).sort(naturalIdentityCompare);
      if(!members.length)return;
      members.forEach(id=&gt;inGroup.add(id));
      clusters.push({ids:members,label:members.length&gt;1?`${members[0]}–${members[members.length-1]}`:members[0],rank:members[0]});
    });

    /* S is a real area but has no separate renban definitions in the base data. */
    if(areaKey===&#x27;S&#x27; &amp;&amp; all.length){
      const sids=all.filter(id=&gt;!inGroup.has(id));
      if(sids.length){sids.forEach(id=&gt;inGroup.add(id));clusters.push({ids:sids,label:sids.length&gt;1?`${sids[0]}–${sids[sids.length-1]}`:sids[0],rank:sids[0]})}
    }

    /* New/unassigned identities stay in their real area as their own cluster. */
    all.filter(id=&gt;!inGroup.has(id)).forEach(id=&gt;clusters.push({ids:[id],label:id,rank:id}));
    return clusters.sort((a,b)=&gt;naturalIdentityCompare(a.rank,b.rank));
  }

  function groupIdentityBases(group){
    return [...new Set(group.ids.map(identityOfActive))];
  }

  function renderRenbanCluster(cluster){
    const box=document.createElement(&#x27;div&#x27;);box.className=&#x27;renban-cluster&#x27;;
    const activeIds=cluster.ids.flatMap(activeIdsForIdentity);
    const activeSet=new Set(activeIds);
    const groups=appState.groups.filter(g=&gt;g.ids.some(id=&gt;activeSet.has(id)));
    const groupedIds=new Set(groups.flatMap(g=&gt;g.ids));
    const free=activeIds.filter(id=&gt;!groupedIds.has(id)&amp;&amp;getStatus(id)===&#x27;empty&#x27;&amp;&amp;!isCleaning(id)).length
      + groups.filter(g=&gt;(g.state||&#x27;empty&#x27;)===&#x27;empty&#x27;&amp;&amp;!isCleaning(g.id)).length;
    box.innerHTML=`&lt;div class=&quot;renban-cluster-title&quot;&gt;&lt;span&gt;${cluster.label}&lt;/span&gt;&lt;/div&gt;`;
    const grid=document.createElement(&#x27;div&#x27;);grid.className=&#x27;renban-cluster-grid&#x27;;

    const renderedGroups=new Set();
    cluster.ids.forEach(base=&gt;{
      const baseActive=activeIdsForIdentity(base);
      const touching=groups.filter(g=&gt;g.ids.some(id=&gt;baseActive.includes(id)));
      touching.forEach(g=&gt;{
        if(renderedGroups.has(g.id))return;
        grid.appendChild(createManualGroupCard(g));
        renderedGroups.add(g.id);
      });

      const ungrouped=baseActive.filter(id=&gt;!groupedIds.has(id));
      if(!ungrouped.length)return;
      if(isCompositeIdentity(base)){
        if(ungrouped.length===baseActive.length){
          grid.appendChild(compositeCard(base));
        }else{
          /* A partially manual-linked split composite cannot be re-merged until the manual group is released. */
          ungrouped.forEach(id=&gt;grid.appendChild(createTableButton(id,currentTables()[id])));
        }
      }else{
        grid.appendChild(createTableButton(base,currentTables()[base]));
      }
    });

    groups.filter(g=&gt;!renderedGroups.has(g.id)).forEach(g=&gt;grid.appendChild(createManualGroupCard(g)));
    if(!grid.children.length){const e=document.createElement(&#x27;div&#x27;);e.className=&#x27;empty-note&#x27;;e.textContent=&#x27;卓がありません。&#x27;;grid.appendChild(e)}
    box.appendChild(grid);return box;
  }

  function renbanRunsForArea(areaKey){
    return maximalEmptyRuns().filter(run=&gt;{
      if(!run.ids.length)return false;
      const bases=run.ids.map(identityOfActive);
      return bases.every(id=&gt;cfgAreaOf(id)===areaKey);
    });
  }

  function renderAreaRenbanStrip(areaKey){
    const wrap=document.createElement(&#x27;div&#x27;);
    const label=document.createElement(&#x27;div&#x27;);
    label.className=&#x27;renban-area-renban-label&#x27;;

    const strip=document.createElement(&#x27;div&#x27;);
    strip.className=&#x27;area-renban-strip&#x27;;

    if(!runs.length){
      const chip=document.createElement(&#x27;span&#x27;);

    }else{
      runs.forEach(run=&gt;{

        btn.type=&#x27;button&#x27;;

        btn.onclick=()=&gt;{

          renderRenbanOptions();

    return wrap;

  function renderTablesByRenbanArea(){
    rebuildOrders();
    const root=document.getElementById(&#x27;tableArea&#x27;);root.innerHTML=&#x27;&#x27;;
    const areaLabels={&#x27;8&#x27;:&#x27;8系&#x27;,&#x27;S&#x27;:&#x27;S系&#x27;,&#x27;9&#x27;:&#x27;9系&#x27;,&#x27;C&#x27;:&#x27;C系&#x27;,&#x27;D&#x27;:&#x27;D系&#x27;};
    [&#x27;8&#x27;,&#x27;C&#x27;,&#x27;S&#x27;,&#x27;9&#x27;,&#x27;D&#x27;].forEach(areaKey=&gt;{
      const clusters=areaIdentityClusters(areaKey);
      if(!clusters.length)return;
      const section=document.createElement(&#x27;section&#x27;);section.className=&#x27;renban-area&#x27;;
      const totalIds=clusters.flatMap(c=&gt;c.ids.flatMap(activeIdsForIdentity));
      const areaGroups=appState.groups.filter(g=&gt;g.ids.some(id=&gt;totalIds.includes(id)));
      const grouped=new Set(areaGroups.flatMap(g=&gt;g.ids));
      const free=totalIds.filter(id=&gt;!grouped.has(id)&amp;&amp;getStatus(id)===&#x27;empty&#x27;&amp;&amp;!isCleaning(id)).length + areaGroups.filter(g=&gt;(g.state||&#x27;empty&#x27;)===&#x27;empty&#x27;).length;
      section.innerHTML=`&lt;div class=&quot;renban-area-title&quot;&gt;&lt;span&gt;${areaLabels[areaKey]}&lt;/span&gt;&lt;/div&gt;`;
      section.appendChild(renderAreaRenbanStrip(areaKey));
      clusters.forEach(c=&gt;section.appendChild(renderRenbanCluster(c)));
      root.appendChild(section);
    });

  function cfgSetupHScroll(holderId,prevId,nextId){
    const holder=document.getElementById(holderId);
    const prev=document.getElementById(prevId);
    const next=document.getElementById(nextId);
    if(!holder||!prev||!next)return;

    const update=()=&gt;{
      const max=Math.max(0,holder.scrollWidth-holder.clientWidth);
      prev.disabled=max&lt;=2 || holder.scrollLeft&lt;=2;
      next.disabled=max&lt;=2 || holder.scrollLeft&gt;=max-2;
    };

    const step=()=&gt;Math.max(180,holder.clientWidth*.85);

    prev.onclick=()=&gt;{
      const target=Math.max(0,holder.scrollLeft-step());
      holder.scrollTo({left:target,behavior:&quot;smooth&quot;});
      setTimeout(update,250);
    };
    next.onclick=()=&gt;{
      const max=Math.max(0,holder.scrollWidth-holder.clientWidth);
      const target=Math.min(max,holder.scrollLeft+step());
      holder.scrollTo({left:target,behavior:&quot;smooth&quot;});
      setTimeout(update,250);
    };

    holder.addEventListener(&quot;scroll&quot;,update,{passive:true});
    holder.addEventListener(&quot;wheel&quot;,e=&gt;{
      if(Math.abs(e.deltaY)&gt;Math.abs(e.deltaX)){
        holder.scrollLeft+=e.deltaY;
        e.preventDefault();
      }
    },{passive:false});

    requestAnimationFrame(update);
    setTimeout(update,80);
    setTimeout(update,250);
  }

&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;

  const STORAGE_KEY = &quot;sekifuri-3f-layout-20260814-v2-flex-group&quot;;

  const fixedTables = {
    &quot;E6&quot;:2,&quot;E7&quot;:2,&quot;E8&quot;:2,&quot;E9&quot;:2,
    &quot;F1&quot;:2,&quot;F2&quot;:2,&quot;F3&quot;:2,&quot;F4&quot;:2,&quot;F5&quot;:2,
    &quot;G6&quot;:2,&quot;G8&quot;:2,&quot;G9&quot;:2,&quot;G10&quot;:2,&quot;G11&quot;:2
  };

  const pairPrefixes = [
    &quot;E1&quot;,&quot;E2&quot;,&quot;E3&quot;,&quot;E4&quot;,&quot;E5&quot;,&quot;E10&quot;,&quot;E11&quot;,
    &quot;G1&quot;,&quot;G2&quot;,&quot;G3&quot;,&quot;G4&quot;,&quot;G5&quot;,&quot;G7&quot;
  ];


  /* ===== cấu hình động demo ===== */
  const cfgTypes=[
    {key:&quot;2&quot;,label:&quot;2人卓&quot;,cap:2},
    {key:&quot;4&quot;,label:&quot;4人卓&quot;,cap:4},
    {key:&quot;6&quot;,label:&quot;6人卓&quot;,cap:6},
    {key:&quot;BOX&quot;,label:&quot;BOX&quot;,cap:7}
  ];
  const cfgAreaRoute=[&quot;E&quot;,&quot;F&quot;,&quot;G&quot;];

  /* Giữ thứ tự tuyến gốc tuyệt đối, không thay đổi khi đổi loại bàn. */
  const cfgBaseRoute = [
    &quot;E1&quot;,&quot;E2&quot;,&quot;E3&quot;,&quot;E4&quot;,&quot;E5&quot;,&quot;E6&quot;,&quot;E7&quot;,&quot;E8&quot;,&quot;E9&quot;,&quot;E10&quot;,&quot;E11&quot;,
    &quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;,
    &quot;G1&quot;,&quot;G2&quot;,&quot;G3&quot;,&quot;G4&quot;,&quot;G5&quot;,&quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;
  ];
  const cfgRouteRank = Object.fromEntries(cfgBaseRoute.map((id,i)=&gt;[id,i]));
  let cfgNextRouteRank = cfgBaseRoute.length;

  function cfgRank(id){
    return cfgRouteRank[id] ?? (1000 + (cfgAreaRoute.indexOf(cfgAreaOf(id))&lt;0?99:cfgAreaRoute.indexOf(cfgAreaOf(id))*100) + cfgNum(id));
  }

  /* identity-level structure */
  const cfgStructures={};
  Object.entries(fixedTables).forEach(([id,cap])=&gt;{
    cfgStructures[id]=cap===&quot;BOX&quot;
      ? {&quot;2&quot;:0,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:1}
      : {&quot;2&quot;:0,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:0,[String(cap)]:1};
  });
  pairPrefixes.forEach(id=&gt;cfgStructures[id]={&quot;2&quot;:2,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:0});

  function cfgAreaOf(id){
    id=String(id).toUpperCase();
    if(/^E/.test(id))return &quot;E&quot;;
    if(/^F/.test(id))return &quot;F&quot;;
    if(/^G/.test(id))return &quot;G&quot;;
    return &quot;&quot;;
  }
  function cfgNum(id){const m=String(id).match(/\d+/);return m?Number(m[0]):99999}
  function cfgCompare(a,b){
    const ra=cfgRank(a),rb=cfgRank(b);
    if(ra!==rb)return ra-rb;
    return String(a).localeCompare(String(b),&quot;ja&quot;,{numeric:true});
  }
  function cfgRouteBase(id){
    id=String(id);
    if(/AB$/.test(id))return id.slice(0,-2);
    if(/[AB]$/.test(id)){
      const p=id.slice(0,-1);
      if(pairPrefixes.includes(p))return p;
    }
    return id;
  }
  function cfgRouteSuffixRank(id){
    id=String(id);
    if(/A$/.test(id)&amp;&amp;!(/AB$/.test(id)))return 0;
    if(/B$/.test(id)&amp;&amp;!(/AB$/.test(id)))return 1;
    if(/AB$/.test(id))return 2;
    return 0;
  }
  function cfgRouteIdCompare(a,b){
    const ba=cfgRouteBase(a),bb=cfgRouteBase(b);
    const r=cfgCompare(ba,bb);
    if(r)return r;
    return cfgRouteSuffixRank(a)-cfgRouteSuffixRank(b);
  }
  function cfgMetric(c){
    let max=0,physical=0;
    cfgTypes.forEach(t=&gt;{const n=c[t.key]||0;max+=n*t.cap;physical+=n});
    return {max,physical};
  }

  /* Renban groups at identity level.
     80-81 riêng, 82-88 riêng vì cầu thang ở giữa. */
  let cfgRenbanGroups=[
    [&quot;E1&quot;,&quot;E2&quot;,&quot;E3&quot;,&quot;E4&quot;,&quot;E5&quot;,&quot;E6&quot;,&quot;E7&quot;,&quot;E8&quot;,&quot;E9&quot;,&quot;E10&quot;,&quot;E11&quot;],
    [&quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;],
    [&quot;G1&quot;,&quot;G2&quot;,&quot;G3&quot;,&quot;G4&quot;,&quot;G5&quot;,&quot;G6&quot;,&quot;G7&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;]
  ];

  function cfgGroupOf(id){
    id=String(id).replace(/AB$/,&quot;&quot;).replace(/[AB]$/,&quot;&quot;);
    return cfgRenbanGroups.find(g=&gt;g.includes(id))||null;
  }
  function cfgExpandIdentity(id){
    if(pairPrefixes.includes(id)){
      return appState.merged[id]?[id+&quot;AB&quot;]:[id+&quot;A&quot;,id+&quot;B&quot;];
    }
    return [id];
  }
  function cfgExpandedRows(){
    return cfgRenbanGroups.map(g=&gt;g.flatMap(cfgExpandIdentity)).filter(g=&gt;g.length);
  }

  /* override renban rows: no hard-coded activePairRow + old renbanGroups */
  /* 卓種別の表示順は、番号順ではなく実際の案内動線に合わせる。 */
  const twoFixedOrder = [&quot;E6&quot;,&quot;E7&quot;,&quot;E8&quot;,&quot;E9&quot;,&quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;,&quot;G6&quot;,&quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;];
  const fourFixedOrder = [];
  const sixOrder = [];
  const boxOrder = [];

  /*
    おすすめ案の案内優先順。
    S卓 → 80番台 → 90番台 → C卓 → D卓。
    同じ列の中では番号の小さい卓から先に表示する。
  */
  const recommendationRoute = [
    &quot;F1&quot;,&quot;F2&quot;,&quot;F3&quot;,&quot;F4&quot;,&quot;F5&quot;,
    &quot;E11&quot;,&quot;E11A&quot;,&quot;E11B&quot;,
    &quot;E10&quot;,&quot;E10A&quot;,&quot;E10B&quot;,
    &quot;E9&quot;,&quot;E8&quot;,&quot;E7&quot;,&quot;E6&quot;,
    &quot;E5&quot;,&quot;E5A&quot;,&quot;E5B&quot;,
    &quot;E4&quot;,&quot;E4A&quot;,&quot;E4B&quot;,
    &quot;E3&quot;,&quot;E3A&quot;,&quot;E3B&quot;,
    &quot;E2&quot;,&quot;E2A&quot;,&quot;E2B&quot;,
    &quot;E1&quot;,&quot;E1A&quot;,&quot;E1B&quot;,
    &quot;G1&quot;,&quot;G1A&quot;,&quot;G1B&quot;,
    &quot;G2&quot;,&quot;G2A&quot;,&quot;G2B&quot;,
    &quot;G3&quot;,&quot;G3A&quot;,&quot;G3B&quot;,
    &quot;G4&quot;,&quot;G4A&quot;,&quot;G4B&quot;,
    &quot;G5&quot;,&quot;G5A&quot;,&quot;G5B&quot;,
    &quot;G6&quot;,
    &quot;G7&quot;,&quot;G7A&quot;,&quot;G7B&quot;,
    &quot;G8&quot;,&quot;G9&quot;,&quot;G10&quot;,&quot;G11&quot;
  ];

  function recommendationIdRank(id){
    const direct = recommendationRoute.indexOf(id);
    if(direct &gt;= 0) return direct;

    const group = appState?.groups?.find(group =&gt; group.id === id);
    if(group){
      const ranks = group.ids.map(recommendationIdRank).filter(Number.isFinite);
      return ranks.length ? Math.min(...ranks) : Number.MAX_SAFE_INTEGER;
    }
    return Number.MAX_SAFE_INTEGER;
  }

  function recommendationKey(option){
    return option.ids
      .flatMap(id =&gt; {
        const group = appState?.groups?.find(group =&gt; group.id === id);
        return group ? group.ids : [id];
      })
      .map(recommendationIdRank)
      .sort((a,b) =&gt; a-b);
  }

  function compareRecommendationRoute(a,b){
    const ka = recommendationKey(a);
    const kb = recommendationKey(b);
    const n = Math.max(ka.length,kb.length);
    for(let i=0;i&lt;n;i++){
      const av = ka[i] ?? Number.MAX_SAFE_INTEGER;
      const bv = kb[i] ?? Number.MAX_SAFE_INTEGER;
      if(av !== bv) return av-bv;
    }
    return 0;
  }

  const renbanGroups = [
    [&quot;80&quot;,&quot;81&quot;],
    [&quot;90&quot;,&quot;91&quot;,&quot;92&quot;,&quot;93&quot;,&quot;94&quot;,&quot;95&quot;,&quot;96&quot;],
    [&quot;97&quot;,&quot;98&quot;,&quot;99&quot;,&quot;100&quot;,&quot;101&quot;],

        const hasBox=parts.some(p=&gt;p.box);
        if(hasBox &amp;&amp; parts.length===1){
          tables[base]=&quot;BOX&quot;;
        }else{
          tables[base]=parts.reduce((sum,p)=&gt;sum+(p.box?7:Number(p.cap||0)),0);
        }
      }else{
        const ids=compositePartIds(base);
        parts.forEach((p,i)=&gt;{

    appState.groups.forEach(group=&gt;{

  function bindLongPress(btn,id){
    let timer=null, held=false, suppressClick=false, startX=0, startY=0;
    const begin=(x,y)=&gt;{

      clearTimeout(timer);
      timer=setTimeout(()=&gt;{
        held=true; suppressClick=true;
        markCleaning(id);
        try{navigator.vibrate&amp;&amp;navigator.vibrate(25)}catch{}
      },500);
    };
    const move=(x,y)=&gt;{
      if(Math.abs(x-startX)&gt;12 || Math.abs(y-startY)&gt;12){
        clearTimeout(timer); timer=null;
      }
    };
    const end=()=&gt;{ clearTimeout(timer); timer=null; };

    btn.addEventListener(&quot;touchstart&quot;,e=&gt;{const t=e.touches[0];begin(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchmove&quot;,e=&gt;{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
    btn.addEventListener(&quot;touchend&quot;,e=&gt;{end();if(held)e.preventDefault()},{passive:false});
    btn.addEventListener(&quot;touchcancel&quot;,end);

    btn.addEventListener(&quot;mousedown&quot;,e=&gt;{if(e.button===0)begin(e.clientX,e.clientY)});
    btn.addEventListener(&quot;mousemove&quot;,e=&gt;move(e.clientX,e.clientY));
    btn.addEventListener(&quot;mouseup&quot;,end);
    btn.addEventListener(&quot;mouseleave&quot;,end);

    btn.addEventListener(&quot;click&quot;,e=&gt;{
      if(suppressClick){
        suppressClick=false;
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    },true);
    btn.addEventListener(&quot;contextmenu&quot;,e=&gt;e.preventDefault());
  }

  /* Split one current renban group according to edited membership.
     Example C1..C6 -&gt; edit C1 keeping only C2:
       new group C1,C2; remaining C3,C4,C5,C6 stays together. */
  function cfgApplyRenbanMembership(id,members){
    const oldGroup=cfgGroupOf(id);
    const chosen=[id,...members.filter(x=&gt;x!==id)];
    if(oldGroup){
      cfgRenbanGroups=cfgRenbanGroups.filter(g=&gt;g!==oldGroup);
      const chosenSet=new Set(chosen);
      const remaining=oldGroup.filter(x=&gt;!chosenSet.has(x));
      if(chosen.length&gt;=2)cfgRenbanGroups.push(chosen.sort(cfgCompare));
      if(remaining.length&gt;=2)cfgRenbanGroups.push(remaining.sort(cfgCompare));
    }else if(chosen.length&gt;=2){
      /* remove chosen members from any previous groups first */
      chosen.slice(1).forEach(member=&gt;{
        const g=cfgGroupOf(member);
        if(!g)return;
        cfgRenbanGroups=cfgRenbanGroups.filter(x=&gt;x!==g);
        const rest=g.filter(x=&gt;x!==member);
        if(rest.length&gt;=2)cfgRenbanGroups.push(rest);
      });
      cfgRenbanGroups.push(chosen.sort(cfgCompare));
    }
    cfgRenbanGroups.sort((a,b)=&gt;cfgCompare(a[0],b[0]));
  }

  function cfgRenameIdentity(oldId,newId){
    oldId=normName(oldId);newId=normName(newId);
    if(oldId===newId)return oldId;
    if(!oldId||!newId)throw new Error(&quot;卓名を確認してください。&quot;);
    if(cfgStructures[newId] || partInfo(newId))throw new Error(`卓 ${newId} はすでに存在します。`);

    const oldStruct=cfgStructures[oldId];
    if(!oldStruct)throw new Error(&quot;元の卓が見つかりません。&quot;);

    const oldWasComposite=structureParts(oldId).length&gt;1;
    const oldPartIds=oldWasComposite?compositePartIds(oldId):[];

    cfgStructures[newId]=oldStruct;
    delete cfgStructures[oldId];

    if(cfgRouteRank[oldId]!==undefined){cfgRouteRank[newId]=cfgRouteRank[oldId];delete cfgRouteRank[oldId]}
    if(fixedTables[oldId]!==undefined){fixedTables[newId]=fixedTables[oldId];delete fixedTables[oldId]}
    [twoFixedOrder,fourFixedOrder,sixOrder,boxOrder].forEach(arr=&gt;arr.forEach((x,i)=&gt;{if(x===oldId)arr[i]=newId}));
    cfgRenbanGroups.forEach(g=&gt;g.forEach((x,i)=&gt;{if(x===oldId)g[i]=newId}));

    const pi=pairPrefixes.indexOf(oldId);
    if(pi&gt;=0)pairPrefixes[pi]=newId;

    moveKey(appState.states,oldId,newId);
    moveKey(appState.cleaning,oldId,newId);
    moveKey(appState.merged,oldId,newId);
    repairGroupsRename(oldId,newId);

    if(oldWasComposite){
      const newPartIds=compositePartIds(newId);
      oldPartIds.forEach((oldPart,i)=&gt;{
        const newPart=newPartIds[i];
        if(!newPart)return;
        moveKey(appState.states,oldPart,newPart);
        moveKey(appState.cleaning,oldPart,newPart);
        repairGroupsRename(oldPart,newPart);
      });
    }

    saveLayout3F();
    saveState();
    return newId;
  }

      const old=cfgEditingId;
      cfgEditingId=cfgRenameIdentity(old,wanted);
      /* arbitrary physical composition becomes one named configurable table;
         2+2 existing pair remains split-able only if unchanged */
      const unchangedPair=pairPrefixes.includes(cfgEditingId) &amp;&amp;
        (cfgEditCounts[&quot;2&quot;]||0)===2 &amp;&amp; m.physical===2 &amp;&amp; m.max===4 &amp;&amp;
        !(cfgEditCounts[&quot;4&quot;]||0) &amp;&amp; !(cfgEditCounts[&quot;6&quot;]||0) &amp;&amp; !(cfgEditCounts[&quot;BOX&quot;]||0);
      if(!unchangedPair &amp;&amp; pairPrefixes.includes(cfgEditingId))cfgConvertPairToFixed(cfgEditingId,cfgEditCounts);

      cfgStructures[cfgEditingId]=JSON.parse(JSON.stringify(cfgEditCounts));
      if(!pairPrefixes.includes(cfgEditingId)){
        fixedTables[cfgEditingId]=(cfgEditCounts.BOX===1&amp;&amp;m.physical===1)?&quot;BOX&quot;:m.max;
        cfgPlaceInCapacity(cfgEditingId,m.max,cfgEditCounts);
      }
      cfgApplyRenbanMembership(cfgEditingId,cfgEditMembers.map(x=&gt;x===old?cfgEditingId:x));
      if(m.physical&gt;1 &amp;&amp; appState.merged[cfgEditingId]===undefined)appState.merged[cfgEditingId]=true;
      if(m.physical&lt;=1)delete appState.merged[cfgEditingId];
      saveLayout3F();saveState();rebuildOrders();renderAll();cfgClose();showToast(`${cfgEditingId} を保存しました`);
    }catch(e){document.getElementById(&quot;cfgEditError&quot;).textContent=e.message||String(e)}
  }

  function cfgNextName(area){
    const ids=cfgIdentityIds();
    if([&quot;E&quot;,&quot;F&quot;,&quot;G&quot;].includes(area)){
      let max=0;
      ids.filter(x=&gt;x.startsWith(area)).forEach(x=&gt;{
        const m=x.slice(1).match(/^\d+/);
        if(m)max=Math.max(max,Number(m[0]));
      });
      return area+(max+1);
    }
    return &quot;&quot;;
  }


  function cfgAssignNewRouteRank(id,area){
    const same=Object.keys(cfgStructures).filter(x=&gt;x!==id &amp;&amp; cfgAreaOf(x)===area);
    if(same.length){
      const max=Math.max(...same.map(cfgRank));
      cfgRouteRank[id]=max+0.5;
    }else{
      cfgRouteRank[id]=cfgNextRouteRank++;
    }
  }

  function cfgSaveAdd(){
    const area=document.getElementById(&quot;cfgArea&quot;).value,id=document.getElementById(&quot;cfgAddName&quot;).value.trim(),m=cfgMetric(cfgAddCounts);
    if(!area||!id||!m.physical){document.getElementById(&quot;cfgAddError&quot;).textContent=&quot;エリア・卓名・卓構成を確認してください。&quot;;return}
    if(cfgStructures[id]){document.getElementById(&quot;cfgAddError&quot;).textContent=`卓 ${id} はすでに存在します。`;return}
    cfgStructures[id]=JSON.parse(JSON.stringify(cfgAddCounts));
    cfgAssignNewRouteRank(id,area);
    fixedTables[id]=(cfgAddCounts.BOX===1&amp;&amp;m.physical===1)?&quot;BOX&quot;:m.max;
    cfgPlaceInCapacity(id,m.max,cfgAddCounts);

  function cfgDelete(){
    if(!cfgEditingBase)return;
    const id=cfgEditingBase;

    const related=pairPrefixes.includes(id)?[id+&quot;A&quot;,id+&quot;B&quot;,id+&quot;AB&quot;]:[id];
    if(related.some(x=&gt;getStatus(x)!==&quot;empty&quot;||isCleaning(x)||isGrouped(x))){
      showToast(&quot;空席で手動連結されていない卓だけ削除できます&quot;);return;
    }

    const g=cfgGroupOf(id);
    if(g){
      cfgRenbanGroups=cfgRenbanGroups.filter(x=&gt;x!==g);
      const remain=g.filter(x=&gt;x!==id);
      if(remain.length&gt;=2)cfgRenbanGroups.push(remain);
    }

    if(pairPrefixes.includes(id)){
      const pi=pairPrefixes.indexOf(id);if(pi&gt;=0)pairPrefixes.splice(pi,1);
      [id+&quot;A&quot;,id+&quot;B&quot;,id+&quot;AB&quot;].forEach(x=&gt;{delete appState.states[x];delete appState.cleaning[x]});
      delete appState.merged[id];
    }

    delete fixedTables[id];
    delete cfgStructures[id];
    if(typeof cfgRouteRank!==&quot;undefined&quot;)delete cfgRouteRank[id];
    cfgRemoveFromOrders(id);
    delete appState.states[id];
    delete appState.cleaning[id];

    saveState();renderAll();cfgClose();showToast(`${id} を削除しました`);
  }

  function cfgPartsForId(id,capacity){
    const group=appState.groups.find(g=&gt;g.id===id);
    if(group)return group.ids.flatMap(x=&gt;cfgPartsForId(x,currentTables()[x]));
    if(/AB$/.test(id)){
      const p=id.slice(0,-2);return cfgStructures[p]?cfgExpandParts(cfgStructures[p]):[{cap:2},{cap:2}];
    }
    if(/[AB]$/.test(id)&amp;&amp;pairPrefixes.includes(id.slice(0,-1)))return [{cap:2}];
    if(cfgStructures[id])return cfgExpandParts(cfgStructures[id]);
    return [{cap:capacity===&quot;BOX&quot;?7:Number(capacity||0)}];
  }
  function cfgExpandParts(c){
    const out=[];cfgTypes.forEach(t=&gt;{for(let i=0;i&lt;(c[t.key]||0);i++)out.push({cap:t.cap,label:t.key})});return out;
  }
