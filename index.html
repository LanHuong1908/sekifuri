  function createManualGroupCard(group){
    const wrap = document.createElement(&quot;div&quot;);
    wrap.className = &quot;pair-card merged&quot;;

    /* Build the physical appearance from EACH member table, not from the
       group&#x27;s total capacity. Example: 80 + 81 must render as 6 + 6. */
    const parts = [];
    group.ids.forEach(memberId =&gt; {
      const info = partInfo(memberId);
      if(info){
        parts.push({...info.part});
        return;
      }
      if(isCompositeIdentity(memberId) &amp;&amp; appState.merged[memberId] !== false){
        structureParts(memberId).forEach(p =&gt; parts.push({...p}));
        return;
      }
      const one = structureParts(memberId)[0];
      if(one){
        parts.push({...one});
        return;
      }
      const cap = currentTables()[memberId];
      parts.push({cap:cap === &quot;BOX&quot; ? 7 : Number(cap || 0),box:cap === &quot;BOX&quot;});
    });

    const total = parts.reduce((sum,p) =&gt; sum + Number(p.cap||0),0);
    const table = document.createElement(&quot;button&quot;);
    table.className = `physical-table ${group.ids.some(id=&gt;isCleaning(id)) ? &quot;cleaning&quot; : (group.state || &quot;empty&quot;)}`;
    table.dataset.id = group.id;
    table.style.width = (parts.reduce((s,p)=&gt;s+seatWidth(p.cap,!!p.box),0)*52 + Math.max(0,parts.length-1)*7) + &quot;px&quot;;

    parts.forEach(p =&gt; {
      const seg = document.createElement(&quot;span&quot;);
      seg.className = `phys-seg ${baseClassForPart(p)}`;
      seg.style.flex = String(seatWidth(p.cap,!!p.box));
      seg.textContent = p.box ? &quot;BOX&quot; : p.cap;
      table.appendChild(seg);
    });

    const overlay = document.createElement(&quot;span&quot;);
    overlay.className = &quot;physical-overlay&quot;;
    overlay.innerHTML = `&lt;span&gt;${group.ids.join(&quot;・&quot;)}&lt;/span&gt;&lt;small&gt;MAX ${total}名&lt;/small&gt;`;
    table.appendChild(overlay);
    table.onclick = () =&gt; manualMode ? showToast(&quot;手動連結中です&quot;) : setStatus(group.ids);
    bindLongPress(table,group.ids);
    wrap.appendChild(table);

    const release = document.createElement(&quot;button&quot;);
    release.className = &quot;pair-action&quot;;
    release.textContent = &quot;解除&quot;;
    release.addEventListener(&quot;click&quot;, event =&gt; {
      event.stopPropagation();
      releaseManualGroup(group.id);
    });
    wrap.appendChild(release);

    return wrap;
  }

  function togglePair(prefix){
    const relatedIds = [prefix + &quot;AB&quot;, prefix + &quot;A&quot;, prefix + &quot;B&quot;];
    if(relatedIds.some(isGrouped)){
      showToast(&quot;先に手動連結を解除してください&quot;);
      return;
    }

    if(appState.merged[prefix]){
      const mergedId = prefix + &quot;AB&quot;;
      const oldStatus = getStatus(mergedId);
      const wasCleaning = !!appState.cleaning[mergedId];

      delete appState.states[mergedId];
      delete appState.cleaning[mergedId];
      appState.merged[prefix] = false;

      if(oldStatus !== &quot;empty&quot;){
        appState.states[prefix + &quot;A&quot;] = oldStatus;
        appState.states[prefix + &quot;B&quot;] = oldStatus;
      }
      if(wasCleaning){
        appState.cleaning[prefix + &quot;A&quot;] = true;
        appState.cleaning[prefix + &quot;B&quot;] = true;
      }
    }else{
      const aId = prefix + &quot;A&quot;;
      const bId = prefix + &quot;B&quot;;
      const aStatus = getStatus(aId);
      const bStatus = getStatus(bId);
      const wasCleaning = !!appState.cleaning[aId] || !!appState.cleaning[bId];

      delete appState.states[aId];
      delete appState.states[bId];
      delete appState.cleaning[aId];
      delete appState.cleaning[bId];
      appState.merged[prefix] = true;

      const mergedId = prefix + &quot;AB&quot;;
      if(aStatus === &quot;used&quot; || bStatus === &quot;used&quot;){
        appState.states[mergedId] = &quot;used&quot;;
      }else if(aStatus === &quot;reserved&quot; || bStatus === &quot;reserved&quot;){
        appState.states[mergedId] = &quot;reserved&quot;;
      }else if(wasCleaning){
        appState.cleaning[mergedId] = true;
      }
    }

    saveState();
    renderAll();
  }

  function createSection(title, ids, pairMode){
    const section = document.createElement(&quot;section&quot;);
    section.className = &quot;card&quot;;

    let freeCount = ids.filter(id =&gt; !isGrouped(id) &amp;&amp; getStatus(id) === &quot;empty&quot;).length;
    const sectionCapacity = Number(title.replace(&quot;人卓&quot;,&quot;&quot;));
    const manualGroups = appState.groups.filter(group =&gt;
      group.capacity &lt;= 6 &amp;&amp; group.capacity === sectionCapacity
    );
    freeCount += manualGroups.filter(group =&gt; getStatus(group.id) === &quot;empty&quot;).length;

    if(pairMode === &quot;split-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(!appState.merged[prefix]){
          if(!isGrouped(prefix + &quot;A&quot;) &amp;&amp; getStatus(prefix + &quot;A&quot;) === &quot;empty&quot;) freeCount++;
          if(!isGrouped(prefix + &quot;B&quot;) &amp;&amp; getStatus(prefix + &quot;B&quot;) === &quot;empty&quot;) freeCount++;
        }
      });
    }

    if(pairMode === &quot;merged-first&quot;){
      pairPrefixes.forEach(prefix =&gt; {
        if(appState.merged[prefix] &amp;&amp; !isGrouped(prefix + &quot;AB&quot;) &amp;&amp; getStatus(prefix + &quot;AB&quot;) === &quot;empty&quot;){
          freeCount++;
        }
      });
    }

    section.innerHTML =
      &#x27;&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;&#x27; + title + &#x27;&lt;/span&gt;&lt;span&gt;空き &#x27; + freeCount + &quot;&lt;/span&gt;&lt;/div&gt;&quot;;

    const grid = document.createElement(&quot;div&quot;);
    grid.className = &quot;table-grid&quot;;
    const tables = currentTables();
    const renderedGroups = new Set();

    /*
      Dynamic display route:
      do NOT use the old manualOrderByCapacity table here.
      A table keeps its original route position even when its capacity changes.
    */
    const pairRouteForSection = pairPrefixes.flatMap(prefix =&gt; [
      prefix+&quot;A&quot;, prefix+&quot;B&quot;, prefix+&quot;AB&quot;
    ]);
    const manualMemberIds = manualGroups.flatMap(group =&gt; group.ids);
    const route = [...new Set([
      ...ids,
      ...pairRouteForSection,
      ...manualMemberIds
    ])].sort(cfgRouteIdCompare);
    const orderedGroups = sortedManualGroups(manualGroups, sectionCapacity)
      .sort((a,b)=&gt;{
        const aa=Math.min(...a.ids.map(id=&gt;cfgRank(cfgRouteBase(id))));
        const bb=Math.min(...b.ids.map(id=&gt;cfgRank(cfgRouteBase(id))));
        return aa-bb;
      });

    function groupAt(id){
      return orderedGroups.find(group =&gt;
        !renderedGroups.has(group.id) &amp;&amp; group.ids.includes(id)
      );
    }

    route.forEach(routeId =&gt; {
      const group = groupAt(routeId);
      if(group){
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
        return;
      }

      const pairPrefix = pairPrefixes.find(prefix =&gt;
        routeId === prefix + &quot;A&quot; ||
        routeId === prefix + &quot;B&quot; ||
        routeId === prefix + &quot;AB&quot;
      );

      if(pairPrefix){
        if(
          pairMode === &quot;split-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;A&quot; &amp;&amp;
          !appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;A&quot;) &amp;&amp;
          !isGrouped(pairPrefix + &quot;B&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }

        if(
          pairMode === &quot;merged-first&quot; &amp;&amp;
          routeId === pairPrefix + &quot;AB&quot; &amp;&amp;
          appState.merged[pairPrefix] &amp;&amp;
          !isGrouped(pairPrefix + &quot;AB&quot;)
        ){
          grid.appendChild(createPairCard(pairPrefix));
        }
        return;
      }

      if(ids.includes(routeId) &amp;&amp; !isGrouped(routeId)){
        grid.appendChild(createTableButton(routeId, tables[routeId]));
      }
    });

    /*
      念のため、順序表にない卓が追加された場合だけ最後に表示する。
      現在の卓構成では通常ここには入らない。
    */
    orderedGroups
      .filter(group =&gt; !renderedGroups.has(group.id))
      .forEach(group =&gt; {
        grid.appendChild(createManualGroupCard(group));
        renderedGroups.add(group.id);
      });

    ids
      .filter(id =&gt; !route.includes(id) &amp;&amp; !isGrouped(id))
      .sort(cfgRouteIdCompare)
      .forEach(id =&gt; grid.appendChild(createTableButton(id, tables[id])));

    if(!grid.children.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;この種類の卓はありません。&quot;;
      grid.appendChild(empty);
    }

    section.appendChild(grid);
    return section;
  }

  function maximalEmptyRuns(){
    const tables = currentTables();
    const runs = [];

    recommendationRows().forEach(group =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(run.length &gt;= 2){
          let total = 0;
          let allBox = true;

          run.forEach(id =&gt; {
            if(tables[id] === &quot;BOX&quot;){
              total += 7;
            }else{
              allBox = false;
              total += Number(tables[id]);
            }
          });

          runs.push({
            ids:[...run],
            label: run.length === 2 ? run.join(&quot;・&quot;) : run[0] + &quot;〜&quot; + run[run.length - 1],
            max:total,
            allBox
          });
        }
        run = [];
      };

      group.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    return runs;
  }

  function allRenbanOptions(){
    const tables = currentTables();
    const options = [];

    const seatCapacity = id =&gt; {
      const value = tables[id];
      return value === &quot;BOX&quot; ? 7 : Number(value || 0);
    };

    recommendationRows().forEach(row =&gt; {
      let run = [];

      const flush = () =&gt; {
        if(!run.length) return;

        /* 連続して空いている卓から、隣り合う全組み合わせを作る。
           2Fは卓種が多いので、4+4=8、6+4=10、BOX+BOX=14等も
           実際に隣接していれば候補として残す。 */
        for(let start = 0; start &lt; run.length; start++){
          let capacity = 0;

          for(let finish = start; finish &lt; run.length; finish++){
            const id = run[finish];
            capacity += seatCapacity(id);

            const ids = run.slice(start, finish + 1);
            if(ids.length &lt; 2) continue;

            const allBox = ids.every(x =&gt; tables[x] === &quot;BOX&quot;);

            if(allBox &amp;&amp; ids.length === 2){
              /* 2 BOX = MAX14.
                 実際の案内人数として9〜14名を選べるように、
                 人数フィルター用の候補を保持する。 */
              [9,10,11,12,13,14].forEach(pax =&gt; {
                options.push({
                  ids:[...ids],
                  pax,
                  capacity:14,
                  low:pax !== 14,
                  box:true
                });
              });
            }else{
              options.push({
                ids,
                pax:capacity,
                capacity,
                low:false,
                box:allBox
              });
            }
          }
        }

        run = [];
      };

      row.forEach(id =&gt; {
        if(isVacant(id)){
          run.push(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 単卓候補 */
    Object.keys(tables)
      .filter(id =&gt; isVacant(id))
      .forEach(id =&gt; {
        if(tables[id] === &quot;BOX&quot;){
          options.push({
            ids:[id],
            pax:7,
            capacity:7,
            low:false,
            box:true,
            singleBox:true
          });

          /* 8名をBOX1卓に入れるのは最終手段だけ。
             候補自体は保持し、表示側で他案が無い時だけ使う。 */
          options.push({
            ids:[id],
            pax:8,
            capacity:7,
            low:true,
            box:true,
            singleBox:true,
            tightEight:true
          });
        }else{
          const capacity = Number(tables[id] || 0);
          if(capacity &gt; 0){
            options.push({
              ids:[id],
              pax:capacity,
              capacity,
              low:false,
              box:false
            });
          }
        }
      });

    options.forEach(option =&gt; {
      option.cleaning = option.ids.some(id =&gt; isCleaning(id));
    });

    const seen = new Set();

    return options
      .filter(option =&gt; {
        const key =
          option.pax + &quot;|&quot; +
          option.capacity + &quot;|&quot; +
          option.ids.join(&quot;-&quot;) + &quot;|&quot; +
          Number(!!option.tightEight);

        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a,b) =&gt;
        a.pax - b.pax ||
        Number(a.low) - Number(b.low) ||
        a.ids.length - b.ids.length
      );
  }

  function renderPeopleRow(){
    const row = document.getElementById(&quot;peopleRow&quot;);
    row.innerHTML = &quot;&quot;;

    const options = allRenbanOptions();
    const availablePax = new Set();

    /* Các mức nhỏ giữ theo những lựa chọn vốn có của 2F. */
    options.forEach(item =&gt; {
      const pax = Number(item.pax);
      if(Number.isFinite(pax)) availablePax.add(pax);
    });

    /* Từ 9 người trở lên phải hiển thị LIÊN TỤC tới MAX hiện tại,
       không phụ thuộc MAX đó đến từ 2 BOX hay từ các bàn đặc thù khác.
       Ví dụ còn phương án MAX14 thì luôn có 9,10,11,12,13,14.
       Nếu MAX12 thì có 9,10,11,12. */
    const maxGuideCapacity = options.reduce((max,item) =&gt; {
      const cap = Number(item.capacity ?? item.pax);
      return Number.isFinite(cap) ? Math.max(max,cap) : max;
    },0);

    if(maxGuideCapacity &gt;= 9){
      for(let n=9; n&lt;=maxGuideCapacity; n++){
        availablePax.add(n);
      }
    }

    const capacities = [...availablePax]
      .filter(value =&gt; Number.isFinite(Number(value)))
      .map(Number)
      .sort((a,b) =&gt; a-b);

    const choices = [
      [&quot;all&quot;,&quot;全部&quot;],
      ...capacities.map(value =&gt; [String(value), value + &quot;名&quot;])
    ];

    choices.forEach(([value,label]) =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      btn.textContent = label;
      btn.classList.toggle(&quot;active&quot;, peopleFilter === value);
      btn.addEventListener(&quot;click&quot;, () =&gt; {
        peopleFilter = value;
        renderPeopleRow();
        renderRenbanOptions();
      });
      row.appendChild(btn);
    });
  }

  function updateRenbanArrows(){
    const holder=document.getElementById(&quot;renbanOptions&quot;);
    const prev=document.getElementById(&quot;renbanPrev&quot;);
    const next=document.getElementById(&quot;renbanNext&quot;);
    if(!holder||!prev||!next)return;
    const max=Math.max(0,holder.scrollWidth-holder.clientWidth);
    prev.disabled=holder.scrollLeft&lt;=2;
    next.disabled=holder.scrollLeft&gt;=max-2;
  }

  function setupRenbanScroller(){
    const holder=document.getElementById(&quot;renbanOptions&quot;);
    const prev=document.getElementById(&quot;renbanPrev&quot;);
    const next=document.getElementById(&quot;renbanNext&quot;);
    if(!holder||!prev||!next)return;

    prev.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:-holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    next.addEventListener(&quot;click&quot;, () =&gt; {
      holder.scrollBy({left:holder.clientWidth * 0.85, behavior:&quot;smooth&quot;});
    });
    holder.addEventListener(&quot;scroll&quot;, updateRenbanArrows, {passive:true});

    let dragging = false;
    let startX = 0;
    let startScroll = 0;

    holder.addEventListener(&quot;pointerdown&quot;, event =&gt; {
      if(event.pointerType === &quot;touch&quot;) return;

      /* おすすめ案ボタンをクリックした時は、
         親の横スクロールがpointerを奪わないようにする。
         これが原因でPCでは案を押してもclickが発火しなかった。 */
      if(event.target.closest(&quot;.renban-option&quot;)) return;

      dragging = true;
      startX = event.clientX;
      startScroll = holder.scrollLeft;
      holder.classList.add(&quot;dragging&quot;);
      holder.setPointerCapture(event.pointerId);
    });

    holder.addEventListener(&quot;pointermove&quot;, event =&gt; {
      if(!dragging) return;
      holder.scrollLeft = startScroll - (event.clientX - startX);
    });

    const stopDragging = event =&gt; {
      if(!dragging) return;
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
      try{ holder.releasePointerCapture(event.pointerId); }catch{}
    };

    holder.addEventListener(&quot;pointerup&quot;, stopDragging);
    holder.addEventListener(&quot;pointercancel&quot;, stopDragging);
    holder.addEventListener(&quot;lostpointercapture&quot;, () =&gt; {
      dragging = false;
      holder.classList.remove(&quot;dragging&quot;);
    });

    window.addEventListener(&quot;resize&quot;, updateRenbanArrows);
  }


  function remainingRenbanScore(usedIds){
    const used = new Set(usedIds);
    const tables = currentTables();

    const capOf = id =&gt; {
      const value = tables[id];
      return value === &quot;BOX&quot; ? 7 : Number(value || 0);
    };

    let bestCapacity = 0;
    let totalCapacityInRuns = 0;

    recommendationRows().forEach(row =&gt; {
      let runCapacity = 0;
      let runLength = 0;

      const flush = () =&gt; {
        if(runLength &gt;= 2){
          totalCapacityInRuns += runCapacity;
          bestCapacity = Math.max(bestCapacity, runCapacity);
        }
        runCapacity = 0;
        runLength = 0;
      };

      row.forEach(id =&gt; {
        if(isVacant(id) &amp;&amp; !used.has(id)){
          runLength++;
          runCapacity += capOf(id);
        }else{
          flush();
        }
      });

      flush();
    });

    /* 最大連番容量を最優先、同じなら残っている連番容量の合計。 */
    return bestCapacity * 1000 + totalCapacityInRuns;
  }

  function physicalCountForId(id){
    const group = appState.groups.find(g =&gt; g.id === id);
    if(group) return group.ids.reduce((sum,x)=&gt;sum+physicalCountForId(x),0);

    const tables = currentTables();
    const cap = tables[id] === &quot;BOX&quot; ? 7 : Number(tables[id] || 0);

    if(/AB$/.test(id)) return 2;
    return 1;
  }

  function cleaningEffort(option){
    let physical = 0;
    let capacity = 0;
    option.ids.forEach(id =&gt; {
      if(isCleaning(id)){
        physical += physicalCountForId(id);
        const tables = currentTables();
        capacity += tables[id] === &quot;BOX&quot; ? 7 : Number(tables[id] || 0);
      }
    });
    return {physical, capacity};
  }

  function cleaningPhysicalKeys(option){
    const keys = [];

    const expand = id =&gt; {
      const group = appState.groups.find(g =&gt; g.id === id);
      if(group){
        group.ids.forEach(expand);
        return;
      }

      if(/AB$/.test(id)){
        const prefix = id.slice(0,-2);
        keys.push(prefix + &quot;A&quot;, prefix + &quot;B&quot;);
        return;
      }

      keys.push(id);
    };

    option.ids.forEach(id =&gt; {
      if(isCleaning(id)) expand(id);
    });

    return [...new Set(keys)];
  }

  function cleaningSetDominated(option, candidates){
    const mine = new Set(cleaningPhysicalKeys(option));
    if(!mine.size) return false;

    return candidates.some(other =&gt; {
      if(other === option) return false;

      const theirs = new Set(cleaningPhysicalKeys(other));
      if(!theirs.size || theirs.size &gt;= mine.size) return false;

      /* Remove an option only when another same-MAX option needs cleaning
         a strict SUBSET of the exact same physical tables.
         Example:
         clean 82AB+83AB  vs  clean 83AB + use clean 84AB
         -&gt; {83A,83B} is a strict subset of {82A,82B,83A,83B},
            so the heavier option is unnecessary.

         But 82AB vs 99+100 are different physical-table choices,
         so neither is a subset of the other and BOTH remain. */
      for(const key of theirs){
        if(!mine.has(key)) return false;
      }
      return true;
    });
  }

  function applyRecommendationOption(option){
    /* Khi bấm một phương án trong おすすめ案:
       - xóa 清掃待ち của mọi bàn thuộc phương án
       - áp dụng thẳng trạng thái đang chọn (席取り / 使用中 / 空席)
       - KHÔNG bắt buộc tạo group ghép mới
       Như vậy ví dụ C7 đang 清掃待ち + C8 đang sạch:
       bấm phương án khi chọn 使用中 =&gt; cả C7 và C8 đều thành 使用中. */
    const expanded = new Set();

    option.ids.forEach(id =&gt; {
      const group = groupFor(id);
      if(group){
        group.ids.forEach(x =&gt; expanded.add(x));
      }else{
        expanded.add(id);
      }
    });

    [...expanded].forEach(id =&gt; {
      delete appState.cleaning[id];

      if(selectedStatus === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = selectedStatus;
      }
    });

    /* Nếu phương án chạm vào một group đã tồn tại thì cập nhật group đó.
       Không tự tạo group mới chỉ vì chọn một phương án đề nghị. */
    appState.groups.forEach(group =&gt; {
      if(group.ids.some(id =&gt; expanded.has(id))){
        group.state = selectedStatus;
        group.ids.forEach(id =&gt; delete appState.cleaning[id]);
      }
    });

    saveState();
    renderAll();
    showToast([...expanded].join(&quot;・&quot;) + &quot; → &quot; + statusLabel(selectedStatus));
  }

function renderRenbanOptions(){
    const all = allRenbanOptions();
    let filtered;

    if(peopleFilter === &quot;all&quot;){
      filtered = [...all].sort((a,b) =&gt;
        Number(a.cleaning) - Number(b.cleaning) ||
        Number(!!a.tightEight) - Number(!!b.tightEight) ||
        compareRecommendationRoute(a,b)
      );
    }else{
      const requested = Number(peopleFilter);
      const capacityOf = item =&gt; item.capacity ?? item.pax;

      /* 8名用のBOX1卓だけは通常候補とは別枠。
         ただし完全に消さず、比較候補として最後に残す。 */
      const normalAll = all.filter(item =&gt;
        !item.tightEight &amp;&amp;
        capacityOf(item) &gt;= requested
      );

      const deduped = new Map();
      normalAll.forEach(item =&gt; {
        const key = item.ids.join(&quot;-&quot;);
        const current = deduped.get(key);

        if(!current ||
           capacityOf(item) &lt; capacityOf(current) ||
           (capacityOf(item) === capacityOf(current) &amp;&amp;
            Number(item.low) &lt; Number(current.low))){
          deduped.set(key,item);
        }
      });
      const normal = [...deduped.values()];

      const keepReasonableCombos = list =&gt; {
        if(!list.length) return [];

        const singles = list.filter(item =&gt; item.ids.length === 1);
        const combos = list.filter(item =&gt; item.ids.length &gt; 1);
        const minOverallCapacity = Math.min(
          ...list.map(item =&gt; capacityOf(item))
        );

        /* 現在の分割/連結状態をその時点の実配置として扱う。
           - ids.length===1: すでに存在する単卓 / 当日すでに連結済みの卓
             → MAXが大きくても予備候補として残す
           - ids.length&gt;1: 今から新しく連結する案
             → 必要最小MAXの案だけ残す
           例：2名で82A/82Bが分割中なら82A+82B=4は出さない。
               82ABとして連結済みならMAX4の予備候補として出す。 */
        return [
          ...singles,
          ...combos.filter(item =&gt; capacityOf(item) === minOverallCapacity)
        ];
      };

      const sorter = (a,b) =&gt; {
        const capA = capacityOf(a);
        const capB = capacityOf(b);

        /* まず人数に近いMAXを優先。 */
        const capacityDiff =
          (capA - requested) - (capB - requested);
        if(capacityDiff) return capacityDiff;

        /* 清掃待ち同士では、表示上の「1卓/2卓」より先に
           実際の清掃負担を見る。
           82AB等は実卓2卓として数える。 */
        if(a.cleaning &amp;&amp; b.cleaning){
          const ea = cleaningEffort(a);
          const eb = cleaningEffort(b);

          const cleanDiff =
            ea.physical - eb.physical ||
            ea.capacity - eb.capacity;
          if(cleanDiff) return cleanDiff;
        }

        /* 次に、残る連番のMAX容量を大きく保つ。 */
        const renDiff =
          remainingRenbanScore(b.ids) - remainingRenbanScore(a.ids);
        if(renDiff) return renDiff;

        /* ここまで同じなら、実際に使う表示単位数が少ない方。 */
        const tableCountDiff = a.ids.length - b.ids.length;
        if(tableCountDiff) return tableCountDiff;

        return compareRecommendationRoute(a,b);
      };

      const ready = keepReasonableCombos(
        normal.filter(item =&gt; !item.cleaning)
      ).sort(sorter);

      const waitingBase = keepReasonableCombos(
        normal.filter(item =&gt; item.cleaning)
      );

      let waiting = [];
      if(waitingBase.length){
        /* 清掃待ちはまず「必要十分なMAX」に絞る。 */
        const minWaitingCapacity = Math.min(
          ...waitingBase.map(item =&gt; capacityOf(item))
        );

        const sameCapacity = waitingBase
          .filter(item =&gt; capacityOf(item) === minWaitingCapacity);

        /* 同じMAXでも、他の候補が「同じ清掃卓の一部だけ」を掃除すれば
           成立するなら、余分に掃除する案は不要なので除外する。
           ただし清掃する卓の場所が違う案は残す。
           これで:
           - 8名: 83AB清掃+84AB空席 があるなら
                  82AB+83AB両方清掃 は消える
           - 4名: 82AB清掃 と 99+100清掃 は
                  後客用の2人卓温存という意味が違うので両方残る */
        waiting = sameCapacity
          .filter(item =&gt; !cleaningSetDominated(item, sameCapacity))
          .sort(sorter);
      }

      /* 8名時のBOX1卓:
         - 空いているBOXなら、待たずに案内できる比較候補として残す
         - 清掃待ちBOXも、2卓掃除などと比較できるよう残す
         ただし通常の8名向け候補より後ろに置く。 */
      let box8Ready = [];
      let box8Waiting = [];

      if(requested === 8){
        box8Ready = all
          .filter(item =&gt; item.tightEight &amp;&amp; !item.cleaning)
          .sort(compareRecommendationRoute);

        const allBoxWaiting = all
          .filter(item =&gt; item.tightEight &amp;&amp; item.cleaning)
          .sort((a,b) =&gt; {
            const ea = cleaningEffort(a);
            const eb = cleaningEffort(b);
            return ea.physical - eb.physical ||
                   ea.capacity - eb.capacity ||
                   compareRecommendationRoute(a,b);
          });

        /* BOXは8名だと窮屈なので通常は後順位。
           ただし、通常案より明らかに掃除が早い
           （例：BOX1卓掃除 vs 4人卓2卓分掃除）なら比較候補として残す。 */
        if(allBoxWaiting.length){
          const bestNormalCleaningPhysical =
            waiting.length
              ? Math.min(...waiting.map(item =&gt; cleaningEffort(item).physical))
              : Infinity;

          box8Waiting = allBoxWaiting.filter(item =&gt;
            cleaningEffort(item).physical &lt; bestNormalCleaningPhysical
          );
        }
      }

      /* お客様優先:
         1) 通常の案内可能
         2) BOX1卓8名（空席・窮屈だが待たない）
         3) 通常の清掃待ち
         4) BOX1卓8名の清掃待ち
         こうすることで、空いているBOXと「2卓掃除」も比較でき、
         清掃BOX候補も消えない。 */
      filtered = [
        ...ready,
        ...box8Ready,
        ...waiting,
        ...box8Waiting
      ];
    }

    document.getElementById(&quot;renbanCount&quot;).textContent = filtered.length + &quot;案&quot;;

    const holder = document.getElementById(&quot;renbanOptions&quot;);
    holder.innerHTML = &quot;&quot;;

    if(!filtered.length){
      const empty = document.createElement(&quot;div&quot;);
      empty.className = &quot;empty-note&quot;;
      empty.textContent = &quot;案内できる空席候補はありません。&quot;;
      holder.appendChild(empty);
      requestAnimationFrame(updateRenbanArrows);
      return;
    }

    const tables = currentTables();
    const requested = peopleFilter === &quot;all&quot; ? null : Number(peopleFilter);

    filtered.forEach(option =&gt; {
      const btn = document.createElement(&quot;button&quot;);
      const cap = option.capacity ?? option.pax;
      const excess = requested === null ? 0 : Math.max(0, cap - requested);

      let priorityClass = &quot;&quot;;
      let priorityLabel = &quot;&quot;;

      if(option.tightEight &amp;&amp; !option.cleaning){
        priorityClass = &quot; box8-fallback&quot;;
        priorityLabel = &quot;予備&quot;;
      }else if(option.tightEight &amp;&amp; option.cleaning){
        priorityClass = &quot; low&quot;;
        priorityLabel = &quot;清掃待ち&quot;;
      }else if(option.cleaning){
        priorityClass = &quot; low&quot;;
        priorityLabel = &quot;清掃待ち&quot;;
      }else if(requested !== null){
        if(excess === 0){
          priorityClass = &quot; priority-1&quot;;
          priorityLabel = &quot;優先&quot;;
        }else if(excess === 1){
          priorityClass = &quot; priority-2&quot;;
          priorityLabel = &quot;次点&quot;;
        }else{
          priorityClass = &quot; priority-3&quot;;
          priorityLabel = &quot;予備&quot;;
        }
      }else{
        priorityClass = option.low ? &quot; low&quot; : &quot;&quot;;
        priorityLabel = option.low ? &quot;優先度低&quot; : &quot;使用可能&quot;;
      }

      btn.className = &quot;renban-option&quot; + priorityClass;

      let note;

      if(option.tightEight &amp;&amp; !option.cleaning){
        note = &quot;予備・BOXは7名推奨・8名は窮屈・待ち時間なし&quot;;
      }else if(option.tightEight &amp;&amp; option.cleaning){
        const effort = cleaningEffort(option);
        const renScore = remainingRenbanScore(option.ids);
        const remainingMaxRenban = Math.floor(renScore / 1000);
        note =
          &quot;清掃待ち・BOXは7名推奨・8名は窮屈&quot; +
          &quot;・清掃&quot; + effort.physical + &quot;卓&quot; +
          &quot;・残す連番MAX &quot; + remainingMaxRenban + &quot;名&quot;;
      }else if(option.cleaning){
        const effort = cleaningEffort(option);
        const renScore = remainingRenbanScore(option.ids);
        const remainingMaxRenban = Math.floor(renScore / 1000);
        note =
          &quot;清掃待ち・MAX &quot; + cap + &quot;名&quot; +
          &quot;・清掃&quot; + effort.physical + &quot;卓&quot; +
          &quot;・残す連番MAX &quot; + remainingMaxRenban + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else if(requested !== null){
        note =
          priorityLabel + &quot;・&quot; +
          option.ids.length + &quot;卓・MAX &quot; + cap + &quot;名&quot;;
        if(excess &gt; 0) note += &quot;・空き &quot; + excess + &quot;席&quot;;
      }else{
        note = priorityLabel;
      }

      btn.innerHTML =
        &quot;&lt;strong&gt;&quot; + (requested ?? option.pax) + &quot;名&lt;/strong&gt;&quot; +
        &#x27;&lt;div class=&quot;chips&quot;&gt;&#x27; +
        option.ids.map(id =&gt;
          &#x27;&lt;span class=&quot;chip &#x27; + capacityClass(tables[id]) + &#x27;&quot;&gt;&#x27; +
          displayTableId(id) +
          &quot;&lt;/span&gt;&quot;
        ).join(&quot;&quot;) +
        &quot;&lt;/div&gt;&quot; +
        &quot;&lt;small&gt;&quot; + note + &quot;&lt;/small&gt;&quot;;

      btn.addEventListener(&quot;click&quot;, () =&gt; {
        if(option.tightEight){
          showToast(&quot;BOX1卓は8名だと窮屈です&quot;);
          return;
        }

        applyRecommendationOption(option);
      });

      holder.appendChild(btn);
    });

    requestAnimationFrame(updateRenbanArrows);
  }

  function showToast(message){

    toast.textContent = message;
    toast.classList.add(&quot;show&quot;);

    clearTimeout(window.__toastTimer);

  function createManualGroup(){
    if(!validManualSelection()){
      showToast(&quot;同じ連番内の隣り合う卓を選択してください&quot;);
      return;
    }

    const ids = sortedManualSelection();
    const state = selectedStatus;
    const tables = currentTables();
    const capacity = ids.reduce((sum,id) =&gt; {
      const value = tables[id];
      return sum + (value === &quot;BOX&quot; ? 7 : Number(value || 0));
    },0);

    const group = {
      id:&quot;manual-&quot; + Date.now(),
      ids,
      state,
      capacity
    };

    appState.groups.push(group);

    ids.forEach(id =&gt; {
      if(state === &quot;empty&quot;){
        delete appState.states[id];
      }else{
        appState.states[id] = state;
      }
    });

    manualMode = false;
    manualSelected.clear();
    saveState();
    renderAll();
    showToast(ids.join(&quot;・&quot;) + &quot; を手動連結&quot;);
  }

  function releaseManualGroup(groupId){
    const index = appState.groups.findIndex(group =&gt; group.id === groupId);
    if(index &lt; 0) return;

    if(appState.merged[base]!==false){if(getStatus(base)!==&quot;empty&quot;||isCleaning(base)){showToast(&quot;空席にしてから分割してください&quot;);return}delete appState.states[base];delete appState.cleaning[base];appState.merged[base]=false}
    else{const ids=compositePartIds(base);if(ids.some(x=&gt;getStatus(x)!==&quot;empty&quot;||isCleaning(x))){showToast(&quot;すべて空席にしてから連結してください&quot;);return}ids.forEach(x=&gt;{delete appState.states[x];delete appState.cleaning[x]});appState.merged[base]=true}
    saveState();rebuildOrders();renderAll();
  }
  function compositeCard(base){const w=document.createElement(&quot;div&quot;);w.className=&quot;composite-card&quot;;if(appState.merged[base]!==false)w.appendChild(createPhysicalMerged(base));else compositePartIds(base).forEach(id=&gt;w.appendChild(createTableButton(id,currentTables()[id])));const t=document.createElement(&quot;button&quot;);t.className=&quot;composite-toggle&quot;;t.textContent=appState.merged[base]!==false?&quot;分割&quot;:&quot;連結&quot;;t.onclick=e=&gt;{e.stopPropagation();toggleComposite2F(base)};w.appendChild(t);return w}

  createSection=function(title,ids,pairMode){
    const section=document.createElement(&quot;section&quot;);section.className=&quot;card&quot;;
    const capacityKey=title.startsWith(&quot;2&quot;)?2:title.startsWith(&quot;4&quot;)?4:title.startsWith(&quot;6&quot;)?6:&quot;BOX&quot;;
    rebuildOrders();
    const all=[];
    const sectionForTotal=max=&gt;max&lt;=2?2:max&lt;=4?4:max&lt;=6?6:&quot;LARGE&quot;;
    Object.keys(cfgStructures).sort(cfgCompare).forEach(base=&gt;{
      const parts=structureParts(base); if(!parts.length)return;
      if(parts.length&gt;1){
        const merged=appState.merged[base]!==false;
        let home;
        if(merged){ home=sectionForTotal(totalCap(base)); }
        else{
          const keys=[...new Set(parts.map(p=&gt;p.box?&quot;BOX&quot;:p.cap))];
          home=keys.length===1?keys[0]:sectionForTotal(totalCap(base));
        }
        if(home===capacityKey)all.push({base,composite:true});
      }else{
        const p=parts[0],home=p.box?&quot;BOX&quot;:p.cap;if(home===capacityKey)all.push({id:base,base});
      }
    });
    all.sort((a,b)=&gt;cfgCompare(a.base,b.base));
    let free=0;
    all.forEach(x=&gt;{
      if(x.composite){
        const active=activeIdsForIdentity(x.base);free+=active.filter(id=&gt;getStatus(id)===&quot;empty&quot;&amp;&amp;!isCleaning(id)&amp;&amp;!isGrouped(id)).length;
      }else if(getStatus(x.id)===&quot;empty&quot;&amp;&amp;!isCleaning(x.id)&amp;&amp;!isGrouped(x.id))free++;
    });
    section.innerHTML=`&lt;div class=&quot;card-title&quot;&gt;&lt;span&gt;${title}&lt;/span&gt;&lt;span&gt;空き ${free}&lt;/span&gt;&lt;/div&gt;`;
    const grid=document.createElement(&quot;div&quot;);grid.className=&quot;table-grid&quot;;
    all.forEach(x=&gt;{if(x.composite)grid.appendChild(compositeCard(x.base));else if(!isGrouped(x.id))grid.appendChild(createTableButton(x.id,currentTables()[x.id]))});
    if(!grid.children.length){const e=document.createElement(&quot;div&quot;);e.className=&quot;empty-note&quot;;e.textContent=&quot;この種類の卓はありません。&quot;;grid.appendChild(e)}
    section.appendChild(grid);return section;
  };

  function bulkDeleteUpdate(){const bar=document.getElementById(&quot;bulkDeleteBar&quot;);bar.classList.toggle(&quot;show&quot;,bulkDeleteMode);document.getElementById(&quot;bulkDeleteCount&quot;).textContent=`${bulkDeleteSelected.size}卓 選択`;document.getElementById(&quot;bulkDeleteCommit&quot;).disabled=!bulkDeleteSelected.size}
  function bulkDeleteToggle(id){bulkDeleteSelected.has(id)?bulkDeleteSelected.delete(id):bulkDeleteSelected.add(id);bulkDeleteUpdate();renderAll()}
  function deleteOne(id){
    const pi=partInfo(id);
    if(pi){
      if(getStatus(id)!==&quot;empty&quot;||isCleaning(id)||isGrouped(id))return false;
      const base=pi.base,parts=structureParts(base),oldIds=compositePartIds(base);
      const snaps=Object.fromEntries(oldIds.map(x=&gt;[x,{s:appState.states[x],c:appState.cleaning[x]}]));
      parts.splice(pi.index,1);
      const counts={&quot;2&quot;:0,&quot;4&quot;:0,&quot;6&quot;:0,&quot;BOX&quot;:0};parts.forEach(p=&gt;counts[p.key]++);cfgStructures[base]=counts;
      oldIds.forEach(x=&gt;{delete appState.states[x];delete appState.cleaning[x]});
      const nextIds=compositePartIds(base);parts.forEach((_,i)=&gt;{const oldIndex=i&gt;=pi.index?i+1:i,snap=snaps[oldIds[oldIndex]];if(snap?.s!==undefined)appState.states[nextIds[i]]=snap.s;if(snap?.c!==undefined)appState.cleaning[nextIds[i]]=snap.c});
      appState.groups.forEach(g=&gt;{g.ids=g.ids.filter(x=&gt;x!==id)});appState.groups=appState.groups.filter(g=&gt;g.ids.length&gt;=2);
      if(parts.length===0){delete cfgStructures[base];delete appState.merged[base];cfgRenbanGroups=cfgRenbanGroups.map(g=&gt;g.filter(x=&gt;x!==base)).filter(g=&gt;g.length&gt;=2)}
      else if(parts.length===1){delete appState.merged[base]}
      else appState.merged[base]=false;
      return true;
    }
    if(!cfgStructures[id])return false;
    const active=activeIdsForIdentity(id);if(active.some(x=&gt;getStatus(x)!==&quot;empty&quot;||isCleaning(x)||isGrouped(x)))return false;
    delete cfgStructures[id];delete appState.states[id];delete appState.cleaning[id];delete appState.merged[id];cfgRenbanGroups=cfgRenbanGroups.map(g=&gt;g.filter(x=&gt;x!==id)).filter(g=&gt;g.length&gt;=2);return true;
  }

  /* ===== 3F display by real renban area: E -&gt; F -&gt; G ===== */
  function areaIdentityClusters(areaKey){
    const all=Object.keys(cfgStructures).filter(id=&gt;cfgAreaOf(id)===areaKey).sort(cfgCompare);
    const groups=cfgRenbanGroups
      .filter(g=&gt;g.some(id=&gt;cfgAreaOf(id)===areaKey))
      .map(g=&gt;g.filter(id=&gt;cfgStructures[id]&amp;&amp;cfgAreaOf(id)===areaKey).sort(cfgCompare))
      .filter(g=&gt;g.length);

    const used=new Set(groups.flat());
    const clusters=groups.map(g=&gt;({
      ids:g,
      label:g.length&gt;1?`${g[0]}–${g[g.length-1]}`:g[0],
      rank:g[0]
    }));

    all.filter(id=&gt;!used.has(id)).forEach(id=&gt;clusters.push({ids:[id],label:id,rank:id}));
    return clusters.sort((a,b)=&gt;cfgCompare(a.rank,b.rank));
  }

  function groupIdentityBases(group){
    return [...new Set(group.ids.map(identityOfActive))];
  }

  function threeFNaturalKeyForId(id){
    id=String(id||&quot;&quot;).toUpperCase();
    const base=identityOfActive(id);
    const area=cfgAreaOf(base);
    const areaRank={&quot;E&quot;:0,&quot;F&quot;:1,&quot;G&quot;:2}[area] ?? 9;
const n=cfgNum(base);
    const pi=partInfo(id);
    return [areaRank,n,0,pi ? pi.index : 0];
  }

  function threeFNaturalKeyForGroup(ids){
    const keys=(ids||[]).map(threeFNaturalKeyForId).sort((a,b)=&gt;{
      for(let i=0;i&lt;Math.max(a.length,b.length);i++){
        const av=a[i]??0,bv=b[i]??0;
        if(av!==bv)return av-bv;
      }
      return 0;
    });
    return keys[0] || [9,99999,0,0];
  }

  function threeFCompareKeys(a,b){
    for(let i=0;i&lt;Math.max(a.length,b.length);i++){
      const av=a[i]??0,bv=b[i]??0;
      if(av!==bv)return av-bv;
    }
    return 0;
  }

  function renderRenbanCluster(cluster){
    const box=document.createElement(&#x27;div&#x27;);box.className=&#x27;renban-cluster&#x27;;
    const activeIds=cluster.ids.flatMap(activeIdsForIdentity);
    const activeSet=new Set(activeIds);
    const groups=appState.groups.filter(g=&gt;g.ids.some(id=&gt;activeSet.has(id)));
    const groupedIds=new Set(groups.flatMap(g=&gt;g.ids));

    box.innerHTML=`&lt;div class=&quot;renban-cluster-title&quot;&gt;&lt;span&gt;${cluster.label}&lt;/span&gt;&lt;/div&gt;`;
    const grid=document.createElement(&#x27;div&#x27;);grid.className=&#x27;renban-cluster-grid&#x27;;

    /*
      Build ONE display list, then sort it by the real physical renban position.
      This prevents a manual group such as E7・E8 from being rendered before E6
      merely because it touches the parent composite E6E7.
    */
    const displayItems=[];

    groups.forEach(g=&gt;{
      displayItems.push({
        kind:&quot;group&quot;,
        group:g,
        key:threeFNaturalKeyForGroup(g.ids)
      });
    });

    cluster.ids.forEach(base=&gt;{
      const baseActive=activeIdsForIdentity(base);
      const ungrouped=baseActive.filter(id=&gt;!groupedIds.has(id));
      if(!ungrouped.length)return;

      if(isCompositeIdentity(base) &amp;&amp; ungrouped.length===baseActive.length){
        displayItems.push({
          kind:&quot;composite&quot;,
          base,
          key:threeFNaturalKeyForGroup(baseActive)
        });
      }else{
        ungrouped.forEach(id=&gt;{
          displayItems.push({
            kind:&quot;table&quot;,
            id,
            key:threeFNaturalKeyForId(id)
          });
        });
      }
    });

    displayItems.sort((a,b)=&gt;{
      const d=threeFCompareKeys(a.key,b.key);
      if(d!==0)return d;
      const al=a.kind===&quot;group&quot;?(a.group.ids||[]).join(&quot;・&quot;):(a.id||a.base||&quot;&quot;);
      const bl=b.kind===&quot;group&quot;?(b.group.ids||[]).join(&quot;・&quot;):(b.id||b.base||&quot;&quot;);
      return al.localeCompare(bl,&quot;ja&quot;,{numeric:true});
    });

    displayItems.forEach(item=&gt;{
      if(item.kind===&quot;group&quot;){
        grid.appendChild(createManualGroupCard(item.group));
      }else if(item.kind===&quot;composite&quot;){
        grid.appendChild(compositeCard(item.base));
      }else{
        grid.appendChild(createTableButton(item.id,currentTables()[item.id]));
      }
    });

    if(!grid.children.length){
      const e=document.createElement(&#x27;div&#x27;);
      e.className=&#x27;empty-note&#x27;;
      e.textContent=&#x27;卓がありません。&#x27;;
      grid.appendChild(e);
    }
    box.appendChild(grid);
    return box;
  }

  function structuralRenbanGroupsForArea(areaKey){
    return cfgRenbanGroups
      .filter(g=&gt;g.length &amp;&amp; g.every(id=&gt;cfgAreaOf(id)===areaKey))

  function renderAreaRenbanStrip(areaKey){
    const wrap=document.createElement(&#x27;div&#x27;);
    const label=document.createElement(&#x27;div&#x27;);
    label.className=&#x27;renban-area-renban-label&#x27;;
    label.textContent=&#x27;連番&#x27;;

    const strip=document.createElement(&#x27;div&#x27;);
    strip.className=&#x27;area-renban-strip&#x27;;

    if(!groups.length){
      const chip=document.createElement(&#x27;span&#x27;);
      chip.className=&#x27;cluster-chip disabled&#x27;;
      chip.textContent=&#x27;連番なし&#x27;;
      strip.appendChild(chip);

      groups.forEach(group=&gt;{
        const btn=document.createElement(&#x27;button&#x27;);

        const labelText = group.length===1
          ? group[0]

        const activeIds=group.flatMap(activeIdsForIdentity);
        const availableCount=activeIds.filter(id=&gt;isAvailable(id)).length;

        btn.innerHTML=`${labelText}&lt;small&gt;${availableCount}卓 空き&lt;/small&gt;`;
        btn.onclick=()=&gt;{

          renderPeopleRow();

          showToast(&#x27;連番: &#x27;+labelText);

        strip.appendChild(btn);

    wrap.appendChild(strip);

  function renderTablesByRenbanArea(){
    rebuildOrders();
    const root=document.getElementById(&#x27;tableArea&#x27;);root.innerHTML=&#x27;&#x27;;
    const areaLabels={&#x27;E&#x27;:&#x27;E系&#x27;,&#x27;F&#x27;:&#x27;F系&#x27;,&#x27;G&#x27;:&#x27;G系&#x27;};
    [&#x27;E&#x27;,&#x27;F&#x27;,&#x27;G&#x27;].forEach(areaKey=&gt;{
      const clusters=areaIdentityClusters(areaKey);
      if(!clusters.length)return;
      const section=document.createElement(&#x27;section&#x27;);section.className=&#x27;renban-area&#x27;;
      const totalIds=clusters.flatMap(c=&gt;c.ids.flatMap(activeIdsForIdentity));
      const areaGroups=appState.groups.filter(g=&gt;g.ids.some(id=&gt;totalIds.includes(id)));
      const grouped=new Set(areaGroups.flatMap(g=&gt;g.ids));
      const free=totalIds.filter(id=&gt;!grouped.has(id)&amp;&amp;getStatus(id)===&#x27;empty&#x27;&amp;&amp;!isCleaning(id)).length + areaGroups.filter(g=&gt;(g.state||&#x27;empty&#x27;)===&#x27;empty&#x27;).length;
      section.innerHTML=`&lt;div class=&quot;renban-area-title&quot;&gt;&lt;span&gt;${areaLabels[areaKey]}&lt;/span&gt;&lt;/div&gt;`;
      section.appendChild(renderAreaRenbanStrip(areaKey));
      clusters.forEach(c=&gt;section.appendChild(renderRenbanCluster(c)));
      root.appendChild(section);
    });
  }

  function cfgSetupHScroll(holderId,prevId,nextId){
    const holder=document.getElementById(holderId);
    const prev=document.getElementById(prevId);
    const next=document.getElementById(nextId);
    if(!holder||!prev||!next)return;

    const update=()=&gt;{
      const max=Math.max(0,holder.scrollWidth-holder.clientWidth);
      prev.disabled=max&lt;=2 || holder.scrollLeft&lt;=2;
      next.disabled=max&lt;=2 || holder.scrollLeft&gt;=max-2;
    };

    const step=()=&gt;Math.max(180,holder.clientWidth*.85);

    prev.onclick=()=&gt;{
      const target=Math.max(0,holder.scrollLeft-step());
      holder.scrollTo({left:target,behavior:&quot;smooth&quot;});
      setTimeout(update,250);
    };
    next.onclick=()=&gt;{
      const max=Math.max(0,holder.scrollWidth-holder.clientWidth);
      const target=Math.min(max,holder.scrollLeft+step());
      holder.scrollTo({left:target,behavior:&quot;smooth&quot;});
      setTimeout(update,250);
    };

    holder.addEventListener(&quot;scroll&quot;,update,{passive:true});
    holder.addEventListener(&quot;wheel&quot;,e=&gt;{
      if(Math.abs(e.deltaY)&gt;Math.abs(e.deltaX)){
        holder.scrollLeft+=e.deltaY;
        e.preventDefault();
      }
    },{passive:false});

    requestAnimationFrame(update);
    setTimeout(update,80);
    setTimeout(update,250);
  }

function roomStats(room){
 const units=[];

 SIDE_ORDER.forEach(side=&gt;{
  const groupedInRenban=new Set();
  renbanGroups(room,side).forEach(group=&gt;{
   operationalRenbanRow(group).forEach(u=&gt;{
    units.push(u);
    u.members.forEach(id=&gt;groupedInRenban.add(id));
   });
  });

  /* Standalone / 連番なし tables still count in room statistics. */
  laneBases(room,side).forEach(base=&gt;{
   activeIds(base).forEach(id=&gt;{
    if(groupedInRenban.has(id))return;
    const g=groupFor(id);
    if(g){
     if(units.some(u=&gt;u.id===g.id))return;
     units.push({
      id:g.id,
      cap:g.ids.reduce((s,x)=&gt;s+Number(capOf(x)||0),0),
      members:[...g.ids],
      manualGroup:true
     });

     units.push({id,cap:Number(capOf(id)||0),members:[id]});
    }
   });
  });
 });

 const empty=u=&gt;u.manualGroup
  ? ((groupById(u.id)?.state||&quot;empty&quot;)===&quot;empty&quot;)
  : state(u.id)===&quot;empty&quot;;

 const c=n=&gt;units.filter(u=&gt;u.cap===n&amp;&amp;empty(u)).length;
 const cleaningCount=units.filter(u=&gt;empty(u)&amp;&amp;operationalUnitCleaning(u)).length;

 return {
  c2:c(2),c4:c(4),c6:c(6),

}

function roomAvailableCapacity(room){

 const countedGroups=new Set();

 Object.keys(tables)
   .filter(base=&gt;tables[base].room===room)
   .forEach(base=&gt;{
     activeIds(base).forEach(id=&gt;{
       const g=groupFor(id);
       if(g){
         if(countedGroups.has(g.id))return;
         countedGroups.add(g.id);

         const roomSide=roomSideOf(g.ids[0]);
         if(!roomSide||roomSide.room!==room)return;
         if((g.state||&quot;empty&quot;)!==&quot;empty&quot;)return;
         if(g.ids.some(x=&gt;cleaning(x)))return;

         total+=g.ids.reduce((s,x)=&gt;s+Number(capOf(x)||0),0);
         return;
       }

       if(state(id)===&quot;empty&quot;&amp;&amp;!cleaning(id)){
         total+=Number(capOf(id)||0);
       }
     });
   });

 return total;
}

function nextTableNameForRoom(room){
 if(!room)return &quot;&quot;;
 let maxNo=0;
 const prefix=String(room).toUpperCase();

 Object.keys(tables).forEach(rawId=&gt;{
  const id=String(rawId).toUpperCase();
  const t=tables[rawId];
  if(!t||String(t.room).toUpperCase()!==prefix)return;

  /* Read the leading numeric identity after the room prefix.
     Examples:
       CD1 -&gt; 1
       CD8 -&gt; 8
       SG34 -&gt; 34
     Ignore unrelated/stale names. */
  if(!id.startsWith(prefix))return;
  const rest=id.slice(prefix.length);
  const m=rest.match(/^(\d+)/);
  if(!m)return;

  const n=Number(m[1]);
  if(Number.isFinite(n))maxNo=Math.max(maxNo,n);
 });

 return prefix+(maxNo+1);
}

 Object.keys(demo).forEach(id=&gt;{

 });

function findRenbanGroupFor(id){
 for(const [key,groups] of Object.entries(RENBAN_GROUPS||{})){
  if(!Array.isArray(groups))continue;
  for(const group of groups){
   if(Array.isArray(group)&amp;&amp;group.includes(id)){
    return {key,group};
   }
  }
 }
 return null;
}

function applyRenbanMembership(id,members){
 const room=tables[id]?.room;
 const side=tables[id]?.side;
 if(!room||!side)return;

 const key=renbanKey(room,side);
 RENBAN_GROUPS[key] ||= [];

 const oldGroupInfo=findRenbanGroupFor(id);
 const chosen=[id,...members.filter(x=&gt;x&amp;&amp;x!==id)];
 const chosenSet=new Set(chosen);

 /* First remove the edited table&#x27;s old group, preserving the members
    that were not kept with this table. This matches the 2F behavior. */
 if(oldGroupInfo){
  RENBAN_GROUPS[oldGroupInfo.key]=RENBAN_GROUPS[oldGroupInfo.key]
   .filter(g=&gt;g!==oldGroupInfo.group);

  const remaining=oldGroupInfo.group.filter(x=&gt;!chosenSet.has(x));
  if(remaining.length&gt;=2){
   RENBAN_GROUPS[oldGroupInfo.key].push(remaining.sort(natural));
  }
 }

 /* Any newly chosen member leaves its previous renban group. */
 chosen.slice(1).forEach(member=&gt;{
  const found=findRenbanGroupFor(member);
  if(!found)return;

  RENBAN_GROUPS[found.key]=RENBAN_GROUPS[found.key].filter(g=&gt;g!==found.group);
  const rest=found.group.filter(x=&gt;x!==member);
  if(rest.length&gt;=2){
   RENBAN_GROUPS[found.key].push(rest.sort(natural));
  }
 });

 if(chosen.length&gt;=2){
  RENBAN_GROUPS[key].push([...new Set(chosen)].sort(natural));
 }

 /* Normalize duplicate/invalid groups. */
 Object.keys(RENBAN_GROUPS).forEach(k=&gt;{
  const seen=new Set();
  RENBAN_GROUPS[k]=(RENBAN_GROUPS[k]||[])
   .map(g=&gt;[...new Set(g)].filter(x=&gt;tables[x]).sort(natural))
   .filter(g=&gt;g.length&gt;=2)
   .filter(g=&gt;{
    const sig=g.join(&quot;|&quot;);
    if(seen.has(sig))return false;
    seen.add(sig);

  const values = {};

    values[k] = v === null ? null : v;

function stable(values){
  const keys = Object.keys(values).sort();
  const obj = {};
  keys.forEach(k=>obj[k]=values[k]);
  return JSON.stringify(obj);
}

function floorFrame(floorId){
  const title = FLOOR_SYNC[floorId].frame;
  return [...document.querySelectorAll(".app-frame")].find(f=>f.title===title);

function applyValues(floorId, values){
  const cfg = FLOOR_SYNC[floorId];
  let changed = false;
  applyingRemote = true;
  try{
    cfg.keys.forEach(k=>{
      const remote = Object.prototype.hasOwnProperty.call(values,k) ? values[k] : null;
      const local = localStorage.getItem(k);
      if(remote === null){
        if(local !== null){
          localStorage.removeItem(k);
          changed = true;
        }
      }else if(local !== remote){
        localStorage.setItem(k, remote);
        changed = true;
      }

    const sig = stable(snapshotFloor(floorId));
    lastSeen[floorId] = sig;
    lastObserved[floorId] = sig;
    delete pendingLocal[floorId];
  }finally{
    applyingRemote = false;
  }
  if(changed) reloadFloor(floorId);

async function uploadFloor(floorId){
  if(!signedIn || !initialSyncDone || applyingRemote) return;

  const values = snapshotFloor(floorId);
  const sig = stable(values);
  const seq = (uploadSeq[floorId] || 0) + 1;
  uploadSeq[floorId] = seq;
  pendingLocal[floorId] = sig;
  lastObserved[floorId] = sig;
  setStatus("同期中…");

  try{
    await db.collection("sekifuriSync").doc(floorId).set({
      values,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: auth.currentUser ? auth.currentUser.uid : null
    }, {merge:false});

    if(uploadSeq[floorId] !== seq) return;

    const currentSig = stable(snapshotFloor(floorId));
    if(currentSig === sig){
      lastSeen[floorId] = sig;
      lastObserved[floorId] = sig;
      delete pendingLocal[floorId];
      setStatus("同期済み", "online");
    }else{
      pendingLocal[floorId] = currentSig;
      lastObserved[floorId] = currentSig;
      scheduleUpload(floorId);

function scheduleUpload(floorId){

  const sig = stable(snapshotFloor(floorId));

  lastObserved[floorId] = sig;

function startLocalPoll(){

    Object.keys(FLOOR_SYNC).forEach(floorId=>{

      if(lastObserved[floorId] === undefined){
        lastObserved[floorId] = sig;
        if(lastSeen[floorId] === undefined) lastSeen[floorId] = sig;
        return;
      }

      if(sig !== lastObserved[floorId]){
        lastObserved[floorId] = sig;
        pendingLocal[floorId] = sig;
        scheduleUpload(floorId);
      }
    });

}

function stopListeners(){
  unsubs.forEach(fn=>{try{fn()}catch{}});
  unsubs = [];
  if(pollTimer){clearInterval(pollTimer);pollTimer=null}
  Object.values(writeTimers).forEach(t=>clearTimeout(t));
  writeTimers = {};
  Object.keys(pendingLocal).forEach(k=>delete pendingLocal[k]);
  Object.keys(uploadSeq).forEach(k=>delete uploadSeq[k]);
  Object.keys(lastObserved).forEach(k=>delete lastObserved[k]);
  Object.keys(lastSeen).forEach(k=>delete lastSeen[k]);
}

async function initRemoteForFloor(floorId){
  const ref = db.collection("sekifuriSync").doc(floorId);

    const values = snapshotFloor(floorId);
    await ref.set({
      values,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: auth.currentUser ? auth.currentUser.uid : null
    }, {merge:false});
    applyValues(floorId, values);
    return values;
  }

  const data = snap.data() || {};
  const values = data.values || {};
  applyValues(floorId, values);
  return values;
}

function subscribeFloor(floorId){

      }
      if(remoteSig === localSig)setStatus("同期中…");
      return;
    }

    if(remoteSig !== localSig){
      applyValues(floorId, values);
      setStatus("他の端末から更新", "online");
    }else{
      lastSeen[floorId] = localSig;
      lastObserved[floorId] = localSig;
      setStatus("同期済み", "online");
    }
  }, err=>{
    console.error("Firestore listener failed", floorId, err);
    setStatus("同期エラー", "error");
  });

  unsubs.push(unsub);
}


async function beginSync(user){
  signedIn = true;
  initialSyncDone = false;
  setStatus("データ同期中…");
  errEl.textContent = "";
  stopListeners();

  try{
    const remoteBaseline = {};

    /* Pass 1: always load current Firestore state first. */
    for(const floorId of Object.keys(FLOOR_SYNC)){
      remoteBaseline[floorId] = await initRemoteForFloor(floorId);
    }

    /* Let iframe startup finish while uploads are still blocked. */
    await new Promise(resolve=>setTimeout(resolve,700));

    /* Pass 2: overwrite any startup-only local drift with the remote baseline. */
    for(const floorId of Object.keys(FLOOR_SYNC)){
      applyValues(floorId, remoteBaseline[floorId] || {});
    }

    await new Promise(resolve=>setTimeout(resolve,350));

    /* Establish a clean baseline before live sync begins. */
    Object.keys(FLOOR_SYNC).forEach(floorId=>{
      const sig = stable(remoteBaseline[floorId] || {});
      lastSeen[floorId] = sig;
      lastObserved[floorId] = sig;
      delete pendingLocal[floorId];
    });

    Object.keys(FLOOR_SYNC).forEach(subscribeFloor);

    initialSyncDone = true;
    startLocalPoll();

    gate.classList.add("hidden");
    userBar.classList.add("show");
    userText.textContent = user.email || "同期済み";
    dot.className = "online";
    setStatus("同期済み", "online");
  }catch(e){
    console.error("Initial Firebase sync failed", e);
    errEl.textContent = "同期に失敗しました。Firestore Rules とネット接続を確認してください。";
    setStatus("同期エラー", "error");
  }
}

async function login(){
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){
    errEl.textContent = "Email と Password を入力してください。";
    return;
  }
  loginBtn.disabled = true;
  errEl.textContent = "";
  setStatus("ログイン中…");
  try{
    await auth.signInWithEmailAndPassword(email,password);
    passEl.value = "";
  }catch(e){
    console.error("Firebase login error:", e);
    const code = e && e.code ? String(e.code) : "unknown-error";
    const msg = e && e.message ? String(e.message) : "";
    errEl.textContent = "Firebase: " + code + (msg ? " / " + msg : "");
    setStatus("未接続", "error");
  }finally{
    loginBtn.disabled = false;
  }
}

async function logout(){
  stopListeners();
  signedIn = false;
  initialSyncDone = false;
  try{await auth.signOut()}catch(e){console.error(e)}
}

loginBtn.addEventListener("click", login);
passEl.addEventListener("keydown", e=>{if(e.key==="Enter")login()});
logoutBtn.addEventListener("click", logout);

try{
  app = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);

  auth.onAuthStateChanged(user=>{
    if(user){
      emailEl.value = user.email || "";
      beginSync(user);
    }else{
      stopListeners();
      signedIn = false;
      initialSyncDone = false;
      gate.classList.remove("hidden");
      userBar.classList.remove("show");
      setStatus("ログインしてください");
    }
  });
}catch(e){
  console.error("Firebase initialization failed", e);
  errEl.textContent = "Firebase の初期化に失敗しました。";
  setStatus("Firebase エラー", "error");
}
})();
</script>
